dialog.bye=Good night, Monsieur Lefort.
lefort.hello.1=Madame Vogt. It is ten to eight. The library closed at six.
lefort.hello.2=Monsieur Lefort, I found something in the psalter.
lefort.hello.3=Non. Whatever it is, it can wait until tomorrow. Everything can wait until tomorrow.
lefort.look=Monsieur Lefort, archivist. Sixty-four years old, forty of them in this room. He says "Non" first and helps afterwards.
lefort.q.page=Please, just look at this page.
lefort.page.1=It was under the pastedown. Latin, numbers, and a seal.
lefort.page.2=Non... Two knights on one horse. Mon Dieu. That is the seal of the Temple.
lefort.page.3=And look at the top edge: CHIRO... cut through. A chirograph. The same text written twice on one skin and cut apart; each party keeps one half. Whoever holds the other half holds the proof.
lefort.page.4=So what does it say?
lefort.page.5=Madame, after ten hours in this building I can't read a bus ticket. Not before my coffee.
lefort.q.coffee=Why don't you get yourself a coffee?
lefort.coffee.1=The machine is right there. Why don't you get yourself a coffee?
lefort.coffee.2=Because that machine and I are not on speaking terms. It wants coins. I have a card. And it gives no cups.
lefort.coffee.3=Black, in my own cup. The one with the blue band. Anything else is dishwater.
lefort.q.give=Your coffee, Monsieur. Black, in your own cup.
lefort.give.1=...Madame Vogt, you are a terrible person and I thank you.
lefort.give.2=Bien. "Paris, in the house of the Temple... the lord King of France owes the brothers..." These are the King's debts, in pounds of Tours.
lefort.give.3=Sealed by the treasurer of the Temple. And here, Brother Gérard. Brother Gérard of the Paris house.
lefort.give.4=The Templars lent money to the King?
lefort.give.5=For a hundred years the kings of France kept their treasury in the Temple, here in Paris. The Templars were their bankers.
lefort.give.6=The total is in deniers. So: how many deniers make one pound? My conversion tables are on the desk, if you need them.
lefort.q.sum=About that sum in deniers...
lefort.sum.again=A small kingdom, Madame. Owed by a king who liked to have his creditors arrested.
sum.12=Twelve.
sum.20=Twenty.
sum.240=Two hundred and forty.
sum.later=Give me a moment.
sum.answer.12=Twelve deniers to the pound?
sum.answer.20=Twenty?
sum.answer.240=Two hundred and forty: twelve deniers to the sou, twenty sous to the pound.
sum.wrong=Non, non. Look at the tables, Madame. They have been waiting there since 1952.
sum.later.answer=Take your time. The King has been owing it for seven hundred years.
sum.right.1=Exactly. Then this is... more than the Crown took in taxes in a whole year. A small kingdom.
sum.right.2=And only days later, the King had every Templar in France arrested. All on the same morning.
sum.right.3=Friday, the thirteenth of October 1307. Who arrests his bank? Somebody who doesn't want to pay it back.
lefort.q.history=Who were the Templars, really?
lefort.history.1=Who were the Templars, really? Kev on the internet says they found the Holy Grail.
lefort.history.2=Kev on the internet says many things. A few knights in Jerusalem around 1120, sworn to protect the pilgrims on the road.
lefort.history.3=Within a century: houses all over Europe, ships, farms, and the safest strongrooms in Christendom. A pilgrim paid in Paris and drew money in Acre, with a letter.
lefort.history.4=Monks, soldiers and bankers. That last part is what killed them.
lefort.q.friday=What happened to them after the arrests?
lefort.friday.1=Torture, false confessions, a trial that lasted years. In 1312 the Pope dissolved the order.
lefort.friday.2=In March 1314 the last Grand Master, Jacques de Molay, was burned on a little island in the Seine, by the Pont Neuf. There is a plaque there today.
lefort.friday.3=And the money?
lefort.friday.4=Most of their lands went to the Hospitallers. The treasure the stories talk about was never found. Perhaps because it was mostly written on parchment.
lefort.q.temple=Where exactly was the Temple?
lefort.temple.1=Five minutes from here. The Templars' enclosure was a little town of its own, with a tower like a castle keep.
lefort.temple.2=Napoleon had the tower torn down in 1808. Today it's a square with a playground: the Square du Temple.
lefort.temple.3=Then that is where I'm going. The psalter came from that quarter.
lefort.bye=Bonne nuit. And close the door; the draught goes straight to my knees.
machine.look=A coffee machine from the eighties. "PIECES SEULEMENT": coins only. And no cups.
machine.no-cup=It gives coffee, but no cups. I'd need a cup first.
machine.no-coin="Pieces seulement". It wants a coin.
machine.coffee=It growls, it spits, it gives coffee. Black. In Lefort's own cup.
rack.look=A rack of washed-up cups. One has a blue band and a chip on the rim.
rack.use=The cups are clean. Mostly.
lefort-cup.look=White with a blue band and a chip on the rim. That has to be Lefort's.
lefort-cup.take=Lefort's cup. If he catches me with it, I'd better have coffee in it.
bookcase.look=Parish registers, land books, the history of every street in the Marais. Ten metres of it.
bookcase.use=Not now. If I start reading, I'll still be here at dawn.
ladder.look=A library ladder on brass rails. It squeaks; Lefort hears it from anywhere in the building.
ladder.use=I don't need anything from up there.
tall-window.look=The street lamps are coming on. The sky over the Marais is going violet.
tall-window.use=Painted shut sometime around 1950.
clock.look=Ten to eight. The library closed two hours ago.
clock.use=It's right. Lefort winds it every Monday.
reading-table.look=Two readers' places, open books, green lamps. Lefort leaves them like that for tomorrow's readers.
reading-table.use=Those aren't mine to close.
desk.look=Lefort's desk: green leather, a dial telephone, papers in piles only he understands.
desk.use=Nobody touches Lefort's desk. Nobody.
ledger-tables.look=Old conversion tables for medieval money: one pound of Tours = 20 sous, one sou = 12 deniers.
ledger-tables.use=Look all you like, Madame, but don't move them.
atelier.look=The door to my workshop.
street.look=The way out to the street. It's getting dark outside.
street.not-yet=First I want to know what this page says.
goal.20=Show the page to Monsieur Lefort.
hint.20=Talk to Lefort, at his desk.
goal.21=Bring Lefort his coffee: black, in his own cup.
hint.21=His cup is on the rack by the coffee machine. The machine takes coins, like the one in my coat pocket.
goal.22=Work out the sum: how many deniers make one pound?
hint.22=The conversion tables are on Lefort's desk. Then talk to him again.
goal.23=Go to the Square du Temple, where the Temple once stood.
hint.23=The way out to the street is on the right of the reading room.

# ---- the Square du Temple ----
