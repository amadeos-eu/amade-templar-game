workshop.intro.1=Last job of the day: the psalter from the old Temple quarter. Thirteen-hundreds, Paris, rebound once and badly.
workshop.intro.2=Monsieur Lefort wants it finished tomorrow. Monsieur Lefort wants everything finished tomorrow.
window.look=The roofs of the Marais. Somewhere over there the Temple used to stand.
window.use=It's been painted shut since before I was born.
pigeon.look=That pigeon again. It sits there every evening and watches me work.
pigeon.use=Shoo. ...It doesn't care.
engraving.look=An old engraving of the Temple tower in Paris. Torn down in 1808.
engraving.use=It's crooked. It has been crooked for forty years, Lefort says. It stays crooked.
shelves.look=Books waiting for me. Some have been waiting since the last restorer.
shelves.use=One job at a time.
coat.look=My coat and my scarf.
coat.coin=Two euros in the pocket. Enough for the coffee machine.
coat.empty=Only a bus ticket and a pencil stub.
door.look=The door to the reading room.
door.not-yet=Not before the psalter is done. I promised.
bench.look=My workbench. The only tidy place in the building.
bench.use=It's not going to restore anything by itself.
press.look=A book press, cast iron, older than the library's catalogue.
press.use=Nothing in it to press.
books.look=Waiting to be repaired. Patiently, as books do.
books.use=Later. Much later.
lamp.look=My desk lamp. Without it I'd be working by candlelight, like the monks.
lamp.use=It's on. It stays on.
jar.look=Distilled water. For a restorer, practically holy water.
jar.use=I'd rather not drink it.
gluepot.look=Wheat starch paste. It comes off again, if you're careful: that's the point.
gluepot.use=Not yet. First things have to come apart.
mug.look=My coffee. Cold. And not Lefort's kind: he drinks his black, from his own cup.
mug.use=Cold. Some things can't be restored.
psalter.look.1=A psalter, about thirteen hundred. The prayers of the week, a calendar of saints' days.
psalter.look.2=The pastedown of the front cover is bulging, as if something were lying under it.
psalter.look.after=The pastedown is lifted. Under it, a hollow in the board, just the size of the folded page.
psalter.use=The paste is seven hundred years old and dry as stone. Without moisture I'd tear the paper.
psalter.use.after=I'll close it again tomorrow. Properly, this time.
psalter.damp=A little water, a little patience... There. The old paste is softening.
flap.look=The lifted pastedown. Whoever stuck it down was in a hurry.
brush.take=The paste brush.
brush.damp=Dipped in distilled water. Damp, not wet.
brush.dry=A dry brush won't soften anything.
bonefolder.take=My bone folder.
bonefolder.dry=Dry like this it would tear. I need to soften the paste first.
discover.1=Easy... easy... There's something under it. Folded parchment!
discover.2=Someone opened this binding before me. Centuries ago.
discover.3=And whoever it was hid this in a hurry. Lefort has to see it.
page.psalter=It stays out until I know what it is.
coin.coat=It's fine where it is. In my hand.
goal.10=Finish the old psalter: its binding comes apart tonight.
hint.10=Take a good look at the psalter on the workbench.
goal.11=Get the old pastedown of the psalter off without tearing it.
hint.11=Old paste softens with a little water. The paste brush and the water jar are on the bench.
goal.12=Lift the softened pastedown.
hint.12=Use the bone folder on the psalter.
goal.13=Show the page to Monsieur Lefort in the reading room.
hint.13=The door to the reading room is next to my coat.

# ---- the reading room ----
name.lefort=Monsieur Lefort
name.machine=coffee machine
name.rack=cup rack
name.lefort-cup=chipped cup
name.bookcase=bookcase
name.ladder=library ladder
name.tall-window=window
