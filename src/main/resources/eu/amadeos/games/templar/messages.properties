phone.look=My phone. Full of photos of other people's books.
phone.use=No signal down here. The walls are older than the telephone.
phone.page=Click. Restorer's habit: photograph everything, before and after.
phone.psalter=I photographed every page of it this morning, the calendar too. Before and after: restorer's rule.
page.look.1=Parchment, folded twice. Latin, columns of numbers in Roman numerals, sums in livres, sous and deniers.
page.look.2=A red wax seal: two knights riding one horse. And along the top edge, half a word, cut through: CHIRO...
page.look.3=The seal of the Knights Templar. Hidden in a psalter. In this library.
page.use=I'm not unfolding it any more than I have to. It's seven hundred years old.
bonefolder.look=A bone folder. Smooth, flat, and it never cuts the paper.
brush.look=A paste brush. Clean, at least.
damp-brush.look=A brush, damp with distilled water.
coin.look=Two euros. Enough for the coffee machine, if it's in a good mood.
cup.look=A chipped cup with a blue band. Lefort's.
coffee.look=Black, no sugar, in his own cup. Lefort's kind of coffee.
coffee.use=It's not for me. It's a bribe.
sandwich.look=Half a ham sandwich, with a beak-shaped bite in it.
sandwich.use=I'm not that hungry.

