square.intro.1=The Square du Temple. For five hundred years the Templars' enclosure stood here, walls, church, tower and all.
square.intro.2=Today: chestnut trees, a playground and a man talking to his phone.
houses.look=The Marais at dusk. In the thirteenth century all of this was the Templars' land; they let it to craftsmen.
houses.use=I don't know anybody up there.
railing.look=A cast-iron railing from the nineteenth century, when the square was laid out.
railing.use=Everything I need is on this side of it.
playground.look=A slide and a climbing frame. Children play where the Grand Master once had his rooms.
playground.use=I'm a bit too old and a bit too busy.
lamppost.look=The lamps are coming on, one by one.
lamppost.use=It's warm. That's something.
bench.square.look=A green bench. Kev's lunch is waiting on it.
bench.square.use=No time to sit down.
kev-sandwich.look=Ham, salad, tomato, half a baguette. Kev's.
kev-sandwich.use=That's Kev's dinner. I'm a restorer, not a thief.
half-sandwich.look=Half a sandwich, in the gravel. The pigeon got the other half.
half-sandwich.take=Half a sandwich. Pigeon-tested. You never know.
board.look.1=An old engraving: the Temple tower, a square keep with four corner turrets. "Demolished in 1808."
board.look.2=And the plan: the church, the tower, the cloister... and the library, right where the playground is now.
board.look.3=The psalter came from this library. Somebody hid the page in it in 1307. Here.
helene.hello=Madame Vogt? What a lovely evening for history.
helene.look=Camel coat, a red handbag, earrings worth my annual salary. She smells of money and old paper.
helene.q.who=Who are you?
helene.who.1=Hélène de Vaucresson. I collect things. Old things, rare things, documents.
helene.who.2=My family has been collecting since before the Revolution. We are... thorough.
helene.q.how=How do you know my name?
helene.how.1=Your Monsieur Lefort telephoned an old friend at the Archives nationales an hour ago. He was very excited.
helene.how.2=Paris is a village, Madame Vogt. And I am a very good neighbour.
helene.q.offer=What do you want?
helene.offer.1=The page. Fifty thousand euros, tonight, in cash. No questions, no papers.
helene.offer.2=It belongs to the library. And to history.
helene.offer.3=History belongs to whoever keeps it best. Think about it.
helene.q.no=It's not for sale.
helene.no.1=It's not for sale. Good night, Madame.
helene.no.2=Everything is for sale. Only the price changes. Bonne soirée.
helene.page=She'd love that. No.
kev.look="Treasure Kev": hoodie, selfie stick, a voice for an audience of thousands. He's live, apparently.
kev.q.who=Who are you talking to?
kev.who.1=To my followers! Treasure Kev, live from the heart of the Templars! Eighty thousand of them, all watching.
kev.who.2=Tonight we find the gold. Or at least the clues to the gold. Or at least clicks.
kev.who.3=Good luck with that.
kev.q.templars=What do you know about the Templars?
kev.templars.1=They hid their gold in nine places, encrypted with the Templar cipher!
kev.templars.2=That cipher was never found in a single medieval document.
kev.templars.3=Exactly. That's how good they were at hiding it.
kev.q.curse=And what about the Grand Master?
kev.curse.1=Jacques de Molay! Burned alive in Paris in 1314. And from the flames he cursed the King and the Pope!
kev.curse.2=Both dead within the year! Coincidence? I don't think so!
kev.curse.3=The Pope died in April 1314, the King in November. Both were ill or old. The great curse comes from stories written long afterwards.
kev.curse.4=One chronicler only says Molay called on God to judge them. It's a legend, Kev.
kev.curse.5=Legend or not, there's a plaque where he burned. On the Pont Neuf, by the statue of the king on the horse.
kev.curse.6=That plaque is real. And Lefort mentioned it too. The Pont Neuf, then: Metro line 7, two stops.
kev.q.film=Could you film the old engraving on the board?
kev.film.1=An engraving! Old stuff! My followers love old stuff. Hold my... no, I'll just leave my sandwich here.
kev.film.2=Look at this, people: the real Temple! Like and subscribe!
kev.film.3=Hey! My sandwich! Shoo! Shoo!
kev.film.4=Ugh. Well. "Templar pigeon steals treasure hunter's dinner". That's content.
kev.q.bye=See you, Kev.
kev.bye=Subscribe! It's free!
kev.sandwich=The pigeon already tried it. Keep it, I'm vegetarian now. Starting now.
kev.page=I'm not showing Kev the page. Eighty thousand followers would be here in ten minutes.
pigeon.square.look=A pigeon with a professional interest in Kev's sandwich.
pigeon.coo=Grrru.
pigeon.square.feed=It's had its half.
metro.look=Metro station Temple, line 3. Line 7 goes to the Pont Neuf.
metro.not-yet=Where would I go now? I'm not done here.
marais.look=The street back to the library.
goal.30=Find out where the Temple stood.
hint.30=There's an information board on the left of the square.
goal.31=Find out more about the Templars' last days.
hint.31=Kev seems to know everything. Some of it might even be true. Ask him about the Grand Master.
goal.32=Go to the Pont Neuf, to the plaque for Jacques de Molay. Something tells me I'll need that sandwich.
hint.32=Ask Kev to film the engraving; his sandwich is on the bench, and a pigeon is watching it.
goal.33=Go to the Pont Neuf, to the plaque for Jacques de Molay.
hint.33=Take the metro on the right of the square.

# ---- the Pont Neuf ----
name.far-bank=the Louvre
name.river=the Seine
name.statue=statue of Henri IV
name.parapet=parapet
name.wall=stone pier
name.steps=steps to the island
name.plaque=plaque
name.metro-bridge=metro station Pont Neuf
name.driver=big man in a dark suit
name.guide=tour guide
name.tourist1=tourist
name.tourist2=tourist
bridge.intro=The Pont Neuf at night. The plaque must be down by the steps. And there's somebody standing right in front of it.
driver.hello.1=Madame Vogt. Madame de Vaucresson sends her regards.
driver.hello.2=You followed me.
driver.hello.3=Madame raises her offer. Sixty thousand. Give me the page, and you can go home.
driver.look=Shoulders like a wardrobe, shoes like mirrors. He's standing between me and the plaque and doesn't look like he'll move.
driver.q.who=Who are you?
driver.who.1=Nobody. I drive Madame's car.
driver.who.2=And sometimes I carry things for her. Small things. Pages, for example.
driver.q.no=The page stays with me.
driver.no.1=The page stays with me.
driver.no.2=I have time, Madame. I have a great deal of time.
driver.page=That's exactly what he wants.
driver.sandwich=You look hungry. Here, have some dinner.
driver.pigeons=What... get off! Get off my shoes!
guide.look=A tour guide with an umbrella and a voice made for crowds.
guide.tour.1=And here, ladies and gentlemen, the most famous curse in history!
guide.tour.2=From the flames, the Grand Master of the Templars cursed the King of France! Unto the thirteenth generation!
guide.tour.3=Strictly speaking, he was burned on the little island down there; it only became part of the bridge three centuries later. And the curse is a legend.
guide.tour.4=Madame is a historian! A round of applause!
guide.tour.5=Look, the big man is feeding the pigeons! Can we take a picture with him?
driver.leave=...Another time, Madame Vogt.
guide.tour.6=And now, ladies and gentlemen, on to Notre-Dame! Follow the umbrella!
far-bank.look=The Louvre, its windows lit. In 1307 a royal castle stood there; the King's men had a short walk to the Temple.
river.look=The Seine, black and gold under the lamps.
river.use=It's cold and it's dark. No.
statue.look=Henri IV on his horse. Three hundred years after the Templars. The pigeons are sitting on the pedestal.
statue.use=I can't reach him and he wouldn't help.
statue.sandwich=From here they'd never notice it. They'd have to come to me.
parapet.look=The oldest bridge in Paris, finished in 1607. Old for Paris; young for the Templars.
parapet.use=I'm not leaning over. Not with what's in my bag.
bridge-lamp.look=The lanterns of the Pont Neuf. Everything looks like an old engraving under them.
bridge-lamp.use=Warm, at least.
wall.look=The stone pier above the steps down to the island.
wall.use=Solid. Four hundred years solid.
steps.look=Steps down to the little park on the island's point. That's where the pyre stood.
steps.use=It's closed at night, and I can read the plaque from up here.
plaque.blocked=Hélène's driver is standing right in front of it.
plaque.look.1="At this place Jacques de Molay, last Grand Master of the Order of the Temple, was burned on 18 March 1314."
plaque.look.2=Seven years after the arrests. Seven years in prison, and then this.
plaque.look.3=The eighteenth of March... The psalter has a calendar of saints' days. And I photographed every page of it this morning.
phone.plaque.early=Let me read the plaque first.
calendar.1=March... the eighteenth. There's a note in the margin. Tiny, in brown ink, by a later hand.
calendar.2="Rupella. Ad navem." Rupella is La Rochelle. "To the ship."
calendar.3=Someone marked the day Molay died, and wrote where something had gone: to a ship, at La Rochelle.
calendar.4=The other half of the chirograph. It has to be.
card.act1.end=End of Act 1|"Rupella. Ad navem." The trail leads to La Rochelle.
goal.40=Get to the plaque for Jacques de Molay. The driver is in the way.
hint.40=The driver won't move for words. But the pigeons on the statue are hungry, and I have half a sandwich.
goal.41=Read the plaque, and compare the date with my photos of the psalter's calendar.
hint.41=Use the phone on the plaque.
name.swarm=pigeons
swarm.look=Every pigeon of the Pont Neuf, and all of them on his shoes.
name.bridge-lamp=lantern

