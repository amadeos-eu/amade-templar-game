quay.intro.1=La Rochelle. Five days on the road, and the fog was waiting for me.
quay.intro.2=Brother Étienne's message said: the ship that answers your lantern three times.
goal.80=Find the ship in the fog.
hint.80=Signal with the lantern, toward the ship.
goal.81=Tell Brother Étienne what happened in Paris.
hint.81=Talk to Brother Étienne.

fog.look=Fog. I can hardly see my own boots.
town-walls.look=The walls of La Rochelle. A few lights in the town. The King's men are there too.
ship.look=Something big, out there in the fog. A mast? A ship with no light.
ship.seen=Three lights. It's her.
sea.look=Black water. It smells of salt and tar.
sea.use=I came here to send something across it, not to swim.
mooring-post.look=A mooring post, the rope wet with fog.
mooring-post.use=Somebody else's ship, somebody else's rope.
gangplank.look=A gangplank, down to the quay. Somebody is expecting company.
gangplank.fog=Not before I know whose ship it is.
gangplank.no=I'm not going aboard. My road ends here.
lantern.look=A shuttered lantern. Open, closed, open: the oldest language at sea.
lantern.use=I should signal toward the ship.
lantern.wrong=Signal the fog? It doesn't answer. Toward the ship.
signal.1=Open... closed. Open... closed. Open... closed.
signal.2=There! Three lights, out in the fog. Three times.
signal.3=Raoul? God be praised. We were afraid you'd been taken with the others.
signal.4=Brother Étienne! I was the only one they didn't take. Thanks to a cat.
sea-chest.look=A small chest with iron bands and a red seal. Our half of the chirograph is inside.
sea-chest.use=That's for the captain, not for me.

etienne.look=Brother Étienne of our house at La Rochelle. He hasn't slept for days, by the look of him.
etienne.q.paris=The Temple in Paris has fallen.
etienne.paris.1=The Temple in Paris has fallen, Brother. Everybody was taken. Brother Gérard, the Marshal, the squires.
etienne.paris.2=Here too. The same morning, the same sealed letters. Only a few of us got away.
etienne.paris.3=God keep them. And God forgive the King, because I can't.
etienne.q.gold=Is there gold in that chest?
etienne.gold.1=Is there gold in that chest?
etienne.gold.2=Parchment. Worth more than gold, and it doesn't clink when the King's men walk past.
etienne.q.page=Aimery hid the Paris half in a psalter, in the library.
etienne.page.1=Aimery hid the Paris half of the account in a psalter, in the library of the Temple. He told me in a psalm.
etienne.page.2=In a psalter. Good boy. Then the two halves are safe, and apart, as they should be.
etienne.page.3=This one must leave France tonight. Captain!
etienne.page.4=My king, Dom Dinis, will not hand Templars over to anyone. In Portugal your half will be safe.
etienne.page.5=Take this, brother. A token from Tomar, from your brothers there. If one day someone comes looking, let it show them the way.
etienne.page.6=Then I'll leave it at our house, behind the two riders. Whoever finds it will know where to look.
etienne.page.7=Go with God.
etienne.page.8=And you with the sea.
card.fog.end=Whether Templar ships really left La Rochelle is not known.|No document tells of this one. The game made it up.
etienne.q.bye=In a moment, Brother.
etienne.bye=Quickly, Raoul. The fog won't hold for ever.

captain.look=The captain: Portuguese, by his accent. He talks little and watches the fog.
captain.talk=Speak to Brother Étienne. I only carry.
epilogue.title=What really happened
epilogue.1.head=Friday, 13 October 1307
epilogue.1.text=At dawn the King's men arrested the Templars all over France, by sealed orders sent out weeks before. The charges were heresy and idolatry. Most historians think money was the real reason: King Philip IV was deep in debt, and the Templars were among those he owed.
epilogue.2.head=The trial
epilogue.2.text=Under torture many Templars confessed. In August 1308, at Chinon, Pope Clement V absolved the Grand Master and the other leaders. That parchment was misfiled in the Vatican archives until Barbara Frale found it in 2001.
epilogue.3.head=The end of the order
epilogue.3.text=In 1312 the Council of Vienne dissolved the order without condemning it, and its property went to the Hospitallers. On 18 March 1314 Jacques de Molay, the last Grand Master, was burned on a small island in the Seine, near today's Pont Neuf.
epilogue.4.head=Portugal
epilogue.4.text=King Denis of Portugal did not hand his Templars over. In 1319 a new order, the Order of Christ, took over their brothers and their lands, and from 1357 its seat was Tomar. The Charola, the Templars' round church of the twelfth century, still stands there.
epilogue.5.head=Legends
epilogue.5.text=A fleet that sailed from La Rochelle with the treasure, a curse from the pyre, a secret Templar cipher: no source tells of any of them. The Pope and the King did both die in 1314; the curse was added to the story later.
epilogue.6.head=Chirographs
epilogue.6.text=A chirograph was one text written twice on one parchment and cut apart through a word, often CHIROGRAPHUM, so that the two halves fitted only each other. Many survive in archives across Europe.
epilogue.7.head=Made up for this game
epilogue.7.text=Maria, Kev, Hélène, Monsieur Lefort, Madame Morin, Dona Inês, Aimery and the brothers Gérard, Raoul and Étienne; the page, the token, the chest of the King's promises, and the archive in the tower. Many records of the Order of Christ are real: today they are kept in Lisbon, in the national archive of the Torre do Tombo.
card.tomar=Tomar, Portugal, two days later|The Convent of Christ, above the town
charola.intro.1=The Charola. The round church of the Templars of Tomar. Eight hundred years old, and it still smells of candles.
charola.helene.1=Madame Vogt. What a coincidence.
charola.helene.2=Madame de Vaucresson. You watch Kev's stream.
charola.helene.3=Every evening. He's very bad at keeping secrets. I've just made a small donation to the convent, for the roof.
charola.helene.4=How small?
charola.helene.5=Small enough for a reader's pass to the archive. Enjoy the church.
charola.kev.1=Chat, did you see that? The camel coat lady! LIVE!
charola.kev.2=No filming in the Charola! How many times, senhor?
charola.kev.3=This is the fourth time. My followers counted.
goal.90=Find out what the token from La Rochelle has to do with Tomar.
hint.90=Look around the church. There's a showcase by the wall.
octagon.look.1=In the middle, the octagon with the high altar, painted and gilded all over.
octagon.look.2=The Templars built it round, like the Church of the Holy Sepulchre in Jerusalem.
octagon.use=Behind a rope, in a church, with a guide watching? No.
paintings.look=The paintings and the gold are younger than the walls: about 1500, when the Order of Christ was rich from the voyages at sea.
paintings.use=Five hundred years old. I don't touch, I look.
charola-window.look=A tall window. The light falls straight onto the altar, as if someone had planned it. Someone did.
rope.look=A red rope. Its job is to keep Kev out. It isn't very good at it.
rope.use=Menina! The rope is there for a reason!
tower-door.locked=A door to the tower stairs. Locked.
showcase.look.1=A showcase for this month's exhibition, "Pilgrims of Tomar". Stone moulds for pilgrims' tokens, from the fourteenth century.
showcase.look.2=One of them is cut in the shape of a round church. The size of my token.
showcase.open=The showcase is open.
showcase.locked=Locked. And the glass is very clean, so Dona Inês must polish it every day.
showcase.glass=The glass is in the way. Dona Inês has the key.
showcase.after=The mould and the token, side by side. Seven hundred years apart, and still a pair.
goal.91=Ask Dona Inês to open the showcase.
hint.91=Talk to Dona Inês.
token.fits.1=It fits. Every line of the church, every letter of TOMAR.
token.fits.2=This token was cast here. In this mould.
token.fits.3=Nossa Senhora. Where did you find that?
token.fits.4=This mould was found in 1931, in the archive tower. In a wall cupboard behind the old registers of the Order of Christ.
token.fits.5=Then that's where I need to look. Behind the registers.
token.fits.6=For a scholar who knows her Templars... Come. I will open the tower for you.
token.fits.7=Up the stairs, menina. And only you. Not the boy with the stick.
goal.94=Go up to the archive.
hint.94=Through the door to the tower stairs.
ines.look=Dona Inês, the guide. Proud of every stone in this convent, and she knows every one of them by name.
ines.page=Put that in an archive box, menina, not in a coat pocket!
ines.phone=No filming! ...Oh, it's you. No filming anyway.
ines.q.who=You're the guide here?
ines.who.1=You're the guide here?
ines.who.2=Inês Carvalho. Thirty-one years in this convent. I've seen popes, presidents and nine film crews.
ines.who.3=And that boy. He's worse than the nine film crews.
ines.q.helene=Who was the lady in the camel coat?
ines.helene.1=Who was the lady in the camel coat?
ines.helene.2=Madame de Vaucresson. She gave money for the roof. The director gave her a pass for the archive.
ines.helene.3=She asked for the registers from 1319. Nobody asks for those. Twice in one day is very strange.
ines.q.round=Why is the church round?
ines.round.1=Why did the Templars build it round?
ines.round.2=Like the Holy Sepulchre in Jerusalem. The knights went there to defend it, and they brought its shape home.
ines.round.3=They say the knights rode into Mass on their horses. That is a story. I tell it anyway; the tourists love it.
ines.q.open=Could you open the showcase?
ines.open.1=Could you open the showcase for a moment? I have a token that may fit one of the moulds.
ines.open.2=I open it for scholars, menina. Not for treasure hunters.
ines.open.3=Three questions. If you know your Templars, I open it.
goal.92=Answer Dona Inês's three questions.
hint.92=You know the answers from Paris and La Rochelle: the day of the arrests, the seal, and who took over in Portugal.
quiz.q.1=First. On what day were the Templars of France arrested?
quiz.a.1314=On 18 March 1314.
quiz.1314.1=On the 18th of March, 1314.
quiz.1314.2=Não. That is the day Jacques de Molay was burned. From the beginning, please.
quiz.a.1307=On Friday, 13 October 1307.
quiz.1307.1=Friday, the 13th of October, 1307. At dawn.
quiz.right.1=Good.
quiz.q.2=Second. What does the seal of the Templars show?
quiz.a.1119=In 1119, in Jerusalem.
quiz.1119.1=In 1119, in Jerusalem?
quiz.1119.2=Não. That is when they were founded, more or less. From the beginning.
quiz.a.church=A round church.
quiz.church.1=A round church.
quiz.church.2=That is on your token, menina, not on the seal. From the beginning.
quiz.a.lion=A lion holding a key.
quiz.lion.1=A lion with a key?
quiz.lion.2=Não. You are thinking of a bank. From the beginning.
quiz.a.riders=Two knights on one horse.
quiz.riders.1=Two knights on one horse. I've had it in my hands.
quiz.right.2=Very good.
quiz.q.3=Last. Who took over the Templars of Portugal, their brothers and their lands?
quiz.a.christ=The Order of Christ, in 1319.
quiz.christ.1=The Order of Christ. Founded in 1319, by King Denis.
quiz.christ.2=Dom Dinis. Yes. And from 1357 its seat was here, in Tomar.
quiz.christ.3=You are a scholar, menina. I open it.
quiz.christ.4=There. Show me your token.
goal.93=Try the token in the mould.
hint.93=Use the lead token on the showcase.
quiz.a.hospital=The Hospitallers.
quiz.hospital.1=The Hospitallers?
quiz.hospital.2=In France, yes. Not here. In Portugal we did things our own way. From the beginning.
quiz.a.king=Nobody. The king kept it all.
quiz.king.1=Nobody. The king kept everything for himself.
quiz.king.2=That was the French king's idea. Ours was cleverer. Não. From the beginning.
quiz.a.think=Let me think about it.
quiz.think=Think, menina. The Templars had seven hundred years; you have all afternoon.
ines.q.bye=Thank you.
ines.bye=De nada. And tell your friend: no filming.
kev-tomar.look=Kev. He's filming the ceiling, the floor, and Dona Inês's back, in that order.
kev-tomar.q.pigeon=Is that the pigeon from Paris?
kev-tomar.pigeon.1=Kev. Is that the pigeon from the Pont Neuf?
kev-tomar.pigeon.2=He was in my backpack the whole way. Eleven hours on the train. He ate my sandwich. Again.
kev-tomar.pigeon.3=My followers named him. He's called Jacques now.
kev-tomar.pigeon.4=After Jacques de Molay? ...That's actually very good, Kev.
kev-tomar.q.stream=Who's watching today?
kev-tomar.stream.1=Who's watching today?
kev-tomar.stream.2=Forty-one! Same as always. Ohio, Lisbon, my mum, and the camel coat lady.
kev-tomar.stream.3=She's here, Kev. She doesn't need to watch.
kev-tomar.stream.4=Then that's forty viewers and one fan in person!
kev-tomar.q.answers=Do you know anything about the Templars?
kev-tomar.answers.1=Kev, quickly: on what day were the Templars arrested?
kev-tomar.answers.2=Easy. Friday the 13th. That's why Friday the 13th is unlucky!
kev-tomar.answers.3=No, it isn't. That story is much younger. But the day is right.
kev-tomar.q.bye=Keep the camera down.
kev-tomar.bye=Down, sure. Down is a good angle.
pigeon-tomar.look=The pigeon. It came all the way from Paris, and it still looks unimpressed.
pigeon-tomar.use=It looks at me, then at my pockets. It knows I don't have food.
archive.intro.1=The archive of the convent. Up here are the registers of the Order of Christ, the ones the museum still keeps.
archive.intro.2=The cupboard behind them is empty now. But the register on the lectern is from 1319 to 1340.
archive.intro.3=Thank you, Dona Inês.
archive.intro.4=Pencil only, menina. I'll be downstairs, in the cloister, keeping an eye on your friend.
goal.100=Look at the register on the lectern.
hint.100=It's the big book in the middle of the room.
archive-door.locked=Locked. From the outside. Of course.
archive-door.notyet=Not yet. I didn't climb a tower to leave with nothing.
registers.look.1=Registers of the Order of Christ, row after row: accounts, letters, visits to the commanderies.
registers.look.2=Seven hundred years of a very careful order.
registers.use=I'd need a year to go through them. And a different reader's pass.
register.look.1=A register of the Order of Christ, 1319 to 1340. Latin and Portuguese, in three or four hands.
register.look.2=The back board is thicker than the front one. Much thicker.
register.use.1=I leaf to the back. The last quire is sewn on, but the back board is too thick for one board.
register.use.2=Just like my psalter in Paris. Somebody liked this trick.
register.empty=The register has given me what it had.
goal.101=Look for the other half of the chirograph in the register.
hint.101=You know how: the bone folder, under the pastedown at the back.
half.found.1=There it is. A folded parchment, under the pastedown. Cut along one edge. The cut goes through letters.
half.found.2=...GRAPHUM. The other half of the word. The other half of the page.
goal.102=Put the two halves together.
hint.102=Use the page from Paris on the other half.
half.look=The Tomar half. The cut along its edge goes through the letters ...GRAPHUM.
half.page=The other way round. The Paris page goes onto this one.
joined.1=CHIRO... GRAPHUM. The two halves fit like teeth. Seven hundred years apart, and not a hair between them.
joined.2=The Paris half has the sum the Crown owed the Temple. The Tomar half has the same sum, and one line more.
joined.3=It's in the same hand as the calendar in the psalter. "Arca in claustro, sub lapide crucis."
joined.4=A chest. In the cloister. Under the stone with the cross.
joined.5=...And I just read that aloud.
joined.helene.1=Thank you, Madame Vogt. You read Latin beautifully. And loudly.
joined.helene.2=Madame de Vaucresson.
joined.helene.3=Keep your little papers. I came for the chest.
joined.helene.4=You can't just dig up a cloister!
joined.helene.5=I gave money for the roof. I'm sure they'll forgive me a floor.
joined.helene.6=She locked the door. I'm locked in a tower. With a pencil.
goal.103=Get out of the archive.
hint.103=Look around: the desk, the book lift in the wall, the window over the cloister.
chirograph.look.1=The chirograph, both halves together. The account the Templars of Paris kept with the King of France.
chirograph.look.2=One half was meant for the Temple and one for the Crown. The Crown's half never left the Temple.
chirograph.use=It's a record, not a key. It opens nothing; it proves something.
reading-desk.look=A reading desk with a green lamp, foam wedges for the books, and a pencil.
reading-desk.use=I sit for a second. Then I remember I'm locked in.
desk-pencil.look=A pencil. In archives only pencils are allowed: ink never comes out of parchment again.
pencil.take=A pencil. The archivist's weapon.
pencil.look=An archive pencil, sharpened at both ends by someone very organised.
rules.look=The rules of the reading room: silence, pencils only, no food or drink. Somebody has underlined "no food" twice.
note.write.1=I write on the back of the café napkin, in big letters:
note.write.2=LOCKED IN THE ARCHIVE. CALL THE CONVENT. MARIA.
note.look=My napkin from La Rochelle: on one side the menu in Kev's "Templar cipher", on the other my call for help.
napkin.pencil=The other way round: pencil on napkin.
goal.104=Find a way to call for help.
hint.104=Write a note. There's a pencil on the desk, and you have a napkin.
goal.105=Write a note asking for help.
hint.105=Use the pencil on the napkin.
goal.106=Make someone down there look up at the window.
hint.106=Kev films anything with feathers. Show your note at the window once the pigeon is there.
book-lift.look=A book lift: a little box on ropes, to send registers down to the reading room. It's down there now.
book-lift.use.1=I turn the crank. The box comes up, creaking, a little at a time.
book-lift.use.2=There's a paper bag in it.
book-lift.up=The book lift, up. Big enough for three registers. Not for one restorer.
book-lift.small=I could fit one arm in there. Possibly a shoulder. Not the rest of me.
book-lift.note=It only goes down to the reading room. Nobody's there on a Sunday.
lunch-bag.look=A paper bag from the bakery on the Praça da República.
lunch-bag.take.1=A pastel de nata. Somebody's lunch, smuggled past the rules.
lunch-bag.take.2=Sorry, whoever you are. It's an emergency.
pastry.look=A pastel de nata, a little squashed. It's crumbling already.
pastry.use=Not in the archive. "No food", underlined twice.
tower-window.look.1=A barred window, high over the cloister.
tower-window.look.2=Down there, Kev is filming the arches with his headphones on. He'd never hear me.
tower-window.notyet=I have work to do first.
tower-window.open.1=The window opens; the bars don't.
tower-window.open.2=KEV! ...Headphones. Of course.
tower-window.shout=KEEEV! ...Nothing. He's nodding along to something.
pastry.closed=The window is closed.
pastry.window.1=I crumble the pastry on the sill. The crumbs fall like snow over the cloister.
pastry.window.2=And there's the pigeon. Of course. It came from Paris and it still can't say no to crumbs.
pastry.window.3=Down below, Kev has swung his camera round to it. "CHAT! JACQUES IS UP THE TOWER!"
pigeon-archive.look=The pigeon, on the sill, eating my only pastry. Kev is filming it from below.
pigeon-archive.use=I'm not throwing a pigeon out of a window. Not even this one.
note.closed=The window is closed.
note.nobody=Nobody down there is looking up. Kev films anything that moves; I need something worth filming next to the window.
note.pigeon=It's not a carrier pigeon. It's barely a pigeon.
rescue.1=I hold the note against the bars, right next to the pigeon. Big letters. Smile, Maria.
rescue.2=Kev is zooming in. On the pigeon. And on my note.
rescue.3=His phone is ringing. And ringing. And ringing.
rescue.4=Menina! Forty-one people have called the porter's lodge! One of them from Ohio!
rescue.5=The boy's mother said to tell you hello.
rescue.6=Hélène de Vaucresson locked me in. She's in the cloister, under the stone with the cross.
rescue.7=In my cloister? With a crowbar?! Come!
cloister.intro.1=Too late, Madame Vogt. Seven hundred years too late, in fact.
cloister.intro.2=You lifted a gravestone in a monument of world heritage.
cloister.intro.3=With a very good crowbar. And look what was under it.
cloister.intro.4=Madame! This is a cloister, not a building site!
cloister.intro.5=The treasure of the Templars...
cloister.intro.6=...Paper? Parchments, with seals on? Where is the gold?
cloister.intro.7=Chat! The chest is open! LIVE! ...What is it? Can anyone zoom?
goal.110=See what is in the chest.
hint.110=Look at the open chest.
arcades.look.1=Two floors of arches around a little garden. The cemetery cloister, from the fifteenth century.
arcades.look.2=Monks are buried under the paving. Or were, until Hélène showed up with a crowbar.
arcades.use=Very old stone, very hard. Very well built.
orange-tree.look=An orange tree, in the middle of the cloister, as if nothing had happened.
orange-tree.use=They're bitter oranges. I know that without trying.
slab.look=The slab with the cross, levered up and leaning. It's thick enough to keep a secret seven hundred years.
slab.use=Hélène needed a crowbar. I have a pencil.
iron-chest.look=An iron-bound chest under the slab.
iron-chest-open.look.1=Parchments. Dozens of them, each with a seal hanging from it on a cord. Not the seal of the Templars.
iron-chest-open.look.2=Lilies. The seal of the King of France.
goal.111=Show Hélène what she has really found.
hint.111=You have the account from both halves. Show it to Hélène.
goal.112=Prove it to Hélène.
hint.112=Use the chirograph on Hélène.
iron-chest-open.use=Hands off, Madame Vogt. Mine.
cloister-gate.look=The gate to the main cloister. Tourists, a café, and an exit.
cloister-gate.notnow=Not now. Not with Hélène in a grave with a crowbar.
helene-cloister.look=Hélène de Vaucresson, kneeling in a monk's grave in a camel coat. She makes it look elegant.
helene-cloister.q.gold=Did you find your gold?
helene-cloister.gold.1=So. Did you find your gold?
helene-cloister.gold.2=My grandfather said the Templars hid their gold and the King never found it. All his life he said that.
helene-cloister.gold.3=He was half right.
helene-cloister.gold.4=Half right is wrong, Madame Vogt.
helene-cloister.q.family=Why do you care so much?
helene-cloister.family.1=Why do you want it so badly?
helene-cloister.family.2=The Vaucressons lent money to kings for three hundred years. Then the kings stopped paying.
helene-cloister.family.3=We had a château. Now I have a flat, a coat, and this.
helene-cloister.family.4=Then you of all people will understand what's in that chest.
helene-cloister.q.read=Read one of them.
helene-cloister.read.1=Read one, Madame. Any one of them.
helene-cloister.read.2="We, Philip, by the grace of God King of the Franks..." I don't read Latin that fast.
helene-cloister.read.3=I do. And I can show you what it means.
helene-cloister.bye=Go away, Madame Vogt. Take your pigeon with you.
helene-cloister.q.bye=Never mind.
finale.early=She wouldn't even look at it. I should first know what's in that chest.
finale.1=This is the account the Temple kept with the King. Both halves. The sum at the bottom, Monsieur Lefort's small kingdom, is what he owed them.
finale.2=And your chest is full of the King's own promises to pay. Sealed with his lilies. They add up to the same sum.
finale.3="...which we promise to repay to the brothers of the Temple at the next feast of All Saints..."
finale.4=All Saints. The first of November 1307. Not three weeks after he had them all arrested.
finale.5=He never meant to pay. He arrested his creditors instead.
finale.6=CHAT. Seven-hundred-year-old unpaid bills! Is that a treasure? Vote now!
finale.7=That is not a treasure, senhor. That is evidence. And it belongs to the convent.
finale.8=You can keep it. Paper. Seven hundred years for a chest of IOUs.
finale.9=My grandfather would have laughed. Bonsoir, Madame Vogt.
finale.10=Gold can be melted down. A debt written in two hands cannot.
finale.11=Beautiful. Who said that?
finale.12=A Templar treasurer, the night before the arrests. At least, that's what I'd like to think.
finale.13=The two halves will go to the archives. Paris and Lisbon, one each, and copies side by side. As a chirograph should be.
finale.14=Maria! MARIA! The video! Two million views!
finale.15=Two million? For seven-hundred-year-old IOUs?
finale.16=For Jacques. He's trending.
finale.17=...Of course he is.
card.finale=The account was settled.|Seven hundred years late, and only on paper. Like most accounts with kings.
finale.chest=Hélène is the one who needs to see it, not the chest.
finale.ines=I believe you, menina. It's Madame you have to convince.
finale.kev=Can I film it? ...For the archive?
ines-cloister.talk.1=Dona Inês, are you all right?
ines-cloister.talk.2=Thirty-one years, menina, and nobody has ever dug up my cloister. I need a coffee. Afterwards.
kev-cloister.talk.1=Kev, put the camera on the chest, not on me.
kev-cloister.talk.2=The chest is boring, Maria. The chat wants the pigeon.
pigeon-cloister.look=The pigeon, very proud of itself. It's on two million phones by now.
phone.archive=No signal. These walls are two metres thick. The Templars would have been pleased.
