dialog.controls.text=<b>Left button</b>: walk, use, talk, go through a door.<br><b>Right button</b>: look at something.<br><br>Move the pointer to the top of the screen for the inventory. Click an item to take it in hand, then click on something to use it there, or on another item to put the two together. The right button puts it back.<br><br><b>N</b>: Lena's notebook, what to do next; press N again for a hint.<br><b>Esc</b> or <b>.</b>: skip a line.<br><b>F5</b>: save, <b>F9</b>: continue the saved game. The game also saves itself in every new room.<br><b>F11</b>: full screen.
dialog.about.text=A point-and-click adventure: a book restorer in Paris finds a page hidden in the binding of a medieval psalter, and follows it back to the night before the Templars were arrested.
dialog.about.history=The history in this game is true: the arrests of 13 October 1307, the king's debts, the Paris Temple, the seal with two knights on one horse. Lena, Aimery, Brother Gérard, Brother Raoul, Hélène and the page are invented; legends are called legends.

