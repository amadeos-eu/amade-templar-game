card.1307=Paris, 12 October 1307|The house of the Knights Templar, at night
card.arrest=Friday, 13 October 1307|At dawn the King's men arrested every Templar in France. The psalter stayed on its lectern.
ledger.look=The last page of the Temple's accounts with the Crown: what King Philip owes the order, to the denier. One half of a chirograph.
ledger.look.sealed=The page, folded and sealed with the two knights on one horse.
key.look=The key to the treasurer's chest. Brother Gérard's hand was shaking when he gave it to me.
seal.look=The seal of the order: two knights riding one horse. Poverty, they say. And brotherhood.
wax.look=A stick of red sealing wax. Hard as bone.
soft-wax.look=Warm and soft. Quick, before it sets again.
cheese.look=A piece of Brother Gérard's cheese. It smells strongly enough to wake the dead.
cheese.use=I'm not hungry. Somebody else might be.
knife.look=The copyist's penknife. Sharp enough to cut parchment.
glue.look=Hide glue, still warm from the stove. The copyist was working late, too.
seal.hardwax=The wax is too hard. It needs warming first.
name.gerard=Brother Gérard
name.lancet=window
name.banner=banner
name.book-stand=reading desk
name.chest=chest
name.chest-open=open chest
name.table=table
name.accounts=account books
name.candles=candles
name.supper=Brother Gérard's supper
name.wax-stick=sealing wax
name.courtyard-door=door to the courtyard
gerard.intro.1=Aimery. Close the door behind you. Quietly.
gerard.intro.2=Brother Gérard? It's long past Compline.
gerard.intro.3=The King's men have been asking questions all week. Tonight I heard they carry sealed letters, to be opened everywhere at the same hour.
gerard.intro.4=Take this: the last page of our accounts with the Crown. What the King owes us, to the denier.
gerard.intro.5=It must leave the Temple tonight, under the treasurer's seal. The seal is in the chest. Here is the key.
gerard.look=Brother Gérard, keeper of the accounts. Thirty years in the Temple. I've never seen him afraid before.
gerard.q.why=Why this page, of all things?
gerard.why.1=Why this page, Brother? Why not the gold?
gerard.why.2=Gold can be melted down, Aimery. A debt written in two hands cannot.
gerard.why.3=This is a chirograph: one half stays with us, the other half is already on its way to the coast. Whoever holds both holds the King's debt.
gerard.q.king=Why would the King move against us?
gerard.king.1=King Philip owes more than he can pay. When that happened before, he arrested the Lombard bankers and took their money. Last year he drove out the Jews and kept everything they had.
gerard.king.2=He calls it justice. I call it bookkeeping.
gerard.q.how=How do I seal it?
gerard.how=Warm the wax at a candle, put it on the fold, and press the seal into it while it's soft.
gerard.q.where=Where shall I take it?
gerard.where.1=Out through the courtyard and the gate. Brother Raoul keeps the gate tonight and he'll want to know why.
gerard.where.2=Don't tell him. Raoul is a good brother but a slow one.
gerard.q.bye=God keep you, Brother.
gerard.bye=And you, child. Go.
lancet.look=The moon over Paris. Somewhere out there the King's men are waiting for morning.
lancet.use=Too narrow to climb through. The Templars built well.
banner.look=The Beauséant: black and white, the banner of the order. Black for our enemies, white for our friends, they say.
banner.use=Nobody touches the banner.
book-stand.look=The treasurer's day book. Rents from the Marais, wine from Brie, a loan to a bishop.
book-stand.use=Not now.
chest.look=The treasurer's chest, bound in iron. Locked.
chest.locked=Locked. Brother Gérard has the key... no, I have it.
chest.open=The seal of the order, in its leather pouch.
chest-open.look=Only receipts left in it. Receipts and dust.
table.look=The treasurer's table: account books, ink, candles. And Brother Gérard's supper, untouched.
table.use=Everything on it has its place. Brother Gérard would notice.
accounts.look=Columns of Roman numerals. Pounds, shillings and pence; livres, sous and deniers.
accounts.use=I can't carry the whole treasury.
candles.look=Two good wax candles. Brother Gérard doesn't save on light.
candles.use=I'd better not burn anything else tonight.
wax.soften=The wax softens in the flame.
ledger.candle=Burning the King's debt? Some would pay for that. No.
supper.look=Bread, a jug of wine, and a piece of cheese that smells all the way to the door.
supper.take=He won't eat tonight. And the cheese may be useful.
wax-stick.look=A stick of red sealing wax.
wax-stick.take=Red wax, for the seal.
wax.hard=The wax is hard as stone. It needs warming.
ledger.waxed=A blob of soft wax on the fold. Now the seal, quickly!
seal.nowax=I need wax on the page first. Soft wax.
seal.done=Two knights on one horse. Sealed.
seal.gerard.1=Good. Now nobody can say it was written yesterday.
seal.gerard.2=Go, Aimery. Out through the gate. And don't look back.
seal.softwax=I put the wax on the page, then the seal on the wax. Not the other way round.
door.unsealed=Not unsealed, Aimery! Seal it first.
name.tower=great tower
name.cloister=cloister
name.moon=moon
name.well=well
name.torch=torch
name.gate=gate
name.library=library door
name.chapter=treasurer's chamber
name.guard=Brother Raoul
name.cat=cat
courtyard.intro=The courtyard. The gate is shut, and Brother Raoul is keeping it. Awake, for once.
tower.look=The great tower of the Temple. The treasure of the King of France lay in it for a hundred years.
tower.use=It's locked at night. Even to me.
cloister.look=The cloister walk. The brothers are asleep, or praying.
cloister.use=No time for the cloister now.
moon.look=A full moon. A bad night for secrets.
well.look=The well of the Temple. Sweet water, they say, the best in Paris.
well.use=I'm not thirsty. I'm afraid.
torch.look=A torch by the gate. Raoul likes to see who's coming.
torch.use=I'd only burn my fingers.
guard.look=Brother Raoul, a sergeant of the order. Big, loyal, and not quick.
guard.q.open=Open the gate, Brother Raoul.
guard.open.1=Open the gate, Brother Raoul. I have an errand for Brother Gérard.
guard.open.2=Nobody leaves before Prime. The Marshal's orders. Not even you, little squire.
guard.q.cat=Is that the stable cat by the well?
guard.cat.1=That beast! It stole my supper last week, right from under my nose. Cheese and all.
guard.cat.2=If I ever catch it near my gate again, I'll chase it all the way to Saint-Denis.
guard.q.bye=Good night, Brother.
guard.bye=Good night. And go to bed.
guard.block=Nobody leaves before Prime, squire.
cat.look=The stable cat. Grey, scarred, and always hungry.
cat.mew=Mrrao.
cat.talk=She wants something. Food, probably. It's always food.
cheese.cat=She'd eat it here and go back to sleep. I want her over there, by the gate.
cheese.throw=Oops. Brother Raoul, I dropped your supper... I mean, Brother Gérard's supper.
guard.sees.1=You! You thief of cheese! Come here!
guard.sees.2=This time I'll catch you!
ledger.guard=Brother Raoul doesn't need to know about this.
gate.look=The great gate to the Rue du Temple. Barred at night.
gate.1=The bar is heavy... There are torches outside. Dozens of them. And lilies on their coats.
gate.2=In the name of the King! Open the gate!
gate.3=The King's men. Already. I'll never get out this way.
gate.4=The library. Nobody will look for a page among books.
gate.soldiers=They're right outside. I'll never get through.
library-door.look=The library door, under the great tower.
library-door.not-yet=Not now. Brother Gérard wants the page out of the Temple tonight.
chapter-door.look=The way back to the treasurer's chamber.
chapter-door.barred=No way back. The brothers are barring the doors.
name.cupboard=book cupboard
name.library-window=window
name.chests=book chests
name.copy-desk=copyist's desk
name.copy-knife=penknife
name.glue-pot=glue pot
name.candle=candle
name.lectern=lectern
name.temple-psalter=psalter
name.library-exit=door to the courtyard
name.soldier=King's man
name.soldier2=King's man
library.intro.1=The library. Books don't get arrested.
library.intro.2=If I hide the page well, it can wait here for better times. However long that takes.
cupboard.look=Books chained to their shelves: the Bible, the Rule of the order, a chronicle of the Holy Land.
cupboard.use=Chained. Nobody takes these books away. That's the point.
library-window.look=Torchlight in the street below. They're surrounding the Temple.
library-window.use=Too high, too narrow, and too many soldiers.
chests.look=Chests of charters and deeds. The first thing they'll search.
chests.use=Charters. The King's clerks will read every one.
chests.ledger=That's the first place they'll look.
copy-desk.look=The copyist's desk. He was working late: the glue pot is still warm.
copy-desk.use=I'm no copyist.
copy-knife.look=A penknife for trimming quills and cutting parchment.
copy-knife.take=The copyist's penknife.
glue-pot.look=A pot of hide glue, still warm.
glue-pot.take=The glue pot. Warm. Good.
library-candle.look=A candle on an iron stand, by the lectern.
lectern.look=The lectern with the psalter that the brothers sing from.
temple-psalter.look.1=A new psalter, the brothers' pride. The prayers of the week and a calendar of the saints.
temple-psalter.look.2=The inside of the cover is pasted over with parchment. If I cut it loose along the edge, there'd be room under it.
temple-psalter.open=The pastedown is loose. There's room under it.
temple-psalter.cut=Carefully, along the edge... The pastedown comes loose.
temple-psalter.no-room=Under the pastedown would be good. But it's glued down.
temple-psalter.hidden=The page fits under it. Folded twice, seal and all.
temple-psalter.no-glue=There's nothing to glue down yet.
temple-psalter.glued=Glue, press, smooth... Nobody will ever know.
temple-psalter.done=It looks as if nobody had ever touched it.
library.soldier.1=There! A squire, in the library! Seize him!
library.aimery.1=Forgive me, Brother Gérard. The page is safe.
library.soldier.2=By order of the King, you are under arrest.
soldier.look=A soldier of the King, with the lilies of France on his coat.
library-exit.look=The door to the courtyard.
library-exit.no=Out there are the King's men. In here is the psalter.
goal.1=Brother Gérard gave me the page and the key to the chest. The page must be sealed with the treasurer's seal.
hint.1=The chest is on the right. Use the key on it.
goal.2=Seal the page: soft wax on the fold, then the seal.
hint.2=Take the sealing wax from the table and warm it at the candles. Put the soft wax on the page, then use the seal on the page.
goal.3=Get the page out of the Temple, through the courtyard and the gate.
hint.3=The door to the courtyard is on the left. Brother Raoul keeps the gate; talk to him.
goal.4=Get Brother Raoul away from the gate.
hint.4=Raoul hates the stable cat, and the cat loves cheese. Brother Gérard's supper is on the table in the chamber.
goal.5=Open the gate.
hint.5=The gate is on the right.
goal.6=Hide the page in the library.
hint.6=The library door is under the great tower.
goal.7=Find a hiding place for the page in the library.
hint.7=Look at the psalter on the lectern. The copyist's penknife is on the desk.
goal.8=Put the page under the pastedown.
hint.8=Use the page on the psalter.
goal.9=Glue the pastedown back down.
hint.9=The glue pot is on the copyist's desk.

# ---- flashback 1: the Rue du Temple, dawn, 13 October 1307 ----
card.cart=Rue du Temple, 13 October 1307|At dawn, outside the gate of the Temple
name.dawn=dawn sky
name.temple-tower=great tower
name.temple-gate=gate of the Temple
name.street-houses=houses
name.bars=bars of the cart
name.wheel=wheel
name.cabbages=barrow of cabbages
name.gerard-cart=Brother Gérard
name.soldier-cart=King's man
name.raoul=carter

cart.intro.1=They took all of us. The Marshal, the cooks, even old Brother Hugues, who can't hear a word.
cart.intro.2=Courage, child. Did you hide it?
cart.intro.3=In the library, Brother. In a psalter. Nobody looks inside a psalter.
cart.intro.4=Good. But somebody outside these bars must know where it is, or it will wait there for ever.
cart.intro.5=That carter with the cabbages... it's Brother Raoul! He was chasing the cat when they came. He got away!
cart.intro.6=If I shout to him in French, the King's man will hear every word.
goal.50=Tell Brother Raoul where the page is hidden, without the King's man noticing.
hint.50=Brother Gérard always knows what to do. Ask him how to talk to Raoul.
goal.51=Sing the message to Raoul, in Latin, as if it were a prayer.
hint.51=Talk to Raoul now. Each line of the psalm has to be in Latin, and it has to carry the message.
goal.52=Raoul knows.
hint.52=Nothing left to do here.

dawn.look=The sun isn't up yet. The King's men came while it was still dark, as if they were ashamed.
temple-tower.look=The great tower. Yesterday it was the safest place in France. Today it's a prison.
temple-tower.use=It's a long way off, and I'm in a cage.
temple-gate.look=Our gate, under the King's lilies. They hung their banner up while we were still being tied.
temple-gate.use=I can't reach it. And the King's men are using it now.
cart-houses.look=The shutters are all closed. Paris is pretending to sleep.
cart-houses.use=Nobody will open a shutter for a Templar this morning.
bars.look=Oak bars, iron nails. Somebody built this cart for people like us long before today.
bars.use=They don't move. I didn't think they would.
wheel.look=A cart wheel. The cart is ready, the prisoners are ready. Only the horse is late.
wheel.use=I can't get at it from in here.
cabbages.look=Cabbages. Brother Raoul hates cabbages.
cabbages.use=I'd have to get out of the cart first.

gerard-cart.look=Brother Gérard. They tied his hands and took his keys. He still looks like the treasurer.
gerard-cart.q.now=What happens to us now?
gerard-cart.now.1=What happens to us now, Brother?
gerard-cart.now.2=Questions. Lawyers. Long months. Monsieur de Nogaret, the King's man of law, has been preparing this for a long time.
gerard-cart.now.3=Say nothing they can twist, child. And pray.
gerard-cart.q.how=How do I tell Raoul without the soldier hearing?
gerard-cart.how.1=How can I tell Raoul without the soldier hearing?
gerard-cart.how.2=These men speak French. The Church speaks Latin. Nobody ever stopped a prisoner from praying.
gerard-cart.how.3=Ask the soldier if you may pray. Then sing, and put the message in the psalm.
gerard-cart.q.bye=I'll try, Brother.
gerard-cart.bye=Slowly, child. Psalms are never in a hurry.

soldier-cart.look=One of the King's men, in the blue with the lilies. He looks as tired as we do.
soldier-cart.q.where=Where are you taking us?
soldier-cart.where.1=Where are you taking us?
soldier-cart.where.2=Where the King's lawyers say. Now sit down.
soldier-cart.q.horse=Shouldn't a cart have a horse?
soldier-cart.horse.1=Shouldn't a cart have a horse?
soldier-cart.horse.2=It's coming. Everything's coming. Half of France is being arrested this morning, there aren't enough horses.
soldier-cart.q.pray=May we pray? It's the hour of Prime.
soldier-cart.pray.1=It's the hour of Prime. May we pray?
soldier-cart.pray.2=Pray, sing, do what you like. In your church Latin, if you must.
soldier-cart.pray.3=I don't understand a word of it anyway.
soldier-cart.q.bye=Nothing.
soldier-cart.bye=Then keep quiet.

raoul.look=Brother Raoul, under a carter's hood. He's pretending to sell cabbages. Badly.
raoul.use=I can't reach him from here. I can only talk.
psalm.start=(He sings, in the voice of the chapel at Prime.)
shout.q.page=Raoul! The page is hidden in the library!
shout.page=Raoul! Brother Raoul! The page, it's in the...
shout.quiet=Hey! Who are you shouting at? Quiet back there!
shout.angry=That's it. You, the carter! Take your cabbages somewhere else!
shout.gone=Raoul is gone. Stupid, stupid...
shout.back=There. He's back, on the other side of his barrow. This time, careful.
shout.q.psst=Psst! Over here!
shout.psst=Psst! Psst!
shout.deaf=He pretends not to hear. Good for him. Bad for me.
shout.eyes=Hm? (The soldier looks from me to the carter and back.)
shout.q.bye=Say nothing.

psalm.q.hear=«Frater Radulfe, audi me.» (Brother Raoul, hear me.)
psalm.hear.1=«Frater Radulfe, audi me, audi me...»
psalm.hear.2=«Audio, frater. Audio.» (I hear you, brother.)
psalm.monks=Monks.
psalm.q.kyrie=«Kyrie eleison.» (Lord, have mercy.)
psalm.kyrie.1=«Kyrie eleison, Christe eleison...»
psalm.kyrie.2=A good prayer. But Raoul just goes on selling cabbages: he thinks I'm really praying.
psalm.q.psst=Psst! Raoul! It's me!
psalm.psst=Psst! Raoul! It's me, Aimery!
psalm.q.where=«Pagina in psalterio, in bibliotheca.» (The page is in the psalter, in the library.)
psalm.where.1=«Pagina in psalterio... in bibliotheca... in psalterio...»
psalm.where.2=«Intellexi.» (Understood.)
psalm.q.cheese=«Caseus in culina est.» (The cheese is in the kitchen.)
psalm.cheese.1=«Caseus in culina est...»
psalm.cheese.2=«...Quid?» (...What?)
psalm.cheese.3=Not that. Raoul's stomach doesn't need to know.
psalm.q.french=The page is in the psalter! In the library!
psalm.french=The page is in the psalter! In the...
psalm.q.half=«Ubi est altera pars?» (Where is the other half?)
psalm.half.1=«Ubi est... altera pars... ubi est?»
psalm.half.2=«Rupella. Ad navem.» (La Rochelle. To the ship.)
psalm.half.3=La Rochelle. The other half is going to a ship at La Rochelle.
psalm.half.4=«Ego sequar.» (I'll follow it.)
psalm.half.5=«Amen.»
psalm.end.1=Here's the horse at last. Enough singing, we're off.
psalm.end.2=Well sung, Aimery. Well sung.
psalm.q.cat=«Ubi est feles?» (Where is the cat?)
psalm.cat.1=«Ubi est feles?»
psalm.cat.2=(Raoul gives me a look that is not a prayer.)
psalm.q.ask=Raoul, where is the other half?
psalm.ask=Raoul, where's the other half of the...
psalm.q.stop=(Stop singing.)
psalm.stop=Amen.
card.cart.end=Brother Raoul was not caught.|That same morning he took the road to the west.

# ---- Act 2: La Rochelle ----
card.rochelle=La Rochelle, the next evening|The old harbour, between its two towers
name.sunset=sunset
name.saint-nicolas=Saint-Nicolas tower
name.chain-tower=Chain tower
name.harbour-water=harbour
name.boat=fishing boat
name.nets=nets
name.gulls=gulls
name.clock-gate=clock gate
name.office=harbour office
name.barometer=barometer
name.quay-lamp=lamp
name.quay-bollard=bollard
name.old-town=to the old town
name.fisherman=old fisherman
name.kev-harbour=Kev

harbour.intro.1=Rupella. La Rochelle. If a ship left with the other half, it left from here.
harbour.intro.2=Seven hundred years ago. I'm looking for a ship that sailed seven hundred years ago.
harbour.kev.1=LENA! Chat, it's her! The page lady!
harbour.kev.2=Kev. What are you doing in La Rochelle?
harbour.kev.3=My followers sent me! Well, one of them. A lady in a camel coat. She even paid for the train.
harbour.kev.4=Hélène. Of course.
goal.60=Find out where the Templars of La Rochelle had their house.
hint.60=Old fishermen know the old town. The one by the nets might.
goal.61=Get the old fisherman a weather forecast he trusts.
hint.61=Kev has a weather app. And the harbour office has something older in its window.
goal.62=Tell the fisherman what the barometer says.
hint.62=Talk to the fisherman.
goal.63=Go to the Cour du Temple, in the old town.
hint.63=The way to the old town is on the left, past the harbour office.

sunset.look=The sun goes down between the towers, straight into the sea. Not bad, La Rochelle.
saint-nicolas.look.1=The Saint-Nicolas tower. Massive, battlemented, beautiful.
saint-nicolas.look.2=And built about forty years after the arrests. No Templar ever saw it.
saint-nicolas.use=It's on the other side of the harbour. And closed at this hour.
chain-tower.look=The Chain tower. At night a chain between the two towers closed the harbour. Also later than the Templars.
chain-tower.use=I'd need a boat to get there.
harbour-water.look=The old harbour. Fishing boats, sailing boats, and a lot of history at the bottom.
harbour-water.use=It's October. No.
boat.look=A blue fishing boat, the MARIE-JO. Freshly painted, nets aboard.
boat.use=It isn't mine. And its owner is standing right there.
nets.look=Nets, floats, a crate. Somebody spent the afternoon mending them.
nets.use=I'd only make the holes bigger.
gulls.look=Gulls, all sitting on the quay. My grandmother used to say that means bad weather.
gulls.use=They look at me as if I owed them money.
gulls.sandwich=That sandwich belongs to the pigeons of Paris.
clock-gate.look=The clock gate of the old town. The gate is medieval; the clock and the dome came much later.
clock-gate.use=The way to the old town is past the harbour office.
office.look=The harbour office. Closed. Through the window: charts, a radio and an old barometer.
office.use=Locked. The opening hours are written on a sign, and we're outside all of them.
office.phone=Not the whole office. Just the barometer.
barometer.dark=An old barometer, on the wall behind the glass. It's too dark in there to read the needle.
barometer.read.1=Phone light on the glass... The needle is past "Variable", heading for "Tempête". Storm.
barometer.read.2=And the little brass pointer says it was much higher this morning. Falling fast.
barometer.again=Falling. Tempête. Even I can read that.
quay-lamp.look=An old quay lamp, just lit.
quay-bollard.look=A bollard with a rope round it.
quay-bollard.use=It's tied tighter than I could untie it.
old-town.where=Into the old town? But where? I don't even know which street to look in.

kev-harbour.look=Kev, streaming the sunset. He hasn't noticed it's beautiful.
kev-harbour.q.who=Who sent you here, Kev?
kev-harbour.who.1=Who sent you here, Kev? Really?
kev-harbour.who.2=A follower. Comments first on every stream. Super nice. Asked where you were going.
kev-harbour.who.3=I said I don't know, and she said La Rochelle, and paid for my ticket!
kev-harbour.who.4=She knows the note too. She must have seen my photos... or your stream, Kev.
kev-harbour.q.fleet=What do you think happened here?
kev-harbour.fleet.1=So, Kev. What happened in La Rochelle?
kev-harbour.fleet.2=The Templar fleet! Eighteen ships, full of gold, gone in one night! It's all over the internet!
kev-harbour.fleet.3=One brother said something like that at his trial, in 1308. One. Nobody else ever confirmed it. It's a legend.
kev-harbour.fleet.4=A legend with eighteen ships, though.
kev-harbour.q.weather=What does your weather app say for tomorrow?
kev-harbour.weather.1=Your phone has a weather app, doesn't it? What does it say for tomorrow?
kev-harbour.weather.2=Sunshine! Twenty-eight degrees! Perfect day for a boat!
kev-harbour.weather.3=Twenty-eight degrees. In October. On the Atlantic. Show me that.
kev-harbour.weather.4=See? "New Rochelle, sunny."
kev-harbour.weather.5=New Rochelle is in New York, Kev.
kev-harbour.weather.6=...That explains the ads for hot dogs.
kev-harbour.q.bye=See you, Kev.
kev-harbour.bye=Stay tuned!
kev-harbour.page=He's had enough of my things in front of his camera.

fisherman.look=An old fisherman, mending his nets. He looks at the sky more often than at the nets.
fisherman.q.templars=Do you know where the Templars lived in La Rochelle?
fisherman.templars.1=Excuse me. Do you know where the Templars had their house in La Rochelle?
fisherman.templars.2=Templars. Do I look like the tourist office, mademoiselle?
fisherman.templars.3=You look like someone who knows the old town.
fisherman.templars.4=Hm. I know the sea. And tomorrow I go out for sole, or I don't. The radio's broken.
fisherman.templars.5=Bring me a forecast I can trust, and I'll tell you about your Templars. Not that boy's telephone.
fisherman.q.again=About the weather...
fisherman.again.1=About tomorrow's weather...
fisherman.again.2=When you know it, I'll know about your Templars.
fisherman.done.1=Thank you again.
fisherman.done.2=Cour du Temple, behind the clock gate. Mind the storm.
fisherman.q.app=Kev's app gives the weather for New Rochelle, in New York.
fisherman.app.1=Kev's app says sunshine. For New Rochelle. In New York.
fisherman.app.2=New York! Ha! Then he's right, it's probably very nice there.
fisherman.app.3=But I don't fish in New York.
fisherman.q.barometer=The barometer in the harbour office is falling fast.
fisherman.barometer.1=The barometer in the harbour office is falling fast. Past "Variable", heading for "Tempête".
fisherman.barometer.2=Falling? ...Then it's wind tomorrow, and no sole. And the gulls knew it before me.
fisherman.barometer.3=You've saved my nets, mademoiselle.
fisherman.barometer.4=And the Templars?
fisherman.barometer.5=My grandmother said their house stood behind the clock gate, in the Cour du Temple. Not much left of it but the name and an old wall.
fisherman.barometer.6=There's a café there now. Madame Morin's. Her family has had it for ever.
fisherman.barometer.7=Tell her Le Goff sent you. Then she'll tell you twice as much.
fisherman.q.towers=Were these towers here in the Templars' time?
fisherman.towers.1=These two towers, were they here in the Templars' time?
fisherman.towers.2=No, no. Later. In your Templars' time there was the harbour, some walls, and the ships. The ships were the important part.
fisherman.q.bye=Good evening.
fisherman.bye=Evening.
fisherman.page=I'm not showing a seven-hundred-year-old page to a man with fish scales on his hands.

# ---- Act 2: the Cour du Temple ----
name.night-sky=night sky
name.old-wall=old wall
name.relief=carved stone
name.hollow=hollow in the wall
name.chalkboard=menu board
name.moved-board=menu board
name.loose-stone=carved stone
name.cafe=café Le Templier
name.cafe-window=café window
name.terrace-lights=string of lights
name.napkin=napkin
name.street-sign=street sign
name.back-harbour=back to the harbour
name.morin=Madame Morin
name.kev-court=Kev

court.intro.1=The Cour du Temple. A café, some houses, and one wall that looks much older than the rest.
court.intro.2=Lena! Look at the menu! It's in the Templar cipher! The Templars left us a message!
court.intro.3=Of course they did, Kev.
goal.70=Look for anything left of the Templars' house in this courtyard.
hint.70=Kev is very excited about the menu board. And there's something behind it.
goal.71=Ask Madame Morin about the old wall behind her menu board.
hint.71=Now that I can read her menu, she might like me. Talk to her.
goal.72=Take a look at the carved stone.
hint.72=It's in the old wall, where the menu board used to stand.
goal.73=See whether the stone can be moved.
hint.73=The mortar round it looks soft. Something thin and flat could get into the joints, like my bone folder.
goal.74=Get help lifting the stone out of the wall.
hint.74=It's too heavy for me. Kev has muscles, at least in his thumbs. Ask him.
goal.75=Look into the hollow behind the stone.
hint.75=Reach into the hollow.

night-sky.look=Stars over La Rochelle. The storm isn't here yet.
old-wall.look=Rough stones, old mortar, ivy. Older than the houses round it, by centuries.
old-wall.use=Solid. Mostly.
street-sign.look=Cour du Temple. The Templars' courtyard. The name has survived seven hundred years. The house hasn't.
cafe.look=Café Le Templier. Of course it's called that.
cafe.use=I'll ask Madame Morin before I walk into her kitchen.
cafe-window.look=Warm light, a bar, three tables. Mussels on every one of them.
terrace-lights.look=A string of light bulbs from the old wall to the café. Seven hundred years of history, and fairy lights.

chalkboard.look.1=The menu board. Squares, angles, dots: the so-called Templar cipher.
chalkboard.look.2=There isn't a single medieval document that uses it. But I'd still like to know what it says. I'd need the key.
chalkboard.behind=Behind the board, something is carved into the wall. I can see the legs of a horse. Four... no, more.
chalkboard.decoded=Mussels and chips, twelve euros. The Templars' last secret.
chalkboard.ask=It's Madame Morin's board. I'd better ask before I move it.
chalkboard.moved=There. Now, what's behind you?
decode.1=Key on the napkin, cipher on the board... square with a dot, M. Open square, O. Angle, U...
decode.2=M-O-U-L-E-S F-R-I-T-E-S. Twelve euros.
decode.3=...So the last secret of the Templars is mussels.
decode.4=And chips. Don't forget the chips.

relief.hidden=Something carved, half behind the menu board. Horses' legs, and the edge of a shield.
relief.blocked=The menu board is in the way.
relief.look.1=Two knights on one horse, shields and lances. Worn almost smooth, but there's no mistaking it.
relief.look.2=The seal of the Templars, in stone. In their own courtyard.
relief.use=It sits in old lime mortar, and the mortar looks soft. I'd need something thin and flat for the joints.
relief.heavy=The stone is loose now, but it's far too heavy for me alone.
relief.loose.1=The bone folder goes into the joint like into butter. Old lime mortar, centuries old... it crumbles.
relief.loose.2=The stone moves! But it's heavy. Much too heavy for me alone.
loose-stone.look=The riders, leaning against the wall. They've been watching this courtyard for seven hundred years.
hollow.look=Behind the stone, a hollow. Dust, a dead spider... and something small and grey.
hollow.empty=Empty now. Just dust.

token.found.1=A lead token, no bigger than a coin. Pilgrims used to buy these at the shrines they visited.
token.found.2=There's a round church on it, and letters round the edge: ...TOMAR.
token.found.3=Tomar, in Portugal. The Templars' castle there was built in 1160. And in Portugal the king never had them arrested.
token.found.4=It's empty?! Where's the gold? Chat, where's the GOLD?
token.found.5=The gold was never the point, Kev.
token.look=A lead pilgrim's token. A round church, and the word TOMAR.
token.use=It's not a coin. Not for the coffee machine, either.
phone.token=Click. Before and after. Restorer's rule.

napkin.look=A paper napkin from the café, with the key to the cipher printed on it, so the guests can read the menu.
napkin.take=A souvenir. And a key.
napkin.page=I'm not putting a paper napkin anywhere near a seven-hundred-year-old page.

kev-court.look=Kev, streaming the menu board. Eleven viewers. A record, he says.
kev-court.q.cipher=It isn't a Templar cipher, Kev.
kev-court.cipher.1=It isn't a Templar code, Kev. That alphabet was never found in a single medieval document.
kev-court.cipher.2=Exactly! That's how good they were at hiding it!
kev-court.cipher.3=That's not how evidence works.
kev-court.cipher.4=That's how content works.
kev-court.q.lift=Kev, help me lift this stone.
kev-court.lift.1=Kev. Put the phone down for a second and help me lift this stone.
kev-court.lift.2=A Templar vault? LIVE? Chat, we're opening a VAULT!
kev-court.lift.3=Hnngh... got it! Chat, we're in!
kev-court.lift.4=...It's a hole. A hole with a spider.
kev-court.lift.5=There's something in there.
kev-court.q.bye=Never mind.
kev-court.bye=Stay tuned!

morin.look=Madame Morin, of the café. She has seen a lot of tourists and believes none of them.
morin.q.old=Is this courtyard very old?
morin.old.1=Is this courtyard very old?
morin.old.2=The houses are seventeenth century. The wall on the left is much older. The Templars, they say.
morin.old.3=People take photos of my menu board in front of it. Nobody ever looks at the wall.
morin.q.board=May I move your menu board for a moment?
morin.board.1=May I move your menu board for a moment? There's something carved behind it.
morin.board.2=During service? Non. People read that board.
morin.board.3=Do they? In that cipher?
morin.board.4=...Nobody has ever read it. But it looks mysterious. Mysterious sells mussels.
morin.q.menu=Your menu says: mussels and chips, twelve euros.
morin.menu.1=Your menu says mussels and chips, twelve euros.
morin.menu.2=You read it! My grandson painted it in that silly code, and in four years nobody has ever read it. Not one!
morin.menu.3=You know, my grandfather rebuilt that wall in 1920. Behind the old stone with the horse he found a hole.
morin.menu.4=There was nothing in it but a little piece of lead. He put it back, for luck. A café needs luck.
morin.menu.5=May I move your board, then?
morin.menu.6=Go on. Move the board. Nobody reads it anyway.
morin.q.bye=Thank you, Madame.
morin.bye=Mussels are twelve euros, if you get hungry.
morin.page=That's not a menu, it's a museum piece. I'll keep it in my bag.

court.end.1=Tomar. The Templars of Portugal were never put on trial.
court.end.2=In 1319 their people and their lands went to a new order, the Order of Christ. Later its seat was Tomar.
court.end.3=If the other half of the chirograph went anywhere, it went there.
court.end.4=Chat, you heard it! Next stop: PORTUGAL!
court.end.5=Kev. Who's watching your stream right now?
court.end.6=Forty-one people! And the lady in the camel coat. She always comments first.
court.end.7=...Of course she does.
card.act2.end=End of Act 2|A token from Tomar. The trail leads to Portugal.

# ---- flashback 2: La Rochelle, end of October 1307 ----
card.fog=La Rochelle, end of October 1307|A few days after the arrests
name.fog=fog
name.town-walls=town walls
name.ship=ship
name.ship-light=ship's lantern
name.sea=sea
name.mooring-post=mooring post
name.sea-chest=chest
name.gangplank=gangplank
name.etienne=Brother Étienne
name.captain=captain

quay.intro.1=La Rochelle. Five days on the road, and the fog was waiting for me.
quay.intro.2=Brother Étienne's message said: the ship that answers your lantern three times.
goal.80=Find the ship in the fog.
hint.80=Signal with the lantern, toward the ship.
goal.81=Tell Brother Étienne what happened in Paris.
hint.81=Talk to Brother Étienne.

fog.look=Fog. I can hardly see my own boots.
town-walls.look=The walls of La Rochelle. A few lights in the town. The King's men are there too.
ship.look=Something big, out there in the fog. A mast? A ship with no light.
ship.seen=Three lights. It's her.
sea.look=Black water. It smells of salt and tar.
sea.use=I came here to send something across it, not to swim.
mooring-post.look=A mooring post, the rope wet with fog.
mooring-post.use=Somebody else's ship, somebody else's rope.
gangplank.look=A gangplank, down to the quay. Somebody is expecting company.
gangplank.fog=Not before I know whose ship it is.
gangplank.no=I'm not going aboard. My road ends here.
lantern.look=A shuttered lantern. Open, closed, open: the oldest language at sea.
lantern.use=I should signal toward the ship.
lantern.wrong=Signal the fog? It doesn't answer. Toward the ship.
signal.1=Open... closed. Open... closed. Open... closed.
signal.2=There! Three lights, out in the fog. Three times.
signal.3=Raoul? God be praised. We were afraid you'd been taken with the others.
signal.4=Brother Étienne! I was the only one they didn't take. Thanks to a cat.
sea-chest.look=A small chest with iron bands and a red seal. Our half of the chirograph is inside.
sea-chest.use=That's for the captain, not for me.

etienne.look=Brother Étienne of our house at La Rochelle. He hasn't slept for days, by the look of him.
etienne.q.paris=The Temple in Paris has fallen.
etienne.paris.1=The Temple in Paris has fallen, Brother. Everybody was taken. Brother Gérard, the Marshal, the squires.
etienne.paris.2=Here too. The same morning, the same sealed letters. Only a few of us got away.
etienne.paris.3=God keep them. And God forgive the King, because I can't.
etienne.q.gold=Is there gold in that chest?
etienne.gold.1=Is there gold in that chest?
etienne.gold.2=Parchment. Worth more than gold, and it doesn't clink when the King's men walk past.
etienne.q.page=Aimery hid the Paris half in a psalter, in the library.
etienne.page.1=Aimery hid the Paris half of the account in a psalter, in the library of the Temple. He told me in a psalm.
etienne.page.2=In a psalter. Good boy. Then the two halves are safe, and apart, as they should be.
etienne.page.3=This one must leave France tonight. Captain!
etienne.page.4=My king, Dom Dinis, will not hand Templars over to anyone. In Portugal your half will be safe.
etienne.page.5=Take this, brother. A token from Tomar, from your brothers there. If one day someone comes looking, let it show them the way.
etienne.page.6=Then I'll leave it at our house, behind the two riders. Whoever finds it will know where to look.
etienne.page.7=Go with God.
etienne.page.8=And you with the sea.
card.fog.end=Whether Templar ships really left La Rochelle is not known.|No document tells of this one. The game made it up.
etienne.q.bye=In a moment, Brother.
etienne.bye=Quickly, Raoul. The fog won't hold for ever.

captain.look=The captain: Portuguese, by his accent. He talks little and watches the fog.
captain.talk=Speak to Brother Étienne. I only carry.
