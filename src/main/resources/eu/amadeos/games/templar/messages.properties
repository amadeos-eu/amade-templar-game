card.1307=Paris, 12 October 1307|The house of the Knights Templar, at night
card.arrest=Friday, 13 October 1307|At dawn the King's men arrested every Templar in France. The psalter stayed on its lectern.
ledger.look=The last page of the Temple's accounts with the Crown: what King Philip owes the order, to the denier. One half of a chirograph.
ledger.look.sealed=The page, folded and sealed with the two knights on one horse.
key.look=The key to the treasurer's chest. Brother Gérard's hand was shaking when he gave it to me.
seal.look=The seal of the order: two knights riding one horse. Poverty, they say. And brotherhood.
wax.look=A stick of red sealing wax. Hard as bone.
soft-wax.look=Warm and soft. Quick, before it sets again.
cheese.look=A piece of Brother Gérard's cheese. It smells strongly enough to wake the dead.
cheese.use=I'm not hungry. Somebody else might be.
knife.look=The copyist's penknife. Sharp enough to cut parchment.
glue.look=Hide glue, still warm from the stove. The copyist was working late, too.
seal.hardwax=The wax is too hard. It needs warming first.
name.gerard=Brother Gérard
name.lancet=window
name.banner=banner
name.book-stand=reading desk
name.chest=chest
name.chest-open=open chest
name.table=table
name.accounts=account books
name.candles=candles
name.supper=Brother Gérard's supper
name.wax-stick=sealing wax
name.courtyard-door=door to the courtyard
gerard.intro.1=Aimery. Close the door behind you. Quietly.
gerard.intro.2=Brother Gérard? It's long past Compline.
gerard.intro.3=The King's men have been asking questions all week. Tonight I heard they carry sealed letters, to be opened everywhere at the same hour.
gerard.intro.4=Take this: the last page of our accounts with the Crown. What the King owes us, to the denier.
gerard.intro.5=It must leave the Temple tonight, under the treasurer's seal. The seal is in the chest. Here is the key.
gerard.look=Brother Gérard, keeper of the accounts. Thirty years in the Temple. I've never seen him afraid before.
gerard.q.why=Why this page, of all things?
gerard.why.1=Why this page, Brother? Why not the gold?
gerard.why.2=Gold can be melted down, Aimery. A debt written in two hands cannot.
gerard.why.3=This is a chirograph: one half stays with us, the other half is already on its way to the coast. Whoever holds both holds the King's debt.
gerard.q.king=Why would the King move against us?
gerard.king.1=King Philip owes more than he can pay. When that happened before, he arrested the Lombard bankers and took their money. Last year he drove out the Jews and kept everything they had.
gerard.king.2=He calls it justice. I call it bookkeeping.
gerard.q.how=How do I seal it?
gerard.how=Warm the wax at a candle, put it on the fold, and press the seal into it while it's soft.
gerard.q.where=Where shall I take it?
gerard.where.1=Out through the courtyard and the gate. Brother Raoul keeps the gate tonight and he'll want to know why.
gerard.where.2=Don't tell him. Raoul is a good brother but a slow one.
gerard.q.bye=God keep you, Brother.
gerard.bye=And you, child. Go.
lancet.look=The moon over Paris. Somewhere out there the King's men are waiting for morning.
lancet.use=Too narrow to climb through. The Templars built well.
banner.look=The Beauséant: black and white, the banner of the order. Black for our enemies, white for our friends, they say.
banner.use=Nobody touches the banner.
book-stand.look=The treasurer's day book. Rents from the Marais, wine from Brie, a loan to a bishop.
book-stand.use=Not now.
chest.look=The treasurer's chest, bound in iron. Locked.
chest.locked=Locked. Brother Gérard has the key... no, I have it.
chest.open=The seal of the order, in its leather pouch.
chest-open.look=Only receipts left in it. Receipts and dust.
table.look=The treasurer's table: account books, ink, candles. And Brother Gérard's supper, untouched.
table.use=Everything on it has its place. Brother Gérard would notice.
accounts.look=Columns of Roman numerals. Pounds, shillings and pence; livres, sous and deniers.
accounts.use=I can't carry the whole treasury.
candles.look=Two good wax candles. Brother Gérard doesn't save on light.
candles.use=I'd better not burn anything else tonight.
wax.soften=The wax softens in the flame.
ledger.candle=Burning the King's debt? Some would pay for that. No.
supper.look=Bread, a jug of wine, and a piece of cheese that smells all the way to the door.
supper.take=He won't eat tonight. And the cheese may be useful.
wax-stick.look=A stick of red sealing wax.
wax-stick.take=Red wax, for the seal.
wax.hard=The wax is hard as stone. It needs warming.
ledger.waxed=A blob of soft wax on the fold. Now the seal, quickly!
seal.nowax=I need wax on the page first. Soft wax.
seal.done=Two knights on one horse. Sealed.
seal.gerard.1=Good. Now nobody can say it was written yesterday.
seal.gerard.2=Go, Aimery. Out through the gate. And don't look back.
seal.softwax=I put the wax on the page, then the seal on the wax. Not the other way round.
door.unsealed=Not unsealed, Aimery! Seal it first.
name.tower=great tower
name.cloister=cloister
name.moon=moon
name.well=well
name.torch=torch
name.gate=gate
name.library=library door
name.chapter=treasurer's chamber
name.guard=Brother Raoul
name.cat=cat
courtyard.intro=The courtyard. The gate is shut, and Brother Raoul is keeping it. Awake, for once.
tower.look=The great tower of the Temple. The treasure of the King of France lay in it for a hundred years.
tower.use=It's locked at night. Even to me.
cloister.look=The cloister walk. The brothers are asleep, or praying.
cloister.use=No time for the cloister now.
moon.look=A full moon. A bad night for secrets.
well.look=The well of the Temple. Sweet water, they say, the best in Paris.
well.use=I'm not thirsty. I'm afraid.
torch.look=A torch by the gate. Raoul likes to see who's coming.
torch.use=I'd only burn my fingers.
guard.look=Brother Raoul, a sergeant of the order. Big, loyal, and not quick.
guard.q.open=Open the gate, Brother Raoul.
guard.open.1=Open the gate, Brother Raoul. I have an errand for Brother Gérard.
guard.open.2=Nobody leaves before Prime. The Marshal's orders. Not even you, little squire.
guard.q.cat=Is that the stable cat by the well?
guard.cat.1=That beast! It stole my supper last week, right from under my nose. Cheese and all.
guard.cat.2=If I ever catch it near my gate again, I'll chase it all the way to Saint-Denis.
guard.q.bye=Good night, Brother.
guard.bye=Good night. And go to bed.
guard.block=Nobody leaves before Prime, squire.
cat.look=The stable cat. Grey, scarred, and always hungry.
cat.mew=Mrrao.
cat.talk=She wants something. Food, probably. It's always food.
cheese.cat=She'd eat it here and go back to sleep. I want her over there, by the gate.
cheese.throw=Oops. Brother Raoul, I dropped your supper... I mean, Brother Gérard's supper.
guard.sees.1=You! You thief of cheese! Come here!
guard.sees.2=This time I'll catch you!
ledger.guard=Brother Raoul doesn't need to know about this.
gate.look=The great gate to the Rue du Temple. Barred at night.
gate.1=The bar is heavy... There are torches outside. Dozens of them. And lilies on their coats.
gate.2=In the name of the King! Open the gate!
gate.3=The King's men. Already. I'll never get out this way.
gate.4=The library. Nobody will look for a page among books.
gate.soldiers=They're right outside. I'll never get through.
library-door.look=The library door, under the great tower.
library-door.not-yet=Not now. Brother Gérard wants the page out of the Temple tonight.
chapter-door.look=The way back to the treasurer's chamber.
chapter-door.barred=No way back. The brothers are barring the doors.
name.cupboard=book cupboard
name.library-window=window
name.chests=book chests
name.copy-desk=copyist's desk
name.copy-knife=penknife
name.glue-pot=glue pot
name.candle=candle
name.lectern=lectern
name.temple-psalter=psalter
name.library-exit=door to the courtyard
name.soldier=King's man
name.soldier2=King's man
library.intro.1=The library. Books don't get arrested.
library.intro.2=If I hide the page well, it can wait here for better times. However long that takes.
cupboard.look=Books chained to their shelves: the Bible, the Rule of the order, a chronicle of the Holy Land.
cupboard.use=Chained. Nobody takes these books away. That's the point.
library-window.look=Torchlight in the street below. They're surrounding the Temple.
library-window.use=Too high, too narrow, and too many soldiers.
chests.look=Chests of charters and deeds. The first thing they'll search.
chests.use=Charters. The King's clerks will read every one.
chests.ledger=That's the first place they'll look.
copy-desk.look=The copyist's desk. He was working late: the glue pot is still warm.
copy-desk.use=I'm no copyist.
copy-knife.look=A penknife for trimming quills and cutting parchment.
copy-knife.take=The copyist's penknife.
glue-pot.look=A pot of hide glue, still warm.
glue-pot.take=The glue pot. Warm. Good.
library-candle.look=A candle on an iron stand, by the lectern.
lectern.look=The lectern with the psalter that the brothers sing from.
temple-psalter.look.1=A new psalter, the brothers' pride. The prayers of the week and a calendar of the saints.
temple-psalter.look.2=The inside of the cover is pasted over with parchment. If I cut it loose along the edge, there'd be room under it.
temple-psalter.open=The pastedown is loose. There's room under it.
temple-psalter.cut=Carefully, along the edge... The pastedown comes loose.
temple-psalter.no-room=Under the pastedown would be good. But it's glued down.
temple-psalter.hidden=The page fits under it. Folded twice, seal and all.
temple-psalter.no-glue=There's nothing to glue down yet.
temple-psalter.glued=Glue, press, smooth... Nobody will ever know.
temple-psalter.done=It looks as if nobody had ever touched it.
library.soldier.1=There! A squire, in the library! Seize him!
library.aimery.1=Forgive me, Brother Gérard. The page is safe.
library.soldier.2=By order of the King, you are under arrest.
soldier.look=A soldier of the King, with the lilies of France on his coat.
library-exit.look=The door to the courtyard.
library-exit.no=Out there are the King's men. In here is the psalter.
goal.1=Brother Gérard gave me the page and the key to the chest. The page must be sealed with the treasurer's seal.
hint.1=The chest is on the right. Use the key on it.
goal.2=Seal the page: soft wax on the fold, then the seal.
hint.2=Take the sealing wax from the table and warm it at the candles. Put the soft wax on the page, then use the seal on the page.
goal.3=Get the page out of the Temple, through the courtyard and the gate.
hint.3=The door to the courtyard is on the left. Brother Raoul keeps the gate; talk to him.
goal.4=Get Brother Raoul away from the gate.
hint.4=Raoul hates the stable cat, and the cat loves cheese. Brother Gérard's supper is on the table in the chamber.
goal.5=Open the gate.
hint.5=The gate is on the right.
goal.6=Hide the page in the library.
hint.6=The library door is under the great tower.
goal.7=Find a hiding place for the page in the library.
hint.7=Look at the psalter on the lectern. The copyist's penknife is on the desk.
goal.8=Put the page under the pastedown.
hint.8=Use the page on the psalter.
goal.9=Glue the pastedown back down.
hint.9=The glue pot is on the copyist's desk.
