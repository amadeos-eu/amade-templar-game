workshop.intro.1=Ultimo lavoro della giornata: il salterio del vecchio quartiere del Temple. Intorno al 1300, Parigi, rilegato una volta, e male.
workshop.intro.2=Monsieur Lefort lo vuole finito per domani. Monsieur Lefort vuole tutto finito per domani.
window.look=I tetti del Marais. Da qualche parte laggiù sorgeva il Temple.
window.use=È bloccata dalla vernice da prima che nascessi.
pigeon.look=Di nuovo quel piccione. Si posa lì ogni sera e mi guarda lavorare.
pigeon.use=Sciò. ...Non gliene importa niente.
engraving.look=Una vecchia incisione della torre del Temple di Parigi. Demolita nel 1808.
engraving.use=È storta. È storta da quarant'anni, dice Lefort. Resta storta.
shelves.look=Libri che mi aspettano. Alcuni aspettano dal restauratore di prima.
shelves.use=Un lavoro alla volta.
coat.look=Il mio cappotto e la mia sciarpa.
coat.coin=Due euro in tasca. Abbastanza per la macchinetta del caffè.
coat.empty=Solo un biglietto dell'autobus e un mozzicone di matita.
door.look=La porta della sala di lettura.
door.not-yet=Non prima di aver finito il salterio. L'ho promesso.
bench.look=Il mio banco da lavoro. L'unico posto in ordine dell'edificio.
bench.use=Da solo non restaura niente.
press.look=Un torchio da legatoria in ghisa, più vecchio del catalogo della biblioteca.
press.use=Non c'è niente da pressare.
books.look=Aspettano di essere riparati. Pazientemente, come fanno i libri.
books.use=Più tardi. Molto più tardi.
lamp.look=La mia lampada da tavolo. Senza, lavorerei a lume di candela, come i monaci.
lamp.use=È accesa. Resta accesa.
jar.look=Acqua distillata. Per una restauratrice, praticamente acqua santa.
jar.use=Preferisco non berla.
gluepot.look=Colla di amido di frumento. Si può togliere, se si fa attenzione: è proprio questo il punto.
gluepot.use=Non ancora. Prima bisogna separare.
mug.look=Il mio caffè. Freddo. E non come piace a Lefort: lui lo beve nero, nella sua tazza.
mug.use=Freddo. Certe cose non si possono restaurare.
psalter.look.1=Un salterio, intorno al 1300. Le preghiere della settimana, un calendario delle feste dei santi.
psalter.look.2=La controguardia del piatto anteriore è gonfia, come se ci fosse qualcosa sotto.
psalter.look.after=La controguardia è sollevata. Sotto, un incavo nel piatto, grande giusto quanto la pagina piegata.
psalter.use=La colla ha settecento anni ed è secca come pietra. Senza umidità strapperei la carta.
psalter.use.after=Domani lo richiudo. Come si deve, stavolta.
psalter.damp=Un po' d'acqua, un po' di pazienza... Ecco. La vecchia colla si ammorbidisce.
flap.look=La controguardia sollevata. Chi l'ha incollata aveva fretta.
brush.take=Il pennello per colla.
brush.damp=Intinto nell'acqua distillata. Umido, non bagnato.
brush.dry=Un pennello asciutto non ammorbidisce niente.
bonefolder.take=La mia stecca d'osso.
bonefolder.dry=Così a secco si strapperebbe. Prima devo ammorbidire la colla.
discover.1=Piano... piano... C'è qualcosa sotto. Pergamena piegata!
discover.2=Qualcuno ha aperto questa legatura prima di me. Secoli fa.
discover.3=E chiunque fosse, ha nascosto questa in fretta. Lefort deve vederla.
page.psalter=Resta fuori finché non so cos'è.
coin.coat=Sta bene dov'è. Nella mia mano.
goal.10=Finire il vecchio salterio: stasera la sua legatura si smonta.
hint.10=Guarda bene il salterio sul banco da lavoro.
goal.11=Staccare la vecchia controguardia del salterio senza strapparla.
hint.11=La vecchia colla si ammorbidisce con un po' d'acqua. Il pennello per colla e il vasetto d'acqua sono sul banco.
goal.12=Sollevare la controguardia ammorbidita.
hint.12=Usa la stecca d'osso sul salterio.
goal.13=Mostrare la pagina a monsieur Lefort nella sala di lettura.
hint.13=La porta della sala di lettura è accanto al mio cappotto.

# ---- la sala di lettura ----
name.lefort=Monsieur Lefort
name.machine=macchinetta del caffè
name.rack=scolatazze
name.lefort-cup=tazza sbeccata
name.bookcase=libreria
name.ladder=scala da biblioteca
name.tall-window=finestra
name.clock=orologio
name.reading-table=tavolo di lettura
name.desk=scrivania di Lefort
name.ledger-tables=tavole di conversione
name.atelier=porta del laboratorio
name.street=uscita sulla strada
dialog.bye=Buonanotte, monsieur Lefort.
lefort.hello.1=Madame Vogt. Sono le otto meno dieci. La biblioteca ha chiuso alle sei.
lefort.hello.2=Monsieur Lefort, ho trovato qualcosa nel salterio.
lefort.hello.3=Non. Qualunque cosa sia, può aspettare domani. Tutto può aspettare domani.
lefort.look=Monsieur Lefort, archivista. Sessantaquattro anni, quaranta dei quali in questa sala. Prima dice "Non" e poi aiuta.
lefort.q.page=La prego, guardi solo questa pagina.
lefort.page.1=Era sotto la controguardia. Latino, numeri e un sigillo.
lefort.page.2=Non... Due cavalieri su un solo cavallo. Mon Dieu. È il sigillo del Temple.
lefort.page.3=E guardi il bordo superiore: CHIRO... tagliato. Un chirografo. Lo stesso testo scritto due volte su una pelle e poi tagliato a metà; ogni parte ne tiene una metà. Chi ha l'altra metà ha la prova.
lefort.page.4=E cosa dice?
lefort.page.5=Madame, dopo dieci ore in questo edificio non riesco a leggere nemmeno un biglietto dell'autobus. Non prima del mio caffè.
lefort.q.coffee=Perché non si prende un caffè?
lefort.coffee.1=La macchinetta è proprio lì. Perché non si prende un caffè?
lefort.coffee.2=Perché io e quella macchinetta non ci parliamo. Vuole monete. Io ho una carta. E non dà bicchieri.
lefort.coffee.3=Nero, nella mia tazza. Quella con la fascia blu. Tutto il resto è acqua dei piatti.
lefort.q.give=Il suo caffè, monsieur. Nero, nella sua tazza.
lefort.give.1=...Madame Vogt, lei è una persona terribile e la ringrazio.
lefort.give.2=Bien. "Parigi, nella casa del Temple... il signor re di Francia deve ai fratelli..." Sono i debiti del re, in lire tornesi.
lefort.give.3=Sigillato dal tesoriere del Temple. E qui, frate Gérard. Frate Gérard, della casa di Parigi.
lefort.give.4=I Templari prestavano soldi al re?
lefort.give.5=Per cent'anni i re di Francia tennero il loro tesoro nel Temple, qui a Parigi. I Templari erano i loro banchieri.
lefort.give.6=Il totale è in denari. Dunque: quanti denari fanno una lira? Le mie tavole di conversione sono sulla scrivania, se le servono.
lefort.q.sum=A proposito di quella somma in denari...
lefort.sum.again=Un piccolo regno, madame. Dovuto da un re a cui piaceva far arrestare i suoi creditori.
sum.12=Dodici.
sum.20=Venti.
sum.240=Duecentoquaranta.
sum.later=Mi dia un momento.
sum.answer.12=Dodici denari per lira?
sum.answer.20=Venti?
sum.answer.240=Duecentoquaranta: dodici denari per soldo, venti soldi per lira.
sum.wrong=Non, non. Guardi le tavole, madame. Aspettano lì dal 1952.
sum.later.answer=Faccia con calma. Il re lo deve da settecento anni.
sum.right.1=Esatto. Allora questo è... più di quanto la Corona incassasse di tasse in un anno intero. Un piccolo regno.
sum.right.2=E pochi giorni dopo il re fece arrestare tutti i Templari di Francia. Tutti la stessa mattina.
sum.right.3=Venerdì 13 ottobre 1307. Chi fa arrestare la propria banca? Qualcuno che non vuole restituire i soldi.
lefort.q.history=Chi erano davvero i Templari?
lefort.history.1=Chi erano davvero i Templari? Kev, su internet, dice che trovarono il Santo Graal.
lefort.history.2=Kev, su internet, dice molte cose. Pochi cavalieri a Gerusalemme intorno al 1120, che giurarono di proteggere i pellegrini lungo la strada.
lefort.history.3=Nel giro di un secolo: case in tutta Europa, navi, fattorie e le camere blindate più sicure della cristianità. Un pellegrino pagava a Parigi e ritirava ad Acri, con una lettera.
lefort.history.4=Monaci, soldati e banchieri. È stata l'ultima parte a ucciderli.
lefort.q.friday=Che cosa accadde loro dopo gli arresti?
lefort.friday.1=Tortura, false confessioni, un processo durato anni. Nel 1312 il papa soppresse l'ordine.
lefort.friday.2=Nel marzo 1314 l'ultimo gran maestro, Jacques de Molay, fu bruciato su un'isoletta della Senna, vicino al Pont Neuf. Oggi lì c'è una targa.
lefort.friday.3=E il denaro?
lefort.friday.4=La maggior parte delle loro terre andò agli Ospitalieri. Il tesoro di cui parlano le storie non fu mai trovato. Forse perché era scritto soprattutto su pergamena.
lefort.q.temple=Dov'era esattamente il Temple?
lefort.temple.1=A cinque minuti da qui. Il recinto dei Templari era una piccola città a sé, con una torre come il mastio di un castello.
lefort.temple.2=Napoleone fece abbattere la torre nel 1808. Oggi è un giardino con un parco giochi: lo Square du Temple.
lefort.temple.3=Allora ci vado. Il salterio veniva da quel quartiere.
lefort.bye=Bonne nuit. E chiuda la porta; la corrente mi va dritta alle ginocchia.
machine.look=Una macchinetta del caffè degli anni Ottanta. "PIÈCES SEULEMENT": solo monete. E niente bicchieri.
machine.no-cup=Dà il caffè, ma non i bicchieri. Prima mi servirebbe una tazza.
machine.no-coin="Pièces seulement". Vuole una moneta.
machine.coffee=Brontola, sputa, dà il caffè. Nero. Nella tazza di Lefort.
rack.look=Uno scolatazze con tazze lavate. Una ha una fascia blu e il bordo sbeccato.
rack.use=Le tazze sono pulite. Più o meno.
lefort-cup.look=Bianca con una fascia blu e il bordo sbeccato. Dev'essere quella di Lefort.
lefort-cup.take=La tazza di Lefort. Se mi becca con questa, è meglio che dentro ci sia del caffè.
bookcase.look=Registri parrocchiali, catasti, la storia di ogni strada del Marais. Dieci metri di scaffali.
bookcase.use=Non adesso. Se comincio a leggere, all'alba sono ancora qui.
ladder.look=Una scala da biblioteca su binari d'ottone. Cigola; Lefort la sente da ogni angolo dell'edificio.
ladder.use=Non mi serve niente lassù.
tall-window.look=Si accendono i lampioni. Il cielo sopra il Marais diventa viola.
tall-window.use=Bloccata dalla vernice intorno al 1950.
clock.look=Le otto meno dieci. La biblioteca ha chiuso due ore fa.
clock.use=È giusto. Lefort lo carica ogni lunedì.
reading-table.look=Due posti di lettura, libri aperti, lampade verdi. Lefort li lascia così per i lettori di domani.
reading-table.use=Non tocca a me chiuderli.
desk.look=La scrivania di Lefort: cuoio verde, un telefono a disco, pile di carte che capisce solo lui.
desk.use=Nessuno tocca la scrivania di Lefort. Nessuno.
ledger-tables.look=Vecchie tavole di conversione per la moneta medievale: una lira tornese = 20 soldi, un soldo = 12 denari.
ledger-tables.use=Le guardi quanto vuole, madame, ma non le sposti.
atelier.look=La porta del mio laboratorio.
street.look=L'uscita sulla strada. Fuori si fa buio.
street.not-yet=Prima voglio sapere cosa dice questa pagina.
goal.20=Mostrare la pagina a monsieur Lefort.
hint.20=Parla con Lefort, alla sua scrivania.
goal.21=Portare a Lefort il suo caffè: nero, nella sua tazza.
hint.21=La sua tazza è sullo scolatazze accanto alla macchinetta del caffè. La macchinetta prende monete, come quella nella tasca del mio cappotto.
goal.22=Fare il conto: quanti denari fanno una lira?
hint.22=Le tavole di conversione sono sulla scrivania di Lefort. Poi parla di nuovo con lui.
goal.23=Andare allo Square du Temple, dove un tempo sorgeva il Temple.
hint.23=L'uscita sulla strada è a destra della sala di lettura.

# ---- lo Square du Temple ----
name.houses=case del Marais
name.railing=cancellata
name.playground=parco giochi
name.board=pannello informativo
name.lamppost=lampione
name.kev-sandwich=panino di Kev
name.half-sandwich=mezzo panino
name.metro=stazione della metro Temple
name.marais=ritorno alla biblioteca
name.kev=Kev
name.helene=donna elegante
name.pigeon=piccione
square.intro.1=Lo Square du Temple. Per cinquecento anni qui sorse il recinto dei Templari, con mura, chiesa, torre e tutto.
square.intro.2=Oggi: castagni, un parco giochi e un uomo che parla al suo telefono.
houses.look=Il Marais al crepuscolo. Nel Duecento tutto questo era terra dei Templari; la davano in affitto agli artigiani.
houses.use=Non conosco nessuno lassù.
railing.look=Una cancellata in ghisa dell'Ottocento, di quando fu realizzato il giardino.
railing.use=Tutto quello che mi serve è da questa parte.
playground.look=Uno scivolo e una struttura per arrampicarsi. I bambini giocano dove il gran maestro aveva i suoi appartamenti.
playground.use=Sono un po' troppo grande e un po' troppo occupata.
lamppost.look=I lampioni si accendono, uno dopo l'altro.
lamppost.use=È caldo. È già qualcosa.
bench.square.look=Una panchina verde. Sopra c'è la cena di Kev che aspetta.
bench.square.use=Non c'è tempo per sedersi.
kev-sandwich.look=Prosciutto, insalata, pomodoro, mezza baguette. Quello di Kev.
kev-sandwich.use=È la cena di Kev. Sono una restauratrice, non una ladra.
half-sandwich.look=Mezzo panino nella ghiaia. Il piccione si è preso l'altra metà.
half-sandwich.take=Mezzo panino. Collaudato da un piccione. Non si sa mai.
board.look.1=Una vecchia incisione: la torre del Temple, un mastio quadrato con quattro torrette agli angoli. "Demolita nel 1808."
board.look.2=E la pianta: la chiesa, la torre, il chiostro... e la biblioteca, proprio dove ora c'è il parco giochi.
board.look.3=Il salterio veniva da questa biblioteca. Qualcuno ci ha nascosto la pagina nel 1307. Qui.
helene.hello=Madame Vogt? Che bella serata per la storia.
helene.look=Cappotto color cammello, una borsetta rossa, orecchini che valgono il mio stipendio di un anno. Profuma di soldi e di carta vecchia.
helene.q.who=Lei chi è?
helene.who.1=Hélène de Vaucresson. Colleziono. Cose antiche, cose rare, documenti.
helene.who.2=La mia famiglia colleziona da prima della Rivoluzione. Siamo... scrupolosi.
helene.q.how=Come conosce il mio nome?
helene.how.1=Il suo monsieur Lefort ha telefonato a un vecchio amico agli Archives nationales un'ora fa. Era molto emozionato.
helene.how.2=Parigi è un paese, madame Vogt. E io sono un'ottima vicina.
helene.q.offer=Che cosa vuole?
helene.offer.1=La pagina. Cinquantamila euro, stasera, in contanti. Niente domande, niente documenti.
helene.offer.2=Appartiene alla biblioteca. E alla storia.
helene.offer.3=La storia appartiene a chi la custodisce meglio. Ci pensi.
helene.q.no=Non è in vendita.
helene.no.1=Non è in vendita. Buonasera, madame.
helene.no.2=Tutto è in vendita. Cambia solo il prezzo. Bonne soirée.
helene.page=Le piacerebbe. No.
kev.look="Kev il Cacciatore di tesori": felpa col cappuccio, bastone per selfie, una voce per un pubblico di migliaia. È in diretta, a quanto pare.
kev.q.who=Con chi sta parlando?
kev.who.1=Con i miei follower! Kev il Cacciatore di tesori, in diretta dal cuore dei Templari! Ottantamila, e tutti guardano.
kev.who.2=Stasera troviamo l'oro. O almeno gli indizi per l'oro. O almeno i clic.
kev.who.3=Buona fortuna.
kev.q.templars=Che cosa sa dei Templari?
kev.templars.1=Hanno nascosto il loro oro in nove posti, cifrato con il codice templare!
kev.templars.2=Quel codice non è mai stato trovato in un solo documento medievale.
kev.templars.3=Appunto. Ecco quanto erano bravi a nasconderlo.
kev.q.curse=E il gran maestro?
kev.curse.1=Jacques de Molay! Bruciato vivo a Parigi nel 1314. E dalle fiamme maledisse il re e il papa!
kev.curse.2=Tutti e due morti entro l'anno! Coincidenza? Non credo proprio!
kev.curse.3=Il papa morì nell'aprile del 1314, il re a novembre. Erano malati o vecchi. La grande maledizione viene da storie scritte molto dopo.
kev.curse.4=Un solo cronista dice soltanto che Molay chiamò Dio a giudicarli. È una leggenda, Kev.
kev.curse.5=Leggenda o no, dove l'hanno bruciato c'è una targa. Sul Pont Neuf, vicino alla statua del re a cavallo.
kev.curse.6=Quella targa è vera. E ne ha parlato anche Lefort. Al Pont Neuf, allora: linea 7, due fermate.
kev.q.film=Potrebbe filmare la vecchia incisione sul pannello?
kev.film.1=Un'incisione! Roba vecchia! I miei follower adorano la roba vecchia. Tienimi il... no, lascio qui il mio panino.
kev.film.2=Guardate qui, gente: il vero Temple! Mettete mi piace e iscrivetevi!
kev.film.3=Ehi! Il mio panino! Sciò! Sciò!
kev.film.4=Bleah. Va be'. "Piccione templare ruba la cena a un cacciatore di tesori". Questo è contenuto.
kev.q.bye=Ci vediamo, Kev.
kev.bye=Iscriviti! È gratis!
kev.sandwich=L'ha già assaggiato il piccione. Se lo tenga, adesso sono vegetariano. Da adesso.
kev.page=Non mostro la pagina a Kev. Ottantamila follower sarebbero qui in dieci minuti.
pigeon.square.look=Un piccione con un interesse professionale per il panino di Kev.
pigeon.coo=Grrru.
pigeon.square.feed=Ha avuto la sua metà.
metro.look=Stazione della metro Temple, linea 3. La linea 7 va al Pont Neuf.
metro.not-yet=Dove andrei adesso? Qui non ho finito.
marais.look=La strada che riporta alla biblioteca.
goal.30=Scoprire dove sorgeva il Temple.
hint.30=C'è un pannello informativo a sinistra del giardino.
goal.31=Scoprire di più sugli ultimi giorni dei Templari.
hint.31=Kev sembra sapere tutto. Qualcosa potrebbe perfino essere vero. Chiedigli del gran maestro.
goal.32=Andare al Pont Neuf, alla targa di Jacques de Molay. Qualcosa mi dice che quel panino mi servirà.
hint.32=Chiedi a Kev di filmare l'incisione; il suo panino è sulla panchina, e un piccione lo tiene d'occhio.
goal.33=Andare al Pont Neuf, alla targa di Jacques de Molay.
hint.33=Prendi la metro a destra del giardino.

# ---- il Pont Neuf ----
name.far-bank=il Louvre
name.river=la Senna
name.statue=statua di Enrico IV
name.parapet=parapetto
name.wall=pilone di pietra
name.steps=scala verso l'isola
name.plaque=targa
name.metro-bridge=stazione della metro Pont Neuf
name.driver=omone in abito scuro
name.guide=guida turistica
name.tourist1=turista
name.tourist2=turista
bridge.intro=Il Pont Neuf di notte. La targa dev'essere giù, vicino alla scala. E qualcuno ci sta proprio davanti.
driver.hello.1=Madame Vogt. Madame de Vaucresson la saluta.
driver.hello.2=Mi ha seguita.
driver.hello.3=Madame alza la sua offerta. Sessantamila. Mi dia la pagina e potrà tornare a casa.
driver.look=Spalle come un armadio, scarpe come specchi. Sta tra me e la targa e non sembra intenzionato a spostarsi.
driver.q.who=Lei chi è?
driver.who.1=Nessuno. Guido l'auto di Madame.
driver.who.2=E a volte porto delle cose per lei. Piccole cose. Pagine, per esempio.
driver.q.no=La pagina resta con me.
driver.no.1=La pagina resta con me.
driver.no.2=Ho tempo, madame. Ho moltissimo tempo.
driver.page=È proprio quello che vuole.
driver.sandwich=Ha l'aria affamata. Ecco, la cena.
driver.pigeons=Cosa... via! Via dalle mie scarpe!
guide.look=Una guida turistica con un ombrello e una voce fatta per le folle.
guide.tour.1=E qui, signore e signori, la maledizione più famosa della storia!
guide.tour.2=Dalle fiamme, il gran maestro dei Templari maledisse il re di Francia! Fino alla tredicesima generazione!
guide.tour.3=A rigor di termini, fu bruciato sull'isoletta laggiù; è diventata parte del ponte solo tre secoli dopo. E la maledizione è una leggenda.
guide.tour.4=La signora è una storica! Un applauso!
guide.tour.5=Guardate, l'omone dà da mangiare ai piccioni! Possiamo fare una foto con lui?
driver.leave=...Un'altra volta, madame Vogt.
guide.tour.6=E ora, signore e signori, verso Notre-Dame! Seguite l'ombrello!
far-bank.look=Il Louvre, con le finestre illuminate. Nel 1307 lì sorgeva un castello reale; gli uomini del re avevano poca strada fino al Temple.
river.look=La Senna, nera e oro sotto i lampioni.
river.use=È fredda ed è buia. No.
statue.look=Enrico IV sul suo cavallo. Trecento anni dopo i Templari. I piccioni sono posati sul piedistallo.
statue.use=Non ci arrivo e non mi aiuterebbe.
statue.sandwich=Da qui non se ne accorgerebbero mai. Dovrebbero venire loro da me.
parapet.look=Il ponte più antico di Parigi, finito nel 1607. Vecchio per Parigi; giovane per i Templari.
parapet.use=Non mi sporgo. Non con quello che ho nella borsa.
bridge-lamp.look=Le lanterne del Pont Neuf. Sotto di loro tutto sembra una vecchia incisione.
bridge-lamp.use=Calda, almeno.
wall.look=Il pilone di pietra sopra la scala che scende all'isola.
wall.use=Solido. Quattrocento anni di solidità.
steps.look=La scala che scende al giardinetto sulla punta dell'isola. Lì c'era il rogo.
steps.use=Di notte è chiuso, e la targa la posso leggere da quassù.
plaque.blocked=L'autista di Hélène le sta proprio davanti.
plaque.look.1="In questo luogo Jacques de Molay, ultimo gran maestro dell'Ordine del Tempio, fu bruciato il 18 marzo 1314."
plaque.look.2=Sette anni dopo gli arresti. Sette anni di prigione, e poi questo.
plaque.look.3=Il diciotto marzo... Il salterio ha un calendario delle feste dei santi. E stamattina ne ho fotografato ogni pagina.
phone.plaque.early=Prima voglio leggere la targa.
calendar.1=Marzo... il diciotto. C'è una nota a margine. Minuscola, in inchiostro bruno, di una mano più tarda.
calendar.2="Rupella. Ad navem." Rupella è La Rochelle. "Alla nave."
calendar.3=Qualcuno ha segnato il giorno della morte di Molay e annotato dove era andata una cosa: a una nave, a La Rochelle.
calendar.4=L'altra metà del chirografo. Deve essere così.
card.act1.end=Fine del primo atto|"Rupella. Ad navem." La pista porta a La Rochelle.
goal.40=Raggiungere la targa di Jacques de Molay. L'autista è in mezzo.
hint.40=L'autista non si sposterà per delle parole. Ma i piccioni sulla statua hanno fame, e io ho mezzo panino.
goal.41=Leggere la targa e confrontare la data con le mie foto del calendario del salterio.
hint.41=Usa il telefono sulla targa.
name.swarm=piccioni
swarm.look=Tutti i piccioni del Pont Neuf, e tutti sulle sue scarpe.
name.bridge-lamp=lanterna

# ---- il prologo: il Temple di Parigi, 12 ottobre 1307 ----
item.ledger=pagina dei conti
item.key=chiave di ferro
item.seal=sigillo
item.wax=bastoncino di ceralacca
item.soft-wax=ceralacca morbida
item.cheese=pezzo di formaggio
item.knife=temperino
item.glue=vasetto di colla
card.1307=Parigi, 12 ottobre 1307|La casa dei cavalieri templari, di notte
card.arrest=Venerdì 13 ottobre 1307|All'alba gli uomini del re arrestarono tutti i Templari di Francia. Il salterio rimase sul suo leggio.
ledger.look=L'ultima pagina dei conti del Temple con la Corona: quanto re Filippo deve all'ordine, fino all'ultimo denaro. Una metà di un chirografo.
ledger.look.sealed=La pagina, piegata e sigillata con i due cavalieri su un solo cavallo.
key.look=La chiave del forziere del tesoriere. A frate Gérard tremava la mano quando me l'ha data.
seal.look=Il sigillo dell'ordine: due cavalieri su un solo cavallo. Povertà, dicono. E fratellanza.
wax.look=Un bastoncino di ceralacca rossa. Duro come l'osso.
soft-wax.look=Calda e morbida. Presto, prima che indurisca di nuovo.
cheese.look=Un pezzo del formaggio di frate Gérard. Puzza abbastanza da svegliare i morti.
cheese.use=Non ho fame. Qualcun altro, forse.
knife.look=Il temperino del copista. Abbastanza affilato da tagliare la pergamena.
glue.look=Colla di pelle, ancora calda della stufa. Anche il copista lavorava fino a tardi.
seal.hardwax=La ceralacca è troppo dura. Bisogna prima scaldarla.
name.gerard=Frate Gérard
name.lancet=finestra
name.banner=stendardo
name.book-stand=leggio
name.chest=forziere
name.chest-open=forziere aperto
name.table=tavolo
name.accounts=libri dei conti
name.candles=candele
name.supper=cena di frate Gérard
name.wax-stick=ceralacca
name.courtyard-door=porta del cortile
gerard.intro.1=Aimery. Chiudi la porta dietro di te. Piano.
gerard.intro.2=Frate Gérard? Compieta è passata da un pezzo.
gerard.intro.3=Gli uomini del re fanno domande da tutta la settimana. Stasera ho saputo che portano lettere sigillate, da aprire ovunque alla stessa ora.
gerard.intro.4=Prendi questa: l'ultima pagina dei nostri conti con la Corona. Quanto il re ci deve, fino all'ultimo denaro.
gerard.intro.5=Deve lasciare il Temple stanotte, col sigillo del tesoriere. Il sigillo è nel forziere. Ecco la chiave.
gerard.look=Frate Gérard, custode dei conti. Trent'anni al Temple. Non l'avevo mai visto spaventato.
gerard.q.why=Perché proprio questa pagina?
gerard.why.1=Perché questa pagina, fratello? Perché non l'oro?
gerard.why.2=L'oro si può fondere, Aimery. Un debito scritto da due mani, no.
gerard.why.3=È un chirografo: una metà resta a noi, l'altra è già in viaggio verso la costa. Chi le ha entrambe ha il debito del re.
gerard.q.king=Perché il re dovrebbe muoversi contro di noi?
gerard.king.1=Re Filippo deve più di quanto possa pagare. Quando è già successo, ha fatto arrestare i banchieri lombardi e ha preso il loro denaro. L'anno scorso ha cacciato gli ebrei e si è tenuto tutto quello che avevano.
gerard.king.2=Lui la chiama giustizia. Io la chiamo contabilità.
gerard.q.how=Come la sigillo?
gerard.how=Scalda la ceralacca a una candela, mettila sulla piega e premi il sigillo finché è morbida.
gerard.q.where=Dove devo portarla?
gerard.where.1=Fuori dal cortile e dal portone. Frate Raoul fa la guardia al portone stanotte e vorrà sapere perché.
gerard.where.2=Non dirglielo. Raoul è un buon fratello, ma lento.
gerard.q.bye=Dio vi protegga, fratello.
gerard.bye=E anche te, figliolo. Va'.
lancet.look=La luna su Parigi. Da qualche parte là fuori gli uomini del re aspettano il mattino.
lancet.use=Troppo stretta per passarci. I Templari costruivano bene.
banner.look=Il Beauséant: nero e bianco, lo stendardo dell'ordine. Nero per i nemici, bianco per gli amici, dicono.
banner.use=Nessuno tocca lo stendardo.
book-stand.look=Il giornale del tesoriere. Affitti dal Marais, vino dalla Brie, un prestito a un vescovo.
book-stand.use=Non adesso.
chest.look=Il forziere del tesoriere, cerchiato di ferro. Chiuso a chiave.
chest.locked=Chiuso a chiave. Frate Gérard ha la chiave... no, ce l'ho io.
chest.open=Il sigillo dell'ordine, nella sua borsa di cuoio.
chest-open.look=Dentro restano solo ricevute. Ricevute e polvere.
table.look=Il tavolo del tesoriere: libri dei conti, inchiostro, candele. E la cena di frate Gérard, intatta.
table.use=Tutto quello che c'è sopra ha il suo posto. Frate Gérard se ne accorgerebbe.
accounts.look=Colonne di numeri romani. Lire, soldi e denari.
accounts.use=Non posso portarmi via tutto il tesoro.
candles.look=Due buone candele di cera. Frate Gérard non risparmia sulla luce.
candles.use=Meglio non bruciare nient'altro stanotte.
wax.soften=La ceralacca si ammorbidisce nella fiamma.
ledger.candle=Bruciare il debito del re? Qualcuno pagherebbe per questo. No.
supper.look=Pane, una brocca di vino e un pezzo di formaggio che si sente fino alla porta.
supper.take=Stanotte non mangerà. E il formaggio può tornare utile.
wax-stick.look=Un bastoncino di ceralacca rossa.
wax-stick.take=Ceralacca rossa, per il sigillo.
wax.hard=La ceralacca è dura come pietra. Va scaldata.
ledger.waxed=Una goccia di ceralacca morbida sulla piega. Ora il sigillo, presto!
seal.nowax=Prima mi serve ceralacca sulla pagina. Ceralacca morbida.
seal.done=Due cavalieri su un solo cavallo. Sigillata.
seal.gerard.1=Bene. Ora nessuno potrà dire che è stata scritta ieri.
seal.gerard.2=Va', Aimery. Esci dal portone. E non voltarti.
seal.softwax=Prima la ceralacca sulla pagina, poi il sigillo sulla ceralacca. Non il contrario.
door.unsealed=Non senza sigillo, Aimery! Prima sigillala.
name.tower=grande torre
name.cloister=chiostro
name.moon=luna
name.well=pozzo
name.torch=torcia
name.gate=portone
name.library=porta della biblioteca
name.chapter=camera del tesoriere
name.guard=Frate Raoul
name.cat=gatta
courtyard.intro=Il cortile. Il portone è chiuso, e frate Raoul lo sorveglia. Sveglio, per una volta.
tower.look=La grande torre del Temple. Il tesoro del re di Francia vi rimase per cent'anni.
tower.use=Di notte è chiusa. Anche per me.
cloister.look=Il porticato del chiostro. I fratelli dormono, o pregano.
cloister.use=Non c'è tempo per il chiostro adesso.
moon.look=Luna piena. Una brutta notte per i segreti.
well.look=Il pozzo del Temple. Acqua dolce, dicono, la migliore di Parigi.
well.use=Non ho sete. Ho paura.
torch.look=Una torcia accanto al portone. A Raoul piace vedere chi arriva.
torch.use=Mi brucerei solo le dita.
guard.look=Frate Raoul, un sergente dell'ordine. Grosso, leale e non svelto.
guard.q.open=Apri il portone, frate Raoul.
guard.open.1=Apri il portone, frate Raoul. Ho una commissione per frate Gérard.
guard.open.2=Nessuno esce prima di prima. Ordini del maresciallo. Nemmeno tu, piccolo scudiero.
guard.q.cat=È la gatta della stalla, quella vicino al pozzo?
guard.cat.1=Quella bestia! La settimana scorsa mi ha rubato la cena, sotto il naso. Formaggio compreso.
guard.cat.2=Se la ribecco vicino al mio portone, la inseguo fino a Saint-Denis.
guard.q.bye=Buonanotte, fratello.
guard.bye=Buonanotte. E vai a letto.
guard.block=Nessuno esce prima di prima, scudiero.
cat.look=La gatta della stalla. Grigia, piena di cicatrici e sempre affamata.
cat.mew=Mrrao.
cat.talk=Vuole qualcosa. Cibo, probabilmente. È sempre cibo.
cheese.cat=Lo mangerebbe qui e tornerebbe a dormire. La voglio là, vicino al portone.
cheese.throw=Ops. Frate Raoul, mi è caduta la tua cena... cioè, la cena di frate Gérard.
guard.sees.1=Tu! Ladra di formaggio! Vieni qui!
guard.sees.2=Stavolta ti prendo!
ledger.guard=Frate Raoul non ha bisogno di saperlo.
gate.look=Il grande portone sulla Rue du Temple. Sbarrato di notte.
gate.1=La sbarra è pesante... Fuori ci sono torce. Decine. E gigli sulle loro sopravvesti.
gate.2=In nome del re! Aprite il portone!
gate.3=Gli uomini del re. Già. Da qui non uscirò mai.
gate.4=La biblioteca. Nessuno cercherà una pagina tra i libri.
gate.soldiers=Sono proprio fuori. Non passerò mai.
library-door.look=La porta della biblioteca, sotto la grande torre.
library-door.not-yet=Non adesso. Frate Gérard vuole la pagina fuori dal Temple stanotte.
chapter-door.look=La via del ritorno verso la camera del tesoriere.
chapter-door.barred=Non si torna indietro. I fratelli sbarrano le porte.
name.cupboard=armadio dei libri
name.library-window=finestra
name.chests=casse dei libri
name.copy-desk=scrittoio del copista
name.copy-knife=temperino
name.glue-pot=vasetto di colla
name.candle=candela
name.lectern=leggio
name.temple-psalter=salterio
name.library-exit=porta del cortile
name.soldier=uomo del re
name.soldier2=uomo del re
library.intro.1=La biblioteca. I libri non vengono arrestati.
library.intro.2=Se nascondo bene la pagina, potrà aspettare qui tempi migliori. Per quanto ci vorrà.
cupboard.look=Libri incatenati ai loro ripiani: la Bibbia, la Regola dell'ordine, una cronaca della Terra Santa.
cupboard.use=Incatenati. Nessuno si porta via questi libri. È proprio questo il punto.
library-window.look=Luce di torce nella strada sotto. Stanno circondando il Temple.
library-window.use=Troppo alta, troppo stretta e troppi soldati.
chests.look=Casse di carte e atti. Il primo posto che perquisiranno.
chests.use=Carte. Gli scrivani del re le leggeranno tutte.
chests.ledger=È il primo posto dove guarderanno.
copy-desk.look=Lo scrittoio del copista. Lavorava fino a tardi: il vasetto di colla è ancora caldo.
copy-desk.use=Non sono un copista.
copy-knife.look=Un temperino per temperare le penne e tagliare la pergamena.
copy-knife.take=Il temperino del copista.
glue-pot.look=Un vasetto di colla di pelle, ancora calda.
glue-pot.take=Il vasetto di colla. Caldo. Bene.
library-candle.look=Una candela su un sostegno di ferro, accanto al leggio.
lectern.look=Il leggio con il salterio da cui cantano i fratelli.
temple-psalter.look.1=Un salterio nuovo, l'orgoglio dei fratelli. Le preghiere della settimana e un calendario dei santi.
temple-psalter.look.2=L'interno del piatto è rivestito di pergamena incollata. Se la stacco lungo il bordo, sotto ci sarebbe spazio.
temple-psalter.open=La controguardia è staccata. Sotto c'è spazio.
temple-psalter.cut=Con attenzione, lungo il bordo... La controguardia si stacca.
temple-psalter.no-room=Sotto la controguardia sarebbe perfetto. Ma è incollata.
temple-psalter.hidden=La pagina ci sta sotto. Piegata due volte, sigillo compreso.
temple-psalter.no-glue=Non c'è ancora niente da incollare.
temple-psalter.glued=Colla, premere, lisciare... Nessuno lo saprà mai.
temple-psalter.done=Sembra che nessuno l'abbia mai toccato.
library.soldier.1=Là! Uno scudiero, in biblioteca! Prendetelo!
library.aimery.1=Perdonatemi, frate Gérard. La pagina è al sicuro.
library.soldier.2=Per ordine del re, sei in arresto.
soldier.look=Un soldato del re, con i gigli di Francia sulla sopravveste.
library-exit.look=La porta del cortile.
library-exit.no=Là fuori ci sono gli uomini del re. Qui dentro c'è il salterio.
goal.1=Frate Gérard mi ha dato la pagina e la chiave del forziere. La pagina va sigillata con il sigillo del tesoriere.
hint.1=Il forziere è a destra. Usa la chiave sul forziere.
goal.2=Sigillare la pagina: ceralacca morbida sulla piega, poi il sigillo.
hint.2=Prendi la ceralacca dal tavolo e scaldala alle candele. Metti la ceralacca morbida sulla pagina, poi usa il sigillo sulla pagina.
goal.3=Portare la pagina fuori dal Temple, attraverso il cortile e il portone.
hint.3=La porta del cortile è a sinistra. Frate Raoul sorveglia il portone; parlagli.
goal.4=Allontanare frate Raoul dal portone.
hint.4=Raoul odia la gatta della stalla, e la gatta adora il formaggio. La cena di frate Gérard è sul tavolo della camera.
goal.5=Aprire il portone.
hint.5=Il portone è a destra.
goal.6=Nascondere la pagina nella biblioteca.
hint.6=La porta della biblioteca è sotto la grande torre.
goal.7=Trovare un nascondiglio per la pagina nella biblioteca.
hint.7=Guarda il salterio sul leggio. Il temperino del copista è sullo scrittoio.
goal.8=Mettere la pagina sotto la controguardia.
hint.8=Usa la pagina sul salterio.
goal.9=Incollare di nuovo la controguardia.
hint.9=Il vasetto di colla è sullo scrittoio del copista.

# ---- flashback 1: rue du Temple, all'alba del 13 ottobre 1307 ----
card.cart=Rue du Temple, 13 ottobre 1307|All'alba, davanti alla porta del Temple
name.dawn=cielo dell'alba
name.temple-tower=grande torre
name.temple-gate=porta del Temple
name.street-houses=case
name.bars=sbarre del carro
name.wheel=ruota
name.cabbages=carretto di cavoli
name.gerard-cart=frate Gérard
name.soldier-cart=uomo del re
name.raoul=carrettiere

cart.intro.1=Ci hanno presi tutti. Il maresciallo, i cuochi, perfino il vecchio frate Hugues, che non sente più una parola.
cart.intro.2=Coraggio, ragazzo. L'hai nascosta?
cart.intro.3=Nella biblioteca, fratello. In un salterio. Nessuno guarda dentro un salterio.
cart.intro.4=Bene. Ma qualcuno fuori da queste sbarre deve sapere dov'è, o resterà lì ad aspettare per sempre.
cart.intro.5=Quel carrettiere con i cavoli... è frate Raoul! Stava inseguendo il gatto quando sono arrivati. È scappato!
cart.intro.6=Se lo chiamo in francese, l'uomo del re sentirà ogni parola.
goal.50=Dire a frate Raoul dov'è nascosta la pagina, senza che l'uomo del re se ne accorga.
hint.50=Frate Gérard sa sempre cosa fare. Gli chiedo come parlare a Raoul.
goal.51=Cantare il messaggio a Raoul, in latino, come se fosse una preghiera.
hint.51=Ora parlare con Raoul. Ogni verso del salmo deve essere in latino e portare il messaggio.
goal.52=Raoul lo sa.
hint.52=Qui non resta niente da fare.

dawn.look=Il sole non è ancora sorto. Gli uomini del re sono venuti al buio, come se si vergognassero.
temple-tower.look=La grande torre. Ieri il posto più sicuro di Francia. Oggi una prigione.
temple-tower.use=È lontana, e io sono in una gabbia.
temple-gate.look=La nostra porta, sotto i gigli del re. Hanno appeso il loro stendardo mentre ci stavano ancora legando.
temple-gate.use=Non ci arrivo. E adesso la usano gli uomini del re.
cart-houses.look=Le imposte sono tutte chiuse. Parigi fa finta di dormire.
cart-houses.use=Stamattina nessuno aprirà un'imposta per un templare.
bars.look=Sbarre di quercia, chiodi di ferro. Qualcuno ha costruito questo carro per gente come noi molto prima di oggi.
bars.use=Non si muovono. Me l'aspettavo.
wheel.look=Una ruota di carro. Il carro è pronto, i prigionieri sono pronti. Solo il cavallo è in ritardo.
wheel.use=Da qui dentro non ci arrivo.
cabbages.look=Cavoli. Frate Raoul odia i cavoli.
cabbages.use=Prima dovrei uscire dal carro.

gerard-cart.look=Frate Gérard. Gli hanno legato le mani e preso le chiavi. Sembra ancora il tesoriere.
gerard-cart.q.now=Che cosa ci succederà adesso?
gerard-cart.now.1=Che cosa ci succederà adesso, fratello?
gerard-cart.now.2=Domande. Giuristi. Lunghi mesi. Monsieur de Nogaret, l'uomo di legge del re, prepara tutto questo da molto tempo.
gerard-cart.now.3=Non dire niente che possano distorcere, ragazzo. E prega.
gerard-cart.q.how=Come lo dico a Raoul senza che il soldato senta?
gerard-cart.how.1=Come posso dirlo a Raoul senza che il soldato senta?
gerard-cart.how.2=Questi uomini parlano francese. La Chiesa parla latino. E nessuno ha mai impedito a un prigioniero di pregare.
gerard-cart.how.3=Chiedi al soldato se puoi pregare. Poi canta, e metti il messaggio nel salmo.
gerard-cart.q.bye=Ci provo, fratello.
gerard-cart.bye=Piano, ragazzo. I salmi non hanno mai fretta.

soldier-cart.look=Uno degli uomini del re, in blu con i gigli. Sembra stanco quanto noi.
soldier-cart.q.where=Dove ci portate?
soldier-cart.where.1=Dove ci portate?
soldier-cart.where.2=Dove dicono i giuristi del re. E adesso siediti.
soldier-cart.q.horse=Un carro non dovrebbe avere un cavallo?
soldier-cart.horse.1=Un carro non dovrebbe avere un cavallo?
soldier-cart.horse.2=Arriva. Arriva tutto. Stamattina si arresta mezza Francia, i cavalli non bastano.
soldier-cart.q.pray=Possiamo pregare? È l'ora di prima.
soldier-cart.pray.1=È l'ora di prima. Possiamo pregare?
soldier-cart.pray.2=Pregate, cantate, fate quello che volete. Nel vostro latino da chiesa, se proprio dovete.
soldier-cart.pray.3=Tanto non ne capisco una parola.
soldier-cart.q.bye=Niente.
soldier-cart.bye=Allora sta' zitto.

raoul.look=Frate Raoul, sotto un cappuccio da carrettiere. Finge di vendere cavoli. Male.
raoul.use=Da qui non ci arrivo. Posso solo parlare.
psalm.start=(Canta, con la voce della cappella all'ora di prima.)
shout.q.page=Raoul! La pagina è nascosta nella biblioteca!
shout.page=Raoul! Frate Raoul! La pagina, è nel...
shout.quiet=Ehi! A chi stai gridando? Silenzio là dietro!
shout.angry=Adesso basta. Tu, carrettiere! Porta i tuoi cavoli da un'altra parte!
shout.gone=Raoul se n'è andato. Stupido, stupido...
shout.back=Ecco. È tornato, dall'altra parte del suo carretto. Questa volta, con prudenza.
shout.q.psst=Pss! Da questa parte!
shout.psst=Pss! Pss!
shout.deaf=Fa finta di non sentire. Bene per lui. Male per me.
shout.eyes=Hm? (Il soldato guarda me, poi il carrettiere, poi di nuovo me.)
shout.q.bye=Non dire niente.

psalm.q.hear=«Frater Radulfe, audi me.» (Frate Raoul, ascoltami.)
psalm.hear.1=«Frater Radulfe, audi me, audi me...»
psalm.hear.2=«Audio, frater. Audio.» (Ti sento, fratello.)
psalm.monks=Monaci.
psalm.q.kyrie=«Kyrie eleison.» (Signore, pietà.)
psalm.kyrie.1=«Kyrie eleison, Christe eleison...»
psalm.kyrie.2=Una bella preghiera. Ma Raoul continua a vendere cavoli: pensa che io stia pregando davvero.
psalm.q.psst=Pss! Raoul! Sono io!
psalm.psst=Pss! Raoul! Sono io, Aimery!
psalm.q.where=«Pagina in psalterio, in bibliotheca.» (La pagina è nel salterio, nella biblioteca.)
psalm.where.1=«Pagina in psalterio... in bibliotheca... in psalterio...»
psalm.where.2=«Intellexi.» (Ho capito.)
psalm.q.cheese=«Caseus in culina est.» (Il formaggio è in cucina.)
psalm.cheese.1=«Caseus in culina est...»
psalm.cheese.2=«...Quid?» (...Cosa?)
psalm.cheese.3=Non questo. Lo stomaco di Raoul non ha bisogno di saperlo.
psalm.q.french=La pagina è nel salterio! Nella biblioteca!
psalm.french=La pagina è nel salterio! Nella...
psalm.q.half=«Ubi est altera pars?» (Dov'è l'altra metà?)
psalm.half.1=«Ubi est... altera pars... ubi est?»
psalm.half.2=«Rupella. Ad navem.» (La Rochelle. Alla nave.)
psalm.half.3=La Rochelle. L'altra metà va verso una nave, a La Rochelle.
psalm.half.4=«Ego sequar.» (La seguirò.)
psalm.half.5=«Amen.»
psalm.end.1=Ecco finalmente il cavallo. Basta cantare, si parte.
psalm.end.2=Ben cantato, Aimery. Ben cantato.
psalm.q.cat=«Ubi est feles?» (Dov'è il gatto?)
psalm.cat.1=«Ubi est feles?»
psalm.cat.2=(Raoul mi lancia uno sguardo che non è una preghiera.)
psalm.q.ask=Raoul, dov'è l'altra metà?
psalm.ask=Raoul, dov'è l'altra metà del...
psalm.q.stop=(Smettere di cantare.)
psalm.stop=Amen.
card.cart.end=Frate Raoul non fu preso.|Quella stessa mattina prese la strada verso ovest.

# ---- atto 2: La Rochelle ----
card.rochelle=La Rochelle, la sera dopo|Il porto vecchio, tra le sue due torri
name.sunset=tramonto
name.saint-nicolas=torre Saint-Nicolas
name.chain-tower=torre della Catena
name.harbour-water=porto
name.boat=peschereccio
name.nets=reti
name.gulls=gabbiani
name.clock-gate=porta dell'orologio
name.office=capitaneria
name.barometer=barometro
name.quay-lamp=lampione
name.quay-bollard=bitta
name.old-town=verso la città vecchia
name.fisherman=vecchio pescatore
name.kev-harbour=Kev

harbour.intro.1=Rupella. La Rochelle. Se una nave è partita con l'altra metà, è partita da qui.
harbour.intro.2=Settecento anni fa. Sto cercando una nave salpata settecento anni fa.
harbour.kev.1=LENA! Chat, è lei! La tipa della pagina!
harbour.kev.2=Kev. Che ci fai a La Rochelle?
harbour.kev.3=Mi hanno mandato i miei follower! Be', una. Una signora col cappotto color cammello. Mi ha perfino pagato il treno.
harbour.kev.4=Hélène. Naturalmente.
goal.60=Scoprire dove avevano la loro casa i templari di La Rochelle.
hint.60=I vecchi pescatori conoscono la città vecchia. Forse quello vicino alle reti.
goal.61=Procurare al vecchio pescatore una previsione del tempo di cui si fidi.
hint.61=Kev ha un'app del meteo. E la capitaneria ha qualcosa di più vecchio alla finestra.
goal.62=Dire al pescatore cosa segna il barometro.
hint.62=Parlare con il pescatore.
goal.63=Andare alla Cour du Temple, nella città vecchia.
hint.63=La strada per la città vecchia è a sinistra, oltre la capitaneria.

sunset.look=Il sole tramonta tra le torri, dritto nel mare. Niente male, La Rochelle.
saint-nicolas.look.1=La torre Saint-Nicolas. Massiccia, merlata, bellissima.
saint-nicolas.look.2=E costruita una quarantina d'anni dopo gli arresti. Nessun templare l'ha mai vista.
saint-nicolas.use=È dall'altra parte del porto. E a quest'ora è chiusa.
chain-tower.look=La torre della Catena. Di notte una catena tesa tra le due torri chiudeva il porto. Anche lei è più tarda dei templari.
chain-tower.use=Mi servirebbe una barca.
harbour-water.look=Il porto vecchio. Pescherecci, barche a vela e un sacco di storia sul fondo.
harbour-water.use=È ottobre. No.
boat.look=Un peschereccio blu, il MARIE-JO. Appena verniciato, con le reti a bordo.
boat.use=Non è mio. E il suo padrone è proprio lì.
nets.look=Reti, galleggianti, una cassa. Qualcuno ha passato il pomeriggio a rammendarle.
nets.use=Farei solo i buchi più grandi.
gulls.look=Gabbiani, tutti posati sul molo. Mia nonna diceva che vuol dire brutto tempo.
gulls.use=Mi guardano come se gli dovessi dei soldi.
gulls.sandwich=Quel panino appartiene ai piccioni di Parigi.
clock-gate.look=La porta dell'orologio della città vecchia. La porta è medievale; l'orologio e la cupola sono arrivati molto dopo.
clock-gate.use=La strada per la città vecchia passa accanto alla capitaneria.
office.look=La capitaneria. Chiusa. Dalla finestra: carte nautiche, una radio e un vecchio barometro.
office.use=Chiusa a chiave. Gli orari sono su un cartello, e siamo fuori da tutti.
office.phone=Non tutta la capitaneria. Solo il barometro.
barometer.dark=Un vecchio barometro, sul muro dietro il vetro. Là dentro è troppo buio per leggere la lancetta.
barometer.read.1=La luce del telefono sul vetro... La lancetta ha superato «Variable» e va verso «Tempête». Tempesta.
barometer.read.2=E la piccola lancetta d'ottone dice che stamattina era molto più in alto. Scende in fretta.
barometer.again=In discesa. Tempête. Perfino io so leggerlo.
quay-lamp.look=Un vecchio lampione del molo, appena acceso.
quay-bollard.look=Una bitta con una cima attorno.
quay-bollard.use=È legata più stretta di quanto saprei slegarla.
old-town.where=Nella città vecchia? Ma dove? Non so nemmeno in che strada cercare.

kev-harbour.look=Kev, in diretta col tramonto. Non si è accorto che è bello.
kev-harbour.q.who=Chi ti ha mandato qui, Kev?
kev-harbour.who.1=Chi ti ha mandato qui, Kev? Davvero?
kev-harbour.who.2=Una follower. Commenta sempre per prima. Gentilissima. Mi ha chiesto dove stavi andando.
kev-harbour.who.3=Le ho detto che non lo sapevo, e lei ha detto La Rochelle, e mi ha pagato il biglietto!
kev-harbour.who.4=Allora conosce anche lei la nota. Avrà visto le mie foto... o la tua diretta, Kev.
kev-harbour.q.fleet=Secondo te cos'è successo qui?
kev-harbour.fleet.1=Allora, Kev. Cos'è successo a La Rochelle?
kev-harbour.fleet.2=La flotta templare! Diciotto navi piene d'oro, sparite in una notte! È ovunque su internet!
kev-harbour.fleet.3=Un frate ha detto qualcosa del genere al suo processo, nel 1308. Uno. Nessun altro l'ha mai confermato. È una leggenda.
kev-harbour.fleet.4=Però una leggenda con diciotto navi.
kev-harbour.q.weather=Cosa dice la tua app del meteo per domani?
kev-harbour.weather.1=Il tuo telefono ha un'app del meteo, no? Cosa dice per domani?
kev-harbour.weather.2=Sole! Ventotto gradi! Giornata perfetta per la barca!
kev-harbour.weather.3=Ventotto gradi. A ottobre. Sull'Atlantico. Fammi vedere.
kev-harbour.weather.4=Vedi? «New Rochelle, soleggiato.»
kev-harbour.weather.5=New Rochelle è a New York, Kev.
kev-harbour.weather.6=...Questo spiega le pubblicità degli hot dog.
kev-harbour.q.bye=Ciao, Kev.
kev-harbour.bye=Restate sintonizzati!
kev-harbour.page=Ha già avuto abbastanza delle mie cose davanti alla telecamera.

fisherman.look=Un vecchio pescatore che rammenda le reti. Guarda il cielo più spesso delle reti.
fisherman.q.templars=Sa dove vivevano i templari a La Rochelle?
fisherman.templars.1=Mi scusi. Sa dove avevano la loro casa i templari, a La Rochelle?
fisherman.templars.2=Templari. Ho la faccia dell'ufficio turistico, mademoiselle?
fisherman.templars.3=Ha la faccia di uno che conosce la città vecchia.
fisherman.templars.4=Hm. Io conosco il mare. E domani esco per le sogliole, oppure no. La radio è rotta.
fisherman.templars.5=Mi porti una previsione di cui posso fidarmi, e le racconto dei suoi templari. Non il telefono di quel ragazzo.
fisherman.q.again=A proposito del tempo...
fisherman.again.1=A proposito del tempo di domani...
fisherman.again.2=Quando lo saprà lei, saprò io qualcosa dei suoi templari.
fisherman.done.1=Grazie ancora.
fisherman.done.2=Cour du Temple, dietro la porta dell'orologio. Attenta alla tempesta.
fisherman.q.app=L'app di Kev dà il meteo di New Rochelle, a New York.
fisherman.app.1=L'app di Kev dice sole. Per New Rochelle. A New York.
fisherman.app.2=New York! Ah! Allora ha ragione, là sarà bellissimo.
fisherman.app.3=Ma io non pesco a New York.
fisherman.q.barometer=Il barometro della capitaneria scende in fretta.
fisherman.barometer.1=Il barometro della capitaneria scende in fretta. Ha superato «Variable» e va verso «Tempête».
fisherman.barometer.2=Scende? ...Allora domani vento, e niente sogliole. E i gabbiani lo sapevano prima di me.
fisherman.barometer.3=Mi ha salvato le reti, mademoiselle.
fisherman.barometer.4=E i templari?
fisherman.barometer.5=Mia nonna diceva che la loro casa stava dietro la porta dell'orologio, nella Cour du Temple. Non ne resta molto, il nome e un vecchio muro.
fisherman.barometer.6=Adesso c'è un caffè. Quello di madame Morin. La sua famiglia ce l'ha da sempre.
fisherman.barometer.7=Le dica che la manda Le Goff. Così gliene racconterà il doppio.
fisherman.q.towers=Queste torri c'erano già al tempo dei templari?
fisherman.towers.1=Queste due torri, c'erano già al tempo dei templari?
fisherman.towers.2=No, no. Dopo. Al tempo dei suoi templari c'erano il porto, qualche muro e le navi. Le navi erano la cosa importante.
fisherman.q.bye=Buonasera.
fisherman.bye=Sera.
fisherman.page=Non mostro una pagina di settecento anni a un uomo con le squame di pesce sulle mani.

# ---- atto 2: la Cour du Temple ----
name.night-sky=cielo notturno
name.old-wall=vecchio muro
name.relief=pietra scolpita
name.hollow=cavità nel muro
name.chalkboard=lavagna del menù
name.moved-board=lavagna del menù
name.loose-stone=pietra scolpita
name.cafe=caffè Le Templier
name.cafe-window=vetrina del caffè
name.terrace-lights=filo di luci
name.napkin=tovagliolo
name.street-sign=targa della via
name.back-harbour=torna al porto
name.morin=madame Morin
name.kev-court=Kev

court.intro.1=La Cour du Temple. Un caffè, qualche casa e un muro che sembra molto più vecchio del resto.
court.intro.2=Lena! Guarda il menù! È nella scrittura templare! I templari ci hanno lasciato un messaggio!
court.intro.3=Certo, Kev.
goal.70=Cercare ciò che resta della casa dei templari in questo cortile.
hint.70=Kev è eccitatissimo per la lavagna del menù. E dietro c'è qualcosa.
goal.71=Chiedere a madame Morin del vecchio muro dietro la sua lavagna.
hint.71=Ora che so leggere il suo menù, forse le starò simpatica. Parlarle.
goal.72=Guardare la pietra scolpita.
hint.72=È nel vecchio muro, dove stava la lavagna.
goal.73=Vedere se la pietra si può muovere.
hint.73=La malta intorno sembra tenera. Qualcosa di sottile e piatto entrerebbe nelle fughe, come la mia stecca d'osso.
goal.74=Trovare aiuto per togliere la pietra dal muro.
hint.74=È troppo pesante per me. Kev ha i muscoli, almeno nei pollici. Chiederlo a lui.
goal.75=Guardare nella cavità dietro la pietra.
hint.75=Infilare la mano nella cavità.

night-sky.look=Stelle su La Rochelle. La tempesta non è ancora arrivata.
old-wall.look=Pietre grezze, malta vecchia, edera. Più vecchio delle case intorno di secoli.
old-wall.use=Solido. Quasi tutto.
street-sign.look=Cour du Temple. Il cortile dei templari. Il nome è sopravvissuto settecento anni. La casa no.
cafe.look=Caffè Le Templier. Ovvio che si chiami così.
cafe.use=Chiederò a madame Morin prima di entrare nella sua cucina.
cafe-window.look=Luce calda, un bancone, tre tavoli. Cozze su ognuno.
terrace-lights.look=Un filo di lampadine dal vecchio muro al caffè. Settecento anni di storia, e lucine.

chalkboard.look.1=La lavagna del menù. Quadrati, angoli, punti: la cosiddetta scrittura templare.
chalkboard.look.2=Nessun documento medievale la usa. Ma vorrei lo stesso sapere cosa dice. Mi servirebbe la chiave.
chalkboard.behind=Dietro la lavagna c'è qualcosa scolpito nel muro. Vedo zampe di cavallo. Quattro... no, di più.
chalkboard.decoded=Cozze e patatine, dodici euro. L'ultimo segreto dei templari.
chalkboard.ask=È la lavagna di madame Morin. Meglio chiedere prima di spostarla.
chalkboard.moved=Ecco. E tu, cosa nascondi?
decode.1=La chiave sul tovagliolo, il codice sulla lavagna... quadrato col punto, M. Quadrato aperto, O. Angolo, U...
decode.2=M-O-U-L-E-S F-R-I-T-E-S. Dodici euro.
decode.3=...Quindi l'ultimo segreto dei templari sono le cozze.
decode.4=E le patatine. Non dimenticare le patatine.

relief.hidden=Qualcosa di scolpito, mezzo nascosto dalla lavagna. Zampe di cavallo e il bordo di uno scudo.
relief.blocked=La lavagna è in mezzo.
relief.look.1=Due cavalieri su un solo cavallo, scudi e lance. Quasi consumati, ma inconfondibili.
relief.look.2=Il sigillo dei templari, nella pietra. Nel loro cortile.
relief.use=È murata in una vecchia malta di calce, e la malta sembra tenera. Per le fughe mi servirebbe qualcosa di sottile e piatto.
relief.heavy=Ora la pietra è smossa, ma è troppo pesante per me da sola.
relief.loose.1=La stecca d'osso entra nella fuga come nel burro. Malta di calce vecchia di secoli... si sbriciola.
relief.loose.2=La pietra si muove! Ma è pesante. Troppo pesante per me da sola.
loose-stone.look=I cavalieri, appoggiati al muro. Sorvegliano questo cortile da settecento anni.
hollow.look=Dietro la pietra, una cavità. Polvere, un ragno morto... e qualcosa di piccolo e grigio.
hollow.empty=Vuota, ora. Solo polvere.

token.found.1=Un gettone di piombo, non più grande di una moneta. I pellegrini li compravano nei santuari che visitavano.
token.found.2=Sopra c'è una chiesa rotonda, e delle lettere sul bordo: ...TOMAR.
token.found.3=Tomar, in Portogallo. Il castello dei templari lì fu costruito nel 1160. E in Portogallo il re non li fece mai arrestare.
token.found.4=È vuota?! Dov'è l'oro? Chat, dov'è l'ORO?
token.found.5=L'oro non è mai stato il punto, Kev.
token.look=Un gettone da pellegrino in piombo. Una chiesa rotonda e la parola TOMAR.
token.use=Non è una moneta. Nemmeno per la macchinetta del caffè.
phone.token=Clic. Prima e dopo. Regola da restauratrice.

napkin.look=Un tovagliolo di carta del caffè, con la chiave del codice stampata sopra, perché i clienti possano leggere il menù.
napkin.take=Un ricordo. E una chiave.
napkin.page=Non metto un tovagliolo di carta vicino a una pagina di settecento anni.

kev-court.look=Kev, in diretta con la lavagna. Undici spettatori. Un record, dice.
kev-court.q.cipher=Non è una scrittura templare, Kev.
kev-court.cipher.1=Non è un codice templare, Kev. Quell'alfabeto non è mai stato trovato in un solo documento medievale.
kev-court.cipher.2=Appunto! Ecco quanto bene lo nascondevano!
kev-court.cipher.3=Non è così che funzionano le prove.
kev-court.cipher.4=È così che funzionano i contenuti.
kev-court.q.lift=Kev, aiutami a sollevare questa pietra.
kev-court.lift.1=Kev. Metti giù il telefono un secondo e aiutami a sollevare questa pietra.
kev-court.lift.2=Una cripta templare? In DIRETTA? Chat, apriamo una CRIPTA!
kev-court.lift.3=Hnngh... presa! Chat, siamo dentro!
kev-court.lift.4=...È un buco. Un buco con un ragno.
kev-court.lift.5=Lì dentro c'è qualcosa.
kev-court.q.bye=Lascia stare.
kev-court.bye=Restate sintonizzati!

morin.look=Madame Morin, del caffè. Ha visto molti turisti e non crede a nessuno.
morin.q.old=Questo cortile è molto antico?
morin.old.1=Questo cortile è molto antico?
morin.old.2=Le case sono del Seicento. Il muro a sinistra è molto più vecchio. Dei templari, dicono.
morin.old.3=La gente fotografa la mia lavagna lì davanti. Nessuno guarda mai il muro.
morin.q.board=Posso spostare la sua lavagna un momento?
morin.board.1=Posso spostare la sua lavagna un momento? Dietro c'è qualcosa di scolpito.
morin.board.2=Durante il servizio? Non. La gente legge quella lavagna.
morin.board.3=Davvero? In quel codice?
morin.board.4=...Nessuno l'ha mai letta. Ma sembra misteriosa. Il mistero vende cozze.
morin.q.menu=Il suo menù dice: cozze e patatine, dodici euro.
morin.menu.1=Il suo menù dice cozze e patatine, dodici euro.
morin.menu.2=L'ha letto! Mio nipote l'ha dipinto in quello stupido codice, e in quattro anni nessuno l'ha mai letto. Nemmeno uno!
morin.menu.3=Sa, mio nonno ha rifatto quel muro nel 1920. Dietro la vecchia pietra col cavallo ha trovato un buco.
morin.menu.4=Dentro non c'era niente, solo un pezzetto di piombo. L'ha rimesso a posto, per fortuna. Un caffè ha bisogno di fortuna.
morin.menu.5=Allora posso spostare la sua lavagna?
morin.menu.6=Prego. Sposti la lavagna. Tanto nessuno la legge.
morin.q.bye=Grazie, madame.
morin.bye=Le cozze sono dodici euro, se le viene fame.
morin.page=Non è un menù, è un pezzo da museo. Resta nella mia borsa.

court.end.1=Tomar. I templari del Portogallo non furono mai processati.
court.end.2=Nel 1319 i loro uomini e le loro terre passarono a un nuovo ordine, l'Ordine di Cristo. Più tardi ebbe la sua sede a Tomar.
court.end.3=Se l'altra metà del chirografo è andata da qualche parte, è andata lì.
court.end.4=Chat, avete sentito! Prossima fermata: PORTOGALLO!
court.end.5=Kev. Chi sta guardando la tua diretta in questo momento?
court.end.6=Quarantuno persone! E la signora col cappotto color cammello. Commenta sempre per prima.
court.end.7=...Naturalmente.
card.act2.end=Fine dell'atto 2|Un gettone di Tomar. La pista porta in Portogallo.

# ---- flashback 2: La Rochelle, fine ottobre 1307 ----
card.fog=La Rochelle, fine ottobre 1307|Pochi giorni dopo gli arresti
name.fog=nebbia
name.town-walls=mura della città
name.ship=nave
name.ship-light=lanterna della nave
name.sea=mare
name.mooring-post=palo d'ormeggio
name.sea-chest=forziere
name.gangplank=passerella
name.etienne=frate Étienne
name.captain=capitano

quay.intro.1=La Rochelle. Cinque giorni di strada, e la nebbia mi stava aspettando.
quay.intro.2=Il messaggio di frate Étienne diceva: la nave che risponde tre volte alla tua lanterna.
goal.80=Trovare la nave nella nebbia.
hint.80=Fare segnali con la lanterna, verso la nave.
goal.81=Raccontare a frate Étienne cos'è successo a Parigi.
hint.81=Parlare con frate Étienne.

fog.look=Nebbia. Vedo appena i miei stivali.
town-walls.look=Le mura di La Rochelle. Qualche luce in città. Ci sono anche gli uomini del re.
ship.look=Qualcosa di grande, là fuori nella nebbia. Un albero? Una nave senza luce.
ship.seen=Tre luci. È lei.
sea.look=Acqua nera. Sa di sale e di catrame.
sea.use=Sono venuto a mandare qualcosa al di là, non a nuotare.
mooring-post.look=Un palo d'ormeggio, la cima bagnata di nebbia.
mooring-post.use=La nave di un altro, la cima di un altro.
gangplank.look=Una passerella, calata fino al molo. Qualcuno aspetta visite.
gangplank.fog=Non prima di sapere di chi è la nave.
gangplank.no=Non salgo a bordo. La mia strada finisce qui.
lantern.look=Una lanterna cieca. Aperta, chiusa, aperta: la lingua più antica del mare.
lantern.use=Dovrei fare segnali verso la nave.
lantern.wrong=Fare segnali alla nebbia? Non risponde. Verso la nave.
signal.1=Aperta... chiusa. Aperta... chiusa. Aperta... chiusa.
signal.2=Là! Tre luci, nella nebbia. Tre volte.
signal.3=Raoul? Sia lodato Dio. Temevamo che ti avessero preso con gli altri.
signal.4=Frate Étienne! Sono l'unico che non hanno preso. Grazie a un gatto.
sea-chest.look=Un piccolo forziere cerchiato di ferro, con un sigillo rosso. Dentro c'è la nostra metà del chirografo.
sea-chest.use=È per il capitano, non per me.

etienne.look=Frate Étienne, della nostra casa di La Rochelle. A giudicare dalla faccia, non dorme da giorni.
etienne.q.paris=Il Temple di Parigi è caduto.
etienne.paris.1=Il Temple di Parigi è caduto, fratello. Li hanno presi tutti. Frate Gérard, il maresciallo, gli scudieri.
etienne.paris.2=Anche qui. La stessa mattina, con le stesse lettere sigillate. Solo pochi di noi sono fuggiti.
etienne.paris.3=Dio li protegga. E Dio perdoni il re, perché io non ci riesco.
etienne.q.gold=C'è oro in quel forziere?
etienne.gold.1=C'è oro in quel forziere?
etienne.gold.2=Pergamena. Vale più dell'oro, e non tintinna quando passano gli uomini del re.
etienne.q.page=Aimery ha nascosto la metà di Parigi in un salterio, nella biblioteca.
etienne.page.1=Aimery ha nascosto la metà parigina del conto in un salterio, nella biblioteca del Temple. Me l'ha detto in un salmo.
etienne.page.2=In un salterio. Bravo ragazzo. Allora le due metà sono al sicuro, e separate, come deve essere.
etienne.page.3=Questa deve lasciare la Francia stanotte. Capitano!
etienne.page.4=Il mio re, Dom Dinis, non consegnerà templari a nessuno. In Portogallo la vostra metà sarà al sicuro.
etienne.page.5=Prendi questo, fratello. Un gettone di Tomar, dai tuoi fratelli di laggiù. Se un giorno qualcuno cercherà, che gli mostri la strada.
etienne.page.6=Allora lo lascerò nella nostra casa, dietro i due cavalieri. Chi lo troverà saprà dove cercare.
etienne.page.7=Va' con Dio.
etienne.page.8=E tu con il mare.
card.fog.end=Non si sa se navi templari siano davvero partite da La Rochelle.|Nessun documento parla di questa. Il gioco l'ha inventata.
etienne.q.bye=Un momento, fratello.
etienne.bye=Svelto, Raoul. La nebbia non durerà per sempre.

captain.look=Il capitano: portoghese, dall'accento. Parla poco e osserva la nebbia.
captain.talk=Parla con frate Étienne. Io trasporto soltanto.
