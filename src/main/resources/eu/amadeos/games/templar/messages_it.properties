dialog.controls.text=<b>Tasto sinistro</b>: camminare, usare, parlare, attraversare una porta.<br><b>Tasto destro</b>: guardare qualcosa.<br><br>Puntatore in cima allo schermo: l'inventario. Fai clic su un oggetto per prenderlo in mano, poi su qualcosa nella stanza per usarlo lì, o su un altro oggetto per unire i due. Il tasto destro lo rimette a posto.<br><br><b>N</b>: il taccuino di Lena, cosa fare dopo; di nuovo N per un suggerimento.<br><b>Esc</b> o <b>.</b>: salta una battuta.<br><b>F5</b>: salva, <b>F9</b>: riprendi la partita salvata. Il gioco salva anche da solo in ogni nuova stanza.<br><b>F11</b>: schermo intero.
dialog.about.text=Un'avventura punta e clicca: una restauratrice di libri a Parigi trova una pagina nascosta nella legatura di un salterio medievale e la segue fino alla notte prima dell'arresto dei Templari.
dialog.about.history=La storia di questo gioco è vera: gli arresti del 13 ottobre 1307, i debiti del re, il Temple di Parigi, il sigillo con due cavalieri su un solo cavallo. Lena, Aimery, frate Gérard, frate Raoul, Hélène e la pagina sono inventati; le leggende si chiamano leggende.

