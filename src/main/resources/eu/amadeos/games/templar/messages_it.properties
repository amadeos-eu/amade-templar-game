phone.look=Il mio telefono. Pieno di foto dei libri degli altri.
phone.use=Qui sotto non c'è campo. I muri sono più vecchi del telefono.
phone.page=Clic. Abitudine da restauratrice: fotografare tutto, prima e dopo.
phone.psalter=Stamattina ne ho fotografato ogni pagina, anche il calendario. Prima e dopo: regola da restauratrice.
page.look.1=Pergamena, piegata due volte. Latino, colonne di numeri romani, somme in lire, soldi e denari.
page.look.2=Un sigillo di cera rossa: due cavalieri su un solo cavallo. E lungo il bordo superiore, mezza parola, tagliata: CHIRO...
page.look.3=Il sigillo dei cavalieri templari. Nascosto in un salterio. In questa biblioteca.
page.use=Non la apro più del necessario. Ha settecento anni.
bonefolder.look=Una stecca d'osso. Liscia, piatta, e non taglia mai la carta.
brush.look=Un pennello per colla. Pulito, almeno.
damp-brush.look=Un pennello inumidito con acqua distillata.
coin.look=Due euro. Abbastanza per la macchinetta del caffè, se è di buon umore.
cup.look=Una tazza sbeccata con una fascia blu. Quella di Lefort.
coffee.look=Nero, senza zucchero, nella sua tazza. Il caffè alla Lefort.
coffee.use=Non è per me. È una bustarella.
sandwich.look=Mezzo panino al prosciutto, con un morso a forma di becco.
sandwich.use=Non ho così fame.

