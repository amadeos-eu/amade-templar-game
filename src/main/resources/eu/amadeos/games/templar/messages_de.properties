dialog.controls.text=<b>Linke Taste</b>: gehen, benutzen, sprechen, durch eine Tür gehen.<br><b>Rechte Taste</b>: etwas ansehen.<br><br>Zeiger an den oberen Bildrand: das Inventar. Einen Gegenstand anklicken nimmt ihn in die Hand, dann etwas im Raum anklicken, um ihn dort zu benutzen, oder einen anderen Gegenstand, um beide zu verbinden. Die rechte Taste legt ihn zurück.<br><br><b>N</b>: Lenas Notizbuch, was als Nächstes zu tun ist; noch einmal N für einen Tipp.<br><b>Esc</b> oder <b>.</b>: einen Satz überspringen.<br><b>F5</b>: speichern, <b>F9</b>: gespeichertes Spiel fortsetzen. Das Spiel speichert auch selbst in jedem neuen Raum.<br><b>F11</b>: Vollbild.
dialog.about.text=Ein Point-and-Click-Adventure: Eine Buchrestauratorin in Paris findet ein Blatt, versteckt im Einband eines mittelalterlichen Psalters, und folgt ihm zurück in die Nacht, bevor die Templer verhaftet wurden.
dialog.about.history=Die Geschichte in diesem Spiel ist wahr: die Verhaftungen vom 13. Oktober 1307, die Schulden des Königs, der Pariser Temple, das Siegel mit zwei Rittern auf einem Pferd. Lena, Aimery, Bruder Gérard, Bruder Raoul, Hélène und das Blatt sind erfunden; Legenden heißen Legenden.

title.name=Das Siegel der Templer
title.subtitle=Ein Geheimnis in Paris, von 1307 bis heute
