phone.look=Mein Handy. Voller Fotos von den Büchern anderer Leute.
phone.use=Kein Netz hier unten. Die Mauern sind älter als das Telefon.
phone.page=Klick. Restauratorengewohnheit: alles fotografieren, vorher und nachher.
phone.psalter=Ich habe heute Morgen jede Seite fotografiert, auch den Kalender. Vorher und nachher: Restauratorenregel.
page.look.1=Pergament, zweimal gefaltet. Latein, Zahlenkolonnen in römischen Ziffern, Summen in Livres, Sous und Deniers.
page.look.2=Ein rotes Wachssiegel: zwei Ritter auf einem Pferd. Und an der Oberkante ein halbes Wort, durchgeschnitten: CHIRO...
page.look.3=Das Siegel der Tempelritter. Versteckt in einem Psalter. In dieser Bibliothek.
page.use=Ich falte es nicht weiter auf als nötig. Es ist siebenhundert Jahre alt.
bonefolder.look=Ein Falzbein. Glatt, flach, und es schneidet nie ins Papier.
brush.look=Ein Kleisterpinsel. Immerhin sauber.
damp-brush.look=Ein Pinsel, feucht von destilliertem Wasser.
coin.look=Zwei Euro. Genug für den Kaffeeautomaten, wenn er gute Laune hat.
cup.look=Eine angeschlagene Tasse mit blauem Rand. Leforts.
coffee.look=Schwarz, ohne Zucker, in seiner eigenen Tasse. Leforts Art von Kaffee.
coffee.use=Der ist nicht für mich. Der ist eine Bestechung.
sandwich.look=Ein halbes Schinkensandwich, mit einem schnabelförmigen Biss.
sandwich.use=So hungrig bin ich nicht.

# ---- die Werkstatt ----
name.window=Fenster
name.window-pigeon=Taube
name.engraving=Kupferstich
name.shelves=Bücherregal
name.coat=Mantel
name.door=Tür
name.bench=Werkbank
name.park-bench=Bank
name.press=Buchpresse
name.books=Bücherstapel
name.lamp=Schreibtischlampe
name.jar=Wasserglas
name.gluepot=Kleistertopf
name.brush=Kleisterpinsel
name.mug=Kaffeebecher
name.psalter=alter Psalter
name.flap=Spiegel
name.bonefolder=Falzbein

workshop.intro.1=Letzte Arbeit für heute: der Psalter aus dem alten Temple-Viertel. Dreizehnhundert, Paris, einmal neu gebunden, und zwar schlecht.
workshop.intro.2=Monsieur Lefort will ihn morgen fertig haben. Monsieur Lefort will alles morgen fertig haben.
window.look=Die Dächer des Marais. Irgendwo dort drüben stand früher der Temple.
window.use=Das ist zugestrichen, seit es mich gibt.
pigeon.look=Schon wieder diese Taube. Sie sitzt jeden Abend da und sieht mir bei der Arbeit zu.
pigeon.use=Husch. ...Es ist ihr egal.
engraving.look=Ein alter Kupferstich vom Turm des Temple in Paris. 1808 abgerissen.
engraving.use=Er hängt schief. Seit vierzig Jahren, sagt Lefort. Er bleibt schief.
shelves.look=Bücher, die auf mich warten. Manche warten schon seit dem letzten Restaurator.
shelves.use=Eins nach dem anderen.
coat.look=Mein Mantel und mein Schal.
coat.coin=Zwei Euro in der Tasche. Genug für den Kaffeeautomaten.
coat.empty=Nur ein Busticket und ein Bleistiftstummel.
door.look=Die Tür zum Lesesaal.
door.not-yet=Nicht bevor der Psalter fertig ist. Ich habe es versprochen.
bench.look=Meine Werkbank. Der einzige aufgeräumte Platz im Haus.
bench.use=Von selbst restauriert sie nichts.
press.look=Eine Buchpresse aus Gusseisen, älter als der Katalog der Bibliothek.
press.use=Nichts drin zum Pressen.
books.look=Sie warten auf die Reparatur. Geduldig, wie Bücher eben sind.
books.use=Später. Viel später.
lamp.look=Meine Schreibtischlampe. Ohne sie würde ich bei Kerzenlicht arbeiten, wie die Mönche.
lamp.use=Sie ist an. Sie bleibt an.
jar.look=Destilliertes Wasser. Für eine Restauratorin praktisch Weihwasser.
jar.use=Trinken möchte ich das lieber nicht.
gluepot.look=Weizenstärkekleister. Er geht wieder ab, wenn man vorsichtig ist: darum geht es.
gluepot.use=Noch nicht. Erst muss etwas auseinander.
mug.look=Mein Kaffee. Kalt. Und nicht Leforts Art: Er trinkt ihn schwarz, aus seiner eigenen Tasse.
mug.use=Kalt. Manches kann man nicht restaurieren.
psalter.look.1=Ein Psalter, um dreizehnhundert. Die Gebete der Woche, ein Kalender der Heiligentage.
psalter.look.2=Der Spiegel im Vorderdeckel wölbt sich, als läge etwas darunter.
psalter.look.after=Der Spiegel ist abgehoben. Darunter eine Mulde im Deckel, genau so groß wie das gefaltete Blatt.
psalter.use=Der Kleister ist siebenhundert Jahre alt und trocken wie Stein. Ohne Feuchtigkeit würde ich das Papier zerreißen.
psalter.use.after=Ich schließe ihn morgen wieder. Diesmal richtig.
psalter.damp=Ein wenig Wasser, ein wenig Geduld... So. Der alte Kleister wird weich.
flap.look=Der abgehobene Spiegel. Wer ihn eingeklebt hat, war in Eile.
brush.take=Der Kleisterpinsel.
brush.damp=In destilliertes Wasser getaucht. Feucht, nicht nass.
brush.dry=Ein trockener Pinsel macht nichts weich.
bonefolder.take=Mein Falzbein.
bonefolder.dry=So trocken würde es reißen. Ich muss erst den Kleister anweichen.
discover.1=Langsam... langsam... Da ist etwas darunter. Gefaltetes Pergament!
discover.2=Jemand hat diesen Einband vor mir geöffnet. Vor Jahrhunderten.
discover.3=Und wer immer es war, hat das hier in Eile versteckt. Lefort muss das sehen.
page.psalter=Es bleibt draußen, bis ich weiß, was es ist.
coin.coat=Sie ist gut da, wo sie ist. In meiner Hand.
goal.10=Den alten Psalter fertig machen: Heute Abend kommt sein Einband auseinander.
hint.10=Sieh dir den Psalter auf der Werkbank genau an.
goal.11=Den alten Spiegel des Psalters lösen, ohne ihn zu zerreißen.
hint.11=Alter Kleister wird mit etwas Wasser weich. Kleisterpinsel und Wasserglas stehen auf der Werkbank.
goal.12=Den angeweichten Spiegel abheben.
hint.12=Benutze das Falzbein mit dem Psalter.
goal.13=Monsieur Lefort im Lesesaal das Blatt zeigen.
hint.13=Die Tür zum Lesesaal ist neben meinem Mantel.

# ---- der Lesesaal ----
name.lefort=Monsieur Lefort
name.machine=Kaffeeautomat
name.rack=Tassenregal
name.lefort-cup=angeschlagene Tasse
name.bookcase=Bücherschrank
name.ladder=Bibliotheksleiter
name.tall-window=Fenster
name.clock=Uhr
name.reading-table=Lesetisch
name.desk=Leforts Schreibtisch
name.ledger-tables=Umrechnungstabellen
name.atelier=Tür zur Werkstatt
name.street=Ausgang zur Straße
dialog.bye=Gute Nacht, Monsieur Lefort.
lefort.hello.1=Madame Vogt. Es ist zehn vor acht. Die Bibliothek hat um sechs geschlossen.
lefort.hello.2=Monsieur Lefort, ich habe etwas im Psalter gefunden.
lefort.hello.3=Non. Was immer es ist, es kann bis morgen warten. Alles kann bis morgen warten.
lefort.look=Monsieur Lefort, Archivar. Vierundsechzig Jahre alt, vierzig davon in diesem Saal. Er sagt erst "Non" und hilft dann.
lefort.q.page=Bitte, sehen Sie sich nur dieses Blatt an.
lefort.page.1=Es lag unter dem Spiegel. Latein, Zahlen und ein Siegel.
lefort.page.2=Non... Zwei Ritter auf einem Pferd. Mon Dieu. Das ist das Siegel des Temple.
lefort.page.3=Und sehen Sie die Oberkante: CHIRO... durchgeschnitten. Ein Chirograph. Derselbe Text zweimal auf eine Haut geschrieben und auseinandergeschnitten; jede Partei behält eine Hälfte. Wer die andere Hälfte hat, hat den Beweis.
lefort.page.4=Und was steht drin?
lefort.page.5=Madame, nach zehn Stunden in diesem Haus kann ich kein Busticket mehr lesen. Nicht vor meinem Kaffee.
lefort.q.coffee=Warum holen Sie sich keinen Kaffee?
lefort.coffee.1=Der Automat steht doch gleich da. Warum holen Sie sich keinen Kaffee?
lefort.coffee.2=Weil dieser Automat und ich nicht miteinander reden. Er will Münzen. Ich habe eine Karte. Und Tassen gibt er auch keine.
lefort.coffee.3=Schwarz, in meiner eigenen Tasse. Die mit dem blauen Rand. Alles andere ist Spülwasser.
lefort.q.give=Ihr Kaffee, Monsieur. Schwarz, in Ihrer eigenen Tasse.
lefort.give.1=...Madame Vogt, Sie sind ein schrecklicher Mensch, und ich danke Ihnen.
lefort.give.2=Bien. "Paris, im Haus des Temple... der Herr König von Frankreich schuldet den Brüdern..." Das sind die Schulden des Königs, in Pfund von Tours.
lefort.give.3=Gesiegelt vom Schatzmeister des Temple. Und hier, Bruder Gérard. Bruder Gérard vom Pariser Haus.
lefort.give.4=Die Templer haben dem König Geld geliehen?
lefort.give.5=Hundert Jahre lang hatten die Könige von Frankreich ihren Staatsschatz im Temple, hier in Paris. Die Templer waren ihre Bankiers.
lefort.give.6=Die Summe steht in Deniers. Also: Wie viele Deniers sind ein Pfund? Meine Umrechnungstabellen liegen auf dem Schreibtisch, wenn Sie sie brauchen.
lefort.q.sum=Wegen der Summe in Deniers...
lefort.sum.again=Ein kleines Königreich, Madame. Geschuldet von einem König, der seine Gläubiger gern verhaften ließ.
sum.12=Zwölf.
sum.20=Zwanzig.
sum.240=Zweihundertvierzig.
sum.later=Einen Moment noch.
sum.answer.12=Zwölf Deniers auf das Pfund?
sum.answer.20=Zwanzig?
sum.answer.240=Zweihundertvierzig: zwölf Deniers auf den Sou, zwanzig Sous auf das Pfund.
sum.wrong=Non, non. Sehen Sie in die Tabellen, Madame. Die warten dort seit 1952.
sum.later.answer=Lassen Sie sich Zeit. Der König schuldet es seit siebenhundert Jahren.
sum.right.1=Genau. Dann ist das hier... mehr, als die Krone in einem ganzen Jahr an Steuern einnahm. Ein kleines Königreich.
sum.right.2=Und nur Tage später ließ der König jeden Templer in Frankreich verhaften. Alle am selben Morgen.
sum.right.3=Freitag, der dreizehnte Oktober 1307. Wer verhaftet seine Bank? Jemand, der nicht zurückzahlen will.
lefort.q.history=Wer waren die Templer wirklich?
lefort.history.1=Wer waren die Templer wirklich? Kev im Internet sagt, sie hätten den Heiligen Gral gefunden.
lefort.history.2=Kev im Internet sagt vieles. Ein paar Ritter in Jerusalem um 1120, die schworen, die Pilger auf der Straße zu schützen.
lefort.history.3=Ein Jahrhundert später: Häuser in ganz Europa, Schiffe, Höfe und die sichersten Tresore der Christenheit. Ein Pilger zahlte in Paris ein und hob in Akkon ab, mit einem Brief.
lefort.history.4=Mönche, Soldaten und Bankiers. Das Letzte hat sie umgebracht.
lefort.q.friday=Was geschah mit ihnen nach den Verhaftungen?
lefort.friday.1=Folter, falsche Geständnisse, ein Prozess, der Jahre dauerte. 1312 löste der Papst den Orden auf.
lefort.friday.2=Im März 1314 wurde der letzte Großmeister, Jacques de Molay, auf einer kleinen Insel in der Seine verbrannt, beim Pont Neuf. Heute ist dort eine Gedenktafel.
lefort.friday.3=Und das Geld?
lefort.friday.4=Die meisten Ländereien bekamen die Johanniter. Der Schatz, von dem die Geschichten reden, wurde nie gefunden. Vielleicht, weil er vor allem auf Pergament stand.
lefort.q.temple=Wo genau war der Temple?
lefort.temple.1=Fünf Minuten von hier. Der Bezirk der Templer war eine kleine Stadt für sich, mit einem Turm wie ein Burgfried.
lefort.temple.2=Napoleon ließ den Turm 1808 abreißen. Heute ist dort ein Park mit Spielplatz: der Square du Temple.
lefort.temple.3=Dann gehe ich dorthin. Der Psalter kam aus diesem Viertel.
lefort.bye=Bonne nuit. Und machen Sie die Tür zu; der Zug geht mir direkt in die Knie.
machine.look=Ein Kaffeeautomat aus den Achtzigern. "PIECES SEULEMENT": nur Münzen. Und keine Becher.
machine.no-cup=Er gibt Kaffee, aber keine Becher. Ich bräuchte erst eine Tasse.
machine.no-coin="Pieces seulement". Er will eine Münze.
machine.coffee=Er knurrt, er spuckt, er gibt Kaffee. Schwarz. In Leforts eigener Tasse.
rack.look=Ein Regal mit gespülten Tassen. Eine hat einen blauen Rand und eine angeschlagene Stelle.
rack.use=Die Tassen sind sauber. Meistens.
lefort-cup.look=Weiß mit blauem Rand und einer angeschlagenen Stelle. Das muss Leforts sein.
lefort-cup.take=Leforts Tasse. Wenn er mich damit erwischt, sollte besser Kaffee drin sein.
bookcase.look=Kirchenbücher, Grundbücher, die Geschichte jeder Straße im Marais. Zehn Meter davon.
bookcase.use=Nicht jetzt. Wenn ich anfange zu lesen, bin ich im Morgengrauen noch hier.
ladder.look=Eine Bibliotheksleiter auf Messingschienen. Sie quietscht; Lefort hört sie überall im Haus.
ladder.use=Ich brauche nichts von da oben.
tall-window.look=Die Straßenlaternen gehen an. Der Himmel über dem Marais wird violett.
tall-window.use=Irgendwann um 1950 zugestrichen.
clock.look=Zehn vor acht. Die Bibliothek hat vor zwei Stunden geschlossen.
clock.use=Sie geht richtig. Lefort zieht sie jeden Montag auf.
reading-table.look=Zwei Leseplätze, aufgeschlagene Bücher, grüne Lampen. Lefort lässt sie so für die Leser von morgen.
reading-table.use=Die habe nicht ich zuzumachen.
desk.look=Leforts Schreibtisch: grünes Leder, ein Telefon mit Wählscheibe, Papierstapel, die nur er versteht.
desk.use=Niemand fasst Leforts Schreibtisch an. Niemand.
ledger-tables.look=Alte Umrechnungstabellen für mittelalterliches Geld: ein Pfund von Tours = 20 Sous, ein Sou = 12 Deniers.
ledger-tables.use=Ansehen dürfen Sie sie, Madame, aber nicht verschieben.
atelier.look=Die Tür zu meiner Werkstatt.
street.look=Der Ausgang zur Straße. Draußen wird es dunkel.
street.not-yet=Erst will ich wissen, was auf dem Blatt steht.
goal.20=Monsieur Lefort das Blatt zeigen.
hint.20=Sprich mit Lefort an seinem Schreibtisch.
goal.21=Lefort seinen Kaffee bringen: schwarz, in seiner eigenen Tasse.
hint.21=Seine Tasse steht im Regal beim Kaffeeautomaten. Der Automat nimmt Münzen, wie die in meiner Manteltasche.
goal.22=Die Summe ausrechnen: Wie viele Deniers sind ein Pfund?
hint.22=Die Umrechnungstabellen liegen auf Leforts Schreibtisch. Dann noch einmal mit ihm sprechen.
goal.23=Zum Square du Temple gehen, wo einst der Temple stand.
hint.23=Der Ausgang zur Straße ist rechts im Lesesaal.

# ---- der Square du Temple ----
name.houses=Häuser des Marais
name.railing=Gitter
name.playground=Spielplatz
name.board=Infotafel
name.lamppost=Straßenlaterne
name.kev-sandwich=Kevs Sandwich
name.half-sandwich=halbes Sandwich
name.metro=Metrostation Temple
name.marais=zurück zur Bibliothek
name.kev=Kev
name.helene=elegante Frau
name.pigeon=Taube
square.intro.1=Der Square du Temple. Fünfhundert Jahre lang stand hier der Bezirk der Templer, mit Mauern, Kirche, Turm und allem.
square.intro.2=Heute: Kastanien, ein Spielplatz und ein Mann, der mit seinem Handy redet.
houses.look=Das Marais in der Dämmerung. Im dreizehnten Jahrhundert war all das Land der Templer; sie verpachteten es an Handwerker.
houses.use=Ich kenne da oben niemanden.
railing.look=Ein gusseisernes Gitter aus dem neunzehnten Jahrhundert, als der Park angelegt wurde.
railing.use=Alles, was ich brauche, ist auf dieser Seite.
playground.look=Eine Rutsche und ein Klettergerüst. Kinder spielen, wo einst der Großmeister seine Räume hatte.
playground.use=Dafür bin ich ein bisschen zu alt und ein bisschen zu beschäftigt.
lamppost.look=Die Laternen gehen an, eine nach der anderen.
lamppost.use=Sie ist warm. Immerhin.
bench.square.look=Eine grüne Bank. Kevs Abendessen wartet darauf.
bench.square.use=Keine Zeit zum Hinsetzen.
kev-sandwich.look=Schinken, Salat, Tomate, ein halbes Baguette. Kevs.
kev-sandwich.use=Das ist Kevs Abendessen. Ich bin Restauratorin, keine Diebin.
half-sandwich.look=Ein halbes Sandwich im Kies. Die andere Hälfte hat die Taube.
half-sandwich.take=Ein halbes Sandwich. Von der Taube getestet. Man weiß ja nie.
board.look.1=Ein alter Stich: der Turm des Temple, ein viereckiger Bergfried mit vier Ecktürmchen. "1808 abgerissen."
board.look.2=Und der Plan: die Kirche, der Turm, der Kreuzgang... und die Bibliothek, genau da, wo heute der Spielplatz ist.
board.look.3=Der Psalter stammt aus dieser Bibliothek. Jemand hat das Blatt 1307 darin versteckt. Hier.
helene.hello=Madame Vogt? Was für ein herrlicher Abend für Geschichte.
helene.look=Kamelhaarmantel, eine rote Handtasche, Ohrringe für ein Jahresgehalt von mir. Sie riecht nach Geld und altem Papier.
helene.q.who=Wer sind Sie?
helene.who.1=Hélène de Vaucresson. Ich sammle. Alte Dinge, seltene Dinge, Dokumente.
helene.who.2=Meine Familie sammelt seit der Zeit vor der Revolution. Wir sind... gründlich.
helene.q.how=Woher kennen Sie meinen Namen?
helene.how.1=Ihr Monsieur Lefort hat vor einer Stunde einen alten Freund in den Archives nationales angerufen. Er war sehr aufgeregt.
helene.how.2=Paris ist ein Dorf, Madame Vogt. Und ich bin eine sehr gute Nachbarin.
helene.q.offer=Was wollen Sie?
helene.offer.1=Das Blatt. Fünfzigtausend Euro, heute Abend, in bar. Keine Fragen, keine Papiere.
helene.offer.2=Es gehört der Bibliothek. Und der Geschichte.
helene.offer.3=Die Geschichte gehört dem, der sie am besten bewahrt. Denken Sie darüber nach.
helene.q.no=Es ist nicht zu verkaufen.
helene.no.1=Es ist nicht zu verkaufen. Guten Abend, Madame.
helene.no.2=Alles ist zu verkaufen. Nur der Preis ändert sich. Bonne soirée.
helene.page=Das hätte sie gern. Nein.
kev.look="Schatz-Kev": Kapuzenpulli, Selfiestick, eine Stimme für ein Publikum von Tausenden. Er ist live, anscheinend.
kev.q.who=Mit wem reden Sie da?
kev.who.1=Mit meinen Followern! Schatz-Kev, live aus dem Herzen der Templer! Achtzigtausend sind es, und alle schauen zu.
kev.who.2=Heute Abend finden wir das Gold. Oder wenigstens die Spuren zum Gold. Oder wenigstens Klicks.
kev.who.3=Viel Glück dabei.
kev.q.templars=Was wissen Sie über die Templer?
kev.templars.1=Sie haben ihr Gold an neun Orten versteckt, verschlüsselt mit der Templer-Chiffre!
kev.templars.2=Diese Chiffre wurde in keinem einzigen mittelalterlichen Dokument gefunden.
kev.templars.3=Eben. So gut waren sie im Verstecken.
kev.q.curse=Und was ist mit dem Großmeister?
kev.curse.1=Jacques de Molay! 1314 in Paris lebendig verbrannt. Und aus den Flammen hat er den König und den Papst verflucht!
kev.curse.2=Beide tot im selben Jahr! Zufall? Das glaube ich nicht!
kev.curse.3=Der Papst starb im April 1314, der König im November. Beide waren krank oder alt. Der große Fluch stammt aus Geschichten, die viel später geschrieben wurden.
kev.curse.4=Ein einziger Chronist sagt nur, Molay habe Gott angerufen, über sie zu richten. Das ist eine Legende, Kev.
kev.curse.5=Legende oder nicht, wo er verbrannt wurde, gibt es eine Gedenktafel. Am Pont Neuf, bei der Statue vom König auf dem Pferd.
kev.curse.6=Die Tafel ist echt. Und Lefort hat sie auch erwähnt. Also zum Pont Neuf: Metrolinie 7, zwei Stationen.
kev.q.film=Könnten Sie den alten Stich auf der Tafel filmen?
kev.film.1=Ein Stich! Altes Zeug! Meine Follower lieben altes Zeug. Halt mal mein... nein, ich lege mein Sandwich einfach hierhin.
kev.film.2=Seht euch das an, Leute: der echte Temple! Liken und abonnieren!
kev.film.3=He! Mein Sandwich! Husch! Husch!
kev.film.4=Ugh. Na gut. "Templer-Taube klaut Schatzjäger das Abendessen". Das ist Content.
kev.q.bye=Bis dann, Kev.
kev.bye=Abonnieren! Kostet nichts!
kev.sandwich=Die Taube hat es schon probiert. Behalten Sie es, ich bin jetzt Vegetarier. Ab sofort.
kev.page=Ich zeige Kev das Blatt nicht. Achtzigtausend Follower wären in zehn Minuten hier.
pigeon.square.look=Eine Taube mit beruflichem Interesse an Kevs Sandwich.
pigeon.coo=Gurrr.
pigeon.square.feed=Sie hatte ihre Hälfte.
metro.look=Metrostation Temple, Linie 3. Die Linie 7 fährt zum Pont Neuf.
metro.not-yet=Wohin sollte ich jetzt? Ich bin hier noch nicht fertig.
marais.look=Die Straße zurück zur Bibliothek.
goal.30=Herausfinden, wo der Temple stand.
hint.30=Links im Park steht eine Infotafel.
goal.31=Mehr über die letzten Tage der Templer herausfinden.
hint.31=Kev scheint alles zu wissen. Manches davon ist vielleicht sogar wahr. Frag ihn nach dem Großmeister.
goal.32=Zum Pont Neuf, zur Gedenktafel für Jacques de Molay. Irgendwas sagt mir, dass ich das Sandwich brauchen werde.
hint.32=Bitte Kev, den Stich zu filmen; sein Sandwich liegt auf der Bank, und eine Taube beobachtet es.
goal.33=Zum Pont Neuf, zur Gedenktafel für Jacques de Molay.
hint.33=Nimm die Metro rechts im Park.

# ---- der Pont Neuf ----
name.far-bank=der Louvre
name.river=die Seine
name.statue=Statue Heinrichs IV.
name.parapet=Brüstung
name.wall=Steinpfeiler
name.steps=Treppe zur Insel
name.plaque=Gedenktafel
name.metro-bridge=Metrostation Pont Neuf
name.driver=großer Mann im dunklen Anzug
name.guide=Fremdenführerin
name.tourist1=Tourist
name.tourist2=Touristin
bridge.intro=Der Pont Neuf bei Nacht. Die Tafel muss unten bei der Treppe sein. Und genau davor steht jemand.
driver.hello.1=Madame Vogt. Madame de Vaucresson lässt grüßen.
driver.hello.2=Sie sind mir gefolgt.
driver.hello.3=Madame erhöht ihr Angebot. Sechzigtausend. Geben Sie mir das Blatt, und Sie können nach Hause gehen.
driver.look=Schultern wie ein Kleiderschrank, Schuhe wie Spiegel. Er steht zwischen mir und der Tafel und sieht nicht aus, als würde er weggehen.
driver.q.who=Wer sind Sie?
driver.who.1=Niemand. Ich fahre Madames Wagen.
driver.who.2=Und manchmal trage ich Dinge für sie. Kleine Dinge. Blätter zum Beispiel.
driver.q.no=Das Blatt bleibt bei mir.
driver.no.1=Das Blatt bleibt bei mir.
driver.no.2=Ich habe Zeit, Madame. Ich habe sehr viel Zeit.
driver.page=Genau das will er.
driver.sandwich=Sie sehen hungrig aus. Hier, ein Abendessen.
driver.pigeons=Was... weg da! Weg von meinen Schuhen!
guide.look=Eine Fremdenführerin mit Regenschirm und einer Stimme für große Gruppen.
guide.tour.1=Und hier, meine Damen und Herren, der berühmteste Fluch der Geschichte!
guide.tour.2=Aus den Flammen verfluchte der Großmeister der Templer den König von Frankreich! Bis ins dreizehnte Glied!
guide.tour.3=Genau genommen wurde er auf der kleinen Insel dort unten verbrannt; die gehört erst drei Jahrhunderte später zur Brücke. Und der Fluch ist eine Legende.
guide.tour.4=Madame ist Historikerin! Applaus, bitte!
guide.tour.5=Seht mal, der große Mann füttert die Tauben! Dürfen wir ein Foto mit ihm machen?
driver.leave=...Ein andermal, Madame Vogt.
guide.tour.6=Und jetzt, meine Damen und Herren, weiter nach Notre-Dame! Folgen Sie dem Schirm!
far-bank.look=Der Louvre mit seinen erleuchteten Fenstern. 1307 stand dort eine königliche Burg; die Männer des Königs hatten es nicht weit zum Temple.
river.look=Die Seine, schwarz und golden unter den Laternen.
river.use=Sie ist kalt, und sie ist dunkel. Nein.
statue.look=Heinrich IV. auf seinem Pferd. Dreihundert Jahre nach den Templern. Auf dem Sockel sitzen die Tauben.
statue.use=Ich komme nicht an ihn heran, und helfen würde er auch nicht.
statue.sandwich=Von hier aus würden sie es nie bemerken. Sie müssten zu mir kommen.
parapet.look=Die älteste Brücke von Paris, fertig 1607. Alt für Paris; jung für die Templer.
parapet.use=Ich lehne mich nicht hinüber. Nicht mit dem, was in meiner Tasche ist.
bridge-lamp.look=Die Laternen des Pont Neuf. Unter ihnen sieht alles aus wie ein alter Stich.
bridge-lamp.use=Warm, immerhin.
wall.look=Der Steinpfeiler über der Treppe hinunter zur Insel.
wall.use=Solide. Vierhundert Jahre solide.
steps.look=Die Treppe hinunter zum kleinen Park an der Inselspitze. Dort stand der Scheiterhaufen.
steps.use=Nachts ist er geschlossen, und die Tafel kann ich von hier oben lesen.
plaque.blocked=Hélènes Fahrer steht genau davor.
plaque.look.1="An dieser Stelle wurde Jacques de Molay, letzter Großmeister des Templerordens, am 18. März 1314 verbrannt."
plaque.look.2=Sieben Jahre nach den Verhaftungen. Sieben Jahre Kerker, und dann das.
plaque.look.3=Der achtzehnte März... Der Psalter hat einen Kalender der Heiligentage. Und ich habe heute Morgen jede Seite fotografiert.
phone.plaque.early=Erst will ich die Tafel lesen.
calendar.1=März... der achtzehnte. Da ist eine Notiz am Rand. Winzig, in brauner Tinte, von späterer Hand.
calendar.2="Rupella. Ad navem." Rupella ist La Rochelle. "Zum Schiff."
calendar.3=Jemand hat den Todestag Molays markiert und notiert, wohin etwas gegangen war: zu einem Schiff, in La Rochelle.
calendar.4=Die andere Hälfte des Chirographen. Das muss sie sein.
card.act1.end=Ende des ersten Akts|"Rupella. Ad navem." Die Spur führt nach La Rochelle.
goal.40=Zur Gedenktafel für Jacques de Molay gelangen. Der Fahrer steht im Weg.
hint.40=Mit Worten bringt man den Fahrer nicht weg. Aber die Tauben auf der Statue sind hungrig, und ich habe ein halbes Sandwich.
goal.41=Die Tafel lesen und das Datum mit meinen Fotos vom Kalender des Psalters vergleichen.
hint.41=Benutze das Handy mit der Tafel.
name.swarm=Tauben
swarm.look=Sämtliche Tauben des Pont Neuf, und alle auf seinen Schuhen.
name.bridge-lamp=Laterne

# ---- der Prolog: der Pariser Temple, 12. Oktober 1307 ----
item.ledger=Rechnungsblatt
item.key=eiserner Schlüssel
item.seal=Siegel
item.wax=Siegelwachs
item.soft-wax=weiches Wachs
item.cheese=Stück Käse
item.knife=Federmesser
item.glue=Leimtopf
card.1307=Paris, 12. Oktober 1307|Das Haus der Tempelritter, bei Nacht
card.arrest=Freitag, 13. Oktober 1307|Im Morgengrauen verhafteten die Männer des Königs jeden Templer in Frankreich. Der Psalter blieb auf seinem Pult.
ledger.look=Das letzte Blatt der Rechnungen des Temple mit der Krone: was König Philipp dem Orden schuldet, auf den Denier genau. Eine Hälfte eines Chirographen.
ledger.look.sealed=Das Blatt, gefaltet und gesiegelt mit den zwei Rittern auf einem Pferd.
key.look=Der Schlüssel zur Truhe des Schatzmeisters. Bruder Gérards Hand hat gezittert, als er ihn mir gab.
seal.look=Das Siegel des Ordens: zwei Ritter auf einem Pferd. Armut, sagt man. Und Bruderschaft.
wax.look=Eine Stange rotes Siegelwachs. Hart wie Knochen.
soft-wax.look=Warm und weich. Schnell, bevor es wieder hart wird.
cheese.look=Ein Stück von Bruder Gérards Käse. Es riecht stark genug, um Tote zu wecken.
cheese.use=Ich habe keinen Hunger. Jemand anders vielleicht.
knife.look=Das Federmesser des Schreibers. Scharf genug, um Pergament zu schneiden.
glue.look=Hautleim, noch warm vom Ofen. Auch der Schreiber hat lange gearbeitet.
seal.hardwax=Das Wachs ist zu hart. Es muss erst warm werden.
name.gerard=Bruder Gérard
name.lancet=Fenster
name.banner=Banner
name.book-stand=Lesepult
name.chest=Truhe
name.chest-open=offene Truhe
name.table=Tisch
name.accounts=Rechnungsbücher
name.candles=Kerzen
name.supper=Bruder Gérards Abendbrot
name.wax-stick=Siegelwachs
name.courtyard-door=Tür zum Hof
gerard.intro.1=Aimery. Schließ die Tür hinter dir. Leise.
gerard.intro.2=Bruder Gérard? Die Komplet ist längst vorbei.
gerard.intro.3=Die Männer des Königs stellen die ganze Woche Fragen. Heute Abend hörte ich, sie tragen versiegelte Briefe, die überall zur selben Stunde zu öffnen sind.
gerard.intro.4=Nimm das: das letzte Blatt unserer Rechnungen mit der Krone. Was der König uns schuldet, auf den Denier genau.
gerard.intro.5=Es muss heute Nacht den Temple verlassen, unter dem Siegel des Schatzmeisters. Das Siegel ist in der Truhe. Hier ist der Schlüssel.
gerard.look=Bruder Gérard, Hüter der Rechnungen. Dreißig Jahre im Temple. Ich habe ihn noch nie ängstlich gesehen.
gerard.q.why=Warum ausgerechnet dieses Blatt?
gerard.why.1=Warum dieses Blatt, Bruder? Warum nicht das Gold?
gerard.why.2=Gold kann man einschmelzen, Aimery. Eine Schuld, von zwei Händen geschrieben, nicht.
gerard.why.3=Das ist ein Chirograph: Eine Hälfte bleibt bei uns, die andere ist schon unterwegs zur Küste. Wer beide hat, hat die Schuld des Königs.
gerard.q.king=Warum sollte der König gegen uns vorgehen?
gerard.king.1=König Philipp schuldet mehr, als er bezahlen kann. Als das früher geschah, ließ er die lombardischen Bankiers verhaften und nahm ihr Geld. Letztes Jahr vertrieb er die Juden und behielt alles, was sie hatten.
gerard.king.2=Er nennt es Gerechtigkeit. Ich nenne es Buchhaltung.
gerard.q.how=Wie siegle ich es?
gerard.how=Wärm das Wachs an einer Kerze, gib es auf den Falz und drück das Siegel hinein, solange es weich ist.
gerard.q.where=Wohin soll ich es bringen?
gerard.where.1=Hinaus über den Hof und durch das Tor. Bruder Raoul hält heute Nacht Torwache, und er wird wissen wollen, warum.
gerard.where.2=Sag es ihm nicht. Raoul ist ein guter Bruder, aber ein langsamer.
gerard.q.bye=Gott schütze dich, Bruder.
gerard.bye=Und dich, Kind. Geh.
lancet.look=Der Mond über Paris. Irgendwo da draußen warten die Männer des Königs auf den Morgen.
lancet.use=Zu schmal zum Durchklettern. Die Templer haben gut gebaut.
banner.look=Der Beauséant: schwarz und weiß, das Banner des Ordens. Schwarz für unsere Feinde, weiß für unsere Freunde, sagt man.
banner.use=Niemand fasst das Banner an.
book-stand.look=Das Tagebuch des Schatzmeisters. Pachten aus dem Marais, Wein aus der Brie, ein Darlehen an einen Bischof.
book-stand.use=Nicht jetzt.
chest.look=Die Truhe des Schatzmeisters, mit Eisen beschlagen. Verschlossen.
chest.locked=Verschlossen. Bruder Gérard hat den Schlüssel... nein, ich habe ihn.
chest.open=Das Siegel des Ordens, in seinem Lederbeutel.
chest-open.look=Nur noch Quittungen darin. Quittungen und Staub.
table.look=Der Tisch des Schatzmeisters: Rechnungsbücher, Tinte, Kerzen. Und Bruder Gérards Abendbrot, unberührt.
table.use=Alles darauf hat seinen Platz. Bruder Gérard würde es merken.
accounts.look=Kolonnen römischer Ziffern. Pfund, Schilling und Pfennig; Livres, Sous und Deniers.
accounts.use=Ich kann nicht den ganzen Schatz tragen.
candles.look=Zwei gute Wachskerzen. Bruder Gérard spart nicht am Licht.
candles.use=Ich verbrenne heute Nacht lieber nichts anderes.
wax.soften=Das Wachs wird in der Flamme weich.
ledger.candle=Die Schuld des Königs verbrennen? Manche würden dafür bezahlen. Nein.
supper.look=Brot, ein Krug Wein und ein Stück Käse, das man bis zur Tür riecht.
supper.take=Er isst heute Nacht nicht mehr. Und der Käse kann nützlich sein.
wax-stick.look=Eine Stange rotes Siegelwachs.
wax-stick.take=Rotes Wachs, für das Siegel.
wax.hard=Das Wachs ist hart wie Stein. Es muss warm werden.
ledger.waxed=Ein Klecks weiches Wachs auf dem Falz. Jetzt das Siegel, schnell!
seal.nowax=Ich brauche erst Wachs auf dem Blatt. Weiches Wachs.
seal.done=Zwei Ritter auf einem Pferd. Gesiegelt.
seal.gerard.1=Gut. Jetzt kann niemand sagen, es sei gestern geschrieben.
seal.gerard.2=Geh, Aimery. Hinaus durch das Tor. Und sieh nicht zurück.
seal.softwax=Erst das Wachs aufs Blatt, dann das Siegel aufs Wachs. Nicht umgekehrt.
door.unsealed=Nicht ungesiegelt, Aimery! Erst siegeln.
name.tower=großer Turm
name.cloister=Kreuzgang
name.moon=Mond
name.well=Brunnen
name.torch=Fackel
name.gate=Tor
name.library=Tür zur Bibliothek
name.chapter=Kammer des Schatzmeisters
name.guard=Bruder Raoul
name.cat=Katze
courtyard.intro=Der Hof. Das Tor ist zu, und Bruder Raoul hält Wache. Diesmal sogar wach.
tower.look=Der große Turm des Temple. Hundert Jahre lang lag der Schatz des Königs von Frankreich darin.
tower.use=Nachts ist er verschlossen. Sogar für mich.
cloister.look=Der Kreuzgang. Die Brüder schlafen oder beten.
cloister.use=Jetzt keine Zeit für den Kreuzgang.
moon.look=Vollmond. Eine schlechte Nacht für Geheimnisse.
well.look=Der Brunnen des Temple. Süßes Wasser, sagt man, das beste von Paris.
well.use=Ich habe keinen Durst. Ich habe Angst.
torch.look=Eine Fackel beim Tor. Raoul will sehen, wer kommt.
torch.use=Ich würde mir nur die Finger verbrennen.
guard.look=Bruder Raoul, ein Sergeant des Ordens. Groß, treu und nicht schnell.
guard.q.open=Öffne das Tor, Bruder Raoul.
guard.open.1=Öffne das Tor, Bruder Raoul. Ich habe einen Auftrag von Bruder Gérard.
guard.open.2=Vor der Prim geht niemand hinaus. Befehl des Marschalls. Nicht einmal du, kleiner Knappe.
guard.q.cat=Ist das die Stallkatze beim Brunnen?
guard.cat.1=Dieses Biest! Letzte Woche hat es mir das Abendbrot gestohlen, direkt vor meiner Nase. Mitsamt dem Käse.
guard.cat.2=Wenn ich es noch einmal an meinem Tor erwische, jage ich es bis nach Saint-Denis.
guard.q.bye=Gute Nacht, Bruder.
guard.bye=Gute Nacht. Und geh ins Bett.
guard.block=Vor der Prim geht niemand hinaus, Knappe.
cat.look=Die Stallkatze. Grau, vernarbt und immer hungrig.
cat.mew=Mrrau.
cat.talk=Sie will etwas. Futter, wahrscheinlich. Es ist immer Futter.
cheese.cat=Sie würde ihn hier fressen und weiterschlafen. Ich will sie da drüben haben, beim Tor.
cheese.throw=Hoppla. Bruder Raoul, ich habe dein Abendbrot fallen lassen... ich meine, Bruder Gérards Abendbrot.
guard.sees.1=Du! Du Käsedieb! Komm her!
guard.sees.2=Diesmal kriege ich dich!
ledger.guard=Bruder Raoul muss davon nichts wissen.
gate.look=Das große Tor zur Rue du Temple. Nachts verriegelt.
gate.1=Der Riegel ist schwer... Draußen sind Fackeln. Dutzende. Und Lilien auf ihren Röcken.
gate.2=Im Namen des Königs! Öffnet das Tor!
gate.3=Die Männer des Königs. Schon jetzt. Hier komme ich nie hinaus.
gate.4=Die Bibliothek. Niemand sucht ein Blatt zwischen Büchern.
gate.soldiers=Sie stehen direkt davor. Da komme ich nie durch.
library-door.look=Die Tür zur Bibliothek, unter dem großen Turm.
library-door.not-yet=Jetzt nicht. Bruder Gérard will das Blatt heute Nacht aus dem Temple haben.
chapter-door.look=Der Weg zurück in die Kammer des Schatzmeisters.
chapter-door.barred=Kein Weg zurück. Die Brüder verriegeln die Türen.
name.cupboard=Bücherschrank
name.library-window=Fenster
name.chests=Bücherkisten
name.copy-desk=Schreibpult
name.copy-knife=Federmesser
name.glue-pot=Leimtopf
name.candle=Kerze
name.lectern=Pult
name.temple-psalter=Psalter
name.library-exit=Tür zum Hof
name.soldier=Mann des Königs
name.soldier2=Mann des Königs
library.intro.1=Die Bibliothek. Bücher werden nicht verhaftet.
library.intro.2=Wenn ich das Blatt gut verstecke, kann es hier auf bessere Zeiten warten. Wie lange es auch dauert.
cupboard.look=Bücher, an ihre Fächer gekettet: die Bibel, die Regel des Ordens, eine Chronik des Heiligen Landes.
cupboard.use=Angekettet. Niemand nimmt diese Bücher mit. Darum geht es.
library-window.look=Fackelschein in der Straße unten. Sie umstellen den Temple.
library-window.use=Zu hoch, zu schmal und zu viele Soldaten.
chests.look=Kisten mit Urkunden und Briefen. Dort suchen sie zuerst.
chests.use=Urkunden. Die Schreiber des Königs werden jede einzelne lesen.
chests.ledger=Da schauen sie als Erstes nach.
copy-desk.look=Das Pult des Schreibers. Er hat lange gearbeitet: Der Leimtopf ist noch warm.
copy-desk.use=Ich bin kein Schreiber.
copy-knife.look=Ein Federmesser zum Zuschneiden von Federkielen und Pergament.
copy-knife.take=Das Federmesser des Schreibers.
glue-pot.look=Ein Topf Hautleim, noch warm.
glue-pot.take=Der Leimtopf. Warm. Gut.
library-candle.look=Eine Kerze auf einem eisernen Ständer, beim Pult.
lectern.look=Das Pult mit dem Psalter, aus dem die Brüder singen.
temple-psalter.look.1=Ein neuer Psalter, der Stolz der Brüder. Die Gebete der Woche und ein Kalender der Heiligen.
temple-psalter.look.2=Die Innenseite des Deckels ist mit Pergament überklebt. Wenn ich es am Rand löse, wäre darunter Platz.
temple-psalter.open=Der Spiegel ist lose. Darunter ist Platz.
temple-psalter.cut=Vorsichtig, am Rand entlang... Der Spiegel löst sich.
temple-psalter.no-room=Unter dem Spiegel wäre gut. Aber er ist festgeklebt.
temple-psalter.hidden=Das Blatt passt darunter. Zweimal gefaltet, samt Siegel.
temple-psalter.no-glue=Noch gibt es nichts festzukleben.
temple-psalter.glued=Leim, andrücken, glattstreichen... Niemand wird es je erfahren.
temple-psalter.done=Es sieht aus, als hätte ihn nie jemand angerührt.
library.soldier.1=Da! Ein Knappe, in der Bibliothek! Packt ihn!
library.aimery.1=Vergebt mir, Bruder Gérard. Das Blatt ist in Sicherheit.
library.soldier.2=Im Namen des Königs, du bist verhaftet.
soldier.look=Ein Soldat des Königs, mit den Lilien Frankreichs auf dem Rock.
library-exit.look=Die Tür zum Hof.
library-exit.no=Da draußen sind die Männer des Königs. Hier drin ist der Psalter.
goal.1=Bruder Gérard hat mir das Blatt und den Schlüssel zur Truhe gegeben. Das Blatt muss mit dem Siegel des Schatzmeisters gesiegelt werden.
hint.1=Die Truhe steht rechts. Benutze den Schlüssel mit ihr.
goal.2=Das Blatt siegeln: weiches Wachs auf den Falz, dann das Siegel.
hint.2=Nimm das Siegelwachs vom Tisch und wärm es an den Kerzen. Gib das weiche Wachs aufs Blatt, dann benutze das Siegel mit dem Blatt.
goal.3=Das Blatt aus dem Temple bringen, über den Hof und durch das Tor.
hint.3=Die Tür zum Hof ist links. Bruder Raoul hält das Tor; sprich mit ihm.
goal.4=Bruder Raoul vom Tor weglocken.
hint.4=Raoul hasst die Stallkatze, und die Katze liebt Käse. Bruder Gérards Abendbrot steht auf dem Tisch in der Kammer.
goal.5=Das Tor öffnen.
hint.5=Das Tor ist rechts.
goal.6=Das Blatt in der Bibliothek verstecken.
hint.6=Die Tür zur Bibliothek ist unter dem großen Turm.
goal.7=Ein Versteck für das Blatt in der Bibliothek finden.
hint.7=Sieh dir den Psalter auf dem Pult an. Das Federmesser liegt auf dem Schreibpult.
goal.8=Das Blatt unter den Spiegel legen.
hint.8=Benutze das Blatt mit dem Psalter.
goal.9=Den Spiegel wieder festkleben.
hint.9=Der Leimtopf steht auf dem Schreibpult.
