phone.look=Mon téléphone. Plein de photos des livres des autres.
phone.use=Pas de réseau ici. Les murs sont plus vieux que le téléphone.
phone.page=Clic. Habitude de restauratrice : tout photographier, avant et après.
phone.psalter=J'en ai photographié chaque page ce matin, le calendrier aussi. Avant et après : règle de restauratrice.
page.look.1=Du parchemin, plié deux fois. Du latin, des colonnes de chiffres romains, des sommes en livres, sous et deniers.
page.look.2=Un sceau de cire rouge : deux chevaliers sur un seul cheval. Et le long du bord supérieur, un demi-mot, coupé : CHIRO...
page.look.3=Le sceau des chevaliers du Temple. Caché dans un psautier. Dans cette bibliothèque.
page.use=Je ne la déplie pas plus que nécessaire. Elle a sept cents ans.
bonefolder.look=Un plioir en os. Lisse, plat, et il ne coupe jamais le papier.
brush.look=Un pinceau à colle. Propre, au moins.
damp-brush.look=Un pinceau humide d'eau distillée.
coin.look=Deux euros. Assez pour la machine à café, si elle est de bonne humeur.
cup.look=Une tasse ébréchée avec une bande bleue. Celle de Lefort.
coffee.look=Noir, sans sucre, dans sa propre tasse. Le café selon Lefort.
coffee.use=Il n'est pas pour moi. C'est un pot-de-vin.
sandwich.look=Une moitié de sandwich jambon, avec une morsure en forme de bec.
sandwich.use=Je n'ai pas si faim.

