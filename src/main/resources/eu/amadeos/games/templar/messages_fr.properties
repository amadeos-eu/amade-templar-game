workshop.intro.1=Dernier travail de la journée : le psautier du vieux quartier du Temple. Treizième siècle, Paris, relié une fois, et mal.
workshop.intro.2=Monsieur Lefort le veut pour demain. Monsieur Lefort veut tout pour demain.
window.look=Les toits du Marais. Quelque part par là se dressait le Temple.
window.use=Elle est bloquée par la peinture depuis avant ma naissance.
pigeon.look=Encore ce pigeon. Il est là tous les soirs et me regarde travailler.
pigeon.use=Ouste. ...Il s'en moque.
engraving.look=Une vieille gravure de la tour du Temple à Paris. Démolie en 1808.
engraving.use=Elle est de travers. Depuis quarante ans, dit Lefort. Elle reste de travers.
shelves.look=Des livres qui m'attendent. Certains attendent depuis le restaurateur d'avant.
shelves.use=Un travail à la fois.
coat.look=Mon manteau et mon écharpe.
coat.coin=Deux euros dans la poche. Assez pour la machine à café.
coat.empty=Juste un ticket de bus et un bout de crayon.
door.look=La porte de la salle de lecture.
door.not-yet=Pas avant d'avoir fini le psautier. J'ai promis.
bench.look=Mon établi. Le seul endroit rangé du bâtiment.
bench.use=Il ne va rien restaurer tout seul.
press.look=Une presse à livres en fonte, plus vieille que le catalogue de la bibliothèque.
press.use=Rien à presser dedans.
books.look=Ils attendent d'être réparés. Patiemment, comme le font les livres.
books.use=Plus tard. Bien plus tard.
lamp.look=Ma lampe de bureau. Sans elle, je travaillerais à la bougie, comme les moines.
lamp.use=Elle est allumée. Elle reste allumée.
jar.look=De l'eau distillée. Pour une restauratrice, c'est presque de l'eau bénite.
jar.use=Je préfère ne pas la boire.
gluepot.look=De la colle d'amidon de blé. Elle se retire, si on fait attention : c'est tout l'intérêt.
gluepot.use=Pas encore. D'abord, il faut défaire.
mug.look=Mon café. Froid. Et pas le genre de Lefort : il le boit noir, dans sa propre tasse.
mug.use=Froid. Certaines choses ne se restaurent pas.
psalter.look.1=Un psautier, vers 1300. Les prières de la semaine, un calendrier des fêtes des saints.
psalter.look.2=La contregarde du plat avant est bombée, comme si quelque chose était dessous.
psalter.look.after=La contregarde est soulevée. Dessous, un creux dans le plat, juste de la taille de la page pliée.
psalter.use=La colle a sept cents ans et elle est sèche comme la pierre. Sans humidité, je déchirerais le papier.
psalter.use.after=Je le refermerai demain. Correctement, cette fois.
psalter.damp=Un peu d'eau, un peu de patience... Voilà. La vieille colle ramollit.
flap.look=La contregarde soulevée. Celui qui l'a collée était pressé.
brush.take=Le pinceau à colle.
brush.damp=Trempé dans l'eau distillée. Humide, pas mouillé.
brush.dry=Un pinceau sec ne ramollit rien.
bonefolder.take=Mon plioir.
bonefolder.dry=À sec, ça déchirerait. Je dois d'abord ramollir la colle.
discover.1=Doucement... doucement... Il y a quelque chose dessous. Du parchemin plié !
discover.2=Quelqu'un a ouvert cette reliure avant moi. Il y a des siècles.
discover.3=Et qui que ce soit, il a caché ceci à la hâte. Lefort doit voir ça.
page.psalter=Elle reste dehors jusqu'à ce que je sache ce que c'est.
coin.coat=Elle est très bien où elle est. Dans ma main.
goal.10=Finir le vieux psautier : sa reliure se défait ce soir.
hint.10=Regardez bien le psautier sur l'établi.
goal.11=Décoller la vieille contregarde du psautier sans la déchirer.
hint.11=La vieille colle ramollit avec un peu d'eau. Le pinceau à colle et le bocal d'eau sont sur l'établi.
goal.12=Soulever la contregarde ramollie.
hint.12=Utilisez le plioir sur le psautier.
goal.13=Montrer la page à monsieur Lefort, dans la salle de lecture.
hint.13=La porte de la salle de lecture est à côté de mon manteau.

# ---- la salle de lecture ----
name.lefort=Monsieur Lefort
name.machine=machine à café
name.rack=égouttoir à tasses
name.lefort-cup=tasse ébréchée
name.bookcase=bibliothèque
name.ladder=échelle de bibliothèque
name.tall-window=fenêtre
name.clock=horloge
name.reading-table=table de lecture
name.desk=bureau de Lefort
name.ledger-tables=tables de conversion
name.atelier=porte de l'atelier
name.street=sortie sur la rue
dialog.bye=Bonne nuit, monsieur Lefort.
lefort.hello.1=Madame Vogt. Il est huit heures moins dix. La bibliothèque a fermé à six heures.
lefort.hello.2=Monsieur Lefort, j'ai trouvé quelque chose dans le psautier.
lefort.hello.3=Non. Quoi que ce soit, cela peut attendre demain. Tout peut attendre demain.
lefort.look=Monsieur Lefort, archiviste. Soixante-quatre ans, dont quarante dans cette salle. Il dit « Non » d'abord et aide ensuite.
lefort.q.page=S'il vous plaît, regardez juste cette page.
lefort.page.1=Elle était sous la contregarde. Du latin, des chiffres, et un sceau.
lefort.page.2=Non... Deux chevaliers sur un seul cheval. Mon Dieu. C'est le sceau du Temple.
lefort.page.3=Et regardez le bord supérieur : CHIRO... coupé. Un chirographe. Le même texte écrit deux fois sur une peau, puis coupé en deux ; chaque partie garde une moitié. Qui détient l'autre moitié détient la preuve.
lefort.page.4=Alors, qu'est-ce qu'elle dit ?
lefort.page.5=Madame, après dix heures dans ce bâtiment, je ne peux plus lire un ticket de bus. Pas avant mon café.
lefort.q.coffee=Pourquoi ne pas vous prendre un café ?
lefort.coffee.1=La machine est juste là. Pourquoi ne pas vous prendre un café ?
lefort.coffee.2=Parce que cette machine et moi ne nous parlons plus. Elle veut des pièces. J'ai une carte. Et elle ne donne pas de gobelets.
lefort.coffee.3=Noir, dans ma propre tasse. Celle avec la bande bleue. Tout le reste, c'est de l'eau de vaisselle.
lefort.q.give=Votre café, monsieur. Noir, dans votre propre tasse.
lefort.give.1=...Madame Vogt, vous êtes une personne terrible et je vous remercie.
lefort.give.2=Bien. « Paris, en la maison du Temple... le seigneur roi de France doit aux frères... » Ce sont les dettes du roi, en livres tournois.
lefort.give.3=Scellé par le trésorier du Temple. Et ici, frère Gérard. Frère Gérard, de la maison de Paris.
lefort.give.4=Les Templiers prêtaient de l'argent au roi ?
lefort.give.5=Pendant cent ans, les rois de France ont gardé leur trésor au Temple, ici à Paris. Les Templiers étaient leurs banquiers.
lefort.give.6=Le total est en deniers. Alors : combien de deniers font une livre ? Mes tables de conversion sont sur le bureau, si vous en avez besoin.
lefort.q.sum=À propos de cette somme en deniers...
lefort.sum.again=Un petit royaume, madame. Dû par un roi qui aimait faire arrêter ses créanciers.
sum.12=Douze.
sum.20=Vingt.
sum.240=Deux cent quarante.
sum.later=Un instant.
sum.answer.12=Douze deniers la livre ?
sum.answer.20=Vingt ?
sum.answer.240=Deux cent quarante : douze deniers au sou, vingt sous à la livre.
sum.wrong=Non, non. Regardez les tables, madame. Elles vous attendent là depuis 1952.
sum.later.answer=Prenez votre temps. Le roi le doit depuis sept cents ans.
sum.right.1=Exactement. Alors ceci fait... plus que ce que la Couronne percevait d'impôts en une année entière. Un petit royaume.
sum.right.2=Et quelques jours plus tard, le roi faisait arrêter tous les Templiers de France. Tous le même matin.
sum.right.3=Vendredi 13 octobre 1307. Qui fait arrêter sa banque ? Quelqu'un qui ne veut pas rembourser.
lefort.q.history=Qui étaient vraiment les Templiers ?
lefort.history.1=Qui étaient vraiment les Templiers ? Kev, sur Internet, dit qu'ils ont trouvé le Saint-Graal.
lefort.history.2=Kev, sur Internet, dit beaucoup de choses. Quelques chevaliers à Jérusalem vers 1120, qui jurèrent de protéger les pèlerins sur la route.
lefort.history.3=Un siècle plus tard : des maisons dans toute l'Europe, des navires, des fermes, et les chambres fortes les plus sûres de la chrétienté. Un pèlerin payait à Paris et retirait à Acre, avec une lettre.
lefort.history.4=Moines, soldats et banquiers. C'est la dernière partie qui les a tués.
lefort.q.friday=Que leur est-il arrivé après les arrestations ?
lefort.friday.1=La torture, de faux aveux, un procès qui dura des années. En 1312, le pape abolit l'ordre.
lefort.friday.2=En mars 1314, le dernier grand maître, Jacques de Molay, fut brûlé sur une petite île de la Seine, près du Pont-Neuf. Il y a une plaque aujourd'hui.
lefort.friday.3=Et l'argent ?
lefort.friday.4=La plupart de leurs terres allèrent aux Hospitaliers. Le trésor dont parlent les histoires n'a jamais été trouvé. Peut-être parce qu'il était surtout écrit sur du parchemin.
lefort.q.temple=Où était exactement le Temple ?
lefort.temple.1=À cinq minutes d'ici. L'enclos des Templiers était une petite ville à lui seul, avec une tour comme un donjon.
lefort.temple.2=Napoléon a fait abattre la tour en 1808. Aujourd'hui, c'est un square avec une aire de jeux : le square du Temple.
lefort.temple.3=Alors c'est là que je vais. Le psautier venait de ce quartier.
lefort.bye=Bonne nuit. Et fermez la porte ; le courant d'air me va droit dans les genoux.
machine.look=Une machine à café des années quatre-vingt. « PIÈCES SEULEMENT ». Et pas de gobelets.
machine.no-cup=Elle donne du café, mais pas de gobelets. Il me faudrait d'abord une tasse.
machine.no-coin=« Pièces seulement ». Elle veut une pièce.
machine.coffee=Elle grogne, elle crache, elle donne du café. Noir. Dans la propre tasse de Lefort.
rack.look=Un égouttoir de tasses lavées. L'une a une bande bleue et une ébréchure sur le bord.
rack.use=Les tasses sont propres. Plus ou moins.
lefort-cup.look=Blanche avec une bande bleue et une ébréchure sur le bord. Ce doit être celle de Lefort.
lefort-cup.take=La tasse de Lefort. S'il me surprend avec, il vaudrait mieux qu'il y ait du café dedans.
bookcase.look=Registres paroissiaux, terriers, l'histoire de chaque rue du Marais. Dix mètres de rayonnages.
bookcase.use=Pas maintenant. Si je commence à lire, je serai encore là à l'aube.
ladder.look=Une échelle de bibliothèque sur rails de laiton. Elle grince ; Lefort l'entend de n'importe où.
ladder.use=Je n'ai besoin de rien là-haut.
tall-window.look=Les réverbères s'allument. Le ciel du Marais vire au violet.
tall-window.use=Bloquée par la peinture vers 1950.
clock.look=Huit heures moins dix. La bibliothèque a fermé il y a deux heures.
clock.use=Elle est à l'heure. Lefort la remonte tous les lundis.
reading-table.look=Deux places de lecteur, des livres ouverts, des lampes vertes. Lefort les laisse ainsi pour les lecteurs de demain.
reading-table.use=Ce n'est pas à moi de les fermer.
desk.look=Le bureau de Lefort : cuir vert, un téléphone à cadran, des piles de papiers que lui seul comprend.
desk.use=Personne ne touche au bureau de Lefort. Personne.
ledger-tables.look=De vieilles tables de conversion pour la monnaie médiévale : une livre tournois = 20 sous, un sou = 12 deniers.
ledger-tables.use=Regardez tant que vous voulez, madame, mais ne les déplacez pas.
atelier.look=La porte de mon atelier.
street.look=La sortie sur la rue. Il commence à faire nuit.
street.not-yet=D'abord, je veux savoir ce que dit cette page.
goal.20=Montrer la page à monsieur Lefort.
hint.20=Parlez à Lefort, à son bureau.
goal.21=Apporter son café à Lefort : noir, dans sa propre tasse.
hint.21=Sa tasse est sur l'égouttoir près de la machine à café. La machine prend des pièces, comme celle de la poche de mon manteau.
goal.22=Faire le calcul : combien de deniers font une livre ?
hint.22=Les tables de conversion sont sur le bureau de Lefort. Ensuite, reparlez-lui.
goal.23=Aller au square du Temple, là où se dressait le Temple.
hint.23=La sortie sur la rue est à droite de la salle de lecture.

# ---- le square du Temple ----
name.houses=maisons du Marais
name.railing=grille
name.playground=aire de jeux
name.board=panneau d'information
name.lamppost=réverbère
name.kev-sandwich=sandwich de Kev
name.half-sandwich=moitié de sandwich
name.metro=station de métro Temple
name.marais=retour à la bibliothèque
name.kev=Kev
name.helene=femme élégante
name.pigeon=pigeon
square.intro.1=Le square du Temple. Pendant cinq cents ans, l'enclos des Templiers s'est dressé ici, murs, église, tour et tout.
square.intro.2=Aujourd'hui : des marronniers, une aire de jeux et un homme qui parle à son téléphone.
houses.look=Le Marais au crépuscule. Au treizième siècle, tout ceci était la terre des Templiers ; ils la louaient à des artisans.
houses.use=Je ne connais personne là-haut.
railing.look=Une grille en fonte du dix-neuvième siècle, quand le square fut aménagé.
railing.use=Tout ce dont j'ai besoin est de ce côté-ci.
playground.look=Un toboggan et une cage à grimper. Les enfants jouent là où le grand maître avait ses appartements.
playground.use=Je suis un peu trop vieille et un peu trop occupée.
lamppost.look=Les réverbères s'allument, un par un.
lamppost.use=Il est chaud. C'est déjà ça.
bench.square.look=Un banc vert. Le dîner de Kev attend dessus.
bench.square.use=Pas le temps de m'asseoir.
kev-sandwich.look=Jambon, salade, tomate, une demi-baguette. Celui de Kev.
kev-sandwich.use=C'est le dîner de Kev. Je suis restauratrice, pas voleuse.
half-sandwich.look=Une moitié de sandwich dans le gravier. Le pigeon a eu l'autre moitié.
half-sandwich.take=Une moitié de sandwich. Testée par un pigeon. On ne sait jamais.
board.look.1=Une vieille gravure : la tour du Temple, un donjon carré à quatre tourelles d'angle. « Démolie en 1808. »
board.look.2=Et le plan : l'église, la tour, le cloître... et la bibliothèque, juste là où se trouve l'aire de jeux.
board.look.3=Le psautier venait de cette bibliothèque. Quelqu'un y a caché la page en 1307. Ici.
helene.hello=Madame Vogt ? Quelle belle soirée pour l'histoire.
helene.look=Manteau camel, sac à main rouge, des boucles d'oreilles qui valent mon salaire annuel. Elle sent l'argent et le vieux papier.
helene.q.who=Qui êtes-vous ?
helene.who.1=Hélène de Vaucresson. Je collectionne. Des choses anciennes, des choses rares, des documents.
helene.who.2=Ma famille collectionne depuis avant la Révolution. Nous sommes... méticuleux.
helene.q.how=Comment connaissez-vous mon nom ?
helene.how.1=Votre monsieur Lefort a téléphoné à un vieil ami des Archives nationales il y a une heure. Il était très excité.
helene.how.2=Paris est un village, madame Vogt. Et je suis une très bonne voisine.
helene.q.offer=Que voulez-vous ?
helene.offer.1=La page. Cinquante mille euros, ce soir, en liquide. Pas de questions, pas de papiers.
helene.offer.2=Elle appartient à la bibliothèque. Et à l'histoire.
helene.offer.3=L'histoire appartient à qui la garde le mieux. Réfléchissez-y.
helene.q.no=Elle n'est pas à vendre.
helene.no.1=Elle n'est pas à vendre. Bonsoir, madame.
helene.no.2=Tout est à vendre. Seul le prix change. Bonne soirée.
helene.page=Ça lui plairait. Non.
kev.look=« Kev le Chasseur de trésors » : sweat à capuche, perche à selfie, une voix pour un public de milliers. Il est en direct, apparemment.
kev.q.who=À qui parlez-vous ?
kev.who.1=À mes abonnés ! Kev le Chasseur de trésors, en direct du cœur des Templiers ! Quatre-vingt mille, et ils regardent tous.
kev.who.2=Ce soir, on trouve l'or. Ou au moins les indices de l'or. Ou au moins des clics.
kev.who.3=Bonne chance.
kev.q.templars=Que savez-vous des Templiers ?
kev.templars.1=Ils ont caché leur or en neuf endroits, codés avec le chiffre des Templiers !
kev.templars.2=Ce chiffre n'apparaît dans aucun document médiéval.
kev.templars.3=Justement. C'est dire s'ils savaient cacher.
kev.q.curse=Et le grand maître ?
kev.curse.1=Jacques de Molay ! Brûlé vif à Paris en 1314. Et depuis les flammes, il a maudit le roi et le pape !
kev.curse.2=Morts tous les deux dans l'année ! Coïncidence ? Je ne crois pas !
kev.curse.3=Le pape est mort en avril 1314, le roi en novembre. Tous deux étaient malades ou vieux. La grande malédiction vient d'histoires écrites bien plus tard.
kev.curse.4=Un seul chroniqueur dit seulement que Molay appela Dieu à les juger. C'est une légende, Kev.
kev.curse.5=Légende ou pas, il y a une plaque là où il a brûlé. Sur le Pont-Neuf, près de la statue du roi à cheval.
kev.curse.6=Cette plaque est réelle. Et Lefort en a parlé aussi. Le Pont-Neuf, donc : ligne 7, deux stations.
kev.q.film=Vous pourriez filmer la vieille gravure du panneau ?
kev.film.1=Une gravure ! Du vieux ! Mes abonnés adorent le vieux. Tenez-moi mon... non, je pose juste mon sandwich là.
kev.film.2=Regardez ça, les amis : le vrai Temple ! Likez et abonnez-vous !
kev.film.3=Hé ! Mon sandwich ! Ouste ! Ouste !
kev.film.4=Beurk. Bon. « Un pigeon templier vole le dîner d'un chasseur de trésors ». Ça, c'est du contenu.
kev.q.bye=À plus, Kev.
kev.bye=Abonnez-vous ! C'est gratuit !
kev.sandwich=Le pigeon l'a déjà goûté. Gardez-le, je suis végétarien maintenant. À partir de maintenant.
kev.page=Je ne montre pas la page à Kev. Quatre-vingt mille abonnés seraient là dans dix minutes.
pigeon.square.look=Un pigeon avec un intérêt professionnel pour le sandwich de Kev.
pigeon.coo=Rrrou.
pigeon.square.feed=Il a eu sa moitié.
metro.look=Station de métro Temple, ligne 3. La ligne 7 va au Pont-Neuf.
metro.not-yet=Où irais-je maintenant ? Je n'ai pas fini ici.
marais.look=La rue qui ramène à la bibliothèque.
goal.30=Découvrir où se dressait le Temple.
hint.30=Il y a un panneau d'information à gauche du square.
goal.31=En savoir plus sur les derniers jours des Templiers.
hint.31=Kev semble tout savoir. Une partie est peut-être même vraie. Interrogez-le sur le grand maître.
goal.32=Aller au Pont-Neuf, à la plaque de Jacques de Molay. Quelque chose me dit que j'aurai besoin de ce sandwich.
hint.32=Demandez à Kev de filmer la gravure ; son sandwich est sur le banc, et un pigeon le surveille.
goal.33=Aller au Pont-Neuf, à la plaque de Jacques de Molay.
hint.33=Prenez le métro à droite du square.

# ---- le Pont-Neuf ----
name.far-bank=le Louvre
name.river=la Seine
name.statue=statue d'Henri IV
name.parapet=parapet
name.wall=pile de pierre
name.steps=escalier vers l'île
name.plaque=plaque
name.metro-bridge=station de métro Pont-Neuf
name.driver=grand homme en costume sombre
name.guide=guide touristique
name.tourist1=touriste
name.tourist2=touriste
bridge.intro=Le Pont-Neuf la nuit. La plaque doit être en bas, près de l'escalier. Et quelqu'un se tient juste devant.
driver.hello.1=Madame Vogt. Madame de Vaucresson vous salue.
driver.hello.2=Vous m'avez suivie.
driver.hello.3=Madame augmente son offre. Soixante mille. Donnez-moi la page, et vous pourrez rentrer chez vous.
driver.look=Des épaules comme une armoire, des chaussures comme des miroirs. Il se tient entre moi et la plaque et n'a pas l'air de vouloir bouger.
driver.q.who=Qui êtes-vous ?
driver.who.1=Personne. Je conduis la voiture de Madame.
driver.who.2=Et parfois, je porte des choses pour elle. De petites choses. Des pages, par exemple.
driver.q.no=La page reste avec moi.
driver.no.1=La page reste avec moi.
driver.no.2=J'ai le temps, madame. J'ai énormément de temps.
driver.page=C'est exactement ce qu'il veut.
driver.sandwich=Vous avez l'air d'avoir faim. Tenez, un dîner.
driver.pigeons=Quoi... dégagez ! Dégagez de mes chaussures !
guide.look=Une guide avec un parapluie et une voix faite pour les foules.
guide.tour.1=Et ici, mesdames et messieurs, la malédiction la plus célèbre de l'histoire !
guide.tour.2=Depuis les flammes, le grand maître des Templiers maudit le roi de France ! Jusqu'à la treizième génération !
guide.tour.3=À vrai dire, il a été brûlé sur la petite île en bas ; elle n'a fait partie du pont que trois siècles plus tard. Et la malédiction est une légende.
guide.tour.4=Madame est historienne ! Applaudissons-la !
guide.tour.5=Regardez, le grand monsieur nourrit les pigeons ! On peut faire une photo avec lui ?
driver.leave=...Une autre fois, madame Vogt.
guide.tour.6=Et maintenant, mesdames et messieurs, en route pour Notre-Dame ! Suivez le parapluie !
far-bank.look=Le Louvre, fenêtres éclairées. En 1307, un château royal se dressait là ; les hommes du roi n'avaient pas loin à aller jusqu'au Temple.
river.look=La Seine, noire et dorée sous les lampes.
river.use=Elle est froide et elle est sombre. Non.
statue.look=Henri IV sur son cheval. Trois cents ans après les Templiers. Les pigeons sont assis sur le socle.
statue.use=Je ne peux pas l'atteindre et il ne m'aiderait pas.
statue.sandwich=D'ici, ils ne le remarqueraient jamais. Il faudrait qu'ils viennent à moi.
parapet.look=Le plus vieux pont de Paris, achevé en 1607. Vieux pour Paris ; jeune pour les Templiers.
parapet.use=Je ne me penche pas. Pas avec ce que j'ai dans mon sac.
bridge-lamp.look=Les lanternes du Pont-Neuf. Sous elles, tout ressemble à une vieille gravure.
bridge-lamp.use=Chaude, au moins.
wall.look=La pile de pierre au-dessus de l'escalier qui descend vers l'île.
wall.use=Solide. Quatre cents ans de solidité.
steps.look=L'escalier qui descend au petit jardin de la pointe de l'île. C'est là que se dressait le bûcher.
steps.use=C'est fermé la nuit, et je peux lire la plaque d'ici.
plaque.blocked=Le chauffeur d'Hélène se tient juste devant.
plaque.look.1=« En cet endroit, Jacques de Molay, dernier grand maître de l'ordre du Temple, a été brûlé le 18 mars 1314. »
plaque.look.2=Sept ans après les arrestations. Sept ans de prison, et puis ça.
plaque.look.3=Le dix-huit mars... Le psautier a un calendrier des fêtes des saints. Et j'en ai photographié chaque page ce matin.
phone.plaque.early=Laissez-moi d'abord lire la plaque.
calendar.1=Mars... le dix-huit. Il y a une note dans la marge. Minuscule, à l'encre brune, d'une main plus tardive.
calendar.2=« Rupella. Ad navem. » Rupella, c'est La Rochelle. « Vers le navire. »
calendar.3=Quelqu'un a marqué le jour de la mort de Molay, et noté où quelque chose était parti : vers un navire, à La Rochelle.
calendar.4=L'autre moitié du chirographe. Ça ne peut être que ça.
card.act1.end=Fin du premier acte|« Rupella. Ad navem. » La piste mène à La Rochelle.
goal.40=Atteindre la plaque de Jacques de Molay. Le chauffeur est dans le chemin.
hint.40=Le chauffeur ne bougera pas pour des mots. Mais les pigeons sur la statue ont faim, et j'ai une moitié de sandwich.
goal.41=Lire la plaque, et comparer la date avec mes photos du calendrier du psautier.
hint.41=Utilisez le téléphone sur la plaque.
name.swarm=pigeons
swarm.look=Tous les pigeons du Pont-Neuf, et tous sur ses chaussures.
name.bridge-lamp=lanterne

# ---- le prologue : le Temple de Paris, 12 octobre 1307 ----
item.ledger=page de comptes
item.key=clé de fer
item.seal=sceau
item.wax=bâton de cire
item.soft-wax=cire molle
item.cheese=morceau de fromage
item.knife=canif
item.glue=pot de colle
card.1307=Paris, 12 octobre 1307|La maison des chevaliers du Temple, la nuit
card.arrest=Vendredi 13 octobre 1307|À l'aube, les hommes du roi arrêtèrent tous les Templiers de France. Le psautier resta sur son lutrin.
ledger.look=La dernière page des comptes du Temple avec la Couronne : ce que le roi Philippe doit à l'ordre, au denier près. Une moitié d'un chirographe.
ledger.look.sealed=La page, pliée et scellée des deux chevaliers sur un seul cheval.
key.look=La clé du coffre du trésorier. La main de frère Gérard tremblait quand il me l'a donnée.
seal.look=Le sceau de l'ordre : deux chevaliers sur un seul cheval. La pauvreté, dit-on. Et la fraternité.
wax.look=Un bâton de cire à cacheter rouge. Dur comme l'os.
soft-wax.look=Chaude et molle. Vite, avant qu'elle ne durcisse.
cheese.look=Un morceau du fromage de frère Gérard. Il sent assez fort pour réveiller les morts.
cheese.use=Je n'ai pas faim. Quelqu'un d'autre, peut-être.
knife.look=Le canif du copiste. Assez tranchant pour couper le parchemin.
glue.look=De la colle de peau, encore chaude du poêle. Le copiste travaillait tard, lui aussi.
seal.hardwax=La cire est trop dure. Il faut d'abord la chauffer.
name.gerard=Frère Gérard
name.lancet=fenêtre
name.banner=bannière
name.book-stand=pupitre
name.chest=coffre
name.chest-open=coffre ouvert
name.table=table
name.accounts=livres de comptes
name.candles=chandelles
name.supper=souper de frère Gérard
name.wax-stick=cire à cacheter
name.courtyard-door=porte de la cour
gerard.intro.1=Aimery. Ferme la porte derrière toi. Doucement.
gerard.intro.2=Frère Gérard ? Complies sont passées depuis longtemps.
gerard.intro.3=Les hommes du roi posent des questions toute la semaine. Ce soir, j'ai appris qu'ils portent des lettres scellées, à ouvrir partout à la même heure.
gerard.intro.4=Prends ceci : la dernière page de nos comptes avec la Couronne. Ce que le roi nous doit, au denier près.
gerard.intro.5=Elle doit quitter le Temple cette nuit, sous le sceau du trésorier. Le sceau est dans le coffre. Voici la clé.
gerard.look=Frère Gérard, gardien des comptes. Trente ans au Temple. Je ne l'ai jamais vu avoir peur.
gerard.q.why=Pourquoi cette page, justement ?
gerard.why.1=Pourquoi cette page, frère ? Pourquoi pas l'or ?
gerard.why.2=L'or se fond, Aimery. Une dette écrite de deux mains, non.
gerard.why.3=C'est un chirographe : une moitié reste chez nous, l'autre est déjà en route vers la côte. Qui détient les deux détient la dette du roi.
gerard.q.king=Pourquoi le roi s'en prendrait-il à nous ?
gerard.king.1=Le roi Philippe doit plus qu'il ne peut payer. La dernière fois, il a fait arrêter les banquiers lombards et pris leur argent. L'an dernier, il a chassé les Juifs et gardé tout ce qu'ils avaient.
gerard.king.2=Il appelle ça la justice. Moi, j'appelle ça de la comptabilité.
gerard.q.how=Comment je la scelle ?
gerard.how=Chauffe la cire à une chandelle, mets-la sur le pli, et presse le sceau dedans tant qu'elle est molle.
gerard.q.where=Où dois-je l'emporter ?
gerard.where.1=Par la cour et la porte. Frère Raoul garde la porte cette nuit et il voudra savoir pourquoi.
gerard.where.2=Ne lui dis rien. Raoul est un bon frère, mais un lent.
gerard.q.bye=Dieu vous garde, frère.
gerard.bye=Et toi aussi, mon enfant. Va.
lancet.look=La lune sur Paris. Quelque part dehors, les hommes du roi attendent le matin.
lancet.use=Trop étroite pour y passer. Les Templiers bâtissaient bien.
banner.look=Le Baucent : noir et blanc, la bannière de l'ordre. Noir pour nos ennemis, blanc pour nos amis, dit-on.
banner.use=Personne ne touche à la bannière.
book-stand.look=Le journal du trésorier. Des loyers du Marais, du vin de Brie, un prêt à un évêque.
book-stand.use=Pas maintenant.
chest.look=Le coffre du trésorier, cerclé de fer. Fermé à clé.
chest.locked=Fermé à clé. Frère Gérard a la clé... non, c'est moi qui l'ai.
chest.open=Le sceau de l'ordre, dans sa bourse de cuir.
chest-open.look=Il n'y reste que des reçus. Des reçus et de la poussière.
table.look=La table du trésorier : livres de comptes, encre, chandelles. Et le souper de frère Gérard, intact.
table.use=Tout ce qui est dessus a sa place. Frère Gérard le remarquerait.
accounts.look=Des colonnes de chiffres romains. Livres, sous et deniers.
accounts.use=Je ne peux pas emporter tout le trésor.
candles.look=Deux bonnes chandelles de cire. Frère Gérard n'économise pas la lumière.
candles.use=Je ferais mieux de ne rien brûler d'autre cette nuit.
wax.soften=La cire ramollit dans la flamme.
ledger.candle=Brûler la dette du roi ? Certains paieraient pour ça. Non.
supper.look=Du pain, une cruche de vin, et un morceau de fromage qui se sent jusqu'à la porte.
supper.take=Il ne mangera pas cette nuit. Et le fromage peut servir.
wax-stick.look=Un bâton de cire à cacheter rouge.
wax-stick.take=De la cire rouge, pour le sceau.
wax.hard=La cire est dure comme la pierre. Il faut la chauffer.
ledger.waxed=Une goutte de cire molle sur le pli. Maintenant le sceau, vite !
seal.nowax=Il me faut d'abord de la cire sur la page. De la cire molle.
seal.done=Deux chevaliers sur un seul cheval. Scellé.
seal.gerard.1=Bien. Maintenant, personne ne pourra dire qu'elle a été écrite hier.
seal.gerard.2=Va, Aimery. Sors par la porte. Et ne te retourne pas.
seal.softwax=D'abord la cire sur la page, puis le sceau sur la cire. Pas l'inverse.
door.unsealed=Pas sans sceau, Aimery ! Scelle-la d'abord.
name.tower=grande tour
name.cloister=cloître
name.moon=lune
name.well=puits
name.torch=torche
name.gate=porte
name.library=porte de la bibliothèque
name.chapter=chambre du trésorier
name.guard=Frère Raoul
name.cat=chatte
courtyard.intro=La cour. La porte est fermée, et frère Raoul la garde. Éveillé, pour une fois.
tower.look=La grande tour du Temple. Le trésor du roi de France y a reposé pendant cent ans.
tower.use=Elle est fermée la nuit. Même pour moi.
cloister.look=La galerie du cloître. Les frères dorment, ou prient.
cloister.use=Pas le temps pour le cloître maintenant.
moon.look=La pleine lune. Une mauvaise nuit pour les secrets.
well.look=Le puits du Temple. De l'eau douce, dit-on, la meilleure de Paris.
well.use=Je n'ai pas soif. J'ai peur.
torch.look=Une torche près de la porte. Raoul aime voir qui arrive.
torch.use=Je ne ferais que me brûler les doigts.
guard.look=Frère Raoul, un sergent de l'ordre. Grand, loyal, et pas rapide.
guard.q.open=Ouvre la porte, frère Raoul.
guard.open.1=Ouvre la porte, frère Raoul. J'ai une course pour frère Gérard.
guard.open.2=Personne ne sort avant prime. Ordre du maréchal. Pas même toi, petit écuyer.
guard.q.cat=C'est la chatte de l'écurie, près du puits ?
guard.cat.1=Cette bête ! Elle m'a volé mon souper la semaine dernière, sous mon nez. Fromage compris.
guard.cat.2=Si je la reprends près de ma porte, je la chasse jusqu'à Saint-Denis.
guard.q.bye=Bonne nuit, frère.
guard.bye=Bonne nuit. Et va te coucher.
guard.block=Personne ne sort avant prime, écuyer.
cat.look=La chatte de l'écurie. Grise, couturée de cicatrices, et toujours affamée.
cat.mew=Mraou.
cat.talk=Elle veut quelque chose. À manger, sans doute. C'est toujours à manger.
cheese.cat=Elle le mangerait ici et se rendormirait. Je la veux là-bas, près de la porte.
cheese.throw=Oups. Frère Raoul, j'ai fait tomber ton souper... je veux dire, le souper de frère Gérard.
guard.sees.1=Toi ! Voleuse de fromage ! Viens ici !
guard.sees.2=Cette fois, je t'attrape !
ledger.guard=Frère Raoul n'a pas besoin de savoir.
gate.look=La grande porte sur la rue du Temple. Barrée la nuit.
gate.1=La barre est lourde... Il y a des torches dehors. Des dizaines. Et des lys sur leurs cottes.
gate.2=Au nom du roi ! Ouvrez la porte !
gate.3=Les hommes du roi. Déjà. Je ne sortirai jamais par ici.
gate.4=La bibliothèque. Personne ne cherchera une page parmi des livres.
gate.soldiers=Ils sont juste dehors. Je ne passerai jamais.
library-door.look=La porte de la bibliothèque, sous la grande tour.
library-door.not-yet=Pas maintenant. Frère Gérard veut que la page quitte le Temple cette nuit.
chapter-door.look=Le chemin du retour vers la chambre du trésorier.
chapter-door.barred=Pas de retour possible. Les frères barrent les portes.
name.cupboard=armoire à livres
name.library-window=fenêtre
name.chests=coffres à livres
name.copy-desk=pupitre du copiste
name.copy-knife=canif
name.glue-pot=pot de colle
name.candle=chandelle
name.lectern=lutrin
name.temple-psalter=psautier
name.library-exit=porte de la cour
name.soldier=homme du roi
name.soldier2=homme du roi
library.intro.1=La bibliothèque. On n'arrête pas les livres.
library.intro.2=Si je cache bien la page, elle pourra attendre ici des temps meilleurs. Aussi longtemps qu'il faudra.
cupboard.look=Des livres enchaînés à leurs rayons : la Bible, la Règle de l'ordre, une chronique de la Terre sainte.
cupboard.use=Enchaînés. Personne n'emporte ces livres. C'est tout l'intérêt.
library-window.look=Des lueurs de torches dans la rue en bas. Ils encerclent le Temple.
library-window.use=Trop haute, trop étroite, et trop de soldats.
chests.look=Des coffres de chartes et d'actes. Le premier endroit qu'ils fouilleront.
chests.use=Des chartes. Les clercs du roi les liront toutes.
chests.ledger=C'est le premier endroit où ils regarderont.
copy-desk.look=Le pupitre du copiste. Il travaillait tard : le pot de colle est encore chaud.
copy-desk.use=Je ne suis pas copiste.
copy-knife.look=Un canif pour tailler les plumes et couper le parchemin.
copy-knife.take=Le canif du copiste.
glue-pot.look=Un pot de colle de peau, encore chaude.
glue-pot.take=Le pot de colle. Chaud. Bien.
library-candle.look=Une chandelle sur un pied de fer, près du lutrin.
lectern.look=Le lutrin avec le psautier dans lequel chantent les frères.
temple-psalter.look.1=Un psautier neuf, la fierté des frères. Les prières de la semaine et un calendrier des saints.
temple-psalter.look.2=L'intérieur du plat est recouvert de parchemin collé. Si je le décolle le long du bord, il y aurait de la place dessous.
temple-psalter.open=La contregarde est décollée. Il y a de la place dessous.
temple-psalter.cut=Doucement, le long du bord... La contregarde se décolle.
temple-psalter.no-room=Sous la contregarde, ce serait bien. Mais elle est collée.
temple-psalter.hidden=La page tient dessous. Pliée deux fois, sceau compris.
temple-psalter.no-glue=Il n'y a encore rien à recoller.
temple-psalter.glued=Colle, presser, lisser... Personne ne le saura jamais.
temple-psalter.done=On dirait que personne n'y a jamais touché.
library.soldier.1=Là ! Un écuyer, dans la bibliothèque ! Saisissez-le !
library.aimery.1=Pardonnez-moi, frère Gérard. La page est en sûreté.
library.soldier.2=Par ordre du roi, tu es arrêté.
soldier.look=Un soldat du roi, avec les lys de France sur sa cotte.
library-exit.look=La porte de la cour.
library-exit.no=Dehors, il y a les hommes du roi. Ici, il y a le psautier.
goal.1=Frère Gérard m'a donné la page et la clé du coffre. La page doit être scellée du sceau du trésorier.
hint.1=Le coffre est à droite. Utilisez la clé sur lui.
goal.2=Sceller la page : de la cire molle sur le pli, puis le sceau.
hint.2=Prenez la cire à cacheter sur la table et chauffez-la aux chandelles. Mettez la cire molle sur la page, puis utilisez le sceau sur la page.
goal.3=Faire sortir la page du Temple, par la cour et la porte.
hint.3=La porte de la cour est à gauche. Frère Raoul garde la porte ; parlez-lui.
goal.4=Éloigner frère Raoul de la porte.
hint.4=Raoul déteste la chatte de l'écurie, et la chatte adore le fromage. Le souper de frère Gérard est sur la table de la chambre.
goal.5=Ouvrir la porte.
hint.5=La porte est à droite.
goal.6=Cacher la page dans la bibliothèque.
hint.6=La porte de la bibliothèque est sous la grande tour.
goal.7=Trouver une cachette pour la page dans la bibliothèque.
hint.7=Regardez le psautier sur le lutrin. Le canif du copiste est sur le pupitre.
goal.8=Mettre la page sous la contregarde.
hint.8=Utilisez la page sur le psautier.
goal.9=Recoller la contregarde.
hint.9=Le pot de colle est sur le pupitre du copiste.

# ---- flash-back 1 : la rue du Temple, à l'aube du 13 octobre 1307 ----
card.cart=Rue du Temple, 13 octobre 1307|À l'aube, devant la porte du Temple
name.dawn=ciel de l'aube
name.temple-tower=grande tour
name.temple-gate=porte du Temple
name.street-houses=maisons
name.bars=barreaux de la charrette
name.wheel=roue
name.cabbages=brouette de choux
name.gerard-cart=frère Gérard
name.soldier-cart=homme du roi
name.raoul=charretier

cart.intro.1=Ils nous ont tous pris. Le maréchal, les cuisiniers, même le vieux frère Hugues, qui n'entend plus un mot.
cart.intro.2=Courage, mon enfant. Tu l'as caché ?
cart.intro.3=Dans la bibliothèque, frère. Dans un psautier. Personne ne regarde dans un psautier.
cart.intro.4=Bien. Mais quelqu'un hors de ces barreaux doit savoir où il est, sinon il attendra là pour toujours.
cart.intro.5=Ce charretier avec ses choux... c'est frère Raoul ! Il courait après le chat quand ils sont venus. Il s'est échappé !
cart.intro.6=Si je l'appelle en français, l'homme du roi entendra chaque mot.
goal.50=Dire à frère Raoul où la page est cachée, sans que l'homme du roi s'en aperçoive.
hint.50=Frère Gérard sait toujours quoi faire. Je lui demande comment parler à Raoul.
goal.51=Chanter le message à Raoul, en latin, comme une prière.
hint.51=Parler à Raoul maintenant. Chaque vers du psaume doit être en latin et porter le message.
goal.52=Raoul sait.
hint.52=Il n'y a plus rien à faire ici.

dawn.look=Le soleil n'est pas encore levé. Les hommes du roi sont venus dans le noir, comme s'ils avaient honte.
temple-tower.look=La grande tour. Hier, l'endroit le plus sûr de France. Aujourd'hui, une prison.
temple-tower.use=Elle est loin, et je suis dans une cage.
temple-gate.look=Notre porte, sous les lys du roi. Ils ont accroché leur bannière pendant qu'on nous attachait encore.
temple-gate.use=Je ne peux pas l'atteindre. Et ce sont les hommes du roi qui s'en servent maintenant.
cart-houses.look=Tous les volets sont fermés. Paris fait semblant de dormir.
cart-houses.use=Personne n'ouvrira un volet pour un templier ce matin.
bars.look=Des barreaux de chêne, des clous de fer. Quelqu'un a construit cette charrette pour des gens comme nous bien avant aujourd'hui.
bars.use=Ils ne bougent pas. Je m'en doutais.
wheel.look=Une roue de charrette. La charrette est prête, les prisonniers sont prêts. Seul le cheval est en retard.
wheel.use=Je ne peux pas l'atteindre d'ici.
cabbages.look=Des choux. Frère Raoul déteste les choux.
cabbages.use=Il faudrait d'abord sortir de la charrette.

gerard-cart.look=Frère Gérard. Ils lui ont lié les mains et pris ses clés. Il a toujours l'air du trésorier.
gerard-cart.q.now=Que va-t-il nous arriver ?
gerard-cart.now.1=Que va-t-il nous arriver, frère ?
gerard-cart.now.2=Des questions. Des légistes. De longs mois. Monsieur de Nogaret, l'homme de loi du roi, prépare cela depuis longtemps.
gerard-cart.now.3=Ne dis rien qu'ils puissent tordre, mon enfant. Et prie.
gerard-cart.q.how=Comment le dire à Raoul sans que le soldat entende ?
gerard-cart.how.1=Comment le dire à Raoul sans que le soldat entende ?
gerard-cart.how.2=Ces hommes parlent français. L'Église parle latin. Et personne n'a jamais empêché un prisonnier de prier.
gerard-cart.how.3=Demande au soldat si tu peux prier. Puis chante, et mets le message dans le psaume.
gerard-cart.q.bye=Je vais essayer, frère.
gerard-cart.bye=Doucement, mon enfant. Les psaumes ne sont jamais pressés.

soldier-cart.look=Un des hommes du roi, en bleu avec les lys. Il a l'air aussi fatigué que nous.
soldier-cart.q.where=Où nous emmenez-vous ?
soldier-cart.where.1=Où nous emmenez-vous ?
soldier-cart.where.2=Là où les légistes du roi le diront. Maintenant, assieds-toi.
soldier-cart.q.horse=Une charrette, ça n'a pas un cheval ?
soldier-cart.horse.1=Une charrette, ça n'a pas un cheval, d'habitude ?
soldier-cart.horse.2=Il arrive. Tout arrive. On arrête la moitié de la France ce matin, il n'y a pas assez de chevaux.
soldier-cart.q.pray=Pouvons-nous prier ? C'est l'heure de prime.
soldier-cart.pray.1=C'est l'heure de prime. Pouvons-nous prier ?
soldier-cart.pray.2=Priez, chantez, faites ce que vous voulez. Dans votre latin d'église, s'il le faut.
soldier-cart.pray.3=De toute façon, je n'y comprends pas un mot.
soldier-cart.q.bye=Rien.
soldier-cart.bye=Alors tais-toi.

raoul.look=Frère Raoul, sous une capuche de charretier. Il fait semblant de vendre des choux. Mal.
raoul.use=Je ne peux pas l'atteindre d'ici. Je peux seulement parler.
psalm.start=(Il chante, de la voix de la chapelle à prime.)
shout.q.page=Raoul ! La page est cachée dans la bibliothèque !
shout.page=Raoul ! Frère Raoul ! La page, elle est dans la...
shout.quiet=Hé ! À qui tu cries, toi ? Silence là-derrière !
shout.angry=Ça suffit. Toi, le charretier ! Va vendre tes choux ailleurs !
shout.gone=Raoul est parti. Idiot, idiot...
shout.back=Voilà. Il est revenu, de l'autre côté de sa brouette. Cette fois, prudence.
shout.q.psst=Psst ! Par ici !
shout.psst=Psst ! Psst !
shout.deaf=Il fait semblant de ne pas entendre. Tant mieux pour lui. Tant pis pour moi.
shout.eyes=Hm ? (Le soldat regarde de moi au charretier, puis de nouveau moi.)
shout.q.bye=Ne rien dire.

psalm.q.hear=«Frater Radulfe, audi me.» (Frère Raoul, écoute-moi.)
psalm.hear.1=«Frater Radulfe, audi me, audi me...»
psalm.hear.2=«Audio, frater. Audio.» (Je t'entends, frère.)
psalm.monks=Des moines.
psalm.q.kyrie=«Kyrie eleison.» (Seigneur, prends pitié.)
psalm.kyrie.1=«Kyrie eleison, Christe eleison...»
psalm.kyrie.2=Une bonne prière. Mais Raoul continue à vendre ses choux : il croit que je prie vraiment.
psalm.q.psst=Psst ! Raoul ! C'est moi !
psalm.psst=Psst ! Raoul ! C'est moi, Aimery !
psalm.q.where=«Pagina in psalterio, in bibliotheca.» (La page est dans le psautier, dans la bibliothèque.)
psalm.where.1=«Pagina in psalterio... in bibliotheca... in psalterio...»
psalm.where.2=«Intellexi.» (Compris.)
psalm.q.cheese=«Caseus in culina est.» (Le fromage est à la cuisine.)
psalm.cheese.1=«Caseus in culina est...»
psalm.cheese.2=«...Quid ?» (...Quoi ?)
psalm.cheese.3=Pas ça. L'estomac de Raoul n'a pas besoin de le savoir.
psalm.q.french=La page est dans le psautier ! Dans la bibliothèque !
psalm.french=La page est dans le psautier ! Dans la...
psalm.q.half=«Ubi est altera pars?» (Où est l'autre moitié ?)
psalm.half.1=«Ubi est... altera pars... ubi est?»
psalm.half.2=«Rupella. Ad navem.» (La Rochelle. Au navire.)
psalm.half.3=La Rochelle. L'autre moitié part vers un navire, à La Rochelle.
psalm.half.4=«Ego sequar.» (Je la suivrai.)
psalm.half.5=«Amen.»
psalm.end.1=Voilà enfin le cheval. Assez chanté, on part.
psalm.end.2=Bien chanté, Aimery. Bien chanté.
psalm.q.cat=«Ubi est feles?» (Où est le chat ?)
psalm.cat.1=«Ubi est feles?»
psalm.cat.2=(Raoul me lance un regard qui n'a rien d'une prière.)
psalm.q.ask=Raoul, où est l'autre moitié ?
psalm.ask=Raoul, où est l'autre moitié du...
psalm.q.stop=(Arrêter de chanter.)
psalm.stop=Amen.
card.cart.end=Frère Raoul ne fut pas pris.|Le matin même, il prit la route de l'ouest.

# ---- acte 2 : La Rochelle ----
card.rochelle=La Rochelle, le lendemain soir|Le Vieux-Port, entre ses deux tours
name.sunset=coucher de soleil
name.saint-nicolas=tour Saint-Nicolas
name.chain-tower=tour de la Chaîne
name.harbour-water=port
name.boat=bateau de pêche
name.nets=filets
name.gulls=mouettes
name.clock-gate=Grosse Horloge
name.office=capitainerie
name.barometer=baromètre
name.quay-lamp=lampadaire
name.quay-bollard=bollard
name.old-town=vers la vieille ville
name.fisherman=vieux pêcheur
name.kev-harbour=Kev

harbour.intro.1=Rupella. La Rochelle. Si un navire est parti avec l'autre moitié, il est parti d'ici.
harbour.intro.2=Il y a sept cents ans. Je cherche un navire qui a pris la mer il y a sept cents ans.
harbour.kev.1=MARIA ! Le chat, c'est elle ! La dame à la page !
harbour.kev.2=Kev. Qu'est-ce que tu fais à La Rochelle ?
harbour.kev.3=Mes followers m'ont envoyé ! Enfin, une. Une dame en manteau camel. Elle m'a même payé le train.
harbour.kev.4=Hélène. Évidemment.
goal.60=Trouver où les templiers de La Rochelle avaient leur maison.
hint.60=Les vieux pêcheurs connaissent la vieille ville. Celui près des filets, peut-être.
goal.61=Trouver au vieux pêcheur une météo en laquelle il a confiance.
hint.61=Kev a une appli météo. Et la capitainerie a quelque chose de plus ancien à sa fenêtre.
goal.62=Dire au pêcheur ce que dit le baromètre.
hint.62=Parler au pêcheur.
goal.63=Aller à la cour du Temple, dans la vieille ville.
hint.63=Le chemin de la vieille ville est à gauche, après la capitainerie.

sunset.look=Le soleil se couche entre les tours, droit dans la mer. Pas mal, La Rochelle.
saint-nicolas.look.1=La tour Saint-Nicolas. Massive, crénelée, magnifique.
saint-nicolas.look.2=Et construite une quarantaine d'années après les arrestations. Aucun templier ne l'a jamais vue.
saint-nicolas.use=Elle est de l'autre côté du port. Et fermée à cette heure-ci.
chain-tower.look=La tour de la Chaîne. La nuit, une chaîne tendue entre les deux tours fermait le port. Elle aussi est plus récente que les templiers.
chain-tower.use=Il me faudrait un bateau.
harbour-water.look=Le Vieux-Port. Des bateaux de pêche, des voiliers, et beaucoup d'histoire au fond.
harbour-water.use=On est en octobre. Non.
boat.look=Un bateau de pêche bleu, le MARIE-JO. Fraîchement peint, les filets à bord.
boat.use=Ce n'est pas le mien. Et son propriétaire est juste là.
nets.look=Des filets, des flotteurs, une caisse. Quelqu'un a passé l'après-midi à les ramender.
nets.use=Je ne ferais qu'agrandir les trous.
gulls.look=Des mouettes, toutes posées sur le quai. Ma grand-mère disait que ça annonce le mauvais temps.
gulls.use=Elles me regardent comme si je leur devais de l'argent.
gulls.sandwich=Ce sandwich appartient aux pigeons de Paris.
clock-gate.look=La Grosse Horloge de la vieille ville. La porte est médiévale ; l'horloge et le dôme sont venus bien plus tard.
clock-gate.use=Le chemin de la vieille ville passe par la capitainerie.
office.look=La capitainerie. Fermée. Par la fenêtre : des cartes, une radio et un vieux baromètre.
office.use=Fermé à clé. Les horaires sont sur un panneau, et nous sommes en dehors de tous.
office.phone=Pas toute la capitainerie. Juste le baromètre.
barometer.dark=Un vieux baromètre, au mur derrière la vitre. Il fait trop sombre là-dedans pour lire l'aiguille.
barometer.read.1=La lampe du téléphone sur la vitre... L'aiguille a dépassé « Variable » et file vers « Tempête ».
barometer.read.2=Et la petite aiguille de laiton dit qu'elle était bien plus haut ce matin. Ça baisse vite.
barometer.again=En baisse. Tempête. Même moi, je sais lire ça.
quay-lamp.look=Un vieux lampadaire de quai, tout juste allumé.
quay-bollard.look=Un bollard avec une amarre autour.
quay-bollard.use=C'est noué plus serré que je ne saurais le dénouer.
old-town.where=Dans la vieille ville ? Mais où ? Je ne sais même pas dans quelle rue chercher.

kev-harbour.look=Kev filme le coucher de soleil en direct. Il n'a pas remarqué que c'est beau.
kev-harbour.q.who=Qui t'a envoyé ici, Kev ?
kev-harbour.who.1=Qui t'a envoyé ici, Kev ? Vraiment ?
kev-harbour.who.2=Une abonnée. Elle commente toujours en premier. Super sympa. Elle m'a demandé où tu allais.
kev-harbour.who.3=J'ai dit que je ne savais pas, et elle a dit La Rochelle, et elle m'a payé le billet !
kev-harbour.who.4=Elle connaît donc la note, elle aussi. Elle a dû voir mes photos... ou ton live, Kev.
kev-harbour.q.fleet=À ton avis, que s'est-il passé ici ?
kev-harbour.fleet.1=Alors, Kev. Que s'est-il passé à La Rochelle ?
kev-harbour.fleet.2=La flotte des templiers ! Dix-huit navires pleins d'or, disparus en une nuit ! C'est partout sur Internet !
kev-harbour.fleet.3=Un frère a dit quelque chose comme ça à son procès, en 1308. Un seul. Personne d'autre ne l'a jamais confirmé. C'est une légende.
kev-harbour.fleet.4=Une légende avec dix-huit navires, quand même.
kev-harbour.q.weather=Que dit ton appli météo pour demain ?
kev-harbour.weather.1=Ton téléphone a une appli météo, non ? Que dit-elle pour demain ?
kev-harbour.weather.2=Soleil ! Vingt-huit degrés ! Journée parfaite pour le bateau !
kev-harbour.weather.3=Vingt-huit degrés. En octobre. Sur l'Atlantique. Montre-moi ça.
kev-harbour.weather.4=Tu vois ? « New Rochelle, ensoleillé. »
kev-harbour.weather.5=New Rochelle, c'est à New York, Kev.
kev-harbour.weather.6=...Ça explique les pubs pour les hot-dogs.
kev-harbour.q.bye=À plus, Kev.
kev-harbour.bye=Restez connectés !
kev-harbour.page=Il a eu assez de mes affaires devant sa caméra.

fisherman.look=Un vieux pêcheur qui ramende ses filets. Il regarde le ciel plus souvent que les filets.
fisherman.q.templars=Savez-vous où vivaient les templiers à La Rochelle ?
fisherman.templars.1=Excusez-moi. Savez-vous où les templiers avaient leur maison, à La Rochelle ?
fisherman.templars.2=Les templiers. J'ai une tête d'office de tourisme, mademoiselle ?
fisherman.templars.3=Vous avez la tête de quelqu'un qui connaît la vieille ville.
fisherman.templars.4=Hm. Je connais la mer. Et demain, je sors pour la sole, ou pas. La radio est en panne.
fisherman.templars.5=Apportez-moi une météo à laquelle je peux me fier, et je vous parlerai de vos templiers. Pas le téléphone de ce gamin.
fisherman.q.again=À propos de la météo...
fisherman.again.1=À propos de la météo de demain...
fisherman.again.2=Quand vous la connaîtrez, je vous parlerai de vos templiers.
fisherman.done.1=Merci encore.
fisherman.done.2=Cour du Temple, derrière la Grosse Horloge. Attention à la tempête.
fisherman.q.app=L'appli de Kev donne la météo de New Rochelle, à New York.
fisherman.app.1=L'appli de Kev annonce du soleil. Pour New Rochelle. À New York.
fisherman.app.2=New York ! Ha ! Alors il a raison, il doit faire très beau là-bas.
fisherman.app.3=Mais je ne pêche pas à New York.
fisherman.q.barometer=Le baromètre de la capitainerie baisse vite.
fisherman.barometer.1=Le baromètre de la capitainerie baisse vite. Il a dépassé « Variable » et file vers « Tempête ».
fisherman.barometer.2=Il baisse ? ...Alors demain, du vent, et pas de sole. Et les mouettes le savaient avant moi.
fisherman.barometer.3=Vous avez sauvé mes filets, mademoiselle.
fisherman.barometer.4=Et les templiers ?
fisherman.barometer.5=Ma grand-mère disait que leur maison était derrière la Grosse Horloge, dans la cour du Temple. Il n'en reste pas grand-chose, le nom et un vieux mur.
fisherman.barometer.6=Il y a un café maintenant. Celui de Madame Morin. Sa famille l'a depuis toujours.
fisherman.barometer.7=Dites-lui que c'est Le Goff qui vous envoie. Elle vous en racontera deux fois plus.
fisherman.q.towers=Ces tours étaient-elles là au temps des templiers ?
fisherman.towers.1=Ces deux tours, elles étaient déjà là au temps des templiers ?
fisherman.towers.2=Non, non. Plus tard. Au temps de vos templiers, il y avait le port, quelques murs et les navires. Les navires, c'était l'important.
fisherman.q.bye=Bonsoir.
fisherman.bye=Bonsoir.
fisherman.page=Je ne montre pas une page de sept cents ans à un homme qui a des écailles de poisson sur les mains.

# ---- acte 2 : la cour du Temple ----
name.night-sky=ciel de nuit
name.old-wall=vieux mur
name.relief=pierre sculptée
name.hollow=cavité dans le mur
name.chalkboard=ardoise du menu
name.moved-board=ardoise du menu
name.loose-stone=pierre sculptée
name.cafe=café Le Templier
name.cafe-window=vitrine du café
name.terrace-lights=guirlande lumineuse
name.napkin=serviette
name.street-sign=plaque de rue
name.back-harbour=retour au port
name.morin=Madame Morin
name.kev-court=Kev

court.intro.1=La cour du Temple. Un café, quelques maisons, et un mur qui a l'air bien plus vieux que le reste.
court.intro.2=Maria ! Regarde le menu ! Il est en écriture templière ! Les templiers nous ont laissé un message !
court.intro.3=Bien sûr, Kev.
goal.70=Chercher ce qui reste de la maison des templiers dans cette cour.
hint.70=Kev est tout excité par l'ardoise du menu. Et il y a quelque chose derrière.
goal.71=Interroger Madame Morin sur le vieux mur derrière son ardoise.
hint.71=Maintenant que je sais lire son menu, elle va peut-être m'apprécier. Lui parler.
goal.72=Regarder la pierre sculptée.
hint.72=Elle est dans le vieux mur, là où se trouvait l'ardoise.
goal.73=Voir si la pierre peut bouger.
hint.73=Le mortier autour a l'air tendre. Quelque chose de mince et plat passerait dans les joints, comme mon plioir.
goal.74=Trouver de l'aide pour sortir la pierre du mur.
hint.74=Elle est trop lourde pour moi. Kev a des muscles, au moins dans les pouces. Lui demander.
goal.75=Regarder dans la cavité derrière la pierre.
hint.75=Mettre la main dans la cavité.

night-sky.look=Des étoiles sur La Rochelle. La tempête n'est pas encore là.
old-wall.look=Des pierres brutes, un vieux mortier, du lierre. Plus vieux que les maisons autour, de plusieurs siècles.
old-wall.use=Solide. En grande partie.
street-sign.look=Cour du Temple. La cour des templiers. Le nom a survécu sept cents ans. La maison, non.
cafe.look=Café Le Templier. Évidemment qu'il s'appelle comme ça.
cafe.use=Je demanderai à Madame Morin avant d'entrer dans sa cuisine.
cafe-window.look=Une lumière chaude, un comptoir, trois tables. Des moules sur chacune.
terrace-lights.look=Une guirlande d'ampoules du vieux mur au café. Sept cents ans d'histoire, et des guirlandes.

chalkboard.look.1=L'ardoise du menu. Des carrés, des angles, des points : la prétendue écriture des templiers.
chalkboard.look.2=Aucun document médiéval ne l'utilise. Mais j'aimerais quand même savoir ce qu'elle dit. Il me faudrait la clé.
chalkboard.behind=Derrière l'ardoise, quelque chose est sculpté dans le mur. Je vois des pattes de cheval. Quatre... non, plus.
chalkboard.decoded=Moules-frites, douze euros. Le dernier secret des templiers.
chalkboard.ask=C'est l'ardoise de Madame Morin. Mieux vaut demander avant de la déplacer.
chalkboard.moved=Voilà. Et toi, qu'est-ce que tu caches ?
decode.1=La clé sur la serviette, le code sur l'ardoise... carré avec un point, M. Carré ouvert, O. Angle, U...
decode.2=M-O-U-L-E-S F-R-I-T-E-S. Douze euros.
decode.3=...Donc le dernier secret des templiers, ce sont des moules.
decode.4=Et des frites. N'oublie pas les frites.

relief.hidden=Quelque chose de sculpté, à moitié derrière l'ardoise. Des pattes de cheval et le bord d'un bouclier.
relief.blocked=L'ardoise est dans le passage.
relief.look.1=Deux chevaliers sur un seul cheval, écus et lances. Presque effacés, mais impossible de s'y tromper.
relief.look.2=Le sceau des templiers, dans la pierre. Dans leur propre cour.
relief.use=Elle est prise dans un vieux mortier de chaux, et le mortier a l'air tendre. Il me faudrait quelque chose de mince et plat pour les joints.
relief.heavy=La pierre est descellée maintenant, mais bien trop lourde pour moi seule.
relief.loose.1=Le plioir entre dans le joint comme dans du beurre. Du vieux mortier de chaux, vieux de plusieurs siècles... il s'effrite.
relief.loose.2=La pierre bouge ! Mais elle est lourde. Bien trop lourde pour moi seule.
loose-stone.look=Les cavaliers, appuyés contre le mur. Ils surveillent cette cour depuis sept cents ans.
hollow.look=Derrière la pierre, une cavité. De la poussière, une araignée morte... et quelque chose de petit et gris.
hollow.empty=Vide maintenant. Juste de la poussière.

token.found.1=Un jeton de plomb, pas plus grand qu'une pièce. Les pèlerins en achetaient dans les sanctuaires qu'ils visitaient.
token.found.2=Il y a une église ronde dessus, et des lettres sur le bord : ...TOMAR.
token.found.3=Tomar, au Portugal. Le château des templiers y fut bâti en 1160. Et au Portugal, le roi ne les a jamais fait arrêter.
token.found.4=C'est vide ?! Où est l'or ? Le chat, où est l'OR ?
token.found.5=L'or n'a jamais été la question, Kev.
token.look=Un jeton de pèlerin en plomb. Une église ronde et le mot TOMAR.
token.use=Ce n'est pas une pièce. Pas pour la machine à café non plus.
phone.token=Clic. Avant et après. Règle de restauratrice.

napkin.look=Une serviette en papier du café, avec la clé du code imprimée dessus, pour que les clients puissent lire le menu.
napkin.take=Un souvenir. Et une clé.
napkin.page=Je ne mets pas une serviette en papier près d'une page de sept cents ans.

kev-court.look=Kev filme l'ardoise en direct. Onze spectateurs. Un record, dit-il.
kev-court.q.cipher=Ce n'est pas une écriture templière, Kev.
kev-court.cipher.1=Ce n'est pas un code templier, Kev. Cet alphabet n'a jamais été trouvé dans un seul document médiéval.
kev-court.cipher.2=Justement ! Ça montre à quel point ils le cachaient bien !
kev-court.cipher.3=Ce n'est pas comme ça que fonctionnent les preuves.
kev-court.cipher.4=C'est comme ça que fonctionne le contenu.
kev-court.q.lift=Kev, aide-moi à soulever cette pierre.
kev-court.lift.1=Kev. Pose ton téléphone une seconde et aide-moi à soulever cette pierre.
kev-court.lift.2=Un caveau templier ? En DIRECT ? Le chat, on ouvre un CAVEAU !
kev-court.lift.3=Hnngh... je l'ai ! Le chat, on est dedans !
kev-court.lift.4=...C'est un trou. Un trou avec une araignée.
kev-court.lift.5=Il y a quelque chose là-dedans.
kev-court.q.bye=Laisse tomber.
kev-court.bye=Restez connectés !

morin.look=Madame Morin, du café. Elle a vu beaucoup de touristes et n'en croit aucun.
morin.q.old=Cette cour est-elle très ancienne ?
morin.old.1=Cette cour est-elle très ancienne ?
morin.old.2=Les maisons sont du dix-septième siècle. Le mur de gauche est bien plus vieux. Les templiers, à ce qu'on dit.
morin.old.3=Les gens photographient mon ardoise devant. Personne ne regarde jamais le mur.
morin.q.board=Puis-je déplacer votre ardoise un instant ?
morin.board.1=Puis-je déplacer votre ardoise un instant ? Il y a quelque chose de sculpté derrière.
morin.board.2=Pendant le service ? Non. Les gens lisent cette ardoise.
morin.board.3=Vraiment ? Dans ce code ?
morin.board.4=...Personne ne l'a jamais lue. Mais elle fait mystérieux. Le mystère, ça vend des moules.
morin.q.menu=Votre menu dit : moules-frites, douze euros.
morin.menu.1=Votre menu dit moules-frites, douze euros.
morin.menu.2=Vous l'avez lu ! Mon petit-fils l'a peint dans ce code idiot, et en quatre ans personne ne l'a jamais lu. Pas un seul !
morin.menu.3=Vous savez, mon grand-père a remonté ce mur en 1920. Derrière la vieille pierre au cheval, il a trouvé un trou.
morin.menu.4=Il n'y avait rien dedans qu'un petit morceau de plomb. Il l'a remis, pour la chance. Un café a besoin de chance.
morin.menu.5=Je peux déplacer votre ardoise, alors ?
morin.menu.6=Allez-y. Déplacez l'ardoise. De toute façon, personne ne la lit.
morin.q.bye=Merci, madame.
morin.bye=Les moules sont à douze euros, si vous avez faim.
morin.page=Ce n'est pas un menu, c'est une pièce de musée. Elle reste dans mon sac.

court.end.1=Tomar. Les templiers du Portugal n'ont jamais été jugés.
court.end.2=En 1319, leurs hommes et leurs terres sont passés à un nouvel ordre, l'ordre du Christ. Plus tard, son siège fut à Tomar.
court.end.3=Si l'autre moitié du chirographe est partie quelque part, c'est là-bas.
court.end.4=Le chat, vous avez entendu ! Prochain arrêt : le PORTUGAL !
court.end.5=Kev. Qui regarde ton live en ce moment ?
court.end.6=Quarante et une personnes ! Et la dame au manteau camel. Elle commente toujours en premier.
court.end.7=...Évidemment.
card.act2.end=Fin de l'acte 2|Un jeton de Tomar. La piste mène au Portugal.

# ---- flash-back 2 : La Rochelle, fin octobre 1307 ----
card.fog=La Rochelle, fin octobre 1307|Quelques jours après les arrestations
name.fog=brouillard
name.town-walls=remparts
name.ship=navire
name.ship-light=lanterne du navire
name.sea=mer
name.mooring-post=pieu d'amarrage
name.sea-chest=coffre
name.gangplank=passerelle
name.etienne=frère Étienne
name.captain=capitaine

quay.intro.1=La Rochelle. Cinq jours de route, et le brouillard m'attendait.
quay.intro.2=Le message de frère Étienne disait : le navire qui répond trois fois à ta lanterne.
goal.80=Trouver le navire dans le brouillard.
hint.80=Faire des signaux avec la lanterne, vers le navire.
goal.81=Raconter à frère Étienne ce qui s'est passé à Paris.
hint.81=Parler à frère Étienne.

fog.look=Du brouillard. Je vois à peine mes propres bottes.
town-walls.look=Les remparts de La Rochelle. Quelques lumières en ville. Les hommes du roi y sont aussi.
ship.look=Quelque chose de grand, là-bas dans le brouillard. Un mât ? Un navire sans lumière.
ship.seen=Trois lumières. C'est lui.
sea.look=Une eau noire. Ça sent le sel et le goudron.
sea.use=Je suis venu envoyer quelque chose de l'autre côté, pas nager.
mooring-post.look=Un pieu d'amarrage, l'amarre mouillée de brouillard.
mooring-post.use=Le navire d'un autre, l'amarre d'un autre.
gangplank.look=Une passerelle, descendue jusqu'au quai. Quelqu'un attend de la visite.
gangplank.fog=Pas avant de savoir à qui est ce navire.
gangplank.no=Je ne monte pas à bord. Ma route s'arrête ici.
lantern.look=Une lanterne sourde. Ouverte, fermée, ouverte : la plus vieille langue de la mer.
lantern.use=Je devrais faire des signaux vers le navire.
lantern.wrong=Faire des signaux au brouillard ? Il ne répond pas. Vers le navire.
signal.1=Ouvert... fermé. Ouvert... fermé. Ouvert... fermé.
signal.2=Là ! Trois lumières, dans le brouillard. Trois fois.
signal.3=Raoul ? Dieu soit loué. Nous avions peur qu'ils t'aient pris avec les autres.
signal.4=Frère Étienne ! Je suis le seul qu'ils n'ont pas pris. Grâce à un chat.
sea-chest.look=Un petit coffre cerclé de fer, avec un sceau rouge. Notre moitié du chirographe est dedans.
sea-chest.use=Il est pour le capitaine, pas pour moi.

etienne.look=Frère Étienne, de notre maison de La Rochelle. À voir sa tête, il n'a pas dormi depuis des jours.
etienne.q.paris=Le Temple de Paris est tombé.
etienne.paris.1=Le Temple de Paris est tombé, frère. Tous ont été pris. Frère Gérard, le maréchal, les écuyers.
etienne.paris.2=Ici aussi. Le même matin, avec les mêmes lettres scellées. Seuls quelques-uns d'entre nous ont pu fuir.
etienne.paris.3=Que Dieu les garde. Et que Dieu pardonne au roi, car moi, je ne peux pas.
etienne.q.gold=Y a-t-il de l'or dans ce coffre ?
etienne.gold.1=Y a-t-il de l'or dans ce coffre ?
etienne.gold.2=Du parchemin. Ça vaut plus que l'or, et ça ne tinte pas quand les hommes du roi passent.
etienne.q.page=Aimery a caché la moitié de Paris dans un psautier, à la bibliothèque.
etienne.page.1=Aimery a caché la moitié parisienne du compte dans un psautier, dans la bibliothèque du Temple. Il me l'a dit dans un psaume.
etienne.page.2=Dans un psautier. Brave petit. Alors les deux moitiés sont en sûreté, et séparées, comme il se doit.
etienne.page.3=Celle-ci doit quitter la France cette nuit. Capitaine !
etienne.page.4=Mon roi, Dom Dinis, ne livrera de templiers à personne. Au Portugal, votre moitié sera en sûreté.
etienne.page.5=Prends ceci, frère. Un jeton de Tomar, de tes frères de là-bas. Si un jour quelqu'un cherche, qu'il lui montre le chemin.
etienne.page.6=Alors je le laisserai dans notre maison, derrière les deux cavaliers. Celui qui le trouvera saura où chercher.
etienne.page.7=Va avec Dieu.
etienne.page.8=Et toi avec la mer.
card.fog.end=On ne sait pas si des navires templiers ont vraiment quitté La Rochelle.|Aucun document ne parle de celui-ci. Le jeu l'a inventé.
etienne.q.bye=Un instant, frère.
etienne.bye=Vite, Raoul. Le brouillard ne tiendra pas éternellement.

captain.look=Le capitaine : portugais, à son accent. Il parle peu et surveille le brouillard.
captain.talk=Parle à frère Étienne. Moi, je ne fais que transporter.
epilogue.title=Ce qui s'est vraiment passé
epilogue.1.head=Vendredi 13 octobre 1307
epilogue.1.text=À l'aube, les hommes du roi arrêtèrent les Templiers dans toute la France, sur des ordres scellés envoyés des semaines plus tôt. On les accusait d'hérésie et d'idolâtrie. La plupart des historiens pensent que l'argent était la vraie raison : Philippe IV était très endetté, et les Templiers comptaient parmi ses créanciers.
epilogue.2.head=Le procès
epilogue.2.text=Sous la torture, beaucoup de Templiers avouèrent. En août 1308, à Chinon, le pape Clément V absout le grand maître et les autres dignitaires. Ce parchemin, mal classé dans les archives du Vatican, fut retrouvé par Barbara Frale en 2001.
epilogue.3.head=La fin de l'ordre
epilogue.3.text=En 1312, le concile de Vienne supprima l'ordre sans le condamner, et ses biens passèrent aux Hospitaliers. Le 18 mars 1314, Jacques de Molay, le dernier grand maître, fut brûlé sur un îlot de la Seine, près de l'actuel Pont Neuf.
epilogue.4.head=Le Portugal
epilogue.4.text=Le roi Denis de Portugal ne livra pas ses Templiers. En 1319, un nouvel ordre, l'ordre du Christ, reprit leurs frères et leurs terres, et à partir de 1357 son siège fut Tomar. La Charola, l'église ronde des Templiers du XIIe siècle, s'y dresse toujours.
epilogue.5.head=Légendes
epilogue.5.text=Une flotte partie de La Rochelle avec le trésor, une malédiction lancée du bûcher, une écriture secrète des Templiers : aucune source n'en parle. Le pape et le roi sont bien morts tous les deux en 1314 ; la malédiction a été ajoutée à l'histoire plus tard.
epilogue.6.head=Les chirographes
epilogue.6.text=Un chirographe était un texte écrit deux fois sur un même parchemin et coupé à travers un mot, souvent CHIROGRAPHUM, de sorte que les deux moitiés n'allaient qu'ensemble. Beaucoup sont conservés dans des archives de toute l'Europe.
epilogue.7.head=Inventé pour ce jeu
epilogue.7.text=Maria, Kev, Hélène, Monsieur Lefort, Madame Morin, Dona Inês, Aimery et les frères Gérard, Raoul et Étienne ; la page, le jeton, le coffre des promesses du roi et l'archive de la tour. Beaucoup d'actes de l'ordre du Christ sont réels : ils sont aujourd'hui conservés à Lisbonne, aux archives nationales de la Torre do Tombo.
card.tomar=Tomar, Portugal, deux jours plus tard|Le couvent du Christ, au-dessus de la ville
charola.intro.1=La Charola. L'église ronde des Templiers de Tomar. Huit cents ans, et elle sent encore les cierges.
charola.helene.1=Madame Vogt. Quelle coïncidence.
charola.helene.2=Madame de Vaucresson. Vous regardez le live de Kev.
charola.helene.3=Tous les soirs. Il garde si mal les secrets. Je viens de faire un petit don au couvent, pour le toit.
charola.helene.4=Petit comment ?
charola.helene.5=Assez petit pour une carte de lectrice des archives. Profitez bien de l'église.
charola.kev.1=Le chat, vous avez vu ? La dame au manteau camel ! EN DIRECT !
charola.kev.2=On ne filme pas dans la Charola ! Combien de fois, senhor ?
charola.kev.3=C'est la quatrième fois. Mes abonnés ont compté.
goal.90=Découvrir ce que le jeton de La Rochelle a à voir avec Tomar.
hint.90=Regarde autour de toi dans l'église. Il y a une vitrine près du mur.
octagon.look.1=Au milieu, l'octogone avec le maître-autel, entièrement peint et doré.
octagon.look.2=Les Templiers l'ont bâti rond, comme l'église du Saint-Sépulcre à Jérusalem.
octagon.use=Derrière un cordon, dans une église, sous les yeux d'une guide ? Non.
paintings.look=Les peintures et l'or sont plus jeunes que les murs : vers 1500, quand l'ordre du Christ s'était enrichi grâce aux voyages en mer.
paintings.use=Cinq cents ans. Je regarde, je ne touche pas.
charola-window.look=Une haute fenêtre. La lumière tombe droit sur l'autel, comme si quelqu'un l'avait prévu. Quelqu'un l'a prévu.
rope.look=Un cordon rouge. Son travail est de tenir Kev à distance. Il n'est pas très doué.
rope.use=Menina ! Le cordon n'est pas là pour rien !
tower-door.locked=Une porte vers l'escalier de la tour. Fermée à clé.
showcase.look.1=Une vitrine pour l'exposition du mois, « Pèlerins de Tomar ». Des moules en pierre pour jetons de pèlerins, du XIVe siècle.
showcase.look.2=L'un d'eux est taillé en forme d'église ronde. De la taille de mon jeton.
showcase.open=La vitrine est ouverte.
showcase.locked=Fermée à clé. Et la vitre est très propre : Dona Inês doit la polir tous les jours.
showcase.glass=La vitre est dans le chemin. C'est Dona Inês qui a la clé.
showcase.after=Le moule et le jeton, côte à côte. Sept cents ans d'écart, et toujours une paire.
goal.91=Demander à Dona Inês d'ouvrir la vitrine.
hint.91=Parle à Dona Inês.
token.fits.1=Il va. Chaque ligne de l'église, chaque lettre de TOMAR.
token.fits.2=Ce jeton a été coulé ici. Dans ce moule.
token.fits.3=Nossa Senhora. Où avez-vous trouvé ça ?
token.fits.4=Ce moule a été trouvé en 1931 dans la tour des archives. Dans un placard mural, derrière les anciens registres de l'ordre du Christ.
token.fits.5=Alors c'est là que je dois chercher. Derrière les registres.
token.fits.6=Pour une savante qui connaît ses Templiers... Venez. Je vous ouvre la tour.
token.fits.7=En haut de l'escalier, menina. Et vous seule. Pas le garçon au bâton.
goal.94=Monter aux archives.
hint.94=Par la porte de l'escalier de la tour.
ines.look=Dona Inês, la guide. Fière de chaque pierre de ce couvent, et elle les connaît toutes par leur nom.
ines.page=Ça se range dans une boîte d'archives, menina, pas dans une poche de manteau !
ines.phone=On ne filme pas ! ...Ah, c'est vous. On ne filme pas quand même.
ines.q.who=Vous êtes la guide ici ?
ines.who.1=Vous êtes la guide ici ?
ines.who.2=Inês Carvalho. Trente et un ans dans ce couvent. J'ai vu des papes, des présidents et neuf équipes de tournage.
ines.who.3=Et ce garçon. Il est pire que les neuf équipes de tournage.
ines.q.helene=Qui était la dame au manteau camel ?
ines.helene.1=Qui était la dame au manteau camel ?
ines.helene.2=Madame de Vaucresson. Elle a donné de l'argent pour le toit. Le directeur lui a donné une carte pour les archives.
ines.helene.3=Elle a demandé les registres de 1319. Personne ne les demande jamais. Deux fois le même jour, c'est très étrange.
ines.q.round=Pourquoi l'église est-elle ronde ?
ines.round.1=Pourquoi les Templiers l'ont-ils construite ronde ?
ines.round.2=Comme le Saint-Sépulcre de Jérusalem. Les chevaliers y sont allés pour le défendre, et ils en ont rapporté la forme.
ines.round.3=On dit que les chevaliers venaient à la messe à cheval. C'est une histoire. Je la raconte quand même ; les touristes adorent.
ines.q.open=Pourriez-vous ouvrir la vitrine ?
ines.open.1=Pourriez-vous ouvrir la vitrine un instant ? J'ai un jeton qui pourrait aller dans l'un des moules.
ines.open.2=Je l'ouvre pour les savants, menina. Pas pour les chasseurs de trésor.
ines.open.3=Trois questions. Si vous connaissez vos Templiers, j'ouvre.
goal.92=Répondre aux trois questions de Dona Inês.
hint.92=Tu connais les réponses depuis Paris et La Rochelle : le jour des arrestations, le sceau, et qui a pris la relève au Portugal.
quiz.q.1=Première question. Quel jour les Templiers de France ont-ils été arrêtés ?
quiz.a.1314=Le 18 mars 1314.
quiz.1314.1=Le 18 mars 1314.
quiz.1314.2=Não. C'est le jour où Jacques de Molay a été brûlé. On recommence, s'il vous plaît.
quiz.a.1307=Le vendredi 13 octobre 1307.
quiz.1307.1=Vendredi 13 octobre 1307. À l'aube.
quiz.right.1=Bien.
quiz.q.2=Deuxième question. Que montre le sceau des Templiers ?
quiz.a.1119=En 1119, à Jérusalem.
quiz.1119.1=En 1119, à Jérusalem ?
quiz.1119.2=Não. C'est à peu près l'année de leur fondation. On recommence.
quiz.a.church=Une église ronde.
quiz.church.1=Une église ronde.
quiz.church.2=Ça, c'est sur votre jeton, menina, pas sur le sceau. On recommence.
quiz.a.lion=Un lion tenant une clé.
quiz.lion.1=Un lion avec une clé ?
quiz.lion.2=Não. Vous pensez à une banque. On recommence.
quiz.a.riders=Deux chevaliers sur un seul cheval.
quiz.riders.1=Deux chevaliers sur un seul cheval. Je l'ai eu entre les mains.
quiz.right.2=Très bien.
quiz.q.3=Dernière question. Qui a repris les Templiers du Portugal, leurs frères et leurs terres ?
quiz.a.christ=L'ordre du Christ, en 1319.
quiz.christ.1=L'ordre du Christ. Fondé en 1319, par le roi Denis.
quiz.christ.2=Dom Dinis. Oui. Et à partir de 1357, son siège était ici, à Tomar.
quiz.christ.3=Vous êtes une savante, menina. J'ouvre.
quiz.christ.4=Voilà. Montrez-moi votre jeton.
goal.93=Essayer le jeton dans le moule.
hint.93=Utilise le jeton de plomb sur la vitrine.
quiz.a.hospital=Les Hospitaliers.
quiz.hospital.1=Les Hospitaliers ?
quiz.hospital.2=En France, oui. Pas ici. Au Portugal, nous avons fait à notre façon. On recommence.
quiz.a.king=Personne. Le roi a tout gardé.
quiz.king.1=Personne. Le roi a tout gardé pour lui.
quiz.king.2=Ça, c'était l'idée du roi de France. Le nôtre était plus malin. Não. On recommence.
quiz.a.think=Laissez-moi réfléchir.
quiz.think=Réfléchissez, menina. Les Templiers ont eu sept cents ans ; vous avez tout l'après-midi.
ines.q.bye=Merci.
ines.bye=De nada. Et dites à votre ami : on ne filme pas.
kev-tomar.look=Kev. Il filme le plafond, le sol et le dos de Dona Inês, dans cet ordre.
kev-tomar.q.pigeon=C'est le pigeon de Paris ?
kev-tomar.pigeon.1=Kev. C'est le pigeon du Pont Neuf ?
kev-tomar.pigeon.2=Il était dans mon sac à dos tout le trajet. Onze heures de train. Il a mangé mon sandwich. Encore.
kev-tomar.pigeon.3=Mes abonnés lui ont donné un nom. Il s'appelle Jacques maintenant.
kev-tomar.pigeon.4=Comme Jacques de Molay ? ...C'est vraiment très bien trouvé, Kev.
kev-tomar.q.stream=Qui regarde aujourd'hui ?
kev-tomar.stream.1=Qui regarde aujourd'hui ?
kev-tomar.stream.2=Quarante et un ! Comme toujours. L'Ohio, Lisbonne, ma mère et la dame au manteau camel.
kev-tomar.stream.3=Elle est ici, Kev. Elle n'a pas besoin de regarder.
kev-tomar.stream.4=Alors ça fait quarante spectateurs et une fan en vrai !
kev-tomar.q.answers=Tu sais quelque chose sur les Templiers ?
kev-tomar.answers.1=Kev, vite : quel jour les Templiers ont-ils été arrêtés ?
kev-tomar.answers.2=Facile. Vendredi 13. C'est pour ça que le vendredi 13 porte malheur !
kev-tomar.answers.3=Non. Cette histoire est bien plus récente. Mais le jour est juste.
kev-tomar.q.bye=Garde la caméra baissée.
kev-tomar.bye=Baissée, d'accord. En contre-plongée, c'est un bon angle.
pigeon-tomar.look=Le pigeon. Venu de Paris jusqu'ici, et toujours pas impressionné.
pigeon-tomar.use=Il me regarde, puis regarde mes poches. Il sait que je n'ai rien à manger.
archive.intro.1=Les archives du couvent. Ici sont rangés les registres de l'ordre du Christ que le musée garde encore.
archive.intro.2=Le placard derrière est vide aujourd'hui. Mais le registre sur le lutrin va de 1319 à 1340.
archive.intro.3=Merci, Dona Inês.
archive.intro.4=Crayon uniquement, menina. Je serai en bas, dans le cloître, à surveiller votre ami.
goal.100=Regarder le registre sur le lutrin.
hint.100=C'est le grand livre au milieu de la pièce.
archive-door.locked=Fermée à clé. De l'extérieur. Évidemment.
archive-door.notyet=Pas encore. Je n'ai pas grimpé dans une tour pour repartir les mains vides.
registers.look.1=Des registres de l'ordre du Christ, rangée après rangée : comptes, lettres, visites des commanderies.
registers.look.2=Sept cents ans d'un ordre très soigneux.
registers.use=Il me faudrait un an. Et une autre carte de lectrice.
register.look.1=Un registre de l'ordre du Christ, de 1319 à 1340. Latin et portugais, de trois ou quatre mains.
register.look.2=Le plat arrière est plus épais que celui de devant. Bien plus épais.
register.use.1=Je feuillette jusqu'à la fin. Le dernier cahier est cousu, mais le plat arrière est trop épais pour un seul plat.
register.use.2=Exactement comme mon psautier à Paris. Quelqu'un aimait ce tour.
register.empty=Le registre m'a donné ce qu'il avait.
goal.101=Chercher l'autre moitié du chirographe dans le registre.
hint.101=Tu sais comment : le plioir, sous la contregarde à l'arrière.
half.found.1=La voilà. Un parchemin plié, sous la contregarde. Coupé le long d'un bord. La coupe passe à travers des lettres.
half.found.2=...GRAPHUM. L'autre moitié du mot. L'autre moitié de la page.
goal.102=Assembler les deux moitiés.
hint.102=Utilise la page de Paris sur l'autre moitié.
half.look=La moitié de Tomar. La coupe le long de son bord passe à travers les lettres ...GRAPHUM.
half.page=Dans l'autre sens. La page de Paris va sur celle-ci.
joined.1=CHIRO... GRAPHUM. Les deux moitiés s'emboîtent comme des dents. Sept cents ans d'écart, et pas un cheveu entre elles.
joined.2=La moitié de Paris porte la somme que la Couronne devait au Temple. La moitié de Tomar porte la même somme, et une ligne de plus.
joined.3=De la même main que le calendrier du psautier. « Arca in claustro, sub lapide crucis. »
joined.4=Un coffre. Dans le cloître. Sous la pierre à la croix.
joined.5=...Et je viens de le lire à voix haute.
joined.helene.1=Merci, Madame Vogt. Vous lisez merveilleusement le latin. Et fort.
joined.helene.2=Madame de Vaucresson.
joined.helene.3=Gardez vos petits papiers. Je suis venue pour le coffre.
joined.helene.4=Vous ne pouvez pas creuser un cloître comme ça !
joined.helene.5=J'ai donné de l'argent pour le toit. On me pardonnera bien un sol.
joined.helene.6=Elle a fermé la porte à clé. Je suis enfermée dans une tour. Avec un crayon.
goal.103=Sortir des archives.
hint.103=Regarde autour de toi : la table, le monte-livres dans le mur, la fenêtre au-dessus du cloître.
chirograph.look.1=Le chirographe, les deux moitiés réunies. Le compte que les Templiers de Paris tenaient avec le roi de France.
chirograph.look.2=Une moitié était pour le Temple, l'autre pour la Couronne. La moitié de la Couronne n'a jamais quitté le Temple.
chirograph.use=C'est une preuve, pas une clé. Elle n'ouvre rien ; elle prouve quelque chose.
reading-desk.look=Une table de lecture avec une lampe verte, des cales en mousse pour les livres et un crayon.
reading-desk.use=Je m'assieds une seconde. Puis je me rappelle que je suis enfermée.
desk-pencil.look=Un crayon. Dans les archives, seuls les crayons sont permis : l'encre ne s'en va jamais d'un parchemin.
pencil.take=Un crayon. L'arme de l'archiviste.
pencil.look=Un crayon d'archives, taillé aux deux bouts par quelqu'un de très organisé.
rules.look=Le règlement de la salle de lecture : silence, crayon uniquement, ni nourriture ni boisson. Quelqu'un a souligné « ni nourriture » deux fois.
note.write.1=J'écris au dos de la serviette du café, en grandes lettres :
note.write.2=ENFERMÉE AUX ARCHIVES. APPELEZ LE COUVENT. MARIA.
note.look=Ma serviette de La Rochelle : d'un côté le menu dans « l'écriture templière » de Kev, de l'autre mon appel au secours.
napkin.pencil=Dans l'autre sens : le crayon sur la serviette.
goal.104=Trouver un moyen d'appeler à l'aide.
hint.104=Écris un message. Il y a un crayon sur la table, et tu as une serviette.
goal.105=Écrire un message pour demander de l'aide.
hint.105=Utilise le crayon sur la serviette.
goal.106=Faire lever les yeux de quelqu'un vers la fenêtre.
hint.106=Kev filme tout ce qui a des plumes. Montre ton message à la fenêtre quand le pigeon y est.
book-lift.look=Un monte-livres : une petite caisse sur des cordes, pour descendre les registres à la salle de lecture. Il est en bas en ce moment.
book-lift.use.1=Je tourne la manivelle. La caisse monte en grinçant, petit à petit.
book-lift.use.2=Il y a un sac en papier dedans.
book-lift.up=Le monte-livres, en haut. Assez grand pour trois registres. Pas pour une restauratrice.
book-lift.small=Un bras rentrerait. Peut-être une épaule. Pas le reste.
book-lift.note=Il descend seulement à la salle de lecture. Personne n'y est le dimanche.
lunch-bag.look=Un sac en papier de la boulangerie de la Praça da República.
lunch-bag.take.1=Un pastel de nata. Le déjeuner de quelqu'un, passé en douce malgré le règlement.
lunch-bag.take.2=Désolée, qui que vous soyez. C'est une urgence.
pastry.look=Un pastel de nata, un peu écrasé. Il s'émiette déjà.
pastry.use=Pas aux archives. « Ni nourriture », souligné deux fois.
tower-window.look.1=Une fenêtre à barreaux, haut au-dessus du cloître.
tower-window.look.2=En bas, Kev filme les arcades, un casque sur les oreilles. Il ne m'entendrait jamais.
tower-window.notyet=J'ai d'abord du travail.
tower-window.open.1=La fenêtre s'ouvre ; les barreaux, non.
tower-window.open.2=KEV ! ...Le casque. Évidemment.
tower-window.shout=KEEEV ! ...Rien. Il hoche la tête en rythme.
pastry.closed=La fenêtre est fermée.
pastry.window.1=J'émiette la pâtisserie sur le rebord. Les miettes tombent comme de la neige sur le cloître.
pastry.window.2=Et voilà le pigeon. Évidemment. Il est venu de Paris et ne sait toujours pas dire non aux miettes.
pastry.window.3=En bas, Kev a tourné sa caméra vers lui. « LE CHAT ! JACQUES EST EN HAUT DE LA TOUR ! »
pigeon-archive.look=Le pigeon, sur le rebord, qui mange ma seule pâtisserie. Kev le filme d'en bas.
pigeon-archive.use=Je ne jette pas un pigeon par la fenêtre. Même pas celui-là.
note.closed=La fenêtre est fermée.
note.nobody=Personne en bas ne lève les yeux. Kev filme tout ce qui bouge ; il me faut quelque chose qui vaille la peine d'être filmé près de la fenêtre.
note.pigeon=Ce n'est pas un pigeon voyageur. C'est à peine un pigeon.
rescue.1=Je tiens le message contre les barreaux, juste à côté du pigeon. Grandes lettres. Souris, Maria.
rescue.2=Kev zoome. Sur le pigeon. Et sur mon message.
rescue.3=Son téléphone sonne. Et sonne. Et sonne.
rescue.4=Menina ! Quarante et une personnes ont appelé la loge ! Dont une de l'Ohio !
rescue.5=La mère du garçon vous dit bonjour.
rescue.6=Hélène de Vaucresson m'a enfermée. Elle est dans le cloître, sous la pierre à la croix.
rescue.7=Dans mon cloître ? Avec un pied-de-biche ?! Venez !
cloister.intro.1=Trop tard, Madame Vogt. Sept cents ans trop tard, pour être exacte.
cloister.intro.2=Vous avez soulevé une pierre tombale dans un monument du patrimoine mondial.
cloister.intro.3=Avec un très bon pied-de-biche. Et voyez ce qu'il y avait dessous.
cloister.intro.4=Madame ! C'est un cloître, pas un chantier !
cloister.intro.5=Le trésor des Templiers...
cloister.intro.6=...Du papier ? Des parchemins, avec des sceaux ? Où est l'or ?
cloister.intro.7=Le chat ! Le coffre est ouvert ! EN DIRECT ! ...C'est quoi ? Quelqu'un peut zoomer ?
goal.110=Voir ce qu'il y a dans le coffre.
hint.110=Regarde le coffre ouvert.
arcades.look.1=Deux étages d'arcades autour d'un petit jardin. Le cloître du cimetière, du XVe siècle.
arcades.look.2=Des moines sont enterrés sous le dallage. Ou l'étaient, jusqu'à ce qu'Hélène arrive avec un pied-de-biche.
arcades.use=Une pierre très ancienne, très dure. Très bien bâtie.
orange-tree.look=Un oranger, au milieu du cloître, comme si de rien n'était.
orange-tree.use=Des oranges amères. Je le sais sans goûter.
slab.look=La dalle à la croix, soulevée et appuyée. Assez épaisse pour garder un secret sept cents ans.
slab.use=Hélène a eu besoin d'un pied-de-biche. J'ai un crayon.
iron-chest.look=Un coffre cerclé de fer sous la dalle.
iron-chest-open.look.1=Des parchemins. Des dizaines, chacun avec un sceau pendu à un cordon. Pas le sceau des Templiers.
iron-chest-open.look.2=Des lys. Le sceau du roi de France.
goal.111=Montrer à Hélène ce qu'elle a vraiment trouvé.
hint.111=Tu as le compte des deux moitiés. Montre-le à Hélène.
goal.112=Le prouver à Hélène.
hint.112=Utilise le chirographe sur Hélène.
iron-chest-open.use=Pas touche, Madame Vogt. C'est à moi.
cloister-gate.look=La porte du grand cloître. Des touristes, un café et une sortie.
cloister-gate.notnow=Pas maintenant. Pas avec Hélène dans une tombe et un pied-de-biche.
helene-cloister.look=Hélène de Vaucresson, à genoux dans la tombe d'un moine en manteau camel. Elle rend même ça élégant.
helene-cloister.q.gold=Vous avez trouvé votre or ?
helene-cloister.gold.1=Alors. Vous avez trouvé votre or ?
helene-cloister.gold.2=Mon grand-père disait que les Templiers avaient caché leur or et que le roi ne l'avait jamais trouvé. Toute sa vie, il l'a dit.
helene-cloister.gold.3=Il avait à moitié raison.
helene-cloister.gold.4=À moitié raison, c'est tort, Madame Vogt.
helene-cloister.q.family=Pourquoi est-ce si important pour vous ?
helene-cloister.family.1=Pourquoi le voulez-vous tant ?
helene-cloister.family.2=Les Vaucresson ont prêté de l'argent aux rois pendant trois cents ans. Puis les rois ont cessé de payer.
helene-cloister.family.3=Nous avions un château. Maintenant, j'ai un appartement, un manteau, et ceci.
helene-cloister.family.4=Alors vous, plus que personne, comprendrez ce qu'il y a dans ce coffre.
helene-cloister.q.read=Lisez-en un.
helene-cloister.read.1=Lisez-en un, Madame. N'importe lequel.
helene-cloister.read.2=« Nous, Philippe, par la grâce de Dieu roi des Francs... » Je ne lis pas le latin si vite.
helene-cloister.read.3=Moi, si. Et je peux vous montrer ce que ça veut dire.
helene-cloister.bye=Allez-vous-en, Madame Vogt. Et emmenez votre pigeon.
helene-cloister.q.bye=Laissez.
finale.early=Elle ne le regarderait même pas. Je devrais d'abord savoir ce qu'il y a dans ce coffre.
finale.1=Voici le compte que le Temple tenait avec le roi. Les deux moitiés. La somme en bas, le petit royaume de Monsieur Lefort, c'est ce qu'il leur devait.
finale.2=Et votre coffre est plein des promesses de paiement du roi. Scellées de ses lys. Elles font la même somme.
finale.3=« ...que nous promettons de rendre aux frères du Temple à la prochaine fête de la Toussaint... »
finale.4=La Toussaint. Le premier novembre 1307. Pas trois semaines après les avoir tous fait arrêter.
finale.5=Il n'a jamais eu l'intention de payer. Il a fait arrêter ses créanciers à la place.
finale.6=LE CHAT. Des factures impayées de sept cents ans ! C'est un trésor ? Votez maintenant !
finale.7=Ce n'est pas un trésor, senhor. C'est une pièce à conviction. Et elle appartient au couvent.
finale.8=Gardez-la. Du papier. Sept cents ans pour un coffre de reconnaissances de dettes.
finale.9=Mon grand-père aurait ri. Bonsoir, Madame Vogt.
finale.10=L'or se fond. Une dette écrite de deux mains, non.
finale.11=C'est beau. Qui a dit ça ?
finale.12=Un trésorier templier, la nuit avant les arrestations. Du moins, c'est ce que j'aime à penser.
finale.13=Les deux moitiés iront aux archives. Paris et Lisbonne, une chacune, et des copies côte à côte. Comme il se doit pour un chirographe.
finale.14=Maria ! MARIA ! La vidéo ! Deux millions de vues !
finale.15=Deux millions ? Pour des reconnaissances de dettes de sept cents ans ?
finale.16=Pour Jacques. Il est en tendance.
finale.17=...Évidemment.
card.finale=Le compte est réglé.|Avec sept cents ans de retard, et seulement sur le papier. Comme la plupart des comptes avec les rois.
finale.chest=C'est Hélène qui doit le voir, pas le coffre.
finale.ines=Je vous crois, menina. C'est Madame qu'il faut convaincre.
finale.kev=Je peux le filmer ? ...Pour les archives ?
ines-cloister.talk.1=Dona Inês, ça va ?
ines-cloister.talk.2=Trente et un ans, menina, et personne n'avait jamais creusé mon cloître. J'ai besoin d'un café. Après.
kev-cloister.talk.1=Kev, filme le coffre, pas moi.
kev-cloister.talk.2=Le coffre, c'est ennuyeux, Maria. Le chat veut le pigeon.
pigeon-cloister.look=Le pigeon, très fier de lui. Il est sur deux millions de téléphones maintenant.
phone.archive=Pas de réseau. Ces murs font deux mètres d'épaisseur. Les Templiers auraient apprécié.
