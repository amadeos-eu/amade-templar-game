dialog.controls.text=<b>Bouton gauche</b> : marcher, utiliser, parler, passer une porte.<br><b>Bouton droit</b> : regarder quelque chose.<br><br>Pointeur en haut de l'écran : l'inventaire. Cliquez sur un objet pour le prendre en main, puis sur quelque chose dans la pièce pour l'y utiliser, ou sur un autre objet pour les assembler. Le bouton droit le repose.<br><br><b>N</b> : le carnet de Maria, ce qu'il faut faire ensuite ; encore N pour un indice.<br><b>Échap</b> ou <b>.</b> : passer une réplique.<br><b>F5</b> : enregistrer, <b>F9</b> : reprendre la partie enregistrée. Le jeu s'enregistre aussi tout seul dans chaque nouvelle pièce.<br><b>F11</b> : plein écran.
dialog.about.text=Un jeu d'aventure point-and-click : une restauratrice de livres à Paris trouve une page cachée dans la reliure d'un psautier médiéval, et la suit jusqu'à la nuit qui précéda l'arrestation des Templiers.
dialog.about.history=L'histoire de ce jeu est vraie : les arrestations du 13 octobre 1307, les dettes du roi, le Temple de Paris, le sceau aux deux chevaliers sur un seul cheval, l'ordre du Christ à Tomar. Maria, Aimery, les frères Gérard, Raoul et Étienne, Hélène, Dona Inês, la page et le coffre sont inventés ; les légendes sont appelées légendes.

