workshop.intro.1=Último trabajo del día: el salterio del viejo barrio del Temple. Hacia 1300, París, reencuadernado una vez, y mal.
workshop.intro.2=Monsieur Lefort lo quiere terminado mañana. Monsieur Lefort lo quiere todo terminado mañana.
window.look=Los tejados del Marais. Por allí, en algún lugar, se alzaba el Temple.
window.use=Está sellada con pintura desde antes de que yo naciera.
pigeon.look=Otra vez esa paloma. Se posa ahí todas las tardes y me mira trabajar.
pigeon.use=Fuera. ...Le da igual.
engraving.look=Un grabado antiguo de la torre del Temple de París. Derribada en 1808.
engraving.use=Está torcido. Lleva cuarenta años torcido, dice Lefort. Se queda torcido.
shelves.look=Libros que me esperan. Algunos esperan desde el restaurador anterior.
shelves.use=Un trabajo cada vez.
coat.look=Mi abrigo y mi bufanda.
coat.coin=Dos euros en el bolsillo. Suficiente para la máquina de café.
coat.empty=Solo un billete de autobús y un cabo de lápiz.
door.look=La puerta de la sala de lectura.
door.not-yet=No antes de terminar el salterio. Lo prometí.
bench.look=Mi mesa de trabajo. El único sitio ordenado del edificio.
bench.use=No va a restaurar nada por sí sola.
press.look=Una prensa de libros de hierro fundido, más vieja que el catálogo de la biblioteca.
press.use=No hay nada que prensar.
books.look=Esperando a que los reparen. Con paciencia, como hacen los libros.
books.use=Luego. Mucho luego.
lamp.look=Mi lámpara de mesa. Sin ella trabajaría a la luz de una vela, como los monjes.
lamp.use=Está encendida. Se queda encendida.
jar.look=Agua destilada. Para una restauradora, casi agua bendita.
jar.use=Prefiero no bebérmela.
gluepot.look=Engrudo de almidón de trigo. Se puede quitar, si se tiene cuidado: de eso se trata.
gluepot.use=Todavía no. Primero hay que separar.
mug.look=Mi café. Frío. Y no del gusto de Lefort: él lo toma solo, en su propia taza.
mug.use=Frío. Hay cosas que no se pueden restaurar.
psalter.look.1=Un salterio, hacia 1300. Las oraciones de la semana, un calendario de fiestas de santos.
psalter.look.2=La contraguarda de la tapa delantera está abombada, como si hubiera algo debajo.
psalter.look.after=La contraguarda está levantada. Debajo, un hueco en la tapa, justo del tamaño de la página doblada.
psalter.use=El engrudo tiene setecientos años y está seco como una piedra. Sin humedad rompería el papel.
psalter.use.after=Mañana lo vuelvo a cerrar. Esta vez, bien.
psalter.damp=Un poco de agua, un poco de paciencia... Ya. El engrudo viejo se ablanda.
flap.look=La contraguarda levantada. Quien la pegó tenía prisa.
brush.take=El pincel de engrudo.
brush.damp=Mojado en agua destilada. Húmedo, no empapado.
brush.dry=Un pincel seco no ablanda nada.
bonefolder.take=Mi plegadera.
bonefolder.dry=En seco se rompería. Primero tengo que ablandar el engrudo.
discover.1=Despacio... despacio... Hay algo debajo. ¡Pergamino doblado!
discover.2=Alguien abrió esta encuadernación antes que yo. Hace siglos.
discover.3=Y quien fuera, escondió esto con prisa. Lefort tiene que verlo.
page.psalter=Se queda fuera hasta que sepa qué es.
coin.coat=Está bien donde está. En mi mano.
goal.10=Terminar el salterio antiguo: esta noche se desmonta su encuadernación.
hint.10=Mira bien el salterio de la mesa de trabajo.
goal.11=Despegar la vieja contraguarda del salterio sin romperla.
hint.11=El engrudo viejo se ablanda con un poco de agua. El pincel de engrudo y el tarro de agua están en la mesa.
goal.12=Levantar la contraguarda ablandada.
hint.12=Usa la plegadera con el salterio.
goal.13=Enseñar la página a monsieur Lefort en la sala de lectura.
hint.13=La puerta de la sala de lectura está junto a mi abrigo.

# ---- la sala de lectura ----
name.lefort=Monsieur Lefort
name.machine=máquina de café
name.rack=escurridor de tazas
name.lefort-cup=taza desportillada
name.bookcase=librería
name.ladder=escalera de biblioteca
name.tall-window=ventana
name.clock=reloj
name.reading-table=mesa de lectura
name.desk=escritorio de Lefort
name.ledger-tables=tablas de conversión
name.atelier=puerta del taller
name.street=salida a la calle
dialog.bye=Buenas noches, monsieur Lefort.
lefort.hello.1=Madame Vogt. Son las ocho menos diez. La biblioteca cerró a las seis.
lefort.hello.2=Monsieur Lefort, he encontrado algo en el salterio.
lefort.hello.3=Non. Sea lo que sea, puede esperar a mañana. Todo puede esperar a mañana.
lefort.look=Monsieur Lefort, archivero. Sesenta y cuatro años, cuarenta de ellos en esta sala. Primero dice "Non" y después ayuda.
lefort.q.page=Por favor, mire solo esta página.
lefort.page.1=Estaba debajo de la contraguarda. Latín, números y un sello.
lefort.page.2=Non... Dos caballeros en un solo caballo. Mon Dieu. Es el sello del Temple.
lefort.page.3=Y mire el borde superior: CHIRO... cortado. Un quirógrafo. El mismo texto escrito dos veces en una piel y cortado por la mitad; cada parte guarda una mitad. Quien tiene la otra mitad tiene la prueba.
lefort.page.4=¿Y qué dice?
lefort.page.5=Madame, después de diez horas en este edificio no puedo leer ni un billete de autobús. No antes de mi café.
lefort.q.coffee=¿Por qué no se toma un café?
lefort.coffee.1=La máquina está justo ahí. ¿Por qué no se toma un café?
lefort.coffee.2=Porque esa máquina y yo no nos hablamos. Quiere monedas. Yo tengo tarjeta. Y no da vasos.
lefort.coffee.3=Solo, en mi propia taza. La de la franja azul. Todo lo demás es agua de fregar.
lefort.q.give=Su café, monsieur. Solo, en su propia taza.
lefort.give.1=...Madame Vogt, es usted una persona terrible y se lo agradezco.
lefort.give.2=Bien. "París, en la casa del Temple... el señor rey de Francia debe a los hermanos..." Son las deudas del rey, en libras tornesas.
lefort.give.3=Sellado por el tesorero del Temple. Y aquí, el hermano Gérard. El hermano Gérard, de la casa de París.
lefort.give.4=¿Los templarios prestaban dinero al rey?
lefort.give.5=Durante cien años los reyes de Francia guardaron su tesoro en el Temple, aquí en París. Los templarios eran sus banqueros.
lefort.give.6=El total está en dineros. Así que: ¿cuántos dineros son una libra? Mis tablas de conversión están en el escritorio, si las necesita.
lefort.q.sum=Sobre esa suma en dineros...
lefort.sum.again=Un pequeño reino, madame. Debido por un rey al que le gustaba arrestar a sus acreedores.
sum.12=Doce.
sum.20=Veinte.
sum.240=Doscientos cuarenta.
sum.later=Deme un momento.
sum.answer.12=¿Doce dineros la libra?
sum.answer.20=¿Veinte?
sum.answer.240=Doscientos cuarenta: doce dineros el sueldo, veinte sueldos la libra.
sum.wrong=Non, non. Mire las tablas, madame. Llevan esperando ahí desde 1952.
sum.later.answer=Tómese su tiempo. El rey lo debe desde hace setecientos años.
sum.right.1=Exacto. Entonces esto es... más de lo que la Corona recaudaba en impuestos en un año entero. Un pequeño reino.
sum.right.2=Y pocos días después, el rey hizo arrestar a todos los templarios de Francia. A todos la misma mañana.
sum.right.3=Viernes, trece de octubre de 1307. ¿Quién arresta a su banco? Alguien que no quiere devolver el dinero.
lefort.q.history=¿Quiénes eran realmente los templarios?
lefort.history.1=¿Quiénes eran realmente los templarios? Kev, en internet, dice que encontraron el Santo Grial.
lefort.history.2=Kev, en internet, dice muchas cosas. Unos pocos caballeros en Jerusalén hacia 1120, que juraron proteger a los peregrinos en el camino.
lefort.history.3=En un siglo: casas por toda Europa, barcos, granjas y las cámaras más seguras de la cristiandad. Un peregrino pagaba en París y cobraba en Acre, con una carta.
lefort.history.4=Monjes, soldados y banqueros. Esa última parte fue la que los mató.
lefort.q.friday=¿Qué les pasó después de los arrestos?
lefort.friday.1=Tortura, confesiones falsas, un proceso que duró años. En 1312 el papa disolvió la orden.
lefort.friday.2=En marzo de 1314, el último gran maestre, Jacques de Molay, fue quemado en una pequeña isla del Sena, junto al Pont Neuf. Hoy hay allí una placa.
lefort.friday.3=¿Y el dinero?
lefort.friday.4=La mayoría de sus tierras pasaron a los hospitalarios. El tesoro del que hablan las historias nunca se encontró. Quizá porque estaba sobre todo escrito en pergamino.
lefort.q.temple=¿Dónde estaba exactamente el Temple?
lefort.temple.1=A cinco minutos de aquí. El recinto de los templarios era una pequeña ciudad en sí mismo, con una torre como la torre del homenaje de un castillo.
lefort.temple.2=Napoleón mandó derribar la torre en 1808. Hoy es una plaza con un parque infantil: el Square du Temple.
lefort.temple.3=Entonces allí voy. El salterio venía de ese barrio.
lefort.bye=Bonne nuit. Y cierre la puerta; la corriente me va directa a las rodillas.
machine.look=Una máquina de café de los años ochenta. "PIÈCES SEULEMENT": solo monedas. Y sin vasos.
machine.no-cup=Da café, pero no vasos. Primero necesitaría una taza.
machine.no-coin="Pièces seulement". Quiere una moneda.
machine.coffee=Gruñe, escupe, da café. Solo. En la propia taza de Lefort.
rack.look=Un escurridor con tazas lavadas. Una tiene una franja azul y el borde desportillado.
rack.use=Las tazas están limpias. Casi todas.
lefort-cup.look=Blanca con una franja azul y el borde desportillado. Tiene que ser la de Lefort.
lefort-cup.take=La taza de Lefort. Si me pilla con ella, más vale que tenga café dentro.
bookcase.look=Registros parroquiales, libros de tierras, la historia de cada calle del Marais. Diez metros de estantes.
bookcase.use=Ahora no. Si empiezo a leer, al amanecer seguiré aquí.
ladder.look=Una escalera de biblioteca sobre rieles de latón. Chirría; Lefort la oye desde cualquier parte del edificio.
ladder.use=No necesito nada de ahí arriba.
tall-window.look=Se encienden las farolas. El cielo sobre el Marais se vuelve violeta.
tall-window.use=Sellada con pintura hacia 1950.
clock.look=Las ocho menos diez. La biblioteca cerró hace dos horas.
clock.use=Va en hora. Lefort le da cuerda cada lunes.
reading-table.look=Dos puestos de lectura, libros abiertos, lámparas verdes. Lefort los deja así para los lectores de mañana.
reading-table.use=No me toca a mí cerrarlos.
desk.look=El escritorio de Lefort: cuero verde, un teléfono de disco, pilas de papeles que solo él entiende.
desk.use=Nadie toca el escritorio de Lefort. Nadie.
ledger-tables.look=Viejas tablas de conversión de moneda medieval: una libra tornesa = 20 sueldos, un sueldo = 12 dineros.
ledger-tables.use=Mírelas cuanto quiera, madame, pero no las mueva.
atelier.look=La puerta de mi taller.
street.look=La salida a la calle. Fuera está oscureciendo.
street.not-yet=Primero quiero saber qué dice esta página.
goal.20=Enseñar la página a monsieur Lefort.
hint.20=Habla con Lefort, en su escritorio.
goal.21=Llevarle su café a Lefort: solo, en su propia taza.
hint.21=Su taza está en el escurridor junto a la máquina de café. La máquina acepta monedas, como la del bolsillo de mi abrigo.
goal.22=Hacer la cuenta: ¿cuántos dineros son una libra?
hint.22=Las tablas de conversión están en el escritorio de Lefort. Después habla otra vez con él.
goal.23=Ir al Square du Temple, donde antes estaba el Temple.
hint.23=La salida a la calle está a la derecha de la sala de lectura.

# ---- el Square du Temple ----
name.houses=casas del Marais
name.railing=verja
name.playground=parque infantil
name.board=panel informativo
name.lamppost=farola
name.kev-sandwich=bocadillo de Kev
name.half-sandwich=medio bocadillo
name.metro=estación de metro Temple
name.marais=volver a la biblioteca
name.kev=Kev
name.helene=mujer elegante
name.pigeon=paloma
square.intro.1=El Square du Temple. Durante quinientos años aquí estuvo el recinto de los templarios, con murallas, iglesia, torre y todo.
square.intro.2=Hoy: castaños, un parque infantil y un hombre hablándole a su móvil.
houses.look=El Marais al anochecer. En el siglo trece todo esto era tierra de los templarios; se la arrendaban a artesanos.
houses.use=No conozco a nadie ahí arriba.
railing.look=Una verja de hierro fundido del siglo diecinueve, cuando se trazó la plaza.
railing.use=Todo lo que necesito está a este lado.
playground.look=Un tobogán y una estructura para trepar. Los niños juegan donde el gran maestre tenía sus aposentos.
playground.use=Soy un poco mayor y estoy un poco ocupada.
lamppost.look=Las farolas se encienden, una a una.
lamppost.use=Está caliente. Algo es algo.
bench.square.look=Un banco verde. La cena de Kev espera encima.
bench.square.use=No hay tiempo para sentarse.
kev-sandwich.look=Jamón, lechuga, tomate, media baguette. El de Kev.
kev-sandwich.use=Es la cena de Kev. Soy restauradora, no ladrona.
half-sandwich.look=Medio bocadillo en la grava. La paloma se llevó la otra mitad.
half-sandwich.take=Medio bocadillo. Probado por una paloma. Nunca se sabe.
board.look.1=Un grabado antiguo: la torre del Temple, una torre cuadrada con cuatro torrecillas en las esquinas. "Derribada en 1808."
board.look.2=Y el plano: la iglesia, la torre, el claustro... y la biblioteca, justo donde ahora está el parque infantil.
board.look.3=El salterio venía de esta biblioteca. Alguien escondió la página en él en 1307. Aquí.
helene.hello=¿Madame Vogt? Qué tarde tan encantadora para la historia.
helene.look=Abrigo de camello, un bolso rojo, pendientes que valen mi sueldo de un año. Huele a dinero y a papel viejo.
helene.q.who=¿Quién es usted?
helene.who.1=Hélène de Vaucresson. Colecciono. Cosas antiguas, cosas raras, documentos.
helene.who.2=Mi familia colecciona desde antes de la Revolución. Somos... minuciosos.
helene.q.how=¿Cómo sabe mi nombre?
helene.how.1=Su monsieur Lefort llamó hace una hora a un viejo amigo de los Archives nationales. Estaba muy emocionado.
helene.how.2=París es un pueblo, madame Vogt. Y yo soy muy buena vecina.
helene.q.offer=¿Qué quiere?
helene.offer.1=La página. Cincuenta mil euros, esta noche, en efectivo. Sin preguntas, sin papeles.
helene.offer.2=Pertenece a la biblioteca. Y a la historia.
helene.offer.3=La historia pertenece a quien mejor la guarda. Piénselo.
helene.q.no=No está en venta.
helene.no.1=No está en venta. Buenas noches, madame.
helene.no.2=Todo está en venta. Solo cambia el precio. Bonne soirée.
helene.page=Le encantaría. No.
kev.look="Kev el Cazatesoros": sudadera con capucha, palo de selfi, una voz para un público de miles. Está en directo, al parecer.
kev.q.who=¿Con quién habla?
kev.who.1=¡Con mis seguidores! ¡Kev el Cazatesoros, en directo desde el corazón de los templarios! Ochenta mil, y todos mirando.
kev.who.2=Esta noche encontramos el oro. O al menos las pistas del oro. O al menos clics.
kev.who.3=Buena suerte.
kev.q.templars=¿Qué sabe de los templarios?
kev.templars.1=¡Escondieron su oro en nueve lugares, cifrado con la clave templaria!
kev.templars.2=Esa clave no aparece en ni un solo documento medieval.
kev.templars.3=Exacto. Así de bien sabían esconderla.
kev.q.curse=¿Y el gran maestre?
kev.curse.1=¡Jacques de Molay! Quemado vivo en París en 1314. ¡Y desde las llamas maldijo al rey y al papa!
kev.curse.2=¡Los dos muertos ese mismo año! ¿Casualidad? ¡No lo creo!
kev.curse.3=El papa murió en abril de 1314, el rey en noviembre. Los dos estaban enfermos o eran viejos. La gran maldición viene de historias escritas mucho después.
kev.curse.4=Un solo cronista dice solo que Molay pidió a Dios que los juzgara. Es una leyenda, Kev.
kev.curse.5=Leyenda o no, hay una placa donde lo quemaron. En el Pont Neuf, junto a la estatua del rey a caballo.
kev.curse.6=Esa placa es real. Y Lefort también la mencionó. Al Pont Neuf, entonces: línea 7, dos paradas.
kev.q.film=¿Podría grabar el grabado antiguo del panel?
kev.film.1=¡Un grabado! ¡Cosas viejas! A mis seguidores les encantan las cosas viejas. Sujétame el... no, dejo aquí mi bocadillo.
kev.film.2=¡Mirad esto, gente: el verdadero Temple! ¡Dadle a me gusta y suscribíos!
kev.film.3=¡Eh! ¡Mi bocadillo! ¡Fuera! ¡Fuera!
kev.film.4=Puaj. Bueno. "Paloma templaria roba la cena a un cazatesoros". Eso es contenido.
kev.q.bye=Hasta luego, Kev.
kev.bye=¡Suscríbete! ¡Es gratis!
kev.sandwich=La paloma ya lo ha probado. Quédeselo, ahora soy vegetariano. Desde ahora mismo.
kev.page=No le enseño la página a Kev. Ochenta mil seguidores estarían aquí en diez minutos.
pigeon.square.look=Una paloma con un interés profesional por el bocadillo de Kev.
pigeon.coo=Gruuu.
pigeon.square.feed=Ya tuvo su mitad.
metro.look=Estación de metro Temple, línea 3. La línea 7 va al Pont Neuf.
metro.not-yet=¿Adónde iría ahora? Aquí no he terminado.
marais.look=La calle de vuelta a la biblioteca.
goal.30=Averiguar dónde estaba el Temple.
hint.30=Hay un panel informativo a la izquierda de la plaza.
goal.31=Averiguar más sobre los últimos días de los templarios.
hint.31=Kev parece saberlo todo. Puede que algo hasta sea verdad. Pregúntale por el gran maestre.
goal.32=Ir al Pont Neuf, a la placa de Jacques de Molay. Algo me dice que voy a necesitar ese bocadillo.
hint.32=Pídele a Kev que grabe el grabado; su bocadillo está en el banco, y una paloma lo vigila.
goal.33=Ir al Pont Neuf, a la placa de Jacques de Molay.
hint.33=Toma el metro a la derecha de la plaza.

# ---- el Pont Neuf ----
name.far-bank=el Louvre
name.river=el Sena
name.statue=estatua de Enrique IV
name.parapet=pretil
name.wall=pilar de piedra
name.steps=escalera a la isla
name.plaque=placa
name.metro-bridge=estación de metro Pont Neuf
name.driver=hombre grande de traje oscuro
name.guide=guía turística
name.tourist1=turista
name.tourist2=turista
bridge.intro=El Pont Neuf de noche. La placa debe de estar abajo, junto a la escalera. Y hay alguien justo delante.
driver.hello.1=Madame Vogt. Madame de Vaucresson le manda saludos.
driver.hello.2=Me ha seguido.
driver.hello.3=Madame sube su oferta. Sesenta mil. Deme la página y podrá irse a casa.
driver.look=Hombros como un armario, zapatos como espejos. Está entre la placa y yo y no parece que vaya a moverse.
driver.q.who=¿Quién es usted?
driver.who.1=Nadie. Conduzco el coche de Madame.
driver.who.2=Y a veces le llevo cosas. Cosas pequeñas. Páginas, por ejemplo.
driver.q.no=La página se queda conmigo.
driver.no.1=La página se queda conmigo.
driver.no.2=Tengo tiempo, madame. Tengo muchísimo tiempo.
driver.page=Eso es justo lo que quiere.
driver.sandwich=Parece que tiene hambre. Tome, una cena.
driver.pigeons=¿Qué...? ¡Fuera! ¡Fuera de mis zapatos!
guide.look=Una guía turística con un paraguas y una voz hecha para multitudes.
guide.tour.1=¡Y aquí, señoras y señores, la maldición más famosa de la historia!
guide.tour.2=¡Desde las llamas, el gran maestre de los templarios maldijo al rey de Francia! ¡Hasta la decimotercera generación!
guide.tour.3=En realidad, lo quemaron en la islita de ahí abajo; no pasó a formar parte del puente hasta tres siglos después. Y la maldición es una leyenda.
guide.tour.4=¡La señora es historiadora! ¡Un aplauso!
guide.tour.5=¡Mirad, el hombre grande da de comer a las palomas! ¿Podemos hacernos una foto con él?
driver.leave=...En otra ocasión, madame Vogt.
guide.tour.6=¡Y ahora, señoras y señores, a Notre-Dame! ¡Sigan el paraguas!
far-bank.look=El Louvre, con las ventanas iluminadas. En 1307 allí había un castillo real; los hombres del rey tenían poco camino hasta el Temple.
river.look=El Sena, negro y dorado bajo las farolas.
river.use=Está frío y está oscuro. No.
statue.look=Enrique IV en su caballo. Trescientos años después de los templarios. Las palomas están posadas en el pedestal.
statue.use=No llego hasta él y no me ayudaría.
statue.sandwich=Desde aquí nunca lo verían. Tendrían que venir hacia mí.
parapet.look=El puente más antiguo de París, terminado en 1607. Viejo para París; joven para los templarios.
parapet.use=No me asomo. No con lo que llevo en el bolso.
bridge-lamp.look=Los faroles del Pont Neuf. Bajo ellos todo parece un grabado antiguo.
bridge-lamp.use=Caliente, al menos.
wall.look=El pilar de piedra sobre la escalera que baja a la isla.
wall.use=Sólido. Cuatrocientos años de solidez.
steps.look=La escalera que baja al pequeño jardín de la punta de la isla. Allí estuvo la hoguera.
steps.use=De noche está cerrado, y puedo leer la placa desde aquí arriba.
plaque.blocked=El chófer de Hélène está justo delante.
plaque.look.1="En este lugar Jacques de Molay, último gran maestre de la Orden del Temple, fue quemado el 18 de marzo de 1314."
plaque.look.2=Siete años después de los arrestos. Siete años de prisión, y luego esto.
plaque.look.3=El dieciocho de marzo... El salterio tiene un calendario de fiestas de santos. Y esta mañana fotografié todas sus páginas.
phone.plaque.early=Primero quiero leer la placa.
calendar.1=Marzo... el dieciocho. Hay una nota en el margen. Diminuta, en tinta marrón, de una mano posterior.
calendar.2="Rupella. Ad navem." Rupella es La Rochelle. "Al barco."
calendar.3=Alguien marcó el día de la muerte de Molay y anotó adónde había ido algo: a un barco, en La Rochelle.
calendar.4=La otra mitad del quirógrafo. Tiene que serlo.
card.act1.end=Fin del primer acto|"Rupella. Ad navem." La pista lleva a La Rochelle.
goal.40=Llegar a la placa de Jacques de Molay. El chófer está en medio.
hint.40=El chófer no se moverá con palabras. Pero las palomas de la estatua tienen hambre, y yo tengo medio bocadillo.
goal.41=Leer la placa y comparar la fecha con mis fotos del calendario del salterio.
hint.41=Usa el móvil con la placa.
name.swarm=palomas
swarm.look=Todas las palomas del Pont Neuf, y todas sobre sus zapatos.
name.bridge-lamp=farol

# ---- el prólogo: el Temple de París, 12 de octubre de 1307 ----
item.ledger=página de cuentas
item.key=llave de hierro
item.seal=sello
item.wax=barra de lacre
item.soft-wax=lacre blando
item.cheese=trozo de queso
item.knife=cortaplumas
item.glue=bote de cola
card.1307=París, 12 de octubre de 1307|La casa de los caballeros templarios, de noche
card.arrest=Viernes, 13 de octubre de 1307|Al amanecer, los hombres del rey arrestaron a todos los templarios de Francia. El salterio se quedó en su atril.
ledger.look=La última página de las cuentas del Temple con la Corona: lo que el rey Felipe debe a la orden, hasta el último dinero. Una mitad de un quirógrafo.
ledger.look.sealed=La página, doblada y sellada con los dos caballeros en un solo caballo.
key.look=La llave del arcón del tesorero. Al hermano Gérard le temblaba la mano cuando me la dio.
seal.look=El sello de la orden: dos caballeros montando un solo caballo. Pobreza, dicen. Y hermandad.
wax.look=Una barra de lacre rojo. Dura como el hueso.
soft-wax.look=Caliente y blando. Rápido, antes de que se endurezca.
cheese.look=Un trozo del queso del hermano Gérard. Huele lo bastante fuerte como para despertar a los muertos.
cheese.use=No tengo hambre. Otro quizá sí.
knife.look=El cortaplumas del copista. Lo bastante afilado para cortar pergamino.
glue.look=Cola de piel, aún caliente de la estufa. El copista también trabajaba hasta tarde.
seal.hardwax=El lacre está demasiado duro. Hay que calentarlo primero.
name.gerard=Hermano Gérard
name.lancet=ventana
name.banner=estandarte
name.book-stand=atril de lectura
name.chest=arcón
name.chest-open=arcón abierto
name.table=mesa
name.accounts=libros de cuentas
name.candles=velas
name.supper=cena del hermano Gérard
name.wax-stick=lacre
name.courtyard-door=puerta al patio
gerard.intro.1=Aimery. Cierra la puerta detrás de ti. Sin ruido.
gerard.intro.2=¿Hermano Gérard? Hace mucho que pasaron las completas.
gerard.intro.3=Los hombres del rey llevan toda la semana haciendo preguntas. Esta noche he oído que llevan cartas selladas, para abrirlas en todas partes a la misma hora.
gerard.intro.4=Toma esto: la última página de nuestras cuentas con la Corona. Lo que el rey nos debe, hasta el último dinero.
gerard.intro.5=Tiene que salir del Temple esta noche, con el sello del tesorero. El sello está en el arcón. Aquí tienes la llave.
gerard.look=El hermano Gérard, guardián de las cuentas. Treinta años en el Temple. Nunca lo había visto con miedo.
gerard.q.why=¿Por qué precisamente esta página?
gerard.why.1=¿Por qué esta página, hermano? ¿Por qué no el oro?
gerard.why.2=El oro se puede fundir, Aimery. Una deuda escrita por dos manos, no.
gerard.why.3=Es un quirógrafo: una mitad se queda con nosotros, la otra ya va camino de la costa. Quien tenga las dos tiene la deuda del rey.
gerard.q.king=¿Por qué iba el rey a actuar contra nosotros?
gerard.king.1=El rey Felipe debe más de lo que puede pagar. Cuando ocurrió antes, arrestó a los banqueros lombardos y se quedó con su dinero. El año pasado expulsó a los judíos y se quedó con todo lo que tenían.
gerard.king.2=Él lo llama justicia. Yo lo llamo contabilidad.
gerard.q.how=¿Cómo la sello?
gerard.how=Calienta el lacre en una vela, ponlo sobre el pliegue y aprieta el sello mientras esté blando.
gerard.q.where=¿Adónde la llevo?
gerard.where.1=Sal por el patio y la puerta. El hermano Raoul guarda la puerta esta noche y querrá saber por qué.
gerard.where.2=No se lo digas. Raoul es un buen hermano, pero lento.
gerard.q.bye=Dios os guarde, hermano.
gerard.bye=Y a ti, hijo. Ve.
lancet.look=La luna sobre París. En algún lugar ahí fuera, los hombres del rey esperan la mañana.
lancet.use=Demasiado estrecha para pasar. Los templarios construían bien.
banner.look=El Beauséant: negro y blanco, el estandarte de la orden. Negro para nuestros enemigos, blanco para nuestros amigos, dicen.
banner.use=Nadie toca el estandarte.
book-stand.look=El libro diario del tesorero. Rentas del Marais, vino de Brie, un préstamo a un obispo.
book-stand.use=Ahora no.
chest.look=El arcón del tesorero, reforzado con hierro. Cerrado con llave.
chest.locked=Cerrado con llave. El hermano Gérard tiene la llave... no, la tengo yo.
chest.open=El sello de la orden, en su bolsa de cuero.
chest-open.look=Solo quedan recibos. Recibos y polvo.
table.look=La mesa del tesorero: libros de cuentas, tinta, velas. Y la cena del hermano Gérard, sin tocar.
table.use=Todo lo que hay encima tiene su sitio. El hermano Gérard lo notaría.
accounts.look=Columnas de números romanos. Libras, sueldos y dineros.
accounts.use=No puedo llevarme todo el tesoro.
candles.look=Dos buenas velas de cera. El hermano Gérard no escatima en luz.
candles.use=Mejor no quemar nada más esta noche.
wax.soften=El lacre se ablanda en la llama.
ledger.candle=¿Quemar la deuda del rey? Algunos pagarían por eso. No.
supper.look=Pan, una jarra de vino y un trozo de queso que se huele desde la puerta.
supper.take=Esta noche no va a comer. Y el queso puede servir.
wax-stick.look=Una barra de lacre rojo.
wax-stick.take=Lacre rojo, para el sello.
wax.hard=El lacre está duro como una piedra. Hay que calentarlo.
ledger.waxed=Una gota de lacre blando en el pliegue. ¡Ahora el sello, rápido!
seal.nowax=Primero necesito lacre en la página. Lacre blando.
seal.done=Dos caballeros en un solo caballo. Sellado.
seal.gerard.1=Bien. Ahora nadie podrá decir que se escribió ayer.
seal.gerard.2=Ve, Aimery. Sal por la puerta. Y no mires atrás.
seal.softwax=Primero el lacre en la página, luego el sello en el lacre. No al revés.
door.unsealed=¡Sin sellar no, Aimery! Séllala primero.
name.tower=gran torre
name.cloister=claustro
name.moon=luna
name.well=pozo
name.torch=antorcha
name.gate=portón
name.library=puerta de la biblioteca
name.chapter=cámara del tesorero
name.guard=Hermano Raoul
name.cat=gata
courtyard.intro=El patio. El portón está cerrado, y el hermano Raoul lo vigila. Despierto, por una vez.
tower.look=La gran torre del Temple. El tesoro del rey de Francia estuvo en ella cien años.
tower.use=De noche está cerrada. Incluso para mí.
cloister.look=La galería del claustro. Los hermanos duermen, o rezan.
cloister.use=No hay tiempo para el claustro.
moon.look=Luna llena. Mala noche para secretos.
well.look=El pozo del Temple. Agua dulce, dicen, la mejor de París.
well.use=No tengo sed. Tengo miedo.
torch.look=Una antorcha junto al portón. A Raoul le gusta ver quién viene.
torch.use=Solo me quemaría los dedos.
guard.look=El hermano Raoul, un sargento de la orden. Grande, leal y no muy rápido.
guard.q.open=Abre el portón, hermano Raoul.
guard.open.1=Abre el portón, hermano Raoul. Tengo un encargo del hermano Gérard.
guard.open.2=Nadie sale antes de prima. Órdenes del mariscal. Ni siquiera tú, escudero.
guard.q.cat=¿Esa es la gata del establo, junto al pozo?
guard.cat.1=¡Esa bestia! La semana pasada me robó la cena, delante de mis narices. Con queso y todo.
guard.cat.2=Si vuelvo a pillarla cerca de mi portón, la persigo hasta Saint-Denis.
guard.q.bye=Buenas noches, hermano.
guard.bye=Buenas noches. Y vete a dormir.
guard.block=Nadie sale antes de prima, escudero.
cat.look=La gata del establo. Gris, llena de cicatrices y siempre hambrienta.
cat.mew=Mrrau.
cat.talk=Quiere algo. Comida, seguramente. Siempre es comida.
cheese.cat=Se lo comería aquí y volvería a dormirse. La quiero allí, junto al portón.
cheese.throw=Uy. Hermano Raoul, se me ha caído tu cena... quiero decir, la cena del hermano Gérard.
guard.sees.1=¡Tú! ¡Ladrona de queso! ¡Ven aquí!
guard.sees.2=¡Esta vez te atrapo!
ledger.guard=El hermano Raoul no necesita saber nada de esto.
gate.look=El gran portón a la Rue du Temple. Atrancado de noche.
gate.1=La tranca pesa... Hay antorchas fuera. Docenas. Y lises en sus sobrevestas.
gate.2=¡En nombre del rey! ¡Abrid el portón!
gate.3=Los hombres del rey. Ya. Por aquí nunca saldré.
gate.4=La biblioteca. Nadie buscará una página entre libros.
gate.soldiers=Están justo fuera. Nunca pasaré.
library-door.look=La puerta de la biblioteca, bajo la gran torre.
library-door.not-yet=Ahora no. El hermano Gérard quiere la página fuera del Temple esta noche.
chapter-door.look=El camino de vuelta a la cámara del tesorero.
chapter-door.barred=No hay vuelta atrás. Los hermanos están atrancando las puertas.
name.cupboard=armario de libros
name.library-window=ventana
name.chests=arcas de libros
name.copy-desk=pupitre del copista
name.copy-knife=cortaplumas
name.glue-pot=bote de cola
name.candle=vela
name.lectern=atril
name.temple-psalter=salterio
name.library-exit=puerta al patio
name.soldier=hombre del rey
name.soldier2=hombre del rey
library.intro.1=La biblioteca. A los libros no los arrestan.
library.intro.2=Si escondo bien la página, podrá esperar aquí tiempos mejores. Lo que haga falta.
cupboard.look=Libros encadenados a sus estantes: la Biblia, la Regla de la orden, una crónica de Tierra Santa.
cupboard.use=Encadenados. Nadie se lleva estos libros. De eso se trata.
library-window.look=Luz de antorchas en la calle de abajo. Están rodeando el Temple.
library-window.use=Demasiado alta, demasiado estrecha y demasiados soldados.
chests.look=Arcas de cartas y escrituras. Lo primero que registrarán.
chests.use=Cartas. Los escribanos del rey las leerán todas.
chests.ledger=Es el primer sitio donde mirarán.
copy-desk.look=El pupitre del copista. Trabajaba hasta tarde: el bote de cola aún está caliente.
copy-desk.use=No soy copista.
copy-knife.look=Un cortaplumas para afilar plumas y cortar pergamino.
copy-knife.take=El cortaplumas del copista.
glue-pot.look=Un bote de cola de piel, aún caliente.
glue-pot.take=El bote de cola. Caliente. Bien.
library-candle.look=Una vela en un soporte de hierro, junto al atril.
lectern.look=El atril con el salterio con el que cantan los hermanos.
temple-psalter.look.1=Un salterio nuevo, el orgullo de los hermanos. Las oraciones de la semana y un calendario de los santos.
temple-psalter.look.2=El interior de la tapa está forrado con pergamino pegado. Si lo despego por el borde, habría sitio debajo.
temple-psalter.open=La contraguarda está suelta. Hay sitio debajo.
temple-psalter.cut=Con cuidado, por el borde... La contraguarda se suelta.
temple-psalter.no-room=Debajo de la contraguarda estaría bien. Pero está pegada.
temple-psalter.hidden=La página cabe debajo. Doblada dos veces, con sello y todo.
temple-psalter.no-glue=Todavía no hay nada que pegar.
temple-psalter.glued=Cola, presionar, alisar... Nadie lo sabrá nunca.
temple-psalter.done=Parece que nadie lo hubiera tocado jamás.
library.soldier.1=¡Allí! ¡Un escudero, en la biblioteca! ¡Prendedlo!
library.aimery.1=Perdonadme, hermano Gérard. La página está a salvo.
library.soldier.2=Por orden del rey, quedas arrestado.
soldier.look=Un soldado del rey, con las lises de Francia en la sobrevesta.
library-exit.look=La puerta al patio.
library-exit.no=Ahí fuera están los hombres del rey. Aquí dentro está el salterio.
goal.1=El hermano Gérard me dio la página y la llave del arcón. La página tiene que llevar el sello del tesorero.
hint.1=El arcón está a la derecha. Usa la llave con él.
goal.2=Sellar la página: lacre blando en el pliegue, luego el sello.
hint.2=Coge el lacre de la mesa y caliéntalo en las velas. Pon el lacre blando en la página y luego usa el sello con la página.
goal.3=Sacar la página del Temple, por el patio y el portón.
hint.3=La puerta al patio está a la izquierda. El hermano Raoul guarda el portón; habla con él.
goal.4=Alejar al hermano Raoul del portón.
hint.4=Raoul odia a la gata del establo, y a la gata le encanta el queso. La cena del hermano Gérard está en la mesa de la cámara.
goal.5=Abrir el portón.
hint.5=El portón está a la derecha.
goal.6=Esconder la página en la biblioteca.
hint.6=La puerta de la biblioteca está bajo la gran torre.
goal.7=Encontrar un escondite para la página en la biblioteca.
hint.7=Mira el salterio del atril. El cortaplumas del copista está en el pupitre.
goal.8=Poner la página bajo la contraguarda.
hint.8=Usa la página con el salterio.
goal.9=Volver a pegar la contraguarda.
hint.9=El bote de cola está en el pupitre del copista.

# ---- flashback 1: la calle del Temple, al alba del 13 de octubre de 1307 ----
card.cart=Rue du Temple, 13 de octubre de 1307|Al alba, ante la puerta del Temple
name.dawn=cielo del alba
name.temple-tower=gran torre
name.temple-gate=puerta del Temple
name.street-houses=casas
name.bars=barrotes del carro
name.wheel=rueda
name.cabbages=carretilla de coles
name.gerard-cart=hermano Gérard
name.soldier-cart=hombre del rey
name.raoul=carretero

cart.intro.1=Nos han llevado a todos. Al mariscal, a los cocineros, hasta al viejo hermano Hugues, que ya no oye ni una palabra.
cart.intro.2=Valor, muchacho. ¿Lo escondiste?
cart.intro.3=En la biblioteca, hermano. En un salterio. Nadie mira dentro de un salterio.
cart.intro.4=Bien. Pero alguien fuera de estos barrotes tiene que saber dónde está, o esperará allí para siempre.
cart.intro.5=Ese carretero de las coles... ¡es el hermano Raoul! Estaba persiguiendo al gato cuando llegaron. ¡Se escapó!
cart.intro.6=Si le grito en francés, el hombre del rey oirá cada palabra.
goal.50=Decirle al hermano Raoul dónde está escondida la página, sin que el hombre del rey se dé cuenta.
hint.50=El hermano Gérard siempre sabe qué hacer. Le preguntaré cómo hablar con Raoul.
goal.51=Cantarle el mensaje a Raoul, en latín, como si fuera una oración.
hint.51=Hablar ahora con Raoul. Cada verso del salmo tiene que estar en latín y llevar el mensaje.
goal.52=Raoul lo sabe.
hint.52=Aquí ya no queda nada por hacer.

dawn.look=El sol aún no ha salido. Los hombres del rey vinieron a oscuras, como si les diera vergüenza.
temple-tower.look=La gran torre. Ayer, el lugar más seguro de Francia. Hoy, una cárcel.
temple-tower.use=Está lejos, y yo estoy en una jaula.
temple-gate.look=Nuestra puerta, bajo los lirios del rey. Colgaron su estandarte mientras todavía nos ataban.
temple-gate.use=No llego. Y ahora la usan los hombres del rey.
cart-houses.look=Todas las contraventanas están cerradas. París finge que duerme.
cart-houses.use=Esta mañana nadie le abrirá una contraventana a un templario.
bars.look=Barrotes de roble, clavos de hierro. Alguien construyó este carro para gente como nosotros mucho antes de hoy.
bars.use=No se mueven. Ya me lo imaginaba.
wheel.look=Una rueda de carro. El carro está listo, los presos están listos. Solo el caballo llega tarde.
wheel.use=Desde aquí dentro no llego.
cabbages.look=Coles. El hermano Raoul odia las coles.
cabbages.use=Primero tendría que salir del carro.

gerard-cart.look=El hermano Gérard. Le han atado las manos y le han quitado las llaves. Aun así, sigue pareciendo el tesorero.
gerard-cart.q.now=¿Qué va a ser de nosotros?
gerard-cart.now.1=¿Qué va a ser de nosotros, hermano?
gerard-cart.now.2=Preguntas. Juristas. Meses largos. Monsieur de Nogaret, el hombre de leyes del rey, lleva mucho tiempo preparando esto.
gerard-cart.now.3=No digas nada que puedan retorcer, muchacho. Y reza.
gerard-cart.q.how=¿Cómo se lo digo a Raoul sin que lo oiga el soldado?
gerard-cart.how.1=¿Cómo puedo decírselo a Raoul sin que lo oiga el soldado?
gerard-cart.how.2=Estos hombres hablan francés. La Iglesia habla latín. Y nunca nadie le ha impedido rezar a un preso.
gerard-cart.how.3=Pregúntale al soldado si puedes rezar. Luego canta, y mete el mensaje en el salmo.
gerard-cart.q.bye=Lo intentaré, hermano.
gerard-cart.bye=Despacio, muchacho. Los salmos nunca tienen prisa.

soldier-cart.look=Uno de los hombres del rey, de azul con los lirios. Parece tan cansado como nosotros.
soldier-cart.q.where=¿Adónde nos lleváis?
soldier-cart.where.1=¿Adónde nos lleváis?
soldier-cart.where.2=Adonde digan los juristas del rey. Y ahora siéntate.
soldier-cart.q.horse=¿Un carro no debería tener caballo?
soldier-cart.horse.1=¿Un carro no debería tener caballo?
soldier-cart.horse.2=Ya viene. Todo viene. Esta mañana se arresta a media Francia, no hay caballos para todos.
soldier-cart.q.pray=¿Podemos rezar? Es la hora de prima.
soldier-cart.pray.1=Es la hora de prima. ¿Podemos rezar?
soldier-cart.pray.2=Rezad, cantad, haced lo que queráis. En vuestro latín de iglesia, si hace falta.
soldier-cart.pray.3=Total, no entiendo ni una palabra.
soldier-cart.q.bye=Nada.
soldier-cart.bye=Entonces calla.

raoul.look=El hermano Raoul, bajo una capucha de carretero. Finge que vende coles. Mal.
raoul.use=Desde aquí no llego hasta él. Solo puedo hablar.
psalm.start=(Canta, con la voz de la capilla a la hora de prima.)
shout.q.page=¡Raoul! ¡La página está escondida en la biblioteca!
shout.page=¡Raoul! ¡Hermano Raoul! La página, está en la...
shout.quiet=¡Eh! ¿A quién le gritas? ¡Silencio ahí detrás!
shout.angry=Se acabó. ¡Tú, el carretero! ¡Llévate tus coles a otra parte!
shout.gone=Raoul se ha ido. Tonto, tonto...
shout.back=Ya está. Ha vuelto, al otro lado de su carretilla. Esta vez, con cuidado.
shout.q.psst=¡Pss! ¡Aquí!
shout.psst=¡Pss! ¡Pss!
shout.deaf=Hace como que no oye. Bien por él. Mal por mí.
shout.eyes=¿Hm? (El soldado mira de mí al carretero, y otra vez a mí.)
shout.q.bye=No decir nada.

psalm.q.hear=«Frater Radulfe, audi me.» (Hermano Raoul, escúchame.)
psalm.hear.1=«Frater Radulfe, audi me, audi me...»
psalm.hear.2=«Audio, frater. Audio.» (Te oigo, hermano.)
psalm.monks=Monjes.
psalm.q.kyrie=«Kyrie eleison.» (Señor, ten piedad.)
psalm.kyrie.1=«Kyrie eleison, Christe eleison...»
psalm.kyrie.2=Una buena oración. Pero Raoul sigue vendiendo coles: cree que estoy rezando de verdad.
psalm.q.psst=¡Pss! ¡Raoul! ¡Soy yo!
psalm.psst=¡Pss! ¡Raoul! ¡Soy yo, Aimery!
psalm.q.where=«Pagina in psalterio, in bibliotheca.» (La página está en el salterio, en la biblioteca.)
psalm.where.1=«Pagina in psalterio... in bibliotheca... in psalterio...»
psalm.where.2=«Intellexi.» (Entendido.)
psalm.q.cheese=«Caseus in culina est.» (El queso está en la cocina.)
psalm.cheese.1=«Caseus in culina est...»
psalm.cheese.2=«...Quid?» (...¿Qué?)
psalm.cheese.3=Eso no. El estómago de Raoul no necesita saberlo.
psalm.q.french=¡La página está en el salterio! ¡En la biblioteca!
psalm.french=¡La página está en el salterio! En la...
psalm.q.half=«Ubi est altera pars?» (¿Dónde está la otra mitad?)
psalm.half.1=«Ubi est... altera pars... ubi est?»
psalm.half.2=«Rupella. Ad navem.» (La Rochelle. Al barco.)
psalm.half.3=La Rochelle. La otra mitad va hacia un barco en La Rochelle.
psalm.half.4=«Ego sequar.» (La seguiré.)
psalm.half.5=«Amen.»
psalm.end.1=Por fin el caballo. Basta de cantar, nos vamos.
psalm.end.2=Bien cantado, Aimery. Bien cantado.
psalm.q.cat=«Ubi est feles?» (¿Dónde está el gato?)
psalm.cat.1=«Ubi est feles?»
psalm.cat.2=(Raoul me lanza una mirada que no es ninguna oración.)
psalm.q.ask=Raoul, ¿dónde está la otra mitad?
psalm.ask=Raoul, ¿dónde está la otra mitad del...?
psalm.q.stop=(Dejar de cantar.)
psalm.stop=Amén.
card.cart.end=Al hermano Raoul no lo atraparon.|Esa misma mañana tomó el camino del oeste.

# ---- acto 2: La Rochelle ----
card.rochelle=La Rochelle, la tarde siguiente|El puerto viejo, entre sus dos torres
name.sunset=puesta de sol
name.saint-nicolas=torre de Saint-Nicolas
name.chain-tower=torre de la Cadena
name.harbour-water=puerto
name.boat=barco de pesca
name.nets=redes
name.gulls=gaviotas
name.clock-gate=puerta del reloj
name.office=capitanía del puerto
name.barometer=barómetro
name.quay-lamp=farola
name.quay-bollard=noray
name.old-town=hacia el casco antiguo
name.fisherman=viejo pescador
name.kev-harbour=Kev

harbour.intro.1=Rupella. La Rochelle. Si un barco zarpó con la otra mitad, zarpó de aquí.
harbour.intro.2=Hace setecientos años. Busco un barco que zarpó hace setecientos años.
harbour.kev.1=¡MARIA! ¡Chat, es ella! ¡La chica de la página!
harbour.kev.2=Kev. ¿Qué haces en La Rochelle?
harbour.kev.3=¡Me han enviado mis seguidores! Bueno, una. Una señora con abrigo de camello. Hasta me pagó el tren.
harbour.kev.4=Hélène. Cómo no.
goal.60=Averiguar dónde tenían su casa los templarios de La Rochelle.
hint.60=Los pescadores viejos conocen el casco antiguo. Quizá el que está junto a las redes.
goal.61=Conseguirle al viejo pescador un pronóstico del tiempo en el que confíe.
hint.61=Kev tiene una app del tiempo. Y la capitanía tiene algo más antiguo en la ventana.
goal.62=Decirle al pescador lo que marca el barómetro.
hint.62=Hablar con el pescador.
goal.63=Ir a la Cour du Temple, en el casco antiguo.
hint.63=El camino al casco antiguo está a la izquierda, pasada la capitanía.

sunset.look=El sol se pone entre las torres, directo al mar. No está mal, La Rochelle.
saint-nicolas.look.1=La torre de Saint-Nicolas. Maciza, almenada, preciosa.
saint-nicolas.look.2=Y construida unos cuarenta años después de los arrestos. Ningún templario la vio jamás.
saint-nicolas.use=Está al otro lado del puerto. Y cerrada a estas horas.
chain-tower.look=La torre de la Cadena. De noche, una cadena entre las dos torres cerraba el puerto. También es posterior a los templarios.
chain-tower.use=Necesitaría un barco.
harbour-water.look=El puerto viejo. Barcos de pesca, veleros y mucha historia en el fondo.
harbour-water.use=Estamos en octubre. No.
boat.look=Un barco de pesca azul, el MARIE-JO. Recién pintado, con las redes a bordo.
boat.use=No es mío. Y su dueño está justo ahí.
nets.look=Redes, flotadores, una caja. Alguien ha pasado la tarde remendándolas.
nets.use=Solo haría los agujeros más grandes.
gulls.look=Gaviotas, todas posadas en el muelle. Mi abuela decía que eso significa mal tiempo.
gulls.use=Me miran como si les debiera dinero.
gulls.sandwich=Ese bocadillo es de las palomas de París.
clock-gate.look=La puerta del reloj del casco antiguo. La puerta es medieval; el reloj y la cúpula llegaron mucho después.
clock-gate.use=El camino al casco antiguo pasa junto a la capitanía.
office.look=La capitanía del puerto. Cerrada. Por la ventana: cartas náuticas, una radio y un barómetro viejo.
office.use=Cerrada con llave. El horario está en un cartel, y estamos fuera de todos.
office.phone=No toda la capitanía. Solo el barómetro.
barometer.dark=Un barómetro viejo, en la pared detrás del cristal. Ahí dentro está demasiado oscuro para leer la aguja.
barometer.read.1=La luz del móvil sobre el cristal... La aguja ha pasado «Variable» y va hacia «Tempête». Tormenta.
barometer.read.2=Y la pequeña aguja de latón dice que esta mañana estaba mucho más alta. Baja deprisa.
barometer.again=Bajando. Tempête. Hasta yo sé leer eso.
quay-lamp.look=Una farola vieja del muelle, recién encendida.
quay-bollard.look=Un noray con un cabo alrededor.
quay-bollard.use=Está atado más fuerte de lo que yo podría desatarlo.
old-town.where=¿Al casco antiguo? ¿Pero adónde? Ni siquiera sé en qué calle buscar.

kev-harbour.look=Kev, retransmitiendo la puesta de sol. No se ha dado cuenta de que es bonita.
kev-harbour.q.who=¿Quién te ha enviado, Kev?
kev-harbour.who.1=¿Quién te ha enviado aquí, Kev? ¿En serio?
kev-harbour.who.2=Una seguidora. Siempre comenta la primera. Supermaja. Me preguntó adónde ibas.
kev-harbour.who.3=Le dije que no lo sabía, y ella dijo La Rochelle, ¡y me pagó el billete!
kev-harbour.who.4=Así que ella también conoce la nota. Habrá visto mis fotos... o tu directo, Kev.
kev-harbour.q.fleet=¿Qué crees que pasó aquí?
kev-harbour.fleet.1=A ver, Kev. ¿Qué pasó en La Rochelle?
kev-harbour.fleet.2=¡La flota templaria! ¡Dieciocho barcos llenos de oro, desaparecidos en una noche! ¡Está por todo internet!
kev-harbour.fleet.3=Un hermano dijo algo así en su juicio, en 1308. Uno. Nadie más lo confirmó nunca. Es una leyenda.
kev-harbour.fleet.4=Pero una leyenda con dieciocho barcos.
kev-harbour.q.weather=¿Qué dice tu app del tiempo para mañana?
kev-harbour.weather.1=Tu móvil tiene una app del tiempo, ¿no? ¿Qué dice para mañana?
kev-harbour.weather.2=¡Sol! ¡Veintiocho grados! ¡Día perfecto para salir en barco!
kev-harbour.weather.3=Veintiocho grados. En octubre. En el Atlántico. Enséñamelo.
kev-harbour.weather.4=¿Ves? «New Rochelle, soleado.»
kev-harbour.weather.5=New Rochelle está en Nueva York, Kev.
kev-harbour.weather.6=...Eso explica los anuncios de perritos calientes.
kev-harbour.q.bye=Hasta luego, Kev.
kev-harbour.bye=¡No os vayáis!
kev-harbour.page=Ya ha tenido bastante de mis cosas delante de su cámara.

fisherman.look=Un viejo pescador remendando sus redes. Mira al cielo más que a las redes.
fisherman.q.templars=¿Sabe dónde vivían los templarios en La Rochelle?
fisherman.templars.1=Perdone. ¿Sabe dónde tenían su casa los templarios en La Rochelle?
fisherman.templars.2=Templarios. ¿Tengo cara de oficina de turismo, mademoiselle?
fisherman.templars.3=Tiene cara de conocer el casco antiguo.
fisherman.templars.4=Hm. Yo conozco el mar. Y mañana salgo a por lenguado, o no. La radio está rota.
fisherman.templars.5=Tráigame un pronóstico en el que pueda confiar y le hablaré de sus templarios. Y no el teléfono de ese chaval.
fisherman.q.again=Sobre el tiempo...
fisherman.again.1=Sobre el tiempo de mañana...
fisherman.again.2=Cuando lo sepa, yo le hablaré de sus templarios.
fisherman.done.1=Gracias otra vez.
fisherman.done.2=Cour du Temple, detrás de la puerta del reloj. Cuidado con la tormenta.
fisherman.q.app=La app de Kev da el tiempo de New Rochelle, en Nueva York.
fisherman.app.1=La app de Kev dice que hará sol. En New Rochelle. En Nueva York.
fisherman.app.2=¡Nueva York! ¡Ja! Entonces tiene razón, allí seguro que hace muy buen tiempo.
fisherman.app.3=Pero yo no pesco en Nueva York.
fisherman.q.barometer=El barómetro de la capitanía baja deprisa.
fisherman.barometer.1=El barómetro de la capitanía baja deprisa. Ha pasado «Variable» y va hacia «Tempête».
fisherman.barometer.2=¿Baja? ...Entonces mañana viento, y nada de lenguado. Y las gaviotas lo sabían antes que yo.
fisherman.barometer.3=Me ha salvado las redes, mademoiselle.
fisherman.barometer.4=¿Y los templarios?
fisherman.barometer.5=Mi abuela decía que su casa estaba detrás de la puerta del reloj, en la Cour du Temple. No queda mucho, el nombre y un muro viejo.
fisherman.barometer.6=Ahora hay un café. El de madame Morin. Su familia lo tiene desde siempre.
fisherman.barometer.7=Dígale que la envía Le Goff. Así le contará el doble.
fisherman.q.towers=¿Estaban estas torres en tiempos de los templarios?
fisherman.towers.1=Estas dos torres, ¿ya estaban en tiempos de los templarios?
fisherman.towers.2=No, no. Después. En tiempos de sus templarios estaban el puerto, algunos muros y los barcos. Lo importante eran los barcos.
fisherman.q.bye=Buenas tardes.
fisherman.bye=Buenas.
fisherman.page=No voy a enseñarle una página de setecientos años a un hombre con escamas de pescado en las manos.

# ---- acto 2: la Cour du Temple ----
name.night-sky=cielo nocturno
name.old-wall=muro viejo
name.relief=piedra tallada
name.hollow=hueco en el muro
name.chalkboard=pizarra del menú
name.moved-board=pizarra del menú
name.loose-stone=piedra tallada
name.cafe=café Le Templier
name.cafe-window=ventana del café
name.terrace-lights=guirnalda de luces
name.napkin=servilleta
name.street-sign=placa de la calle
name.back-harbour=volver al puerto
name.morin=madame Morin
name.kev-court=Kev

court.intro.1=La Cour du Temple. Un café, unas casas y un muro que parece mucho más viejo que el resto.
court.intro.2=¡Maria! ¡Mira el menú! ¡Está en la escritura templaria! ¡Los templarios nos dejaron un mensaje!
court.intro.3=Claro que sí, Kev.
goal.70=Buscar lo que quede de la casa de los templarios en este patio.
hint.70=A Kev le entusiasma la pizarra del menú. Y detrás hay algo.
goal.71=Preguntar a madame Morin por el muro viejo detrás de su pizarra.
hint.71=Ahora que sé leer su menú, quizá le caiga bien. Hablar con ella.
goal.72=Mirar la piedra tallada.
hint.72=Está en el muro viejo, donde estaba la pizarra.
goal.73=Ver si la piedra se puede mover.
hint.73=El mortero de alrededor parece blando. Algo fino y plano entraría en las juntas, como mi plegadera.
goal.74=Conseguir ayuda para sacar la piedra del muro.
hint.74=Pesa demasiado para mí. Kev tiene músculos, al menos en los pulgares. Pedírselo a él.
goal.75=Mirar en el hueco detrás de la piedra.
hint.75=Meter la mano en el hueco.

night-sky.look=Estrellas sobre La Rochelle. La tormenta aún no ha llegado.
old-wall.look=Piedras toscas, mortero viejo, hiedra. Siglos más viejo que las casas de alrededor.
old-wall.use=Sólido. Casi todo.
street-sign.look=Cour du Temple. El patio de los templarios. El nombre ha sobrevivido setecientos años. La casa, no.
cafe.look=Café Le Templier. Cómo no iba a llamarse así.
cafe.use=Preguntaré a madame Morin antes de meterme en su cocina.
cafe-window.look=Luz cálida, una barra, tres mesas. Mejillones en todas.
terrace-lights.look=Una guirnalda de bombillas del muro viejo al café. Setecientos años de historia, y lucecitas.

chalkboard.look.1=La pizarra del menú. Cuadrados, ángulos, puntos: la llamada escritura templaria.
chalkboard.look.2=Ni un solo documento medieval la usa. Pero aun así me gustaría saber qué pone. Me haría falta la clave.
chalkboard.behind=Detrás de la pizarra hay algo tallado en el muro. Veo patas de caballo. Cuatro... no, más.
chalkboard.decoded=Mejillones con patatas fritas, doce euros. El último secreto de los templarios.
chalkboard.ask=Es la pizarra de madame Morin. Mejor pregunto antes de moverla.
chalkboard.moved=Ya está. ¿Y qué escondes tú?
decode.1=La clave en la servilleta, el código en la pizarra... cuadrado con punto, M. Cuadrado abierto, O. Ángulo, U...
decode.2=M-O-U-L-E-S F-R-I-T-E-S. Doce euros.
decode.3=...O sea, que el último secreto de los templarios son mejillones.
decode.4=Y patatas fritas. No te olvides de las patatas.

relief.hidden=Algo tallado, medio tapado por la pizarra. Patas de caballo y el borde de un escudo.
relief.blocked=La pizarra estorba.
relief.look.1=Dos caballeros en un solo caballo, escudos y lanzas. Casi borrados, pero inconfundibles.
relief.look.2=El sello de los templarios, en piedra. En su propio patio.
relief.use=Está asentada en mortero de cal viejo, y el mortero parece blando. Para las juntas me haría falta algo fino y plano.
relief.heavy=La piedra ya está suelta, pero pesa demasiado para mí sola.
relief.loose.1=La plegadera entra en la junta como en mantequilla. Mortero de cal de hace siglos... se desmorona.
relief.loose.2=¡La piedra se mueve! Pero pesa. Demasiado para mí sola.
loose-stone.look=Los jinetes, apoyados contra el muro. Llevan setecientos años vigilando este patio.
hollow.look=Detrás de la piedra, un hueco. Polvo, una araña muerta... y algo pequeño y gris.
hollow.empty=Ahora vacío. Solo polvo.

token.found.1=Una ficha de plomo, no más grande que una moneda. Los peregrinos las compraban en los santuarios que visitaban.
token.found.2=Tiene una iglesia redonda, y letras en el borde: ...TOMAR.
token.found.3=Tomar, en Portugal. El castillo de los templarios se construyó allí en 1160. Y en Portugal el rey nunca los mandó arrestar.
token.found.4=¡¿Está vacío?! ¿Dónde está el oro? Chat, ¿dónde está el ORO?
token.found.5=El oro nunca fue lo importante, Kev.
token.look=Una ficha de peregrino de plomo. Una iglesia redonda y la palabra TOMAR.
token.use=No es una moneda. Tampoco para la cafetera.
phone.token=Clic. Antes y después. Regla de restauradora.

napkin.look=Una servilleta de papel del café, con la clave del código impresa, para que los clientes puedan leer el menú.
napkin.take=Un recuerdo. Y una clave.
napkin.page=No voy a poner una servilleta de papel cerca de una página de setecientos años.

kev-court.look=Kev, retransmitiendo la pizarra. Once espectadores. Un récord, dice.
kev-court.q.cipher=No es una escritura templaria, Kev.
kev-court.cipher.1=No es un código templario, Kev. Ese alfabeto no aparece en ni un solo documento medieval.
kev-court.cipher.2=¡Exacto! ¡Así de bien lo escondían!
kev-court.cipher.3=Así no funcionan las pruebas.
kev-court.cipher.4=Así funciona el contenido.
kev-court.q.lift=Kev, ayúdame a levantar esta piedra.
kev-court.lift.1=Kev. Deja el móvil un segundo y ayúdame a levantar esta piedra.
kev-court.lift.2=¿Una cripta templaria? ¿En DIRECTO? ¡Chat, vamos a abrir una CRIPTA!
kev-court.lift.3=Hnngh... ¡ya está! ¡Chat, estamos dentro!
kev-court.lift.4=...Es un agujero. Un agujero con una araña.
kev-court.lift.5=Ahí dentro hay algo.
kev-court.q.bye=Déjalo.
kev-court.bye=¡No os vayáis!

morin.look=Madame Morin, del café. Ha visto muchos turistas y no se cree a ninguno.
morin.q.old=¿Es muy antiguo este patio?
morin.old.1=¿Es muy antiguo este patio?
morin.old.2=Las casas son del siglo diecisiete. El muro de la izquierda es mucho más viejo. De los templarios, dicen.
morin.old.3=La gente fotografía mi pizarra delante. Nadie mira nunca el muro.
morin.q.board=¿Puedo mover su pizarra un momento?
morin.board.1=¿Puedo mover su pizarra un momento? Hay algo tallado detrás.
morin.board.2=¿Durante el servicio? Non. La gente lee esa pizarra.
morin.board.3=¿Ah, sí? ¿En ese código?
morin.board.4=...Nadie la ha leído nunca. Pero parece misteriosa. Lo misterioso vende mejillones.
morin.q.menu=Su menú dice: mejillones con patatas, doce euros.
morin.menu.1=Su menú dice mejillones con patatas fritas, doce euros.
morin.menu.2=¡Lo ha leído! Mi nieto lo pintó en ese código tonto, y en cuatro años nadie lo ha leído nunca. ¡Ni uno!
morin.menu.3=¿Sabe? Mi abuelo rehízo ese muro en 1920. Detrás de la piedra vieja del caballo encontró un agujero.
morin.menu.4=No había nada dentro más que un trocito de plomo. Lo volvió a dejar, para que diera suerte. Un café necesita suerte.
morin.menu.5=¿Puedo mover su pizarra, entonces?
morin.menu.6=Adelante. Mueva la pizarra. Total, nadie la lee.
morin.q.bye=Gracias, madame.
morin.bye=Los mejillones cuestan doce euros, por si le entra hambre.
morin.page=No es un menú, es una pieza de museo. Se queda en mi bolso.

court.end.1=Tomar. A los templarios de Portugal nunca los juzgaron.
court.end.2=En 1319 su gente y sus tierras pasaron a una orden nueva, la Orden de Cristo. Más tarde tuvo su sede en Tomar.
court.end.3=Si la otra mitad del quirógrafo fue a alguna parte, fue allí.
court.end.4=¡Chat, ya lo habéis oído! Próxima parada: ¡PORTUGAL!
court.end.5=Kev. ¿Quién está viendo tu directo ahora mismo?
court.end.6=¡Cuarenta y una personas! Y la señora del abrigo de camello. Siempre comenta la primera.
court.end.7=...Cómo no.
card.act2.end=Fin del acto 2|Una ficha de Tomar. La pista lleva a Portugal.

# ---- flashback 2: La Rochelle, finales de octubre de 1307 ----
card.fog=La Rochelle, finales de octubre de 1307|Pocos días después de los arrestos
name.fog=niebla
name.town-walls=murallas
name.ship=barco
name.ship-light=farol del barco
name.sea=mar
name.mooring-post=poste de amarre
name.sea-chest=cofre
name.gangplank=pasarela
name.etienne=hermano Étienne
name.captain=capitán

quay.intro.1=La Rochelle. Cinco días de camino, y la niebla me estaba esperando.
quay.intro.2=El mensaje del hermano Étienne decía: el barco que responda tres veces a tu farol.
goal.80=Encontrar el barco en la niebla.
hint.80=Hacer señales con el farol, hacia el barco.
goal.81=Contarle al hermano Étienne lo que pasó en París.
hint.81=Hablar con el hermano Étienne.

fog.look=Niebla. Apenas veo mis propias botas.
town-walls.look=Las murallas de La Rochelle. Unas pocas luces en la ciudad. Los hombres del rey también están allí.
ship.look=Algo grande, ahí fuera en la niebla. ¿Un mástil? Un barco sin luz.
ship.seen=Tres luces. Es él.
sea.look=Agua negra. Huele a sal y a brea.
sea.use=He venido a mandar algo al otro lado, no a nadar.
mooring-post.look=Un poste de amarre, el cabo mojado por la niebla.
mooring-post.use=Barco ajeno, cabo ajeno.
gangplank.look=Una pasarela, bajada hasta el muelle. Alguien espera visita.
gangplank.fog=No antes de saber de quién es el barco.
gangplank.no=No subo a bordo. Mi camino termina aquí.
lantern.look=Un farol con postigo. Abierto, cerrado, abierto: la lengua más antigua del mar.
lantern.use=Debería hacer señales hacia el barco.
lantern.wrong=¿Hacerle señales a la niebla? No contesta. Hacia el barco.
signal.1=Abierto... cerrado. Abierto... cerrado. Abierto... cerrado.
signal.2=¡Ahí! Tres luces en la niebla. Tres veces.
signal.3=¿Raoul? Alabado sea Dios. Temíamos que te hubieran llevado con los demás.
signal.4=¡Hermano Étienne! Fui el único al que no atraparon. Gracias a un gato.
sea-chest.look=Un cofre pequeño con flejes de hierro y un sello rojo. Dentro está nuestra mitad del quirógrafo.
sea-chest.use=Es para el capitán, no para mí.

etienne.look=El hermano Étienne, de nuestra casa de La Rochelle. Por su cara, lleva días sin dormir.
etienne.q.paris=El Temple de París ha caído.
etienne.paris.1=El Temple de París ha caído, hermano. Se llevaron a todos. Al hermano Gérard, al mariscal, a los escuderos.
etienne.paris.2=Aquí también. La misma mañana, con las mismas cartas selladas. Solo unos pocos escapamos.
etienne.paris.3=Dios los guarde. Y que Dios perdone al rey, porque yo no puedo.
etienne.q.gold=¿Hay oro en ese cofre?
etienne.gold.1=¿Hay oro en ese cofre?
etienne.gold.2=Pergamino. Vale más que el oro, y no tintinea cuando pasan los hombres del rey.
etienne.q.page=Aimery escondió la mitad de París en un salterio, en la biblioteca.
etienne.page.1=Aimery escondió la mitad parisina de la cuenta en un salterio, en la biblioteca del Temple. Me lo dijo en un salmo.
etienne.page.2=En un salterio. Buen chico. Entonces las dos mitades están a salvo, y separadas, como debe ser.
etienne.page.3=Esta tiene que salir de Francia esta noche. ¡Capitán!
etienne.page.4=Mi rey, don Dinís, no entregará templarios a nadie. En Portugal vuestra mitad estará a salvo.
etienne.page.5=Toma esto, hermano. Una ficha de Tomar, de tus hermanos de allí. Si un día alguien busca, que le muestre el camino.
etienne.page.6=Entonces la dejaré en nuestra casa, detrás de los dos jinetes. Quien la encuentre sabrá dónde buscar.
etienne.page.7=Ve con Dios.
etienne.page.8=Y tú con el mar.
card.fog.end=No se sabe si de verdad salieron barcos templarios de La Rochelle.|Ningún documento habla de este. El juego se lo ha inventado.
etienne.q.bye=Un momento, hermano.
etienne.bye=Deprisa, Raoul. La niebla no durará para siempre.

captain.look=El capitán: portugués, por el acento. Habla poco y vigila la niebla.
captain.talk=Habla con el hermano Étienne. Yo solo llevo la carga.
epilogue.title=Lo que pasó de verdad
epilogue.1.head=Viernes, 13 de octubre de 1307
epilogue.1.text=Al amanecer, los hombres del rey detuvieron a los templarios en toda Francia, con órdenes selladas enviadas semanas antes. Los acusaban de herejía e idolatría. La mayoría de los historiadores cree que el verdadero motivo era el dinero: Felipe IV estaba muy endeudado, y los templarios estaban entre sus acreedores.
epilogue.2.head=El proceso
epilogue.2.text=Bajo tortura, muchos templarios confesaron. En agosto de 1308, en Chinon, el papa Clemente V absolvió al gran maestre y a los demás dirigentes. Ese pergamino estuvo mal archivado en el Archivo Vaticano hasta que Barbara Frale lo encontró en 2001.
epilogue.3.head=El fin de la orden
epilogue.3.text=En 1312 el Concilio de Vienne disolvió la orden sin condenarla, y sus bienes pasaron a los hospitalarios. El 18 de marzo de 1314, Jacques de Molay, el último gran maestre, fue quemado en una pequeña isla del Sena, cerca del actual Pont Neuf.
epilogue.4.head=Portugal
epilogue.4.text=El rey Dionisio de Portugal no entregó a sus templarios. En 1319 una nueva orden, la Orden de Cristo, acogió a sus hermanos y sus tierras, y desde 1357 su sede fue Tomar. La Charola, la iglesia redonda de los templarios del siglo XII, sigue en pie allí.
epilogue.5.head=Leyendas
epilogue.5.text=Una flota que zarpó de La Rochelle con el tesoro, una maldición desde la hoguera, una escritura secreta templaria: ninguna fuente habla de ellas. El papa y el rey sí murieron los dos en 1314; la maldición se añadió a la historia más tarde.
epilogue.6.head=Los quirógrafos
epilogue.6.text=Un quirógrafo era un texto escrito dos veces en un mismo pergamino y cortado a través de una palabra, a menudo CHIROGRAPHUM, de modo que las dos mitades solo encajaban entre sí. Muchos se conservan en archivos de toda Europa.
epilogue.7.head=Inventado para este juego
epilogue.7.text=Maria, Kev, Hélène, Monsieur Lefort, Madame Morin, Dona Inês, Aimery y los hermanos Gérard, Raoul y Étienne; la página, la ficha, el cofre con las promesas del rey y el archivo de la torre. Muchos documentos de la Orden de Cristo son reales: hoy se guardan en Lisboa, en el archivo nacional de la Torre do Tombo.
card.tomar=Tomar, Portugal, dos días después|El Convento de Cristo, sobre la ciudad
charola.intro.1=La Charola. La iglesia redonda de los templarios de Tomar. Ochocientos años, y todavía huele a velas.
charola.helene.1=Madame Vogt. Qué casualidad.
charola.helene.2=Madame de Vaucresson. Usted ve el directo de Kev.
charola.helene.3=Todas las noches. Guarda fatal los secretos. Acabo de hacer un pequeño donativo al convento, para el tejado.
charola.helene.4=¿Pequeño cuánto?
charola.helene.5=Lo bastante pequeño para un carné de lectora del archivo. Disfrute de la iglesia.
charola.kev.1=Chat, ¿lo habéis visto? ¡La señora del abrigo camel! ¡EN DIRECTO!
charola.kev.2=¡En la Charola no se graba! ¿Cuántas veces, senhor?
charola.kev.3=Es la cuarta vez. Mis seguidores lo han contado.
goal.90=Averiguar qué tiene que ver la ficha de La Rochelle con Tomar.
hint.90=Mira por la iglesia. Junto a la pared hay una vitrina.
octagon.look.1=En el centro, el octógono con el altar mayor, todo pintado y dorado.
octagon.look.2=Los templarios la hicieron redonda, como la iglesia del Santo Sepulcro de Jerusalén.
octagon.use=¿Detrás de un cordón, en una iglesia, con una guía mirando? No.
paintings.look=Las pinturas y el oro son más jóvenes que los muros: de hacia 1500, cuando la Orden de Cristo se había hecho rica con los viajes por mar.
paintings.use=Quinientos años. Miro, no toco.
charola-window.look=Una ventana alta. La luz cae justo sobre el altar, como si alguien lo hubiera planeado. Alguien lo planeó.
rope.look=Un cordón rojo. Su trabajo es mantener a Kev fuera. No se le da muy bien.
rope.use=¡Menina! ¡El cordón no está ahí por gusto!
tower-door.locked=Una puerta a la escalera de la torre. Cerrada con llave.
showcase.look.1=Una vitrina para la exposición de este mes, «Peregrinos de Tomar». Moldes de piedra para fichas de peregrino, del siglo XIV.
showcase.look.2=Uno de ellos está tallado en forma de iglesia redonda. Del tamaño de mi ficha.
showcase.open=La vitrina está abierta.
showcase.locked=Cerrada con llave. Y el cristal está muy limpio; Dona Inês debe de pulirlo cada día.
showcase.glass=El cristal estorba. La llave la tiene Dona Inês.
showcase.after=El molde y la ficha, uno junto a otra. Setecientos años separados, y siguen siendo pareja.
goal.91=Pedir a Dona Inês que abra la vitrina.
hint.91=Habla con Dona Inês.
token.fits.1=Encaja. Cada línea de la iglesia, cada letra de TOMAR.
token.fits.2=Esta ficha se fundió aquí. En este molde.
token.fits.3=Nossa Senhora. ¿Dónde ha encontrado eso?
token.fits.4=Este molde apareció en 1931 en la torre del archivo. En un armario empotrado, detrás de los viejos registros de la Orden de Cristo.
token.fits.5=Entonces es ahí donde tengo que buscar. Detrás de los registros.
token.fits.6=Para una erudita que conoce a sus templarios... Venga. Le abro la torre.
token.fits.7=Escaleras arriba, menina. Y usted sola. No el chico del palo.
goal.94=Subir al archivo.
hint.94=Por la puerta de la escalera de la torre.
ines.look=Dona Inês, la guía. Orgullosa de cada piedra de este convento, y las conoce todas por su nombre.
ines.page=¡Eso va en una caja de archivo, menina, no en el bolsillo de un abrigo!
ines.phone=¡No se graba! ...Ah, es usted. Tampoco se graba.
ines.q.who=¿Usted es la guía?
ines.who.1=¿Usted es la guía aquí?
ines.who.2=Inês Carvalho. Treinta y un años en este convento. He visto papas, presidentes y nueve equipos de rodaje.
ines.who.3=Y a ese chico. Es peor que los nueve equipos de rodaje.
ines.q.helene=¿Quién era la señora del abrigo camel?
ines.helene.1=¿Quién era la señora del abrigo camel?
ines.helene.2=Madame de Vaucresson. Dio dinero para el tejado. El director le dio un pase para el archivo.
ines.helene.3=Pidió los registros de 1319. Nadie los pide nunca. Dos veces en un día es muy raro.
ines.q.round=¿Por qué es redonda la iglesia?
ines.round.1=¿Por qué la construyeron redonda los templarios?
ines.round.2=Como el Santo Sepulcro de Jerusalén. Los caballeros fueron allí a defenderlo y se trajeron su forma a casa.
ines.round.3=Dicen que los caballeros entraban a misa a caballo. Es una historia. La cuento igual; a los turistas les encanta.
ines.q.open=¿Podría abrir la vitrina?
ines.open.1=¿Podría abrir la vitrina un momento? Tengo una ficha que quizá encaje en uno de los moldes.
ines.open.2=La abro para eruditos, menina. No para cazatesoros.
ines.open.3=Tres preguntas. Si conoce a sus templarios, la abro.
goal.92=Responder a las tres preguntas de Dona Inês.
hint.92=Conoces las respuestas de París y La Rochelle: el día de las detenciones, el sello y quién tomó el relevo en Portugal.
quiz.q.1=Primera. ¿Qué día detuvieron a los templarios de Francia?
quiz.a.1314=El 18 de marzo de 1314.
quiz.1314.1=El 18 de marzo de 1314.
quiz.1314.2=Não. Ese es el día en que quemaron a Jacques de Molay. Desde el principio, por favor.
quiz.a.1307=El viernes 13 de octubre de 1307.
quiz.1307.1=El viernes 13 de octubre de 1307. Al amanecer.
quiz.right.1=Bien.
quiz.q.2=Segunda. ¿Qué muestra el sello de los templarios?
quiz.a.1119=En 1119, en Jerusalén.
quiz.1119.1=¿En 1119, en Jerusalén?
quiz.1119.2=Não. Eso es cuando se fundaron, más o menos. Desde el principio.
quiz.a.church=Una iglesia redonda.
quiz.church.1=Una iglesia redonda.
quiz.church.2=Eso está en su ficha, menina, no en el sello. Desde el principio.
quiz.a.lion=Un león con una llave.
quiz.lion.1=¿Un león con una llave?
quiz.lion.2=Não. Está pensando en un banco. Desde el principio.
quiz.a.riders=Dos caballeros en un solo caballo.
quiz.riders.1=Dos caballeros en un solo caballo. Lo he tenido en las manos.
quiz.right.2=Muy bien.
quiz.q.3=La última. ¿Quién se hizo cargo de los templarios de Portugal, de sus hermanos y sus tierras?
quiz.a.christ=La Orden de Cristo, en 1319.
quiz.christ.1=La Orden de Cristo. Fundada en 1319 por el rey Dionisio.
quiz.christ.2=Dom Dinis. Sí. Y desde 1357 su sede estuvo aquí, en Tomar.
quiz.christ.3=Es usted una erudita, menina. La abro.
quiz.christ.4=Ya está. Enséñeme su ficha.
goal.93=Probar la ficha en el molde.
hint.93=Usa la ficha de plomo con la vitrina.
quiz.a.hospital=Los hospitalarios.
quiz.hospital.1=¿Los hospitalarios?
quiz.hospital.2=En Francia, sí. Aquí no. En Portugal lo hicimos a nuestra manera. Desde el principio.
quiz.a.king=Nadie. El rey se lo quedó todo.
quiz.king.1=Nadie. El rey se lo quedó todo para él.
quiz.king.2=Esa fue la idea del rey de Francia. El nuestro era más listo. Não. Desde el principio.
quiz.a.think=Déjeme pensarlo.
quiz.think=Piense, menina. Los templarios tuvieron setecientos años; usted tiene toda la tarde.
ines.q.bye=Gracias.
ines.bye=De nada. Y dígale a su amigo: no se graba.
kev-tomar.look=Kev. Graba el techo, el suelo y la espalda de Dona Inês, por ese orden.
kev-tomar.q.pigeon=¿Esa es la paloma de París?
kev-tomar.pigeon.1=Kev. ¿Esa es la paloma del Pont Neuf?
kev-tomar.pigeon.2=Vino en mi mochila todo el viaje. Once horas de tren. Se comió mi bocadillo. Otra vez.
kev-tomar.pigeon.3=Mis seguidores le pusieron nombre. Ahora se llama Jacques.
kev-tomar.pigeon.4=¿Por Jacques de Molay? ...Eso está muy bien, Kev.
kev-tomar.q.stream=¿Quién mira hoy?
kev-tomar.stream.1=¿Quién te mira hoy?
kev-tomar.stream.2=¡Cuarenta y uno! Como siempre. Ohio, Lisboa, mi madre y la señora del abrigo camel.
kev-tomar.stream.3=Está aquí, Kev. No le hace falta mirar.
kev-tomar.stream.4=¡Entonces son cuarenta espectadores y una fan en persona!
kev-tomar.q.answers=¿Sabes algo de los templarios?
kev-tomar.answers.1=Kev, rápido: ¿qué día detuvieron a los templarios?
kev-tomar.answers.2=Fácil. El viernes 13. ¡Por eso el viernes 13 trae mala suerte!
kev-tomar.answers.3=No. Esa historia es mucho más reciente. Pero el día es correcto.
kev-tomar.q.bye=Baja la cámara.
kev-tomar.bye=Abajo, vale. Desde abajo es un buen ángulo.
pigeon-tomar.look=La paloma. Ha venido desde París, y sigue sin parecer impresionada.
pigeon-tomar.use=Me mira, luego mira mis bolsillos. Sabe que no llevo comida.
archive.intro.1=El archivo del convento. Aquí arriba están los registros de la Orden de Cristo que el museo aún conserva.
archive.intro.2=El armario de detrás está vacío hoy. Pero el registro del atril va de 1319 a 1340.
archive.intro.3=Gracias, Dona Inês.
archive.intro.4=Solo lápiz, menina. Estaré abajo, en el claustro, vigilando a su amigo.
goal.100=Mirar el registro del atril.
hint.100=Es el libro grande en el centro de la sala.
archive-door.locked=Cerrada con llave. Desde fuera. Cómo no.
archive-door.notyet=Todavía no. No he subido a una torre para irme con las manos vacías.
registers.look.1=Registros de la Orden de Cristo, fila tras fila: cuentas, cartas, visitas a las encomiendas.
registers.look.2=Setecientos años de una orden muy cuidadosa.
registers.use=Necesitaría un año. Y otro carné de lectora.
register.look.1=Un registro de la Orden de Cristo, de 1319 a 1340. Latín y portugués, de tres o cuatro manos.
register.look.2=La tapa de atrás es más gruesa que la de delante. Mucho más gruesa.
register.use.1=Paso hojas hasta el final. El último cuadernillo está cosido, pero la tapa de atrás es demasiado gruesa para una sola tapa.
register.use.2=Igual que mi salterio de París. A alguien le gustaba este truco.
register.empty=El registro me ha dado lo que tenía.
goal.101=Buscar la otra mitad del quirógrafo en el registro.
hint.101=Ya sabes cómo: la plegadera, bajo la guarda de la tapa trasera.
half.found.1=Ahí está. Un pergamino doblado, bajo la guarda. Cortado por un borde. El corte atraviesa letras.
half.found.2=...GRAPHUM. La otra mitad de la palabra. La otra mitad de la página.
goal.102=Juntar las dos mitades.
hint.102=Usa la página de París con la otra mitad.
half.look=La mitad de Tomar. El corte de su borde atraviesa las letras ...GRAPHUM.
half.page=Al revés. La página de París va sobre esta.
joined.1=CHIRO... GRAPHUM. Las dos mitades encajan como dientes. Setecientos años separadas, y ni un pelo entre ellas.
joined.2=La mitad de París tiene la suma que la Corona debía al Temple. La de Tomar tiene la misma suma, y una línea más.
joined.3=De la misma mano que el calendario del salterio. «Arca in claustro, sub lapide crucis».
joined.4=Un cofre. En el claustro. Bajo la piedra de la cruz.
joined.5=...Y lo acabo de leer en voz alta.
joined.helene.1=Gracias, Madame Vogt. Lee usted el latín de maravilla. Y alto.
joined.helene.2=Madame de Vaucresson.
joined.helene.3=Quédese con sus papelitos. Yo he venido por el cofre.
joined.helene.4=¡No puede ponerse a cavar en un claustro!
joined.helene.5=He dado dinero para el tejado. Seguro que me perdonan un suelo.
joined.helene.6=Ha cerrado la puerta con llave. Estoy encerrada en una torre. Con un lápiz.
goal.103=Salir del archivo.
hint.103=Mira a tu alrededor: la mesa, el montalibros de la pared, la ventana sobre el claustro.
chirograph.look.1=El quirógrafo, las dos mitades juntas. La cuenta que los templarios de París llevaban con el rey de Francia.
chirograph.look.2=Una mitad era para el Temple y otra para la Corona. La mitad de la Corona nunca salió del Temple.
chirograph.use=Es un registro, no una llave. No abre nada; demuestra algo.
reading-desk.look=Una mesa de lectura con una lámpara verde, cuñas de espuma para los libros y un lápiz.
reading-desk.use=Me siento un segundo. Luego recuerdo que estoy encerrada.
desk-pencil.look=Un lápiz. En los archivos solo se permiten lápices: la tinta no sale nunca de un pergamino.
pencil.take=Un lápiz. El arma del archivero.
pencil.look=Un lápiz de archivo, afilado por los dos extremos por alguien muy ordenado.
rules.look=Las normas de la sala de lectura: silencio, solo lápiz, ni comida ni bebida. Alguien ha subrayado «ni comida» dos veces.
note.write.1=Escribo en el dorso de la servilleta del café, con letras grandes:
note.write.2=ENCERRADA EN EL ARCHIVO. LLAMAD AL CONVENTO. MARIA.
note.look=Mi servilleta de La Rochelle: por un lado el menú en la «escritura templaria» de Kev, por el otro mi petición de ayuda.
napkin.pencil=Al revés: el lápiz sobre la servilleta.
goal.104=Encontrar una forma de pedir ayuda.
hint.104=Escribe una nota. Hay un lápiz en la mesa, y tienes una servilleta.
goal.105=Escribir una nota pidiendo ayuda.
hint.105=Usa el lápiz con la servilleta.
goal.106=Conseguir que alguien de abajo mire hacia la ventana.
hint.106=Kev graba todo lo que tenga plumas. Enseña tu nota en la ventana cuando esté la paloma.
book-lift.look=Un montalibros: una cajita con cuerdas para bajar registros a la sala de lectura. Ahora está abajo.
book-lift.use.1=Giro la manivela. La caja sube chirriando, poco a poco.
book-lift.use.2=Hay una bolsa de papel dentro.
book-lift.up=El montalibros, arriba. Caben tres registros. No una restauradora.
book-lift.small=Cabría un brazo. Quizá un hombro. El resto de mí, no.
book-lift.note=Solo baja a la sala de lectura. Los domingos no hay nadie.
lunch-bag.look=Una bolsa de papel de la panadería de la Praça da República.
lunch-bag.take.1=Un pastel de nata. El almuerzo de alguien, colado a escondidas de las normas.
lunch-bag.take.2=Lo siento, quienquiera que seas. Es una emergencia.
pastry.look=Un pastel de nata, algo aplastado. Ya se desmigaja.
pastry.use=En el archivo no. «Ni comida», subrayado dos veces.
tower-window.look.1=Una ventana con rejas, muy por encima del claustro.
tower-window.look.2=Abajo, Kev graba los arcos con los auriculares puestos. Nunca me oiría.
tower-window.notyet=Primero tengo trabajo.
tower-window.open.1=La ventana se abre; la reja, no.
tower-window.open.2=¡KEV! ...Auriculares. Cómo no.
tower-window.shout=¡KEEEV! ...Nada. Mueve la cabeza al ritmo de algo.
pastry.closed=La ventana está cerrada.
pastry.window.1=Desmigajo el pastel en el alféizar. Las migas caen como nieve sobre el claustro.
pastry.window.2=Y ahí está la paloma. Cómo no. Vino desde París y sigue sin saber decir que no a unas migas.
pastry.window.3=Abajo, Kev ha girado la cámara hacia ella. «¡CHAT! ¡JACQUES ESTÁ EN LO ALTO DE LA TORRE!»
pigeon-archive.look=La paloma, en el alféizar, comiéndose mi único pastel. Kev la graba desde abajo.
pigeon-archive.use=No voy a tirar una paloma por la ventana. Ni siquiera esta.
note.closed=La ventana está cerrada.
note.nobody=Nadie mira hacia arriba. Kev graba todo lo que se mueve; necesito algo digno de grabar junto a la ventana.
note.pigeon=No es una paloma mensajera. Apenas es una paloma.
rescue.1=Pongo la nota contra la reja, justo al lado de la paloma. Letras grandes. Sonríe, Maria.
rescue.2=Kev hace zoom. A la paloma. Y a mi nota.
rescue.3=Le suena el móvil. Y suena. Y suena.
rescue.4=¡Menina! ¡Cuarenta y una personas han llamado a la portería! ¡Una de Ohio!
rescue.5=La madre del chico le manda saludos.
rescue.6=Hélène de Vaucresson me ha encerrado. Está en el claustro, bajo la piedra de la cruz.
rescue.7=¿En mi claustro? ¡¿Con una palanca?! ¡Venga!
cloister.intro.1=Demasiado tarde, Madame Vogt. Setecientos años tarde, para ser exactos.
cloister.intro.2=Ha levantado una lápida en un monumento patrimonio de la humanidad.
cloister.intro.3=Con una palanca muy buena. Y mire lo que había debajo.
cloister.intro.4=¡Madame! ¡Esto es un claustro, no una obra!
cloister.intro.5=El tesoro de los templarios...
cloister.intro.6=...¿Papel? ¿Pergaminos, con sellos? ¿Dónde está el oro?
cloister.intro.7=¡Chat! ¡El cofre está abierto! ¡EN DIRECTO! ...¿Qué es? ¿Alguien puede hacer zoom?
goal.110=Ver qué hay en el cofre.
hint.110=Mira el cofre abierto.
arcades.look.1=Dos pisos de arcos alrededor de un pequeño jardín. El claustro del cementerio, del siglo XV.
arcades.look.2=Bajo el enlosado hay monjes enterrados. O los había, hasta que llegó Hélène con una palanca.
arcades.use=Piedra muy antigua, muy dura. Muy bien construida.
orange-tree.look=Un naranjo, en medio del claustro, como si no hubiera pasado nada.
orange-tree.use=Son naranjas amargas. Lo sé sin probarlas.
slab.look=La losa de la cruz, levantada y apoyada. Lo bastante gruesa para guardar un secreto setecientos años.
slab.use=Hélène necesitó una palanca. Yo tengo un lápiz.
iron-chest.look=Un cofre con herrajes bajo la losa.
iron-chest-open.look.1=Pergaminos. Docenas, cada uno con un sello colgando de un cordón. No es el sello de los templarios.
iron-chest-open.look.2=Lises. El sello del rey de Francia.
goal.111=Enseñar a Hélène lo que ha encontrado de verdad.
hint.111=Tienes la cuenta de las dos mitades. Enséñasela a Hélène.
goal.112=Demostrárselo a Hélène.
hint.112=Usa el quirógrafo con Hélène.
iron-chest-open.use=Las manos quietas, Madame Vogt. Es mío.
cloister-gate.look=La puerta al claustro principal. Turistas, un café y una salida.
cloister-gate.notnow=Ahora no. No con Hélène en una tumba y con una palanca.
helene-cloister.look=Hélène de Vaucresson, arrodillada en la tumba de un monje con abrigo camel. Hasta eso lo hace elegante.
helene-cloister.q.gold=¿Ha encontrado su oro?
helene-cloister.gold.1=Bueno. ¿Ha encontrado su oro?
helene-cloister.gold.2=Mi abuelo decía que los templarios escondieron su oro y que el rey nunca lo encontró. Lo dijo toda su vida.
helene-cloister.gold.3=Tenía razón a medias.
helene-cloister.gold.4=Razón a medias es no tener razón, Madame Vogt.
helene-cloister.q.family=¿Por qué le importa tanto?
helene-cloister.family.1=¿Por qué lo quiere tanto?
helene-cloister.family.2=Los Vaucresson prestaron dinero a los reyes durante trescientos años. Luego los reyes dejaron de pagar.
helene-cloister.family.3=Teníamos un castillo. Ahora tengo un piso, un abrigo y esto.
helene-cloister.family.4=Entonces usted, más que nadie, entenderá lo que hay en ese cofre.
helene-cloister.q.read=Lea uno.
helene-cloister.read.1=Lea uno, Madame. Cualquiera.
helene-cloister.read.2=«Nos, Felipe, por la gracia de Dios rey de los francos...» No leo latín tan deprisa.
helene-cloister.read.3=Yo sí. Y puedo enseñarle lo que significa.
helene-cloister.bye=Váyase, Madame Vogt. Y llévese su paloma.
helene-cloister.q.bye=Nada.
finale.early=Ni siquiera lo miraría. Primero debería saber qué hay en el cofre.
finale.1=Esta es la cuenta que el Temple llevaba con el rey. Las dos mitades. La suma de abajo, el pequeño reino de Monsieur Lefort, es lo que les debía.
finale.2=Y su cofre está lleno de promesas de pago del rey. Selladas con sus lises. Suman lo mismo.
finale.3=«...que prometemos devolver a los hermanos del Temple en la próxima fiesta de Todos los Santos...»
finale.4=Todos los Santos. El uno de noviembre de 1307. Ni tres semanas después de haberlos hecho detener a todos.
finale.5=Nunca pensó pagar. En lugar de eso, detuvo a sus acreedores.
finale.6=CHAT. ¡Facturas sin pagar de hace setecientos años! ¿Es un tesoro? ¡Votad ya!
finale.7=Eso no es un tesoro, senhor. Es una prueba. Y pertenece al convento.
finale.8=Quédenselo. Papel. Setecientos años para un cofre de pagarés.
finale.9=Mi abuelo se habría reído. Bonsoir, Madame Vogt.
finale.10=El oro se puede fundir. Una deuda escrita por dos manos, no.
finale.11=Qué bonito. ¿Quién lo dijo?
finale.12=Un tesorero templario, la noche antes de las detenciones. Al menos, eso me gusta pensar.
finale.13=Las dos mitades irán a los archivos. París y Lisboa, una cada uno, y copias juntas. Como corresponde a un quirógrafo.
finale.14=¡Maria! ¡MARIA! ¡El vídeo! ¡Dos millones de visitas!
finale.15=¿Dos millones? ¿Por unos pagarés de setecientos años?
finale.16=Por Jacques. Es tendencia.
finale.17=...Cómo no.
card.finale=La cuenta quedó saldada.|Con setecientos años de retraso, y solo sobre el papel. Como casi todas las cuentas con los reyes.
finale.chest=Quien tiene que verlo es Hélène, no el cofre.
finale.ines=Yo la creo, menina. Es a Madame a quien tiene que convencer.
finale.kev=¿Puedo grabarlo? ...¿Para el archivo?
ines-cloister.talk.1=Dona Inês, ¿está bien?
ines-cloister.talk.2=Treinta y un años, menina, y nadie había excavado nunca mi claustro. Necesito un café. Después.
kev-cloister.talk.1=Kev, enfoca el cofre, no a mí.
kev-cloister.talk.2=El cofre es aburrido, Maria. El chat quiere la paloma.
pigeon-cloister.look=La paloma, muy orgullosa de sí misma. Ya está en dos millones de móviles.
phone.archive=Sin cobertura. Estos muros tienen dos metros de grosor. A los templarios les habría gustado.
