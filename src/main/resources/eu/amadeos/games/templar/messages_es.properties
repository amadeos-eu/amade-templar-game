phone.look=Mi móvil. Lleno de fotos de libros ajenos.
phone.use=Aquí abajo no hay cobertura. Las paredes son más viejas que el teléfono.
phone.page=Clic. Costumbre de restauradora: fotografiarlo todo, antes y después.
phone.psalter=Esta mañana fotografié todas sus páginas, también el calendario. Antes y después: regla de restauradora.
page.look.1=Pergamino, doblado dos veces. Latín, columnas de números romanos, sumas en libras, sueldos y dineros.
page.look.2=Un sello de cera roja: dos caballeros montando un solo caballo. Y en el borde superior, media palabra, cortada: CHIRO...
page.look.3=El sello de los caballeros templarios. Escondido en un salterio. En esta biblioteca.
page.use=No pienso desdoblarla más de lo necesario. Tiene setecientos años.
bonefolder.look=Una plegadera de hueso. Lisa, plana, y nunca corta el papel.
brush.look=Un pincel de engrudo. Limpio, al menos.
damp-brush.look=Un pincel humedecido con agua destilada.
coin.look=Dos euros. Suficiente para la máquina de café, si está de buen humor.
cup.look=Una taza desportillada con una franja azul. La de Lefort.
coffee.look=Solo, sin azúcar, en su propia taza. El café a la manera de Lefort.
coffee.use=No es para mí. Es un soborno.
sandwich.look=Medio bocadillo de jamón, con un mordisco en forma de pico.
sandwich.use=No tengo tanta hambre.

