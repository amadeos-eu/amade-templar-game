dialog.controls.text=<b>Botón izquierdo</b>: caminar, usar, hablar, cruzar una puerta.<br><b>Botón derecho</b>: mirar algo.<br><br>Puntero en la parte superior de la pantalla: el inventario. Haz clic en un objeto para tomarlo en la mano, luego en algo de la sala para usarlo allí, o en otro objeto para juntar los dos. El botón derecho lo devuelve.<br><br><b>N</b>: el cuaderno de Lena, qué hacer a continuación; otra vez N para una pista.<br><b>Esc</b> o <b>.</b>: saltar una frase.<br><b>F5</b>: guardar, <b>F9</b>: reanudar la partida guardada. El juego también se guarda solo en cada sala nueva.<br><b>F11</b>: pantalla completa.
dialog.about.text=Una aventura gráfica de apuntar y hacer clic: una restauradora de libros en París encuentra una página escondida en la encuadernación de un salterio medieval y la sigue hasta la noche antes de que arrestaran a los templarios.
dialog.about.history=La historia de este juego es real: los arrestos del 13 de octubre de 1307, las deudas del rey, el Temple de París, el sello con dos caballeros en un solo caballo. Lena, Aimery, el hermano Gérard, Hélène y la página son inventados; a las leyendas se las llama leyendas.

