workshop.intro.1=Último trabajo del día: el salterio del viejo barrio del Temple. Hacia 1300, París, reencuadernado una vez, y mal.
workshop.intro.2=Monsieur Lefort lo quiere terminado mañana. Monsieur Lefort lo quiere todo terminado mañana.
window.look=Los tejados del Marais. Por allí, en algún lugar, se alzaba el Temple.
window.use=Está sellada con pintura desde antes de que yo naciera.
pigeon.look=Otra vez esa paloma. Se posa ahí todas las tardes y me mira trabajar.
pigeon.use=Fuera. ...Le da igual.
engraving.look=Un grabado antiguo de la torre del Temple de París. Derribada en 1808.
engraving.use=Está torcido. Lleva cuarenta años torcido, dice Lefort. Se queda torcido.
shelves.look=Libros que me esperan. Algunos esperan desde el restaurador anterior.
shelves.use=Un trabajo cada vez.
coat.look=Mi abrigo y mi bufanda.
coat.coin=Dos euros en el bolsillo. Suficiente para la máquina de café.
coat.empty=Solo un billete de autobús y un cabo de lápiz.
door.look=La puerta de la sala de lectura.
door.not-yet=No antes de terminar el salterio. Lo prometí.
bench.look=Mi mesa de trabajo. El único sitio ordenado del edificio.
bench.use=No va a restaurar nada por sí sola.
press.look=Una prensa de libros de hierro fundido, más vieja que el catálogo de la biblioteca.
press.use=No hay nada que prensar.
books.look=Esperando a que los reparen. Con paciencia, como hacen los libros.
books.use=Luego. Mucho luego.
lamp.look=Mi lámpara de mesa. Sin ella trabajaría a la luz de una vela, como los monjes.
lamp.use=Está encendida. Se queda encendida.
jar.look=Agua destilada. Para una restauradora, casi agua bendita.
jar.use=Prefiero no bebérmela.
gluepot.look=Engrudo de almidón de trigo. Se puede quitar, si se tiene cuidado: de eso se trata.
gluepot.use=Todavía no. Primero hay que separar.
mug.look=Mi café. Frío. Y no del gusto de Lefort: él lo toma solo, en su propia taza.
mug.use=Frío. Hay cosas que no se pueden restaurar.
psalter.look.1=Un salterio, hacia 1300. Las oraciones de la semana, un calendario de fiestas de santos.
psalter.look.2=La contraguarda de la tapa delantera está abombada, como si hubiera algo debajo.
psalter.look.after=La contraguarda está levantada. Debajo, un hueco en la tapa, justo del tamaño de la página doblada.
psalter.use=El engrudo tiene setecientos años y está seco como una piedra. Sin humedad rompería el papel.
psalter.use.after=Mañana lo vuelvo a cerrar. Esta vez, bien.
psalter.damp=Un poco de agua, un poco de paciencia... Ya. El engrudo viejo se ablanda.
flap.look=La contraguarda levantada. Quien la pegó tenía prisa.
brush.take=El pincel de engrudo.
brush.damp=Mojado en agua destilada. Húmedo, no empapado.
brush.dry=Un pincel seco no ablanda nada.
bonefolder.take=Mi plegadera.
bonefolder.dry=En seco se rompería. Primero tengo que ablandar el engrudo.
discover.1=Despacio... despacio... Hay algo debajo. ¡Pergamino doblado!
discover.2=Alguien abrió esta encuadernación antes que yo. Hace siglos.
discover.3=Y quien fuera, escondió esto con prisa. Lefort tiene que verlo.
page.psalter=Se queda fuera hasta que sepa qué es.
coin.coat=Está bien donde está. En mi mano.
goal.10=Terminar el salterio antiguo: esta noche se desmonta su encuadernación.
hint.10=Mira bien el salterio de la mesa de trabajo.
goal.11=Despegar la vieja contraguarda del salterio sin romperla.
hint.11=El engrudo viejo se ablanda con un poco de agua. El pincel de engrudo y el tarro de agua están en la mesa.
goal.12=Levantar la contraguarda ablandada.
hint.12=Usa la plegadera con el salterio.
goal.13=Enseñar la página a monsieur Lefort en la sala de lectura.
hint.13=La puerta de la sala de lectura está junto a mi abrigo.

# ---- la sala de lectura ----
name.lefort=Monsieur Lefort
name.machine=máquina de café
name.rack=escurridor de tazas
name.lefort-cup=taza desportillada
name.bookcase=librería
name.ladder=escalera de biblioteca
name.tall-window=ventana
name.clock=reloj
name.reading-table=mesa de lectura
name.desk=escritorio de Lefort
name.ledger-tables=tablas de conversión
name.atelier=puerta del taller
name.street=salida a la calle
dialog.bye=Buenas noches, monsieur Lefort.
lefort.hello.1=Madame Vogt. Son las ocho menos diez. La biblioteca cerró a las seis.
lefort.hello.2=Monsieur Lefort, he encontrado algo en el salterio.
lefort.hello.3=Non. Sea lo que sea, puede esperar a mañana. Todo puede esperar a mañana.
lefort.look=Monsieur Lefort, archivero. Sesenta y cuatro años, cuarenta de ellos en esta sala. Primero dice "Non" y después ayuda.
lefort.q.page=Por favor, mire solo esta página.
lefort.page.1=Estaba debajo de la contraguarda. Latín, números y un sello.
lefort.page.2=Non... Dos caballeros en un solo caballo. Mon Dieu. Es el sello del Temple.
lefort.page.3=Y mire el borde superior: CHIRO... cortado. Un quirógrafo. El mismo texto escrito dos veces en una piel y cortado por la mitad; cada parte guarda una mitad. Quien tiene la otra mitad tiene la prueba.
lefort.page.4=¿Y qué dice?
lefort.page.5=Madame, después de diez horas en este edificio no puedo leer ni un billete de autobús. No antes de mi café.
lefort.q.coffee=¿Por qué no se toma un café?
lefort.coffee.1=La máquina está justo ahí. ¿Por qué no se toma un café?
lefort.coffee.2=Porque esa máquina y yo no nos hablamos. Quiere monedas. Yo tengo tarjeta. Y no da vasos.
lefort.coffee.3=Solo, en mi propia taza. La de la franja azul. Todo lo demás es agua de fregar.
lefort.q.give=Su café, monsieur. Solo, en su propia taza.
lefort.give.1=...Madame Vogt, es usted una persona terrible y se lo agradezco.
lefort.give.2=Bien. "París, en la casa del Temple... el señor rey de Francia debe a los hermanos..." Son las deudas del rey, en libras tornesas.
lefort.give.3=Sellado por el tesorero del Temple. Y aquí, el hermano Gérard. El hermano Gérard, de la casa de París.
lefort.give.4=¿Los templarios prestaban dinero al rey?
lefort.give.5=Durante cien años los reyes de Francia guardaron su tesoro en el Temple, aquí en París. Los templarios eran sus banqueros.
lefort.give.6=El total está en dineros. Así que: ¿cuántos dineros son una libra? Mis tablas de conversión están en el escritorio, si las necesita.
lefort.q.sum=Sobre esa suma en dineros...
lefort.sum.again=Un pequeño reino, madame. Debido por un rey al que le gustaba arrestar a sus acreedores.
sum.12=Doce.
sum.20=Veinte.
sum.240=Doscientos cuarenta.
sum.later=Deme un momento.
sum.answer.12=¿Doce dineros la libra?
sum.answer.20=¿Veinte?
sum.answer.240=Doscientos cuarenta: doce dineros el sueldo, veinte sueldos la libra.
sum.wrong=Non, non. Mire las tablas, madame. Llevan esperando ahí desde 1952.
sum.later.answer=Tómese su tiempo. El rey lo debe desde hace setecientos años.
sum.right.1=Exacto. Entonces esto es... más de lo que la Corona recaudaba en impuestos en un año entero. Un pequeño reino.
sum.right.2=Y pocos días después, el rey hizo arrestar a todos los templarios de Francia. A todos la misma mañana.
sum.right.3=Viernes, trece de octubre de 1307. ¿Quién arresta a su banco? Alguien que no quiere devolver el dinero.
lefort.q.history=¿Quiénes eran realmente los templarios?
lefort.history.1=¿Quiénes eran realmente los templarios? Kev, en internet, dice que encontraron el Santo Grial.
lefort.history.2=Kev, en internet, dice muchas cosas. Unos pocos caballeros en Jerusalén hacia 1120, que juraron proteger a los peregrinos en el camino.
lefort.history.3=En un siglo: casas por toda Europa, barcos, granjas y las cámaras más seguras de la cristiandad. Un peregrino pagaba en París y cobraba en Acre, con una carta.
lefort.history.4=Monjes, soldados y banqueros. Esa última parte fue la que los mató.
lefort.q.friday=¿Qué les pasó después de los arrestos?
lefort.friday.1=Tortura, confesiones falsas, un proceso que duró años. En 1312 el papa disolvió la orden.
lefort.friday.2=En marzo de 1314, el último gran maestre, Jacques de Molay, fue quemado en una pequeña isla del Sena, junto al Pont Neuf. Hoy hay allí una placa.
lefort.friday.3=¿Y el dinero?
lefort.friday.4=La mayoría de sus tierras pasaron a los hospitalarios. El tesoro del que hablan las historias nunca se encontró. Quizá porque estaba sobre todo escrito en pergamino.
lefort.q.temple=¿Dónde estaba exactamente el Temple?
lefort.temple.1=A cinco minutos de aquí. El recinto de los templarios era una pequeña ciudad en sí mismo, con una torre como la torre del homenaje de un castillo.
lefort.temple.2=Napoleón mandó derribar la torre en 1808. Hoy es una plaza con un parque infantil: el Square du Temple.
lefort.temple.3=Entonces allí voy. El salterio venía de ese barrio.
lefort.bye=Bonne nuit. Y cierre la puerta; la corriente me va directa a las rodillas.
machine.look=Una máquina de café de los años ochenta. "PIÈCES SEULEMENT": solo monedas. Y sin vasos.
machine.no-cup=Da café, pero no vasos. Primero necesitaría una taza.
machine.no-coin="Pièces seulement". Quiere una moneda.
machine.coffee=Gruñe, escupe, da café. Solo. En la propia taza de Lefort.
rack.look=Un escurridor con tazas lavadas. Una tiene una franja azul y el borde desportillado.
rack.use=Las tazas están limpias. Casi todas.
lefort-cup.look=Blanca con una franja azul y el borde desportillado. Tiene que ser la de Lefort.
lefort-cup.take=La taza de Lefort. Si me pilla con ella, más vale que tenga café dentro.
bookcase.look=Registros parroquiales, libros de tierras, la historia de cada calle del Marais. Diez metros de estantes.
bookcase.use=Ahora no. Si empiezo a leer, al amanecer seguiré aquí.
ladder.look=Una escalera de biblioteca sobre rieles de latón. Chirría; Lefort la oye desde cualquier parte del edificio.
ladder.use=No necesito nada de ahí arriba.
tall-window.look=Se encienden las farolas. El cielo sobre el Marais se vuelve violeta.
tall-window.use=Sellada con pintura hacia 1950.
clock.look=Las ocho menos diez. La biblioteca cerró hace dos horas.
clock.use=Va en hora. Lefort le da cuerda cada lunes.
reading-table.look=Dos puestos de lectura, libros abiertos, lámparas verdes. Lefort los deja así para los lectores de mañana.
reading-table.use=No me toca a mí cerrarlos.
desk.look=El escritorio de Lefort: cuero verde, un teléfono de disco, pilas de papeles que solo él entiende.
desk.use=Nadie toca el escritorio de Lefort. Nadie.
ledger-tables.look=Viejas tablas de conversión de moneda medieval: una libra tornesa = 20 sueldos, un sueldo = 12 dineros.
ledger-tables.use=Mírelas cuanto quiera, madame, pero no las mueva.
atelier.look=La puerta de mi taller.
street.look=La salida a la calle. Fuera está oscureciendo.
street.not-yet=Primero quiero saber qué dice esta página.
goal.20=Enseñar la página a monsieur Lefort.
hint.20=Habla con Lefort, en su escritorio.
goal.21=Llevarle su café a Lefort: solo, en su propia taza.
hint.21=Su taza está en el escurridor junto a la máquina de café. La máquina acepta monedas, como la del bolsillo de mi abrigo.
goal.22=Hacer la cuenta: ¿cuántos dineros son una libra?
hint.22=Las tablas de conversión están en el escritorio de Lefort. Después habla otra vez con él.
goal.23=Ir al Square du Temple, donde antes estaba el Temple.
hint.23=La salida a la calle está a la derecha de la sala de lectura.

# ---- el Square du Temple ----
name.houses=casas del Marais
name.railing=verja
name.playground=parque infantil
name.board=panel informativo
name.lamppost=farola
name.kev-sandwich=bocadillo de Kev
name.half-sandwich=medio bocadillo
name.metro=estación de metro Temple
name.marais=volver a la biblioteca
name.kev=Kev
name.helene=mujer elegante
name.pigeon=paloma
square.intro.1=El Square du Temple. Durante quinientos años aquí estuvo el recinto de los templarios, con murallas, iglesia, torre y todo.
square.intro.2=Hoy: castaños, un parque infantil y un hombre hablándole a su móvil.
houses.look=El Marais al anochecer. En el siglo trece todo esto era tierra de los templarios; se la arrendaban a artesanos.
houses.use=No conozco a nadie ahí arriba.
railing.look=Una verja de hierro fundido del siglo diecinueve, cuando se trazó la plaza.
railing.use=Todo lo que necesito está a este lado.
playground.look=Un tobogán y una estructura para trepar. Los niños juegan donde el gran maestre tenía sus aposentos.
playground.use=Soy un poco mayor y estoy un poco ocupada.
lamppost.look=Las farolas se encienden, una a una.
lamppost.use=Está caliente. Algo es algo.
bench.square.look=Un banco verde. La cena de Kev espera encima.
bench.square.use=No hay tiempo para sentarse.
kev-sandwich.look=Jamón, lechuga, tomate, media baguette. El de Kev.
kev-sandwich.use=Es la cena de Kev. Soy restauradora, no ladrona.
half-sandwich.look=Medio bocadillo en la grava. La paloma se llevó la otra mitad.
half-sandwich.take=Medio bocadillo. Probado por una paloma. Nunca se sabe.
board.look.1=Un grabado antiguo: la torre del Temple, una torre cuadrada con cuatro torrecillas en las esquinas. "Derribada en 1808."
board.look.2=Y el plano: la iglesia, la torre, el claustro... y la biblioteca, justo donde ahora está el parque infantil.
board.look.3=El salterio venía de esta biblioteca. Alguien escondió la página en él en 1307. Aquí.
helene.hello=¿Madame Vogt? Qué tarde tan encantadora para la historia.
helene.look=Abrigo de camello, un bolso rojo, pendientes que valen mi sueldo de un año. Huele a dinero y a papel viejo.
helene.q.who=¿Quién es usted?
helene.who.1=Hélène de Vaucresson. Colecciono. Cosas antiguas, cosas raras, documentos.
helene.who.2=Mi familia colecciona desde antes de la Revolución. Somos... minuciosos.
helene.q.how=¿Cómo sabe mi nombre?
helene.how.1=Su monsieur Lefort llamó hace una hora a un viejo amigo de los Archives nationales. Estaba muy emocionado.
helene.how.2=París es un pueblo, madame Vogt. Y yo soy muy buena vecina.
helene.q.offer=¿Qué quiere?
helene.offer.1=La página. Cincuenta mil euros, esta noche, en efectivo. Sin preguntas, sin papeles.
helene.offer.2=Pertenece a la biblioteca. Y a la historia.
helene.offer.3=La historia pertenece a quien mejor la guarda. Piénselo.
helene.q.no=No está en venta.
helene.no.1=No está en venta. Buenas noches, madame.
helene.no.2=Todo está en venta. Solo cambia el precio. Bonne soirée.
helene.page=Le encantaría. No.
kev.look="Kev el Cazatesoros": sudadera con capucha, palo de selfi, una voz para un público de miles. Está en directo, al parecer.
kev.q.who=¿Con quién habla?
kev.who.1=¡Con mis seguidores! ¡Kev el Cazatesoros, en directo desde el corazón de los templarios! Ochenta mil, y todos mirando.
kev.who.2=Esta noche encontramos el oro. O al menos las pistas del oro. O al menos clics.
kev.who.3=Buena suerte.
kev.q.templars=¿Qué sabe de los templarios?
kev.templars.1=¡Escondieron su oro en nueve lugares, cifrado con la clave templaria!
kev.templars.2=Esa clave no aparece en ni un solo documento medieval.
kev.templars.3=Exacto. Así de bien sabían esconderla.
kev.q.curse=¿Y el gran maestre?
kev.curse.1=¡Jacques de Molay! Quemado vivo en París en 1314. ¡Y desde las llamas maldijo al rey y al papa!
kev.curse.2=¡Los dos muertos ese mismo año! ¿Casualidad? ¡No lo creo!
kev.curse.3=El papa murió en abril de 1314, el rey en noviembre. Los dos estaban enfermos o eran viejos. La gran maldición viene de historias escritas mucho después.
kev.curse.4=Un solo cronista dice solo que Molay pidió a Dios que los juzgara. Es una leyenda, Kev.
kev.curse.5=Leyenda o no, hay una placa donde lo quemaron. En el Pont Neuf, junto a la estatua del rey a caballo.
kev.curse.6=Esa placa es real. Y Lefort también la mencionó. Al Pont Neuf, entonces: línea 7, dos paradas.
kev.q.film=¿Podría grabar el grabado antiguo del panel?
kev.film.1=¡Un grabado! ¡Cosas viejas! A mis seguidores les encantan las cosas viejas. Sujétame el... no, dejo aquí mi bocadillo.
kev.film.2=¡Mirad esto, gente: el verdadero Temple! ¡Dadle a me gusta y suscribíos!
kev.film.3=¡Eh! ¡Mi bocadillo! ¡Fuera! ¡Fuera!
kev.film.4=Puaj. Bueno. "Paloma templaria roba la cena a un cazatesoros". Eso es contenido.
kev.q.bye=Hasta luego, Kev.
kev.bye=¡Suscríbete! ¡Es gratis!
kev.sandwich=La paloma ya lo ha probado. Quédeselo, ahora soy vegetariano. Desde ahora mismo.
kev.page=No le enseño la página a Kev. Ochenta mil seguidores estarían aquí en diez minutos.
pigeon.square.look=Una paloma con un interés profesional por el bocadillo de Kev.
pigeon.coo=Gruuu.
pigeon.square.feed=Ya tuvo su mitad.
metro.look=Estación de metro Temple, línea 3. La línea 7 va al Pont Neuf.
metro.not-yet=¿Adónde iría ahora? Aquí no he terminado.
marais.look=La calle de vuelta a la biblioteca.
goal.30=Averiguar dónde estaba el Temple.
hint.30=Hay un panel informativo a la izquierda de la plaza.
goal.31=Averiguar más sobre los últimos días de los templarios.
hint.31=Kev parece saberlo todo. Puede que algo hasta sea verdad. Pregúntale por el gran maestre.
goal.32=Ir al Pont Neuf, a la placa de Jacques de Molay. Algo me dice que voy a necesitar ese bocadillo.
hint.32=Pídele a Kev que grabe el grabado; su bocadillo está en el banco, y una paloma lo vigila.
goal.33=Ir al Pont Neuf, a la placa de Jacques de Molay.
hint.33=Toma el metro a la derecha de la plaza.

# ---- el Pont Neuf ----
name.far-bank=el Louvre
name.river=el Sena
name.statue=estatua de Enrique IV
name.parapet=pretil
name.wall=pilar de piedra
name.steps=escalera a la isla
name.plaque=placa
name.metro-bridge=estación de metro Pont Neuf
name.driver=hombre grande de traje oscuro
name.guide=guía turística
name.tourist1=turista
name.tourist2=turista
bridge.intro=El Pont Neuf de noche. La placa debe de estar abajo, junto a la escalera. Y hay alguien justo delante.
driver.hello.1=Madame Vogt. Madame de Vaucresson le manda saludos.
driver.hello.2=Me ha seguido.
driver.hello.3=Madame sube su oferta. Sesenta mil. Deme la página y podrá irse a casa.
driver.look=Hombros como un armario, zapatos como espejos. Está entre la placa y yo y no parece que vaya a moverse.
driver.q.who=¿Quién es usted?
driver.who.1=Nadie. Conduzco el coche de Madame.
driver.who.2=Y a veces le llevo cosas. Cosas pequeñas. Páginas, por ejemplo.
driver.q.no=La página se queda conmigo.
driver.no.1=La página se queda conmigo.
driver.no.2=Tengo tiempo, madame. Tengo muchísimo tiempo.
driver.page=Eso es justo lo que quiere.
driver.sandwich=Parece que tiene hambre. Tome, una cena.
driver.pigeons=¿Qué...? ¡Fuera! ¡Fuera de mis zapatos!
guide.look=Una guía turística con un paraguas y una voz hecha para multitudes.
guide.tour.1=¡Y aquí, señoras y señores, la maldición más famosa de la historia!
guide.tour.2=¡Desde las llamas, el gran maestre de los templarios maldijo al rey de Francia! ¡Hasta la decimotercera generación!
guide.tour.3=En realidad, lo quemaron en la islita de ahí abajo; no pasó a formar parte del puente hasta tres siglos después. Y la maldición es una leyenda.
guide.tour.4=¡La señora es historiadora! ¡Un aplauso!
guide.tour.5=¡Mirad, el hombre grande da de comer a las palomas! ¿Podemos hacernos una foto con él?
driver.leave=...En otra ocasión, madame Vogt.
guide.tour.6=¡Y ahora, señoras y señores, a Notre-Dame! ¡Sigan el paraguas!
far-bank.look=El Louvre, con las ventanas iluminadas. En 1307 allí había un castillo real; los hombres del rey tenían poco camino hasta el Temple.
river.look=El Sena, negro y dorado bajo las farolas.
river.use=Está frío y está oscuro. No.
statue.look=Enrique IV en su caballo. Trescientos años después de los templarios. Las palomas están posadas en el pedestal.
statue.use=No llego hasta él y no me ayudaría.
statue.sandwich=Desde aquí nunca lo verían. Tendrían que venir hacia mí.
parapet.look=El puente más antiguo de París, terminado en 1607. Viejo para París; joven para los templarios.
parapet.use=No me asomo. No con lo que llevo en el bolso.
bridge-lamp.look=Los faroles del Pont Neuf. Bajo ellos todo parece un grabado antiguo.
bridge-lamp.use=Caliente, al menos.
wall.look=El pilar de piedra sobre la escalera que baja a la isla.
wall.use=Sólido. Cuatrocientos años de solidez.
steps.look=La escalera que baja al pequeño jardín de la punta de la isla. Allí estuvo la hoguera.
steps.use=De noche está cerrado, y puedo leer la placa desde aquí arriba.
plaque.blocked=El chófer de Hélène está justo delante.
plaque.look.1="En este lugar Jacques de Molay, último gran maestre de la Orden del Temple, fue quemado el 18 de marzo de 1314."
plaque.look.2=Siete años después de los arrestos. Siete años de prisión, y luego esto.
plaque.look.3=El dieciocho de marzo... El salterio tiene un calendario de fiestas de santos. Y esta mañana fotografié todas sus páginas.
phone.plaque.early=Primero quiero leer la placa.
calendar.1=Marzo... el dieciocho. Hay una nota en el margen. Diminuta, en tinta marrón, de una mano posterior.
calendar.2="Rupella. Ad navem." Rupella es La Rochelle. "Al barco."
calendar.3=Alguien marcó el día de la muerte de Molay y anotó adónde había ido algo: a un barco, en La Rochelle.
calendar.4=La otra mitad del quirógrafo. Tiene que serlo.
card.act1.end=Fin del primer acto|"Rupella. Ad navem." La pista lleva a La Rochelle.
goal.40=Llegar a la placa de Jacques de Molay. El chófer está en medio.
hint.40=El chófer no se moverá con palabras. Pero las palomas de la estatua tienen hambre, y yo tengo medio bocadillo.
goal.41=Leer la placa y comparar la fecha con mis fotos del calendario del salterio.
hint.41=Usa el móvil con la placa.
name.swarm=palomas
swarm.look=Todas las palomas del Pont Neuf, y todas sobre sus zapatos.
name.bridge-lamp=farol

# ---- el prólogo: el Temple de París, 12 de octubre de 1307 ----
item.ledger=página de cuentas
item.key=llave de hierro
item.seal=sello
item.wax=barra de lacre
item.soft-wax=lacre blando
item.cheese=trozo de queso
item.knife=cortaplumas
item.glue=bote de cola
card.1307=París, 12 de octubre de 1307|La casa de los caballeros templarios, de noche
card.arrest=Viernes, 13 de octubre de 1307|Al amanecer, los hombres del rey arrestaron a todos los templarios de Francia. El salterio se quedó en su atril.
ledger.look=La última página de las cuentas del Temple con la Corona: lo que el rey Felipe debe a la orden, hasta el último dinero. Una mitad de un quirógrafo.
ledger.look.sealed=La página, doblada y sellada con los dos caballeros en un solo caballo.
key.look=La llave del arcón del tesorero. Al hermano Gérard le temblaba la mano cuando me la dio.
seal.look=El sello de la orden: dos caballeros montando un solo caballo. Pobreza, dicen. Y hermandad.
wax.look=Una barra de lacre rojo. Dura como el hueso.
soft-wax.look=Caliente y blando. Rápido, antes de que se endurezca.
cheese.look=Un trozo del queso del hermano Gérard. Huele lo bastante fuerte como para despertar a los muertos.
cheese.use=No tengo hambre. Otro quizá sí.
knife.look=El cortaplumas del copista. Lo bastante afilado para cortar pergamino.
glue.look=Cola de piel, aún caliente de la estufa. El copista también trabajaba hasta tarde.
seal.hardwax=El lacre está demasiado duro. Hay que calentarlo primero.
name.gerard=Hermano Gérard
name.lancet=ventana
name.banner=estandarte
name.book-stand=atril de lectura
name.chest=arcón
name.chest-open=arcón abierto
name.table=mesa
name.accounts=libros de cuentas
name.candles=velas
name.supper=cena del hermano Gérard
name.wax-stick=lacre
name.courtyard-door=puerta al patio
gerard.intro.1=Aimery. Cierra la puerta detrás de ti. Sin ruido.
gerard.intro.2=¿Hermano Gérard? Hace mucho que pasaron las completas.
gerard.intro.3=Los hombres del rey llevan toda la semana haciendo preguntas. Esta noche he oído que llevan cartas selladas, para abrirlas en todas partes a la misma hora.
gerard.intro.4=Toma esto: la última página de nuestras cuentas con la Corona. Lo que el rey nos debe, hasta el último dinero.
gerard.intro.5=Tiene que salir del Temple esta noche, con el sello del tesorero. El sello está en el arcón. Aquí tienes la llave.
gerard.look=El hermano Gérard, guardián de las cuentas. Treinta años en el Temple. Nunca lo había visto con miedo.
gerard.q.why=¿Por qué precisamente esta página?
gerard.why.1=¿Por qué esta página, hermano? ¿Por qué no el oro?
gerard.why.2=El oro se puede fundir, Aimery. Una deuda escrita por dos manos, no.
gerard.why.3=Es un quirógrafo: una mitad se queda con nosotros, la otra ya va camino de la costa. Quien tenga las dos tiene la deuda del rey.
gerard.q.king=¿Por qué iba el rey a actuar contra nosotros?
gerard.king.1=El rey Felipe debe más de lo que puede pagar. Cuando ocurrió antes, arrestó a los banqueros lombardos y se quedó con su dinero. El año pasado expulsó a los judíos y se quedó con todo lo que tenían.
gerard.king.2=Él lo llama justicia. Yo lo llamo contabilidad.
gerard.q.how=¿Cómo la sello?
gerard.how=Calienta el lacre en una vela, ponlo sobre el pliegue y aprieta el sello mientras esté blando.
gerard.q.where=¿Adónde la llevo?
gerard.where.1=Sal por el patio y la puerta. El hermano Raoul guarda la puerta esta noche y querrá saber por qué.
gerard.where.2=No se lo digas. Raoul es un buen hermano, pero lento.
gerard.q.bye=Dios os guarde, hermano.
gerard.bye=Y a ti, hijo. Ve.
lancet.look=La luna sobre París. En algún lugar ahí fuera, los hombres del rey esperan la mañana.
lancet.use=Demasiado estrecha para pasar. Los templarios construían bien.
banner.look=El Beauséant: negro y blanco, el estandarte de la orden. Negro para nuestros enemigos, blanco para nuestros amigos, dicen.
banner.use=Nadie toca el estandarte.
book-stand.look=El libro diario del tesorero. Rentas del Marais, vino de Brie, un préstamo a un obispo.
book-stand.use=Ahora no.
chest.look=El arcón del tesorero, reforzado con hierro. Cerrado con llave.
chest.locked=Cerrado con llave. El hermano Gérard tiene la llave... no, la tengo yo.
chest.open=El sello de la orden, en su bolsa de cuero.
chest-open.look=Solo quedan recibos. Recibos y polvo.
table.look=La mesa del tesorero: libros de cuentas, tinta, velas. Y la cena del hermano Gérard, sin tocar.
table.use=Todo lo que hay encima tiene su sitio. El hermano Gérard lo notaría.
accounts.look=Columnas de números romanos. Libras, sueldos y dineros.
accounts.use=No puedo llevarme todo el tesoro.
candles.look=Dos buenas velas de cera. El hermano Gérard no escatima en luz.
candles.use=Mejor no quemar nada más esta noche.
wax.soften=El lacre se ablanda en la llama.
ledger.candle=¿Quemar la deuda del rey? Algunos pagarían por eso. No.
supper.look=Pan, una jarra de vino y un trozo de queso que se huele desde la puerta.
supper.take=Esta noche no va a comer. Y el queso puede servir.
wax-stick.look=Una barra de lacre rojo.
wax-stick.take=Lacre rojo, para el sello.
wax.hard=El lacre está duro como una piedra. Hay que calentarlo.
ledger.waxed=Una gota de lacre blando en el pliegue. ¡Ahora el sello, rápido!
seal.nowax=Primero necesito lacre en la página. Lacre blando.
seal.done=Dos caballeros en un solo caballo. Sellado.
seal.gerard.1=Bien. Ahora nadie podrá decir que se escribió ayer.
seal.gerard.2=Ve, Aimery. Sal por la puerta. Y no mires atrás.
seal.softwax=Primero el lacre en la página, luego el sello en el lacre. No al revés.
door.unsealed=¡Sin sellar no, Aimery! Séllala primero.
name.tower=gran torre
name.cloister=claustro
name.moon=luna
name.well=pozo
name.torch=antorcha
name.gate=portón
name.library=puerta de la biblioteca
name.chapter=cámara del tesorero
name.guard=Hermano Raoul
name.cat=gata
courtyard.intro=El patio. El portón está cerrado, y el hermano Raoul lo vigila. Despierto, por una vez.
tower.look=La gran torre del Temple. El tesoro del rey de Francia estuvo en ella cien años.
tower.use=De noche está cerrada. Incluso para mí.
cloister.look=La galería del claustro. Los hermanos duermen, o rezan.
cloister.use=No hay tiempo para el claustro.
moon.look=Luna llena. Mala noche para secretos.
well.look=El pozo del Temple. Agua dulce, dicen, la mejor de París.
well.use=No tengo sed. Tengo miedo.
torch.look=Una antorcha junto al portón. A Raoul le gusta ver quién viene.
torch.use=Solo me quemaría los dedos.
guard.look=El hermano Raoul, un sargento de la orden. Grande, leal y no muy rápido.
guard.q.open=Abre el portón, hermano Raoul.
guard.open.1=Abre el portón, hermano Raoul. Tengo un encargo del hermano Gérard.
guard.open.2=Nadie sale antes de prima. Órdenes del mariscal. Ni siquiera tú, escudero.
guard.q.cat=¿Esa es la gata del establo, junto al pozo?
guard.cat.1=¡Esa bestia! La semana pasada me robó la cena, delante de mis narices. Con queso y todo.
guard.cat.2=Si vuelvo a pillarla cerca de mi portón, la persigo hasta Saint-Denis.
guard.q.bye=Buenas noches, hermano.
guard.bye=Buenas noches. Y vete a dormir.
guard.block=Nadie sale antes de prima, escudero.
cat.look=La gata del establo. Gris, llena de cicatrices y siempre hambrienta.
cat.mew=Mrrau.
cat.talk=Quiere algo. Comida, seguramente. Siempre es comida.
cheese.cat=Se lo comería aquí y volvería a dormirse. La quiero allí, junto al portón.
cheese.throw=Uy. Hermano Raoul, se me ha caído tu cena... quiero decir, la cena del hermano Gérard.
guard.sees.1=¡Tú! ¡Ladrona de queso! ¡Ven aquí!
guard.sees.2=¡Esta vez te atrapo!
ledger.guard=El hermano Raoul no necesita saber nada de esto.
gate.look=El gran portón a la Rue du Temple. Atrancado de noche.
gate.1=La tranca pesa... Hay antorchas fuera. Docenas. Y lises en sus sobrevestas.
gate.2=¡En nombre del rey! ¡Abrid el portón!
gate.3=Los hombres del rey. Ya. Por aquí nunca saldré.
gate.4=La biblioteca. Nadie buscará una página entre libros.
gate.soldiers=Están justo fuera. Nunca pasaré.
library-door.look=La puerta de la biblioteca, bajo la gran torre.
library-door.not-yet=Ahora no. El hermano Gérard quiere la página fuera del Temple esta noche.
chapter-door.look=El camino de vuelta a la cámara del tesorero.
chapter-door.barred=No hay vuelta atrás. Los hermanos están atrancando las puertas.
name.cupboard=armario de libros
name.library-window=ventana
name.chests=arcas de libros
name.copy-desk=pupitre del copista
name.copy-knife=cortaplumas
name.glue-pot=bote de cola
name.candle=vela
name.lectern=atril
name.temple-psalter=salterio
name.library-exit=puerta al patio
name.soldier=hombre del rey
name.soldier2=hombre del rey
library.intro.1=La biblioteca. A los libros no los arrestan.
library.intro.2=Si escondo bien la página, podrá esperar aquí tiempos mejores. Lo que haga falta.
cupboard.look=Libros encadenados a sus estantes: la Biblia, la Regla de la orden, una crónica de Tierra Santa.
cupboard.use=Encadenados. Nadie se lleva estos libros. De eso se trata.
library-window.look=Luz de antorchas en la calle de abajo. Están rodeando el Temple.
library-window.use=Demasiado alta, demasiado estrecha y demasiados soldados.
chests.look=Arcas de cartas y escrituras. Lo primero que registrarán.
chests.use=Cartas. Los escribanos del rey las leerán todas.
chests.ledger=Es el primer sitio donde mirarán.
copy-desk.look=El pupitre del copista. Trabajaba hasta tarde: el bote de cola aún está caliente.
copy-desk.use=No soy copista.
copy-knife.look=Un cortaplumas para afilar plumas y cortar pergamino.
copy-knife.take=El cortaplumas del copista.
glue-pot.look=Un bote de cola de piel, aún caliente.
glue-pot.take=El bote de cola. Caliente. Bien.
library-candle.look=Una vela en un soporte de hierro, junto al atril.
lectern.look=El atril con el salterio con el que cantan los hermanos.
temple-psalter.look.1=Un salterio nuevo, el orgullo de los hermanos. Las oraciones de la semana y un calendario de los santos.
temple-psalter.look.2=El interior de la tapa está forrado con pergamino pegado. Si lo despego por el borde, habría sitio debajo.
temple-psalter.open=La contraguarda está suelta. Hay sitio debajo.
temple-psalter.cut=Con cuidado, por el borde... La contraguarda se suelta.
temple-psalter.no-room=Debajo de la contraguarda estaría bien. Pero está pegada.
temple-psalter.hidden=La página cabe debajo. Doblada dos veces, con sello y todo.
temple-psalter.no-glue=Todavía no hay nada que pegar.
temple-psalter.glued=Cola, presionar, alisar... Nadie lo sabrá nunca.
temple-psalter.done=Parece que nadie lo hubiera tocado jamás.
library.soldier.1=¡Allí! ¡Un escudero, en la biblioteca! ¡Prendedlo!
library.aimery.1=Perdonadme, hermano Gérard. La página está a salvo.
library.soldier.2=Por orden del rey, quedas arrestado.
soldier.look=Un soldado del rey, con las lises de Francia en la sobrevesta.
library-exit.look=La puerta al patio.
library-exit.no=Ahí fuera están los hombres del rey. Aquí dentro está el salterio.
goal.1=El hermano Gérard me dio la página y la llave del arcón. La página tiene que llevar el sello del tesorero.
hint.1=El arcón está a la derecha. Usa la llave con él.
goal.2=Sellar la página: lacre blando en el pliegue, luego el sello.
hint.2=Coge el lacre de la mesa y caliéntalo en las velas. Pon el lacre blando en la página y luego usa el sello con la página.
goal.3=Sacar la página del Temple, por el patio y el portón.
hint.3=La puerta al patio está a la izquierda. El hermano Raoul guarda el portón; habla con él.
goal.4=Alejar al hermano Raoul del portón.
hint.4=Raoul odia a la gata del establo, y a la gata le encanta el queso. La cena del hermano Gérard está en la mesa de la cámara.
goal.5=Abrir el portón.
hint.5=El portón está a la derecha.
goal.6=Esconder la página en la biblioteca.
hint.6=La puerta de la biblioteca está bajo la gran torre.
goal.7=Encontrar un escondite para la página en la biblioteca.
hint.7=Mira el salterio del atril. El cortaplumas del copista está en el pupitre.
goal.8=Poner la página bajo la contraguarda.
hint.8=Usa la página con el salterio.
goal.9=Volver a pegar la contraguarda.
hint.9=El bote de cola está en el pupitre del copista.
